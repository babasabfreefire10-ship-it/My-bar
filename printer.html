<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY BAR • Printer</title>

<!-- QZ Tray -->
<script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.5/qz-tray.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#07100b;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
.top{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid #193523;
  background:#0a130e;
}
.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:3px;
}
.logo span{color:#35e878}
.status{
  padding:9px 15px;
  border-radius:8px;
  background:#111b15;
  color:#aaa;
  font-size:13px;
}
.wrap{
  max-width:1100px;
  margin:35px auto;
  padding:0 20px;
}
.grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:25px;
}
.card{
  background:#0c1711;
  border:1px solid #1b3826;
  border-radius:16px;
  padding:22px;
}
h2{
  margin:0 0 18px;
  font-size:18px;
}
label{
  display:block;
  margin:15px 0 7px;
  color:#9daaa1;
  font-size:13px;
}
select,input{
  width:100%;
  background:#07100b;
  color:#fff;
  border:1px solid #284631;
  border-radius:9px;
  padding:12px;
  outline:none;
}
button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  margin-top:12px;
  font-weight:800;
  cursor:pointer;
  background:#35e878;
  color:#041008;
}
button.dark{
  background:#16251b;
  color:#fff;
  border:1px solid #294632;
}
button.red{
  background:#8d2929;
  color:#fff;
}
.receipt-area{
  min-height:650px;
  background:#202820;
  border-radius:14px;
  padding:25px;
  display:flex;
  justify-content:center;
  overflow:auto;
}
.receipt{
  width:80mm;
  min-height:120mm;
  background:#fff;
  color:#000;
  padding:6mm;
  font-family:Arial,Helvetica,sans-serif;
  box-shadow:0 5px 30px #0008;
}
.r-title{
  text-align:center;
  font-size:21px;
  font-weight:900;
}
.r-center{text-align:center}
.line{
  border-top:1px dashed #000;
  margin:10px 0;
}
.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  margin:5px 0;
}
.total{
  display:flex;
  justify-content:space-between;
  font-size:18px;
  font-weight:900;
  margin-top:12px;
}
.small{
  font-size:11px;
  line-height:1.45;
}
.info{
  margin-top:20px;
  padding:13px;
  border-radius:10px;
  background:#101a13;
  color:#aab6ad;
  font-size:12px;
  line-height:1.5;
}
.ok{color:#35e878}
.err{color:#ff6666}

@media(max-width:850px){
  .grid{grid-template-columns:1fr}
  .receipt-area{min-height:auto}
}

@media print{
  body *{visibility:hidden!important}
  .receipt-area,
  .receipt-area *{
    visibility:visible!important;
  }
  .receipt-area{
    position:absolute!important;
    left:0!important;
    top:0!important;
    padding:0!important;
    margin:0!important;
    background:#fff!important;
    width:100%!important;
    min-height:0!important;
  }
  .receipt{
    box-shadow:none!important;
    width:100%!important;
    min-height:0!important;
  }
  @page{
    margin:0;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="logo">MY <span>BAR</span></div>
  <div id="status" class="status">Printer: duke kontrolluar...</div>
</header>

<div class="wrap">

  <div class="grid">

    <div class="card">

      <h2>🖨️ PRINTER</h2>

      <label>Printeri i PC-së</label>
      <select id="printerSelect">
        <option value="">Duke kërkuar printerat...</option>
      </select>

      <button onclick="refreshPrinters()">↻ KËRKO PRINTERAT</button>

      <label>Formati</label>
      <select id="paper">
        <option value="80">Thermal 80mm</option>
        <option value="58">Thermal 58mm</option>
        <option value="A4">A4</option>
      </select>

      <button onclick="testPrint()">🧾 TEST PRINT</button>

      <button onclick="printCurrent()">⚡ PRINT F6 / FATURA</button>

      <button class="dark" onclick="browserPrint()">PRINT ME WINDOWS</button>

      <button class="dark" onclick="loadLastInvoice()">↻ FATURA E FUNDIT</button>

      <button class="red" onclick="clearPreview()">PASTRO PREVIEW</button>

      <div class="info">
        <b>F6</b> = printon faturën.<br><br>
        Nëse QZ Tray është aktiv dhe printeri është i konfiguruar,
        MY BAR mund ta dërgojë faturën direkt te printeri.
      </div>

    </div>

    <div class="card">
      <h2>PREVIEW FATURA</h2>

      <div class="receipt-area">
        <div id="receipt" class="receipt">
          <div class="r-title">MY BAR</div>
          <div class="r-center small">SISTEMI I MENAXHIMIT</div>

          <div class="line"></div>

          <div class="r-center small">
            Gati për faturën...
          </div>

          <div class="line"></div>

          <div class="r-center small">
            Shtyp F6 nga tastiera.
          </div>
        </div>
      </div>

    </div>

  </div>

</div>

<script>
/* =========================================================
   MY BAR PRINTER
   ========================================================= */

let printers = [];
let currentInvoice = null;

/* ---------------------------------------------------------
   QZ CONNECTION
--------------------------------------------------------- */

async function connectQZ(){

  const status = document.getElementById("status");

  if(typeof qz === "undefined"){
    status.textContent = "QZ Tray: nuk u gjet";
    status.className = "status err";
    return false;
  }

  try{

    if(!qz.websocket.isActive()){
      await qz.websocket.connect();
    }

    status.textContent = "QZ Tray: CONNECTED";
    status.className = "status ok";

    await refreshPrinters();

    return true;

  }catch(e){

    console.error(e);

    status.textContent = "QZ Tray: OFF";
    status.className = "status err";

    return false;
  }
}


/* ---------------------------------------------------------
   FIND PRINTERS
--------------------------------------------------------- */

async function refreshPrinters(){

  const select = document.getElementById("printerSelect");

  select.innerHTML =
    '<option value="">Duke kërkuar...</option>';

  if(typeof qz === "undefined"){
    select.innerHTML =
      '<option value="">QZ Tray nuk është instaluar</option>';
    return;
  }

  try{

    if(!qz.websocket.isActive()){
      await qz.websocket.connect();
    }

    printers = await qz.printers.find();

    select.innerHTML = "";

    if(!printers.length){

      select.innerHTML =
        '<option value="">Nuk u gjet printer</option>';

      return;
    }

    printers.forEach(name => {

      const option =
        document.createElement("option");

      option.value = name;
      option.textContent = name;

      select.appendChild(option);

    });

    const saved =
      localStorage.getItem("MY_BAR_PRINTER");

    if(saved && printers.includes(saved)){
      select.value = saved;
    }

    select.addEventListener("change", savePrinter, {
      once:false
    });

  }catch(e){

    console.error(e);

    select.innerHTML =
      '<option value="">Gabim në lidhjen me printerin</option>';
  }
}


/* ---------------------------------------------------------
   SAVE PRINTER
--------------------------------------------------------- */

function savePrinter(){

  const printer =
    document.getElementById("printerSelect").value;

  if(printer){
    localStorage.setItem(
      "MY_BAR_PRINTER",
      printer
    );
  }
}


/* ---------------------------------------------------------
   GET INVOICE FROM MY BAR
--------------------------------------------------------- */

function getInvoices(){

  const keys = [
    "MY_BAR_FINAL_PC",
    "MY_BAR",
    "MY_BAR_DATA",
    "MY_BAR_POS"
  ];

  for(const key of keys){

    try{

      const data =
        JSON.parse(localStorage.getItem(key));

      if(!data) continue;

      if(Array.isArray(data))
        return data;

      if(Array.isArray(data.invoices))
        return data.invoices;

      if(Array.isArray(data.history))
        return data.history;

    }catch(e){}
  }

  return [];
}


/* ---------------------------------------------------------
   LAST INVOICE
--------------------------------------------------------- */

function getLastInvoice(){

  const invoices = getInvoices();

  if(!invoices.length)
    return null;

  return invoices[invoices.length - 1];
}


/* ---------------------------------------------------------
   NORMALIZE INVOICE
--------------------------------------------------------- */

function normalizeInvoice(raw){

  if(!raw) return null;

  const items =
    raw.items ||
    raw.products ||
    raw.order ||
    [];

  const normalizedItems =
    Array.isArray(items)
      ? items.map(item => {

          const qty =
            Number(
              item.qty ??
              item.quantity ??
              1
            );

          const price =
            Number(
              item.price ??
              item.unitPrice ??
              item.cost ??
              0
            );

          return {
            name:
              item.name ||
              item.product ||
              "Produkt",
            qty,
            price,
            total:
              Number(
                item.total ??
                qty * price
              )
          };

        })
      : [];

  let total =
    Number(
      raw.total ??
      raw.grandTotal ??
      raw.amount ??
      normalizedItems.reduce(
        (sum,item)=>sum+item.total,0
      )
    );

  return {

    id:
      raw.id ||
      raw.invoiceId ||
      raw.number ||
      ("F-" + Date.now()),

    table:
      raw.table ||
      raw.tableNumber ||
      raw.tavolina ||
      "-",

    waiter:
      raw.waiter ||
      raw.user ||
      raw.cashier ||
      "Kamarier",

    payment:
      raw.payment ||
      raw.method ||
      "CASH",

    date:
      raw.date ||
      raw.createdAt ||
      new Date().toLocaleString("sq-AL"),

    items:
      normalizedItems,

    total

  };
}


/* ---------------------------------------------------------
   BUILD RECEIPT
--------------------------------------------------------- */

function renderReceipt(invoice){

  const r =
    document.getElementById("receipt");

  if(!invoice){

    r.innerHTML = `
      <div class="r-title">MY BAR</div>
      <div class="line"></div>
      <div class="r-center small">
        Nuk u gjet faturë.
      </div>
    `;

    return;
  }

  const itemsHTML =
    invoice.items.length
      ? invoice.items.map(item => `
          <div class="row">
            <span>
              ${escapeHTML(item.name)}
              ×${item.qty}
            </span>
            <span>
              €${Number(item.total).toFixed(2)}
            </span>
          </div>
        `).join("")
      : `
        <div class="r-center small">
          Pa produkte
        </div>
      `;

  r.innerHTML = `

    <div class="r-title">MY BAR</div>

    <div class="r-center small">
      SISTEMI I MENAXHIMIT
    </div>

    <div class="line"></div>

    <div class="small">
      Fatura: <b>${escapeHTML(invoice.id)}</b><br>
      Tavolina: ${escapeHTML(invoice.table)}<br>
      Kamarier: ${escapeHTML(invoice.waiter)}<br>
      Data: ${escapeHTML(invoice.date)}
    </div>

    <div class="line"></div>

    ${itemsHTML}

    <div class="line"></div>

    <div class="total">
      <span>TOTAL</span>
      <span>€${Number(invoice.total).toFixed(2)}</span>
    </div>

    <div class="line"></div>

    <div class="r-center small">
      Pagesa: ${escapeHTML(invoice.payment)}
    </div>

    <br>

    <div class="r-center small">
      FALEMINDERIT PËR ZGJEDHJEN E MY BAR
    </div>

    <br>

    <div class="r-center small">
      www.mybar.local
    </div>

  `;

}


/* ---------------------------------------------------------
   ESCAPE
--------------------------------------------------------- */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* ---------------------------------------------------------
   LOAD LAST
--------------------------------------------------------- */

function loadLastInvoice(){

  const raw =
    getLastInvoice();

  currentInvoice =
    normalizeInvoice(raw);

  renderReceipt(currentInvoice);
}


/* ---------------------------------------------------------
   CURRENT PRINT
--------------------------------------------------------- */

async function printCurrent(){

  let invoice =
    currentInvoice;

  if(!invoice){
    invoice =
      normalizeInvoice(
        getLastInvoice()
      );
  }

  if(!invoice){

    alert(
      "Nuk u gjet asnjë faturë në MY BAR."
    );

    return;
  }

  currentInvoice = invoice;

  renderReceipt(invoice);

  await directPrint(invoice);
}


/* ---------------------------------------------------------
   DIRECT PRINT
--------------------------------------------------------- */

async function directPrint(invoice){

  const printer =
    document.getElementById("printerSelect").value;

  if(!printer){

    alert(
      "Zgjidh printerin e PC-së."
    );

    return;
  }

  if(typeof qz === "undefined"){

    alert(
      "QZ Tray nuk është i disponueshëm. " +
      "Përdor 'PRINT ME WINDOWS'."
    );

    return;
  }

  try{

    if(!qz.websocket.isActive()){
      await qz.websocket.connect();
    }

    const config =
      qz.configs.create(printer,{
        copies:1
      });

    const data = [

      "\x1B\x40",

      "\x1B\x61\x01",

      "MY BAR\n",

      "SISTEMI I MENAXHIMIT\n",

      "------------------------------\n",

      "Fatura: " +
      invoice.id +
      "\n",

      "Tavolina: " +
      invoice.table +
      "\n",

      "Kamarier: " +
      invoice.waiter +
      "\n",

      "Data: " +
      invoice.date +
      "\n",

      "------------------------------\n",

    ];

    invoice.items.forEach(item => {

      data.push(
        item.name +
        " x" +
        item.qty +
        "  " +
        Number(item.total).toFixed(2) +
        " EUR\n"
      );

    });

    data.push(

      "------------------------------\n",

      "TOTAL: " +
      Number(invoice.total).toFixed(2) +
      " EUR\n",

      "Pagesa: " +
      invoice.payment +
      "\n",

      "\n",

      "FALEMINDERIT!\n",

      "\n",

      "\x1D\x56\x00"

    );

    await qz.print(
      config,
      data
    );

    document.getElementById("status").textContent =
      "Fatura u dërgua te printeri";

  }catch(e){

    console.error(e);

    alert(
      "Printimi direkt dështoi.\n\n" +
      e
    );
  }
}


/* ---------------------------------------------------------
   TEST PRINT
--------------------------------------------------------- */

async function testPrint(){

  const printer =
    document.getElementById("printerSelect").value;

  if(!printer){

    alert("Zgjidh printerin.");

    return;
  }

  if(typeof qz === "undefined"){

    alert(
      "QZ Tray nuk është i disponueshëm."
    );

    return;
  }

  try{

    if(!qz.websocket.isActive()){
      await qz.websocket.connect();
    }

    const config =
      qz.configs.create(printer,{
        copies:1
      });

    const data = [

      "\x1B\x40",
      "\x1B\x61\x01",

      "MY BAR\n",
      "TEST PRINT\n",
      "------------------------------\n",
      "PRINTERI FUNKSIONON\n",
      new Date().toLocaleString("sq-AL") +
      "\n",
      "------------------------------\n",
      "\n",
      "Faleminderit!\n",
      "\n",

      "\x1D\x56\x00"

    ];

    await qz.print(
      config,
      data
    );

    alert(
      "TEST PRINT u dërgua te printeri."
    );

  }catch(e){

    console.error(e);

    alert(
      "Gabim gjatë TEST PRINT."
    );
  }
}


/* ---------------------------------------------------------
   WINDOWS PRINT FALLBACK
--------------------------------------------------------- */

function browserPrint(){

  window.print();

}


/* ---------------------------------------------------------
   CLEAR
--------------------------------------------------------- */

function clearPreview(){

  currentInvoice = null;

  document.getElementById("receipt").innerHTML = `

    <div class="r-title">MY BAR</div>

    <div class="line"></div>

    <div class="r-center small">
      Preview i pastruar.
    </div>

  `;

}


/* ---------------------------------------------------------
   F6
--------------------------------------------------------- */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "F6"){

      event.preventDefault();

      printCurrent();

    }

  }
);


/* ---------------------------------------------------------
   START
--------------------------------------------------------- */

window.addEventListener(
  "load",
  async function(){

    loadLastInvoice();

    await connectQZ();

  }
);

</script>

</body>
</html>
