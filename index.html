<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY BAR</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#070907;
    color:#f5f7f6;
    font-family:Arial,sans-serif;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    display:grid;
    grid-template-columns:220px 1fr;
    min-height:100vh;
}

aside{
    background:#090d0a;
    border-right:1px solid #203127;
    padding:20px;
    position:sticky;
    top:0;
    height:100vh;
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:25px;
}

.logo b{
    color:#35d07f;
}

nav button{
    display:block;
    width:100%;
    padding:12px;
    margin:5px 0;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#aab5ae;
    text-align:left;
}

nav button.active,
nav button:hover{
    background:#132019;
    color:white;
}

.user{
    position:absolute;
    bottom:18px;
    font-size:12px;
    color:#89968e;
}

.user strong{
    display:block;
    color:white;
    margin-bottom:4px;
}

main{
    min-width:0;
}

.top{
    height:65px;
    background:#090d0a;
    border-bottom:1px solid #203127;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    position:sticky;
    top:0;
    z-index:10;
}

.clock{
    color:#35d07f;
}

.page{
    display:none;
    padding:24px;
    max-width:1500px;
    margin:auto;
}

.page.active{
    display:block;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.card{
    background:#0d120f;
    border:1px solid #203127;
    border-radius:13px;
    padding:16px;
}

.stat small{
    color:#89968e;
}

.stat strong{
    display:block;
    font-size:25px;
    margin-top:7px;
}

.toolbar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

input,
select{
    background:#090e0b;
    color:white;
    border:1px solid #26392d;
    border-radius:9px;
    padding:11px;
    outline:0;
}

.btn{
    background:#121a15;
    color:white;
    border:1px solid #294033;
    border-radius:9px;
    padding:10px 14px;
}

.primary{
    background:#239d5b;
    border-color:#239d5b;
}

.danger{
    background:#3a1717;
    border-color:#662626;
}

.tables{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
    gap:11px;
}

.table{
    min-height:105px;
    text-align:left;
    padding:14px;
    background:#0d1510;
    color:white;
    border:1px solid #23372b;
    border-radius:12px;
}

.table.active{
    border-color:#35d07f;
}

.table span{
    display:block;
    color:#89968e;
    margin-top:15px;
}

.pos{
    display:grid;
    grid-template-columns:1fr 390px;
    gap:18px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
    gap:10px;
}

.menu button{
    min-height:110px;
    text-align:left;
    padding:14px;
    background:#0d1510;
    color:white;
    border:1px solid #23372b;
    border-radius:12px;
}

.menu button:hover{
    border-color:#35d07f;
}

.menu button:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.menu span{
    display:block;
    color:#35d07f;
    margin-top:10px;
}

.menu small{
    display:block;
    color:#7f8b84;
    margin-top:7px;
}

.categories{
    display:flex;
    gap:7px;
    overflow:auto;
    margin-bottom:10px;
}

.order{
    position:sticky;
    top:85px;
    height:calc(100vh - 105px);
    display:flex;
    flex-direction:column;
}

.order-items{
    overflow:auto;
    flex:1;
}

.order-row{
    display:flex;
    justify-content:space-between;
    gap:8px;
    padding:12px 0;
    border-bottom:1px solid #1d2921;
}

.order-row small{
    display:block;
    color:#89968e;
    margin-top:4px;
}

.qty{
    display:flex;
    align-items:center;
    gap:5px;
}

.qty button{
    width:27px;
    height:27px;
    padding:0;
    background:#121a15;
    color:white;
    border:1px solid #294033;
    border-radius:6px;
}

.total{
    border-top:1px solid #26372c;
    padding-top:13px;
    display:flex;
    justify-content:space-between;
    font-size:21px;
    font-weight:900;
}

.list{
    display:grid;
    gap:8px;
}

.row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    align-items:center;
    background:#0d120f;
    border:1px solid #203127;
    border-radius:10px;
    padding:12px;
}

.row small{
    display:block;
    color:#89968e;
    margin-top:4px;
}

.settings{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}

.field label{
    display:block;
    color:#89968e;
    font-size:12px;
    margin-bottom:5px;
}

.field input,
.field select{
    width:100%;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000c;
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modalbox{
    background:#0b100d;
    border:1px solid #31523f;
    border-radius:15px;
    padding:20px;
    width:min(500px,100%);
}

.pay{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.invoice{
    background:white;
    color:#111;
    width:min(380px,100%);
    padding:18px;
    margin:auto;
    border-radius:7px;
}

.invoice h2{
    text-align:center;
    margin:0 0 5px;
}

.invoice p{
    text-align:center;
    font-size:12px;
    margin:3px;
}

.invrow{
    display:flex;
    justify-content:space-between;
    border-bottom:1px dashed #999;
    padding:7px 0;
    font-size:13px;
}

.invtotal{
    display:flex;
    justify-content:space-between;
    font-weight:900;
    font-size:17px;
    margin-top:10px;
}

#printArea{
    display:none;
}

.empty{
    text-align:center;
    color:#89968e;
    padding:40px;
}

.toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    display:none;
    background:#111;
    color:white;
    border:1px solid #35d07f;
    border-radius:9px;
    padding:11px 17px;
    z-index:999;
}

@media(max-width:950px){

    .app{
        grid-template-columns:1fr;
    }

    aside{
        height:auto;
        position:static;
        border-right:0;
        border-bottom:1px solid #203127;
    }

    .user{
        display:none;
    }

    .pos{
        grid-template-columns:1fr;
    }

    .order{
        position:static;
        height:auto;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .page{
        padding:14px;
    }

    .settings{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }
}

@media print{

    body *{
        visibility:hidden!important;
    }

    #printArea,
    #printArea *{
        visibility:visible!important;
    }

    #printArea{
        display:block!important;
        position:absolute;
        left:0;
        top:0;
        width:100%;
    }

    .paper{
        width:80mm;
        max-width:100%;
        margin:0 auto;
        padding:4mm;
        font-family:Arial,sans-serif;
    }
}
</style>
</head>

<body>

<div class="app">

<aside>

<div class="logo">
MY <b>BAR</b>
</div>

<nav>

<button class="active" onclick="go('dashboard',this)">
▦ Dashboard
</button>

<button onclick="go('pos',this)">
▣ Porosi
</button>

<button onclick="go('tables',this)">
▤ Tavolina
</button>

<button onclick="go('history',this)">
◷ Historiku
</button>

<button id="settingsBtn" onclick="go('settings',this)">
⚙ Cilësime
</button>

<button onclick="logout()">
↪ Dil
</button>

</nav>

<div class="user">
<strong id="userName">Përdorues</strong>
<span id="userRole"></span>
</div>

</aside>

<main>

<header class="top">

<strong id="barName">
MY BAR
</strong>

<span class="clock" id="clock"></span>

</header>


<section id="dashboard" class="page active">

<div class="toolbar">

<h2 style="margin:0">
Dashboard
</h2>

<button class="btn primary"
onclick="go('pos')">
+ Porosi
</button>

</div>

<div class="stats">

<div class="card stat">
<small>Shitje sot</small>
<strong id="sales">0 L</strong>
</div>

<div class="card stat">
<small>Tavolina aktive</small>
<strong id="active">0</strong>
</div>

<div class="card stat">
<small>Fatura sot</small>
<strong id="count">0</strong>
</div>

<div class="card stat">
<small>Kartë sot</small>
<strong id="cards">0 L</strong>
</div>

</div>

<div class="card" style="margin-top:15px">

<h3>
Tavolinat
</h3>

<div id="dashTables" class="tables"></div>

</div>

</section>


<section id="pos" class="page">

<div class="toolbar">

<h2 style="margin:0">
Porosi
</h2>

<input
id="search"
placeholder="Kërko produkt..."
oninput="renderMenu()"
>

<button class="btn"
onclick="printLast()">
🖨 F6 / Printo
</button>

</div>

<div class="pos">

<div>

<div id="cats" class="categories"></div>

<div id="menu" class="menu"></div>

</div>


<div class="card order">

<div style="display:flex;justify-content:space-between">

<strong id="selTable">
Zgjidh tavolinën
</strong>

<button class="btn"
onclick="clearOrder()">
Pastro
</button>

</div>

<div id="order" class="order-items"></div>

<div>

<div class="total">

<span>TOTAL</span>

<span id="total">
0 L
</span>

</div>

<button
class="btn primary"
style="width:100%;margin-top:12px"
onclick="openPayment()">

Paguaj & Printo

</button>

</div>

</div>

</div>

</section>


<section id="tables" class="page">

<div class="toolbar">

<h2>
Tavolina
</h2>

</div>

<div id="tableGrid" class="tables"></div>

</section>


<section id="history" class="page">

<div class="toolbar">

<h2 style="margin:0">
Historiku
</h2>

<button class="btn danger"
onclick="clearHistory()">
Fshi
</button>

</div>

<div id="historyList" class="list"></div>

</section>


<section id="settings" class="page">

<div class="toolbar">

<h2 style="margin:0">
Cilësime
</h2>

<button class="btn primary"
onclick="saveSettings()">
Ruaj
</button>

</div>

<div class="card">

<div class="settings">

<div class="field">
<label>Emri</label>
<input id="sName">
</div>

<div class="field">
<label>Adresa</label>
<input id="sAddress">
</div>

<div class="field">
<label>Telefon</label>
<input id="sPhone">
</div>

<div class="field">
<label>Tavolina</label>
<input id="sTables" type="number" min="1" max="100">
</div>

<div class="field">
<label>Printer</label>
<input id="sPrinter">
</div>

<div class="field">
<label>Letër</label>

<select id="sPaper">

<option value="58">
58 mm
</option>

<option value="80">
80 mm
</option>

</select>

</div>

</div>

</div>


<div class="card" style="margin-top:15px">

<h3>
Produkte
</h3>

<div class="toolbar">

<input id="pn" placeholder="Produkt">

<input id="pc" placeholder="Kategori">

<input id="pp" type="number" placeholder="Çmim">

<button class="btn primary"
onclick="addProductAdmin()">
Shto
</button>

</div>

<div id="products" class="list"></div>

</div>

</section>

</main>

</div>


<div id="payment" class="modal">

<div class="modalbox">

<h3>
Zgjidh pagesën
</h3>

<div
id="payTotal"
style="font-size:28px;font-weight:900">
</div>

<div class="pay">

<button
class="btn primary"
onclick="pay('cash')">
💵 CASH
</button>

<button
class="btn"
onclick="pay('card')">
💳 KARTË
</button>

</div>

</div>

</div>


<div id="invoiceModal" class="modal">

<div class="modalbox">

<div id="invoicePreview"></div>

<div
style="display:flex;gap:8px;justify-content:center;margin-top:14px">

<button
class="btn primary"
onclick="printCurrent()">
🖨 PRINT
</button>

<button
class="btn"
onclick="closeInvoice()">
Mbyll
</button>

</div>

</div>

</div>


<div id="printArea"></div>

<div id="toast" class="toast"></div>


<script>

"use strict";


const KEY={

S:"mybar_settings_v6",
P:"mybar_products_v6",
T:"mybar_tables_v6",
I:"mybar_invoices_v6",
INV:"mybar_inventory_v6",
SESSION:"MY_BAR_SESSION"

};


const DEF={

barName:"MY BAR",
address:"",
phone:"",
printer:"",
paper:"80",
tableCount:12

};


const DEFAULT_PRODUCTS=[

["Espresso","Kafe",100],
["Espresso Dopio","Kafe",150],
["Macchiato","Kafe",120],
["Cappuccino","Kafe",180],
["Latte","Kafe",200],
["Freddo Espresso","Kafe",200],
["Freddo Cappuccino","Kafe",220],
["Çaj","Kafe",120],

["Coca Cola","Pije Freskuese",150],
["Coca Cola Zero","Pije Freskuese",150],
["Fanta","Pije Freskuese",150],
["Sprite","Pije Freskuese",150],
["Schweppes","Pije Freskuese",150],
["Red Bull","Pije Freskuese",250],

["Ujë 0.5L","Ujë",100],
["Ujë 0.75L","Ujë",150],
["Ujë 1.5L","Ujë",150],

["Birra Tirana","Birra",200],
["Birra Korça","Birra",200],
["Heineken","Birra",250],
["Corona","Birra",300],

["Jack Daniel's","Whisky",500],
["Johnnie Walker Red","Whisky",450],
["Chivas Regal","Whisky",700],

["Gordon's Gin","Gin",450],
["Bombay Sapphire","Gin",550],
["Hendrick's","Gin",800],

["Absolut Vodka","Vodka",450],
["Smirnoff","Vodka",450],
["Grey Goose","Vodka",800],

["Bacardi","Rum",450],
["Captain Morgan","Rum",500],

["Jose Cuervo","Tequila",500],

["Baileys","Liqueur",450],
["Jägermeister","Liqueur",450],
["Aperol","Liqueur",400],

["Verë e Kuqe","Verë",300],
["Verë e Bardhë","Verë",300],
["Prosecco","Verë",600],

["Mojito","Cocktails",600],
["Margarita","Cocktails",650],
["Aperol Spritz","Cocktails",650],
["Long Island","Cocktails",800],

["Gin Tonic","Long Drinks",550],
["Vodka Red Bull","Long Drinks",600],
["Whisky Cola","Long Drinks",550],

["Shot Tequila","Shots",300],
["Shot Jägermeister","Shots",300],
["Shot Vodka","Shots",250],

["Patatina","Snacks",200],
["Kikirikë","Snacks",200],
["Ullinj","Snacks",250],
["Mix Nuts","Snacks",350]

].map((x,i)=>({

id:i+1,
name:x[0],
category:x[1],
price:x[2]

}));


let selectedCategory="Të gjitha";

let currentInvoice=null;


function get(k,d){

try{

let x=localStorage.getItem(k);

return x?JSON.parse(x):d;

}catch{

return d;

}

}


function set(k,v){

localStorage.setItem(k,JSON.stringify(v));

}


function money(n){

return Number(n||0)
.toLocaleString("sq-AL")+" L";

}


function esc(x){

return String(x??"")
.replace(/[&<>"']/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[c]));

}


function S(){

return {
...DEF,
...get(KEY.S,{})
};

}


function PS(){

return get(KEY.P,DEFAULT_PRODUCTS);

}


function TS(){

return get(KEY.T,[]);

}


function IS(){

return get(KEY.I,[]);

}


function user(){

try{

return JSON.parse(
localStorage.getItem(KEY.SESSION)
);

}catch{

return null;

}

}


function table(){

return TS().find(
t=>t.id===Number(
localStorage.getItem("mybar_selected")||0
)
);

}


function stock(id){

let x=get(KEY.INV,{});

if(x[id]===undefined){

x[id]=20;

set(KEY.INV,x);

}

return Number(x[id]||0);

}


function setStock(id,n){

let x=get(KEY.INV,{});

x[id]=Math.max(0,n);

set(KEY.INV,x);

}


function total(t){

return (t?.items||[])
.reduce(
(a,i)=>a+i.price*i.quantity,
0
);

}


function go(id,btn){

document
.querySelectorAll(".page")
.forEach(x=>
x.classList.toggle("active",x.id===id)
);

document
.querySelectorAll("nav button")
.forEach(x=>
x.classList.remove("active")
);

if(btn){

btn.classList.add("active");

}

if(id==="pos"){

renderMenu();

}

if(id==="history"){

renderHistory();

}

if(id==="settings"){

renderProducts();

}

}


function init(){

let s=S();

set(KEY.S,s);


if(!localStorage.getItem(KEY.P)){

set(KEY.P,DEFAULT_PRODUCTS);

}


let ts=TS();

let n=Math.max(
1,
Math.min(
100,
Number(s.tableCount)||12
)
);


if(!ts.length || ts.length!==n){

ts=Array.from(
{length:n},
(_,i)=>
ts[i]||
{
id:i+1,
name:"Tavolina "+(i+1),
items:[]
}
);

set(KEY.T,ts);

}


if(!localStorage.getItem(KEY.I)){

set(KEY.I,[]);

}


let u=user();

if(!u){

location.href="./login.html";

return;

}


document
.getElementById("userName")
.textContent=
u.name||u.username;


document
.getElementById("userRole")
.textContent=
u.role==="admin"
?"ADMIN"
:"KAMARIER";


document
.getElementById("settingsBtn")
.style.display=
u.role==="admin"
?"block"
:"none";


document
.getElementById("settings")
.style.display=
u.role==="admin"
?"block"
:"none";


loadSettings();

renderAll();

setInterval(clock,1000);

clock();

}


function clock(){

document
.getElementById("clock")
.textContent=
new Date().toLocaleTimeString(
"sq-AL",
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
}
);

}


function renderAll(){

document
.getElementById("barName")
.textContent=
S().barName;


renderTables();
renderMenu();
renderOrder();
dashboard();
renderHistory();
renderProducts();

}


function renderTables(){

let html=
TS().map(t=>`

<button
class="table ${t.items?.length?"active":""}"
onclick="selectTable(${t.id})">

<strong>
${esc(t.name)}
</strong>

<span>
${t.items?.length
?money(total(t))
:"E lirë"}
</span>

</button>

`).join("");


document
.getElementById("dashTables")
.innerHTML=html;


document
.getElementById("tableGrid")
.innerHTML=html;

}


function selectTable(id){

localStorage.setItem(
"mybar_selected",
id
);

go("pos");

renderTables();

renderOrder();

}


function renderMenu(){

let q=
(
document
.getElementById("search")
.value||""
)
.toLowerCase();


let ps=PS();


let cats=[
"Të gjitha",
...new Set(
ps.map(p=>p.category)
)
];


document
.getElementById("cats")
.innerHTML=
cats.map(c=>`

<button
class="btn ${
c===selectedCategory
?"primary"
:""
}"
onclick="cat('${esc(c)}')">

${esc(c)}

</button>

`).join("");


let f=
ps.filter(p=>
(
selectedCategory==="Të gjitha"||
p.category===selectedCategory
)
&&
p.name
.toLowerCase()
.includes(q)
);


document
.getElementById("menu")
.innerHTML=
f.map(p=>`

<button
${stock(p.id)<=0?"disabled":""}
onclick="add(${p.id})">

<strong>
${esc(p.name)}
</strong>

<span>
${money(p.price)}
</span>

<small>
Stok: ${stock(p.id)}
</small>

</button>

`).join("");

}


function cat(c){

selectedCategory=c;

renderMenu();

}


function add(id){

let t=table();

let p=
PS().find(x=>x.id===id);


if(!t){

toast("Zgjidh tavolinën.");

return;

}


if(!p){

return;

}


let i=
(t.items||[])
.find(x=>x.productId===id);


if((i?.quantity||0)>=stock(id)){

toast("Nuk ka stok.");

return;

}


if(!t.items){

t.items=[];

}


if(i){

i.quantity++;

}else{

t.items.push({

productId:p.id,
name:p.name,
price:p.price,
quantity:1

});

}


saveTable(t);

renderAll();

}


function saveTable(t){

let a=TS();

let i=
a.findIndex(x=>x.id===t.id);

a[i]=t;

set(KEY.T,a);

}


function qty(i,d){

let t=table();

let x=t?.items?.[i];

if(!x)return;


let n=x.quantity+d;


if(n<=0){

t.items.splice(i,1);

}else{

if(n>stock(x.productId)){

toast("Nuk ka mjaftueshëm stok.");

return;

}

x.quantity=n;

}


saveTable(t);

renderAll();

}


function removeItem(i){

let t=table();

if(!t)return;

t.items.splice(i,1);

saveTable(t);

renderAll();

}


function clearOrder(){

let t=table();

if(!t?.items?.length)return;


if(
confirm("Të pastrohet porosia?")
){

t.items=[];

saveTable(t);

renderAll();

}

}


function renderOrder(){

let t=table();

let b=
document.getElementById("order");


document
.getElementById("selTable")
.textContent=
t
?t.name
:"Zgjidh tavolinën";


if(!t?.items?.length){

b.innerHTML=
'<div class="empty">Nuk ka produkte.</div>';

document
.getElementById("total")
.textContent=
money(0);

return;

}


b.innerHTML=
t.items.map((i,n)=>`

<div class="order-row">

<div>

<strong>
${esc(i.name)}
</strong>

<small>
${money(i.price)} × ${i.quantity}
</small>

</div>

<div class="qty">

<button
onclick="qty(${n},-1)">
−
</button>

<span>
${i.quantity}
</span>

<button
onclick="qty(${n},1)">
+
</button>

<button
onclick="removeItem(${n})">
×
</button>

</div>

</div>

`).join("");


document
.getElementById("total")
.textContent=
money(total(t));

}


function openPayment(){

let t=table();


if(!t?.items?.length){

toast("Porosia është bosh.");

return;

}


document
.getElementById("payTotal")
.textContent=
money(total(t));


document
.getElementById("payment")
.classList.add("show");

}


function pay(method){

let t=table();

if(!t)return;


for(let i of t.items){

if(
i.quantity>stock(i.productId)
){

toast(
"Stok i pamjaftueshëm."
);

return;

}

}


t.items.forEach(i=>
setStock(
i.productId,
stock(i.productId)-i.quantity
)
);


let inv={

id:Date.now(),

number:
"INV-"+String(Date.now()).slice(-8),

date:
new Date().toISOString(),

tableName:t.name,

items:
JSON.parse(
JSON.stringify(t.items)
),

total:
total(t),

payment:
method,

waiter:
user()?.name||
user()?.username||
"Pa emër"

};


let a=IS();

a.push(inv);

set(KEY.I,a);


t.items=[];

saveTable(t);


localStorage.removeItem(
"mybar_selected"
);


document
.getElementById("payment")
.classList.remove("show");


renderAll();

showInvoice(inv);

}


function showInvoice(i){

currentInvoice=i;

let s=S();


document
.getElementById("invoicePreview")
.innerHTML=`

<div class="invoice">

<h2>
${esc(s.barName)}
</h2>

<p>
${esc(s.address)}
</p>

<p>
${esc(s.phone)}
</p>

<hr>

<p>
<b>
${i.number}
</b>
</p>

<p>
${new Date(i.date)
.toLocaleString("sq-AL")}
</p>

<p>
${esc(i.tableName)}
•
${esc(i.waiter)}
</p>

${
i.items.map(x=>`

<div class="invrow">

<span>
${esc(x.name)} × ${x.quantity}
</span>

<b>
${money(x.price*x.quantity)}
</b>

</div>

`).join("")
}

<div class="invtotal">

<span>
TOTAL
</span>

<span>
${money(i.total)}
</span>

</div>

<p>
Pagesa:
${i.payment==="card"
?"KARTË"
:"CASH"}
</p>

</div>

`;


document
.getElementById("invoiceModal")
.classList.add("show");

}


function closeInvoice(){

document
.getElementById("invoiceModal")
.classList.remove("show");

}


function preparePrint(i){

let s=S();

let width=
s.paper==="58"
?"58mm"
:"80mm";


document
.getElementById("printArea")
.innerHTML=`

<div
class="paper"
style="width:${width}">

<div
style="
text-align:center;
font-family:Arial,sans-serif;
">

<h2
style="margin:0">

${esc(s.barName)}

</h2>

${
s.address
?`<div>${esc(s.address)}</div>`
:""
}

${
s.phone

:""
}

<div>
${i.number}
</div>

${new Date(i.date)
.toLocaleString("sq-AL")}
</div>

${esc(i.tableName)}
•
${esc(i.waiter)}
</div>

<hr>

${
i.items.map(x=>`

<div

gap:5mm;

${esc(x.name)} × ${x.quantity}

}


function printInvoice(i){

preparePrint(i);

setTimeout(
()=>{
window.print();
},
100
);

}


function printCurrent(){

if(currentInvoice){

printInvoice(currentInvoice);

}

}


function printLast(){

let a=IS();

if(a.length){

printInvoice(
a[a.length-1]
);

}else{

toast(
"Nuk ka faturë."
);

}

}


function dashboard(){

let today=
new Date().toDateString();


let a=
IS().filter(
i=>
new Date(i.date)
.toDateString()
===today
);


document
.getElementById("sales")
.textContent=
money(
a.reduce(
(x,i)=>x+i.total,
0
)
);


document
.getElementById("count")
.textContent=
a.length;


document
.getElementById("cards")
.textContent=
money(
a.filter(
i=>i.payment==="card"
)
.reduce(
(x,i)=>x+i.total,
0
)
);


document
.getElementById("active")
.textContent=
TS().filter(
t=>t.items?.length
).length;

}


function renderHistory(){

let a=
IS()
.slice()
.reverse();


let b=
document
.getElementById("historyList");


if(!a.length){

b.innerHTML=
'<div class="empty">Nuk ka histori.</div>';

}


b.innerHTML=
a.map(i=>`

PRINT

function printById(id){

let i=
IS().find(x=>x.id===id);

if(i){

printInvoice(i);

}

}


function clearHistory(){

if(
confirm("Fshi gjithë historikun?")
){

set(KEY.I,[]);

renderAll();

}

}


function loadSettings(){

let s=S();


document
.getElementById("sName")
.value=s.barName;


document
.getElementById("sAddress")
.value=s.address;


document
.getElementById("sPhone")
.value=s.phone;


document
.getElementById("sTables")
.value=s.tableCount;


document
.getElementById("sPrinter")
.value=s.printer;


document
.getElementById("sPaper")
.value=s.paper;

}


function saveSettings(){

let s=S();


s.barName=
document
.getElementById("sName")
.value.trim()
||"MY BAR";


s.address=
document
.getElementById("sAddress")
.value.trim();


s.phone=
document
.getElementById("sPhone")
.value.trim();


s.printer=
document
.getElementById("sPrinter")
.value.trim();


s.paper=
document
.getElementById("sPaper")
.value;


s.tableCount=
Math.max(
1,
Math.min(
100,
Number(
document
.getElementById("sTables")
.value
)||12
)
);


set(KEY.S,s);

location.reload();

}


function renderProducts(){

let u=user();

if(u?.role!=="admin")return;


document
.getElementById("products")
.innerHTML=
PS().map(p=>`

<div class="row">

<div>

<strong>
${esc(p.name)}
</strong>

<small>
${esc(p.category)}
•
${money(p.price)}
•
Stok ${stock(p.id)}
</small>

</div>

<div>

<button
class="btn"
onclick="
setStock(
${p.id},
${stock(p.id)+1}
);
renderAll()
">

+

</button>

<button
class="btn"
onclick="
setStock(
${p.id},
${Math.max(0,stock(p.id)-1)}
);
renderAll()
">

−

</button>

<button
class="btn danger"
onclick="
delProduct(${p.id})
">

Fshi

</button>

</div>

</div>

`).join("");

}


function addProductAdmin(){

let n=
document
.getElementById("pn")
.value.trim();


let c=
document
.getElementById("pc")
.value.trim()
||"Të tjera";


let p=
Number(
document
.getElementById("pp")
.value
);


if(!n||!p){

toast(
"Plotëso produktin."
);

return;

}


let a=PS();


a.push({

id:Date.now(),
name:n,
category:c,
price:p

});


set(KEY.P,a);


document
.getElementById("pn")
.value="";


document
.getElementById("pc")
.value="";


document
.getElementById("pp")
.value="";


renderAll();

}


function delProduct(id){

if(
confirm("Fshi produktin?")
){

set(
KEY.P,
PS().filter(
p=>p.id!==id
)
);

renderAll();

}

}


function logout(){

localStorage.removeItem(
KEY.SESSION
);

location.href="./login.html";

}


function toast(m){

let x=
document
.getElementById("toast");


x.textContent=m;

x.style.display="block";


clearTimeout(
window.tt
);


window.tt=
setTimeout(
()=>{
x.style.display="none";
},
2200
);

}


document.addEventListener(
"keydown",
e=>{

if(e.key==="F6"){

e.preventDefault();

printLast();

}

if(e.key==="Escape"){

document
.getElementById("payment")
.classList.remove("show");

closeInvoice();

}

}
);


init();

</script>

</html>
