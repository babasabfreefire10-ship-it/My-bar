<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MY BAR</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#080b09;
    color:#fff;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
    display:flex;
}

/* SIDEBAR */

.sidebar{
    width:230px;
    background:#0d120f;
    border-right:1px solid #26352c;
    padding:20px;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
    color:#55df83;
    margin-bottom:30px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.nav button{
    width:100%;
    padding:13px;
    text-align:left;
    border:0;
    border-radius:10px;
    background:transparent;
    color:#aab6ae;
}

.nav button:hover,
.nav button.active{
    background:#173022;
    color:#65e991;
}

.logout{
    position:absolute;
    left:20px;
    right:20px;
    bottom:20px;
    background:#261514 !important;
    color:#ff8585 !important;
}

/* MAIN */

.main{
    margin-left:230px;
    width:calc(100% - 230px);
    min-height:100vh;
}

.topbar{
    height:70px;
    padding:0 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #26352c;
    background:#0a0f0c;
}

.app-title{
    font-weight:800;
}

.user-info{
    color:#8fa198;
    font-size:14px;
}

.content{
    padding:25px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* CARDS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.stat{
    background:#101712;
    border:1px solid #26382c;
    border-radius:15px;
    padding:20px;
}

.stat small{
    color:#819087;
}

.stat strong{
    display:block;
    margin-top:10px;
    font-size:25px;
    color:#69e992;
}

/* TABLES */

.tables-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.table-card{
    border:1px solid #284332;
    background:#101712;
    border-radius:16px;
    padding:20px;
    min-height:125px;
    color:#fff;
    text-align:left;
}

.table-card:hover{
    border-color:#57d981;
}

.table-card.free{
    background:#101712;
}

.table-card.busy{
    background:#1a1410;
    border-color:#76552d;
}

.table-card.selected{
    border:2px solid #54e58a;
    box-shadow:0 0 20px rgba(84,229,138,.12);
}

.table-number{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    background:#1a2b20;
    color:#65e991;
    font-weight:900;
    margin-bottom:12px;
}

.table-card strong{
    display:block;
}

.table-card small{
    display:block;
    margin-top:8px;
    color:#8d9b93;
}

/* POS */

.pos-layout{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:20px;
}

.panel{
    background:#0f1511;
    border:1px solid #26372c;
    border-radius:16px;
    padding:18px;
}

.panel-title{
    font-size:19px;
    font-weight:800;
    margin-bottom:15px;
}

.search{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #2a3d31;
    background:#0a0f0c;
    color:#fff;
    outline:none;
}

.categories{
    display:flex;
    gap:8px;
    overflow:auto;
    margin:15px 0;
}

.categories button{
    white-space:nowrap;
    border:1px solid #294032;
    background:#111812;
    color:#9ba9a0;
    padding:9px 13px;
    border-radius:9px;
}

.categories button.active{
    background:#1a3a26;
    color:#69e992;
}

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.product{
    border:1px solid #283a2e;
    background:#111812;
    color:#fff;
    border-radius:13px;
    padding:14px;
    text-align:left;
    min-height:100px;
}

.product:hover{
    border-color:#55df83;
}

.product strong{
    display:block;
    margin-bottom:10px;
}

.product span{
    color:#68e890;
    font-weight:800;
}

.product small{
    display:block;
    color:#75837b;
    margin-top:7px;
}

/* ORDER */

.selected-table{
    padding:12px;
    background:#142319;
    color:#6be995;
    border-radius:10px;
    margin-bottom:15px;
}

.order-list{
    min-height:250px;
}

.order-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:13px 0;
    border-bottom:1px solid #202b24;
}

.order-row strong{
    display:block;
}

.order-row small{
    color:#7f8c84;
}

.order-actions{
    display:flex;
    align-items:center;
    gap:6px;
}

.order-actions button{
    width:28px;
    height:28px;
    border:0;
    border-radius:7px;
    background:#1d2b22;
    color:#fff;
}

.order-actions .delete{
    background:#321817;
    color:#ff7777;
}

.total-box{
    border-top:1px solid #29382f;
    padding-top:15px;
    margin-top:15px;
}

.total-line{
    display:flex;
    justify-content:space-between;
    font-size:21px;
    font-weight:900;
}

.total-line strong{
    color:#68e990;
}

.primary{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:11px;
    background:#36b967;
    color:#fff;
    font-weight:900;
}

.primary:hover{
    background:#42d277;
}

/* HISTORY */

.history-row{
    display:flex;
    justify-content:space-between;
    padding:16px;
    border-bottom:1px solid #243129;
}

.history-row small{
    display:block;
    color:#7d8a82;
    margin-top:5px;
}

/* SETTINGS */

.settings{
    max-width:700px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    margin-bottom:7px;
    color:#a8b3ad;
}

.field input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #293b30;
    background:#0a0f0c;
    color:#fff;
}

/* MODALS */

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.75);
    z-index:1000;
    padding:20px;
}

.modal-box{
    width:420px;
    max-width:100%;
    background:#101611;
    border:1px solid #304437;
    border-radius:18px;
    padding:22px;
}

.modal-title{
    font-size:21px;
    font-weight:900;
    margin-bottom:20px;
}

.payment-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.payment-buttons button{
    padding:16px;
    border:0;
    border-radius:11px;
    background:#193622;
    color:#72ed99;
    font-weight:900;
}

.close{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:1px solid #39453e;
    background:#151b17;
    color:#aaa;
    border-radius:10px;
}

/* INVOICE */

.invoice{
    background:#fff;
    color:#111;
    width:420px;
    max-width:100%;
    border-radius:10px;
    padding:25px;
}

.invoice-header{
    text-align:center;
    border-bottom:1px dashed #777;
    padding-bottom:15px;
}

.invoice-header h2{
    margin:0;
}

.invoice-info{
    margin:15px 0;
    font-size:13px;
}

.invoice-item{
    display:flex;
    justify-content:space-between;
    padding:7px 0;
    border-bottom:1px dashed #ddd;
}

.invoice-total{
    display:flex;
    justify-content:space-between;
    font-size:20px;
    font-weight:900;
    padding-top:15px;
}

.invoice-buttons{
    display:flex;
    gap:8px;
    margin-top:20px;
}

.invoice-buttons button{
    flex:1;
    padding:12px;
    border:0;
    border-radius:9px;
    background:#1d6e3b;
    color:#fff;
    font-weight:800;
}

.invoice-buttons button:last-child{
    background:#333;
}

/* PRINT */

#printArea{
    display:none;
}

@media print{

    body *{
        visibility:hidden !important;
    }

    #printArea,
    #printArea *{
        visibility:visible !important;
    }

    #printArea{
        display:block !important;
        position:absolute;
        left:0;
        top:0;
        width:80mm;
        padding:3mm;
        color:#000;
        background:#fff;
        font-family:Arial, sans-serif;
        font-size:12px;
    }

    @page{
        size:80mm auto;
        margin:0;
    }
}

/* MOBILE */

@media(max-width:1000px){

    .sidebar{
        width:190px;
    }

    .main{
        margin-left:190px;
        width:calc(100% - 190px);
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .products{
        grid-template-columns:repeat(3,1fr);
    }

    .tables-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .pos-layout{
        grid-template-columns:1fr;
    }
}

@media(max-width:700px){

    .sidebar{
        position:static;
        width:100%;
        height:auto;
    }

    .app{
        display:block;
    }

    .main{
        margin-left:0;
        width:100%;
    }

    .logout{
        position:static;
        margin-top:15px;
    }

    .stats,
    .tables-grid,
    .products{
        grid-template-columns:repeat(2,1fr);
    }

    .content{
        padding:14px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">MY BAR</div>

        <div class="nav">

            <button class="active" onclick="showPage('dashboard',this)">
                Dashboard
            </button>

            <button onclick="showPage('pos',this)">
                Porosi / Kasa
            </button>

            <button onclick="showPage('tables',this)">
                Tavolinat
            </button>

            <button onclick="showPage('history',this)">
                Historiku
            </button>

            <button id="adminNav" onclick="showPage('settings',this)">
                Cilësime
            </button>

        </div>

        <button class="nav logout" onclick="logout()">
            Dil
        </button>

    </aside>


    <main class="main">

        <header class="topbar">

            <div>
                <strong id="barNameTop">
                    MY BAR
                </strong>
            </div>

            <div class="user-info" id="userInfo">
                —
            </div>

        </header>


        <div class="content">

            <!-- DASHBOARD -->

            <section id="dashboard" class="page active">

                <h1>Dashboard</h1>

                <div class="stats">

                    <div class="stat">
                        <small>Shitje sot</small>
                        <strong id="salesToday">0 L</strong>
                    </div>

                    <div class="stat">
                        <small>Tavolina aktive</small>
                        <strong id="activeTables">0</strong>
                    </div>

                    <div class="stat">
                        <small>Fatura sot</small>
                        <strong id="invoiceCount">0</strong>
                    </div>

                    <div class="stat">
                        <small>Pagesa me kartë</small>
                        <strong id="cardToday">0 L</strong>
                    </div>

                </div>

                <br>

                <div class="panel">

                    <div class="panel-title">
                        Tavolinat
                    </div>

                    <div
                        id="dashboardTables"
                        class="tables-grid">
                    </div>

                </div>

            </section>


            <!-- POS -->

            <section id="pos" class="page">

                <div class="pos-layout">

                    <div class="panel">

                        <div class="panel-title">
                            Menu
                        </div>

                        <input
                            id="search"
                            class="search"
                            placeholder="Kërko produkt..."
                        >

                        <div
                            id="categories"
                            class="categories">
                        </div>

                        <div
                            id="products"
                            class="products">
                        </div>

                    </div>


                    <div class="panel">

                        <div class="panel-title">
                            Porosia
                        </div>

                        <div
                            id="selectedTable"
                            class="selected-table">
                            Zgjidh një tavolinë
                        </div>

                        <div
                            id="orderList"
                            class="order-list">
                        </div>

                        <div class="total-box">

                            <div class="total-line">
                                <span>Total</span>
                                <strong id="orderTotal">
                                    0 L
                                </strong>
                            </div>

                            <button
                                class="primary"
                                onclick="openPayment()">
                                Paguaj
                            </button>

                        </div>

                    </div>

                </div>

            </section>


            <!-- TABLES -->

            <section id="tables" class="page">

                <div class="panel">

                    <div class="panel-title">
                        Tavolinat
                    </div>

                    <div
                        id="tableGrid"
                        class="tables-grid">
                    </div>

                </div>

            </section>


            <!-- HISTORY -->

            <section id="history" class="page">

                <div class="panel">

                    <div class="panel-title">
                        Historiku
                    </div>

                    <div id="historyList">
                    </div>

                </div>

            </section>


            <!-- SETTINGS -->

            <section id="settings" class="page">

                <div class="panel settings">

                    <div class="panel-title">
                        Cilësime
                    </div>

                    <div class="field">
                        <label>
                            Emri i lokalit
                        </label>

                        <input
                            id="barNameInput"
                            placeholder="MY BAR">
                    </div>

                    <div class="field">
                        <label>
                            Adresa
                        </label>

                        <input
                            id="barAddressInput"
                            placeholder="Adresa">
                    </div>

                    <div class="field">
                        <label>
                            Telefoni
                        </label>

                        <input
                            id="barPhoneInput"
                            placeholder="Telefon">
                    </div>

                    <button
                        class="primary"
                        onclick="saveSettings()">
                        Ruaj cilësimet
                    </button>

                </div>

            </section>

        </div>

    </main>

</div>


<!-- PAYMENT MODAL -->

<div
    id="paymentModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-title">
            Zgjidh mënyrën e pagesës
        </div>

        <div style="margin-bottom:20px">
            Total:
            <strong
                id="paymentTotal"
                style="color:#69e992">
                0 L
            </strong>
        </div>

        <div class="payment-buttons">

            <button onclick="completePayment('cash')">
                💵 CASH
            </button>

            <button onclick="completePayment('card')">
                💳 KARTË
            </button>

        </div>

        <button
            class="close"
            onclick="closePayment()">
            Anulo
        </button>

    </div>

</div>


<!-- INVOICE MODAL -->

<div
    id="invoiceModal"
    class="modal">

    <div class="modal-box">

        <div id="invoiceContent">
        </div>

    </div>

</div>


<!-- PRINT AREA -->

<div id="printArea"></div>


<script>

/* =========================================================

========================================================= */

"use strict";


/* STORAGE */

const USERS_KEY = "MYBAR_USERS_FINAL";

const PRODUCTS_KEY = "MYBAR_PRODUCTS_FINAL";
const TABLES_KEY = "MYBAR_TABLES_FINAL";

/* USERS */

const DEFAULT_USERS = [

/* PRODUCTS */

    {id:162,name:"Ullinj",category:"Snacks",price:250}

];


/* DEFAULT SETTINGS */

const DEFAULT_SETTINGS = {

    barName:"MY BAR",
    address:"",
    phone:""

};


/* HELPERS */

function getJSON(key,fallback){

    try{

        const value =
            localStorage.getItem(key);

        return value
            ? JSON.parse(value)
            : fallback;

    }catch(e){

        return fallback;

    }

}


function setJSON(key,value){

    localStorage.setItem(
        key,
        JSON.stringify(value)
    );

}


function money(value){

    return Number(value || 0)
        .toLocaleString("sq-AL") + " L";

}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* INIT */

function initialize(){

    if(!localStorage.getItem(USERS_KEY)){
        setJSON(USERS_KEY,DEFAULT_USERS);
    }

    if(!localStorage.getItem(PRODUCTS_KEY)){
        setJSON(
            PRODUCTS_KEY,
            DEFAULT_PRODUCTS
        );
    }

    if(!localStorage.getItem(INVOICES_KEY)){
        setJSON(INVOICES_KEY,[]);
    }

    if(!localStorage.getItem(SETTINGS_KEY)){
        setJSON(
            SETTINGS_KEY,
            DEFAULT_SETTINGS
        );
    }

    if(!localStorage.getItem(STOCK_KEY)){

        const stock = {};

        DEFAULT_PRODUCTS.forEach(product=>{
            stock[product.id] = 20;
        });

        setJSON(STOCK_KEY,stock);
    }

    initializeTables();

}


/* TABLES */

function initializeTables(){

    let tables =
        getJSON(TABLES_KEY,null);

    if(!Array.isArray(tables) || tables.length !== 12){

        tables = [];

        for(let i=1;i<=12;i++){

            tables.push({

                id:i,
                name:"Tavolina " + i,
                items:[]

            });

        }

        setJSON(
            TABLES_KEY,
            tables
        );

    }

}


function getTables(){

    return getJSON(
        TABLES_KEY,
        []
    );

}


function saveTables(tables){

    setJSON(
        TABLES_KEY,
        tables
    );

}


function getSelectedTable(){

    return Number(
        localStorage.getItem(
            "MYBAR_SELECTED_TABLE"
        ) || 0
    );

}


function selectTable(id){

    localStorage.setItem(
        "MYBAR_SELECTED_TABLE",
        String(id)
    );

    renderTables();
    renderOrder();

    showPageById("pos");

}


/* NAVIGATION */

function showPage(id,button){

    showPageById(id);

    document
        .querySelectorAll(".nav button")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    if(button){
        button.classList.add("active");
    }

}


function showPageById(id){

    document
        .querySelectorAll(".page")
        .forEach(page=>{
            page.classList.remove("active");
        });

    const page =
        document.getElementById(id);

    if(page){
        page.classList.add("active");
    }

}


/* RENDER TABLES */

function renderTables(){

    const containers = [

        document.getElementById(
            "dashboardTables"
        ),

        document.getElementById(
            "tableGrid"
        )

    ];

    const tables = getTables();

    const selected =
        getSelectedTable();

    const html =
        tables.map(table=>{

            const items =
                Array.isArray(table.items)
                    ? table.items
                    : [];

            const busy =
                items.length > 0;

            const total =
                items.reduce(
                    (sum,item)=>
                        sum +
                        Number(item.price || 0) *
                        Number(item.quantity || 0),
                    0
                );

            return `

                <button
                    class="
                        table-card
                        ${busy ? "busy" : "free"}
                        ${
                            selected === Number(table.id)
                                ? "selected"
                                : ""
                        }
                    "
                    onclick="
                        selectTable(${table.id})
                    "
                >

                    <div class="table-number">
                        ${table.id}
                    </div>

                    <strong>
                        ${escapeHTML(table.name)}
                    </strong>

                    <small>
                        ${
                            busy
                                ? "E zënë • " + money(total)
                                : "E lirë"
                        }
                    </small>

                </button>

            `;

        }).join("");


    containers.forEach(container=>{

        if(container){
            container.innerHTML = html;
        }

    });


    const selectedText =
        document.getElementById(
            "selectedTable"
        );

    if(selectedText){

        selectedText.textContent =
            selected
                ? "Tavolina " + selected
                : "Zgjidh një tavolinë";

    }

}


/* MENU */

    const products =
        getJSON(
            PRODUCTS_KEY,
            DEFAULT_PRODUCTS
        );

    const categories =
        document.getElementById(
            "categories"
        );

            "products"
        );

            products.map(
                product => product.category
            )
        )

    ];


    categories.innerHTML =

            <button

                    }

                    )
                "

            </button>

        `).join("");


    const search =
        document.getElementById(

        ).value

        .toLowerCase();

function setCategory(category){

    currentCategory =
        category;

    renderMenu();

}


/* STOCK */

function getStock(productId){

    const stock =
        getJSON(
            STOCK_KEY,
            {}
        );

    return Number(
        stock[productId] ?? 0
    );

}


function changeStock(productId,amount){

    const stock =
        getJSON(
            STOCK_KEY,
            {}
        );

    stock[productId] =
        Math.max(
            0,
            Number(stock[productId] || 0)
            + Number(amount)
        );

    setJSON(
        STOCK_KEY,
        stock
    );

}


/* ADD PRODUCT */

function addProduct(productId){

    const tableId =
        getSelectedTable();

    if(!tableId){

        alert(
            "Zgjidh fillimisht një tavolinë."
        );

        return;

    }


    const products =
        getJSON(
            PRODUCTS_KEY,
            DEFAULT_PRODUCTS
        );

    const product =
        products.find(
            p =>
                Number(p.id) ===
                Number(productId)
        );


    if(!product) return;


    const stock =
        getStock(productId);

    if(stock <= 0){

        alert(
            "Ky produkt nuk ka stok."
        );

        return;

    }


    const tables =
        getTables();

    const table =
        tables.find(
            t =>
                Number(t.id) ===
                Number(tableId)
        );


    if(!table) return;


    if(!Array.isArray(table.items)){
        table.items = [];
    }


    const existing =
        table.items.find(
            item =>
                Number(item.productId) ===
                Number(productId)
        );


    if(existing){

        if(
            existing.quantity >=
            stock
        ){

            alert(
                "Nuk ka më stok."
            );

            return;

        }

        existing.quantity++;

    }else{

        table.items.push({

            productId:product.id,

            name:product.name,

            price:Number(
                product.price
            ),

            quantity:1

        });

    }


    saveTables(tables);

    renderTables();
    renderOrder();
    renderMenu();
    updateDashboard();

}


/* ORDER */

function renderOrder(){

    const container =
        document.getElementById(
            "orderList"
        );

    const totalElement =
        document.getElementById(
            "orderTotal"
        );


    const tableId =
        getSelectedTable();

    const tables =
        getTables();

    const table =
        tables.find(
            t =>
                Number(t.id) ===
                Number(tableId)
        );


    if(
        !table ||
        !Array.isArray(table.items) ||
        !table.items.length
    ){

        container.innerHTML = `
            <div style="
                color:#77847d;
                padding:25px 0;
                text-align:center;
            ">
                Nuk ka produkte në porosi.
            </div>
        `;

        totalElement.textContent =
            money(0);

        return;

    }


    let total = 0;


    container.innerHTML =
        table.items.map(
            (item,index)=>{

                const itemTotal =
                    Number(item.price) *
                    Number(item.quantity);

                total += itemTotal;


                return `

                    <div class="order-row">

                        <div>

                            <strong>
                                ${escapeHTML(
                                    item.name
                                )}
                            </strong>

                            <small>
                                ${money(item.price)}
                                ×
                                ${item.quantity}
                            </small>

                        </div>


                        <div class="order-actions">

                            <button
                                onclick="
                                    changeQuantity(
                                        ${index},
                                        -1
                                    )
                                "
                            >
                                −
                            </button>

                            <span>
                                ${item.quantity}
                            </span>

                            <button
                                onclick="
                                    changeQuantity(
                                        ${index},
                                        1
                                    )
                                "
                            >
                                +
                            </button>

                            <button
                                class="delete"
                                onclick="
                                    removeItem(
                                        ${index}
                                    )
                                "
                            >
                                ×
                            </button>

                        </div>

                    </div>

                `;

            }
        ).join("");


    totalElement.textContent =
        money(total);

}


function changeQuantity(index,amount){

    const tableId =
        getSelectedTable();

    const tables =
        getTables();

    const table =
        tables.find(
            t =>
                Number(t.id) ===
                Number(tableId)
        );


    if(!table) return;


    const item =
        table.items[index];

    if(!item) return;


    const newQuantity =
        Number(item.quantity) +
        Number(amount);


    if(newQuantity <= 0){

        table.items.splice(
            index,
            1
        );

    }else{

        if(
            newQuantity >
            getStock(item.productId)
        ){

            alert(
                "Nuk ka mjaftueshëm stok."
            );

            return;

        }

        item.quantity =
            newQuantity;

    }


    saveTables(tables);

    renderTables();
    renderOrder();
    updateDashboard();

}


function removeItem(index){

    const tableId =
        getSelectedTable();

    const tables =
        getTables();

    const table =
        tables.find(
            t =>
                Number(t.id) ===
                Number(tableId)
        );


    if(!table) return;


    table.items.splice(
        index,
        1
    );


    saveTables(tables);

    renderTables();
    renderOrder();
    updateDashboard();

}


/* TOTAL */

function getTableTotal(table){

    if(
        !table ||
        !Array.isArray(table.items)
    ){
        return 0;
    }


    return table.items.reduce(
        (sum,item)=>
            sum +
            Number(item.price || 0) *
            Number(item.quantity || 0),
        0
    );

}


/* PAYMENT */

function openPayment(){

    const tableId =
        getSelectedTable();

    if(!tableId){

        alert(
            "Zgjidh një tavolinë."
        );

        return;

    }


    const tables =
        getTables();

    const table =
        tables.find(
            t =>
                Number(t.id) ===
                Number(tableId)
        );


    if(
        !table ||
        !table.items.length
    ){

        alert(
            "Porosia është bosh."
        );

        return;

    }


    const total =
        getTableTotal(table);


    document.getElementById(
        "paymentTotal"
    ).textContent =

    document.getElementById(
        "paymentModal"
    ).style.display =
        "flex";

}


function closePayment(){

    document.getElementById(
        "paymentModal"
    ).style.display =
        "none";

}


/* COMPLETE PAYMENT */

function completePayment(method){

    const tableId =
        getSelectedTable();

    const tables =
        getTables();

    const table =
        tables.find(
            t =>
                Number(t.id) ===
                Number(tableId)
        );


    if(
        !table ||
        !table.items.length
    ){

        alert(
            "Porosia është bosh."
        );

        return;

    }


    /* CHECK STOCK */

    for(
        const item
        of table.items
    ){

        if(
            Number(item.quantity) >
            getStock(item.productId)
        ){

            alert(
                "Stoku nuk është i mjaftueshëm për " +
                item.name
            );

            return;

        }

    }


    const total =
        getTableTotal(table);


    /* REDUCE STOCK */

    table.items.forEach(item=>{

        changeStock(
            item.productId,
            -Number(item.quantity)
        );

    });


    const user =
        getJSON(
            SESSION_KEY,
            null
        );


    const invoice = {

        id:Date.now(),

        number:
            "INV-" +
            Date.now(),

        date:
            new Date().toISOString(),

        table:
            table.id,

        tableName:
            table.name,

        items:
            JSON.parse(
                JSON.stringify(
                    table.items
                )
            ),

        total:total,

        payment:method,

        waiter:
            user
                ? user.name
                : "Kamarier"

    };


    const invoices =
        getJSON(
            INVOICES_KEY,
            []
        );


    invoices.push(
        invoice
    );


    setJSON(
        INVOICES_KEY,
        invoices
    );


    /* CLEAR TABLE */

    table.items = [];

    saveTables(tables);


    localStorage.removeItem(
        "MYBAR_SELECTED_TABLE"
    );


    closePayment();


    renderTables();
    renderOrder();
    renderMenu();
    updateDashboard();
    renderHistory();


    showInvoice(invoice);

}

            font-family:Arial,sans-serif;

        ">

                text-align:center;
                font-size:18px;
                font-weight:bold;
            ">

                margin-top:4px;
            ">

            </div>

            <hr>

                Nr: ${invoice.number}

            <div>
                Tavolina:
                ${escapeHTML(

                )}
            </div>

            <div>
                Kamarier:
                ${escapeHTML(

                )}
            </div>

            <div>

                ${

                }
            </div>

            <div>
                ${new Date(
                    invoice.date
                ).toLocaleString("sq-AL")}
            </div>

            <hr>

    `;


    invoice.items.forEach(item=>{

        html += `

            <div style="
                display:flex;
                justify-content:space-between;
                margin:5px 0;
            ">

                <span>
                    ${escapeHTML(
                        item.name
                    )}
                    x${item.quantity}
                </span>

                <strong>

                        Number(item.price) *
                        Number(item.quantity)
                    )}

/* DASHBOARD */

function updateDashboard(){

    const invoices =
        getJSON(
            INVOICES_KEY,
            []
        );


    const today =
        new Date();


    const todayKey =
        today.toLocaleDateString(
            "sq-AL"
        );


    const todayInvoices =
        invoices.filter(invoice=>{

            return new Date(
                invoice.date
            ).toLocaleDateString(
                "sq-AL"
            ) === todayKey;

        });


    const sales =
        todayInvoices.reduce(
            (sum,invoice)=>
                sum +
                Number(invoice.total || 0),
            0
        );


    const card =
        todayInvoices
        .filter(
            invoice =>
                invoice.payment ===
                "card"
        )
        .reduce(
            (sum,invoice)=>
                sum +
                Number(invoice.total || 0),
            0
        );


    const activeTables =
        getTables().filter(
            table =>
                table.items &&
                table.items.length
        ).length;


    document.getElementById(
        "salesToday"
    ).textContent =
        money(sales);


    document.getElementById(
        "activeTables"
    ).textContent =
        activeTables;


    document.getElementById(
        "invoiceCount"
    ).textContent =
        todayInvoices.length;


    document.getElementById(
        "cardToday"
    ).textContent =
        money(card);

}

    localStorage.removeItem(
        SESSION_KEY
    );

    window.location.href =
        "./login.html";

}


/* SEARCH */

document.getElementById(
    "search"
).addEventListener(
    "input",

);


/* KEYBOARD PRINT */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "F6"
        ){

            event.preventDefault();

            const invoices =
                getJSON(
                    INVOICES_KEY,
                    []
                );


            if(
                invoices.length
            ){

                printInvoice(
                    invoices[

                    ].id
                );

            }

        }

    }
);


/* START */

document.addEventListener(

    function(){

        initialize();

        renderHeader();
        applyRole();

        renderTables();
        renderMenu();
        renderOrder();
        renderHistory();
        updateDashboard();
        loadSettings();

    }
);
