<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>WELCOME • MY BAR</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#050505;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    overflow-x:hidden;
}

/* =========================
   GOLD BACKGROUND
========================= */

body::before{
    content:"";
    position:fixed;
    inset:-30%;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(201,165,92,.16),
            transparent 28%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(201,165,92,.08),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(201,165,92,.06),
            transparent 25%
        );
    pointer-events:none;
    z-index:-3;
}

/* =========================
   GOLD FRAME
========================= */

.frame{
    position:fixed;
    inset:14px;
    border:1px solid rgba(201,165,92,.38);
    border-radius:22px;
    pointer-events:none;
    z-index:20;
}

.frame::before,
.frame::after{
    content:"";
    position:absolute;
    width:90px;
    height:1px;
    background:#d7b56b;
    box-shadow:0 0 18px #d7b56b;
}

.frame::before{
    top:-1px;
    left:50%;
    transform:translateX(-50%);
}

.frame::after{
    bottom:-1px;
    left:50%;
    transform:translateX(-50%);
}

/* =========================
   HEADER
========================= */

header{
    width:100%;
    padding:28px 42px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:relative;
    z-index:5;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.brand-logo{
    width:42px;
    height:42px;
    border:1px solid #c9a55c;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#d9b86f;
    font-size:20px;
    font-weight:700;
    box-shadow:
        0 0 15px rgba(201,165,92,.22),
        inset 0 0 15px rgba(201,165,92,.08);
}

.brand-text{
    line-height:1.05;
}

.brand-text strong{
    font-size:15px;
    letter-spacing:4px;
    color:#fff;
}

.brand-text small{
    display:block;
    margin-top:5px;
    color:#9c8a67;
    letter-spacing:2px;
    font-size:9px;
}

/* =========================
   CONTACT BUTTON
========================= */

.contact-btn{
    border:1px solid rgba(201,165,92,.65);
    background:rgba(201,165,92,.05);
    color:#d9b86f;
    padding:11px 19px;
    border-radius:10px;
    font-size:11px;
    letter-spacing:2px;
    cursor:pointer;
    transition:.25s;
}

.contact-btn:hover{
    background:#c9a55c;
    color:#080808;
    box-shadow:0 0 25px rgba(201,165,92,.35);
}

/* =========================
   MAIN
========================= */

main{
    min-height:calc(100vh - 120px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:35px 20px 80px;
}

.main-box{
    width:min(100%,1050px);
    display:grid;
    grid-template-columns:1fr 330px;
    gap:70px;
    align-items:center;
}

/* =========================
   WELCOME
========================= */

.welcome{
    text-align:left;
}

.welcome-line{
    width:70px;
    height:1px;
    background:#c9a55c;
    box-shadow:0 0 12px rgba(201,165,92,.7);
    margin-bottom:24px;
}

.welcome h1{
    font-size:clamp(54px,9vw,110px);
    line-height:.88;
    letter-spacing:-5px;
    font-weight:300;
}

.welcome h1 span{
    color:#c9a55c;
}

.created{
    margin-top:26px;
    color:#a99a7e;
    font-size:13px;
    letter-spacing:3px;
}

.created strong{
    color:#d8b86c;
    font-weight:500;
}

.subtitle{
    margin-top:20px;
    max-width:470px;
    color:#737373;
    font-size:13px;
    line-height:1.8;
}

/* =========================
   USERS
========================= */

.users{
    border:1px solid rgba(201,165,92,.3);
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.015)
        );
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:25px;
    box-shadow:
        0 20px 70px rgba(0,0,0,.55),
        inset 0 0 30px rgba(201,165,92,.025);
}

.users-title{
    color:#7f7565;
    font-size:9px;
    letter-spacing:3px;
    margin-bottom:18px;
}

.user-btn{
    width:100%;
    border:1px solid rgba(255,255,255,.08);
    background:#0b0b0b;
    color:#fff;
    padding:18px;
    border-radius:13px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    transition:.25s;
}

.user-btn:last-child{
    margin-bottom:0;
}

.user-btn:hover{
    border-color:#c9a55c;
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(201,165,92,.12);
}

.user-left{
    display:flex;
    align-items:center;
    gap:13px;
}

.user-icon{
    width:35px;
    height:35px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(201,165,92,.45);
    color:#c9a55c;
    font-size:12px;
}

.user-name{
    font-size:12px;
    letter-spacing:2px;
    text-align:left;
}

.user-role{
    display:block;
    margin-top:4px;
    color:#666;
    font-size:8px;
    letter-spacing:1px;
}

.arrow{
    color:#c9a55c;
    font-size:18px;
}

/* =========================
   FOOTER
========================= */

footer{
    position:fixed;
    bottom:28px;
    left:0;
    width:100%;
    text-align:center;
    color:#4d4d4d;
    font-size:8px;
    letter-spacing:3px;
}

/* =========================
   CONTACT MODAL
========================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(12px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.overlay.show{
    display:flex;
}

.contact-card{
    width:min(100%,440px);
    background:#0b0b0b;
    border:1px solid rgba(201,165,92,.45);
    border-radius:20px;
    padding:30px;
    box-shadow:0 25px 90px rgba(0,0,0,.8);
    position:relative;
}

.close{
    position:absolute;
    top:15px;
    right:17px;
    width:32px;
    height:32px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.1);
    background:#111;
    color:#aaa;
    cursor:pointer;
}

.contact-card h2{
    font-size:25px;
    font-weight:400;
    margin-bottom:8px;
}

.contact-card h2 span{
    color:#c9a55c;
}

.contact-card p{
    color:#777;
    font-size:12px;
    line-height:1.7;
    margin-bottom:22px;
}

.contact-option{
    width:100%;
    border:1px solid rgba(201,165,92,.22);
    background:#101010;
    color:#fff;
    padding:16px;
    border-radius:12px;
    margin-top:10px;
    text-align:left;
    cursor:pointer;
    transition:.2s;
}

.contact-option:hover{
    border-color:#c9a55c;
}

.contact-option strong{
    font-size:11px;
    letter-spacing:1px;
}

.contact-option small{
    display:block;
    color:#666;
    margin-top:5px;
}

/* =========================
   REPORT FORM
========================= */

.report-form{
    display:none;
    margin-top:15px;
}

.report-form textarea{
    width:100%;
    min-height:120px;
    resize:vertical;
    border-radius:12px;
    border:1px solid #292929;
    background:#050505;
    color:#fff;
    padding:14px;
    outline:none;
    font-family:inherit;
}

.report-form textarea:focus{
    border-color:#c9a55c;
}

.send-btn{
    width:100%;
    margin-top:10px;
    border:0;
    border-radius:12px;
    padding:14px;
    background:#c9a55c;
    color:#090909;
    font-weight:700;
    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

    .frame{
        inset:8px;
        border-radius:17px;
    }

    header{
        padding:22px 25px;
    }

    main{
        padding:20px 25px 80px;
    }

    .main-box{
        grid-template-columns:1fr;
        gap:45px;
        max-width:430px;
    }

    .welcome{
        text-align:center;
    }

    .welcome-line{
        margin:0 auto 22px;
    }

    .welcome h1{
        font-size:64px;
        letter-spacing:-3px;
    }

    .created{
        font-size:11px;
    }

    .subtitle{
        margin-left:auto;
        margin-right:auto;
        font-size:12px;
    }

    .users{
        padding:20px;
    }

    footer{
        bottom:18px;
        font-size:7px;
    }
}
</style>
</head>

<body>

<div class="frame"></div>

<header>

    <div class="brand">

        <div class="brand-logo">
            S
        </div>

        <div class="brand-text">
            <strong>MY BAR</strong>
            <small>CREATED BY SABI</small>
        </div>

    </div>

    <button class="contact-btn" onclick="openContact()">
        CONTACT
    </button>

</header>

<main>

    <div class="main-box">

        <section class="welcome">

            <div class="welcome-line"></div>

            <h1>
                WEL<span>COME</span>
            </h1>

            <div class="created">
                Created — <strong>Sabi</strong>
            </div>

            <p class="subtitle">
                Sistem menaxhimi premium për barin tuaj.
                Zgjidh përdoruesin për të vazhduar.
            </p>

        </section>

        <section class="users">

            <div class="users-title">
                SELECT USER
            </div>

            <button class="user-btn" onclick="goLogin('admin')">

                <div class="user-left">

                    <div class="user-icon">
                        A
                    </div>

                    <div class="user-name">
                        ADMIN
                        <span class="user-role">
                            ADMINISTRATOR
                        </span>
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </button>

            <button class="user-btn" onclick="goLogin('sabi')">

                <div class="user-left">

                    <div class="user-icon">
                        S
                    </div>

                    <div class="user-name">
                        SABI
                        <span class="user-role">
                            WAITER
                        </span>
                    </div>

                </div>

                <div class="arrow">
                    ›
                </div>

            </button>

        </section>

    </div>

</main>

<footer>
    PREMIUM BAR MANAGEMENT • CREATED BY SABI
</footer>


<!-- CONTACT -->

<div class="overlay" id="contactOverlay">

    <div class="contact-card">

        <button class="close" onclick="closeContact()">
            ×
        </button>

        <h2>
            <span>MY</span> BAR
        </h2>

        <p>
            Kontakt dhe mbështetje.
            Zgjidh një nga opsionet më poshtë.
        </p>

        <button class="contact-option" onclick="showReport()">

            <strong>
                RAPORTO NJË PROBLEM
            </strong>

            <small>
                Na shkruaj problemin që ke.
            </small>

        </button>

        <button class="contact-option" onclick="buyApp()">

            <strong>
                BLI APLIKACIONIN
            </strong>

            <small>
                Kontakt për blerjen e MY BAR.
            </small>

        </button>

        <div class="report-form" id="reportForm">

            <textarea
                id="reportText"
                placeholder="Shkruaj problemin këtu..."
            ></textarea>

            <button class="send-btn" onclick="sendReport()">
                DËRGO MESAZHIN
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   LOGIN
========================= */

function goLogin(user){

    localStorage.setItem(
        "MYBAR_SELECTED_USER",
        user
    );

    window.location.href = "login.html";
}


/* =========================
   CONTACT
========================= */

function openContact(){

    document
        .getElementById("contactOverlay")
        .classList.add("show");
}

function closeContact(){

    document
        .getElementById("contactOverlay")
        .classList.remove("show");
}

function showReport(){

    const form =
        document.getElementById("reportForm");

    form.style.display = "block";

    document
        .getElementById("reportText")
        .focus();
}


/* =========================
   SEND REPORT
========================= */

function sendReport(){

    const text =
        document
        .getElementById("reportText")
        .value
        .trim();

    if(!text){

        alert("Shkruaj fillimisht problemin.");

        return;
    }

    /*
       Për momentin ruhet lokalisht.
       Më vonë mund ta lidhim me SMS/API.
    */

    const reports =
        JSON.parse(
            localStorage.getItem("MYBAR_REPORTS") || "[]"
        );

    reports.push({

        id:Date.now(),

        message:text,

        date:new Date().toISOString()

    });

    localStorage.setItem(
        "MYBAR_REPORTS",
        JSON.stringify(reports)
    );

    document
        .getElementById("reportText")
        .value = "";

    alert(
        "Mesazhi u regjistrua. Faleminderit!"
    );
}


/* =========================
   BUY APP
========================= */

function buyApp(){

    alert(
        "Për të blerë MY BAR, na kontakto nga CONTACT."
    );
}


/* =========================
   CLOSE WITH ESC
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape"){

            closeContact();

        }

    }
);

</script>

</body>
</html>
