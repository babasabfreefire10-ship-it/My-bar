<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MY BAR</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden
}
body:before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 50% 35%,rgba(212,175,55,.10),transparent 35%),
    radial-gradient(circle at 10% 90%,rgba(212,175,55,.05),transparent 30%);
    pointer-events:none
}
.led{position:fixed;background:#d4af37;z-index:10}
.led.top,.led.bottom{left:0;width:100%;height:1px}
.led.top{top:0}.led.bottom{bottom:0}
.led.left,.led.right{top:0;width:1px;height:100%}
.led.left{left:0}.led.right{right:0}

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px
}
.main{
    width:min(1100px,100%);
    height:650px;
    position:relative;
    border:1px solid rgba(212,175,55,.28);
    border-radius:28px;
    background:linear-gradient(145deg,#141414,#050505);
    box-shadow:0 0 80px rgba(212,175,55,.08);
    overflow:hidden
}
.logo{
    position:absolute;
    top:35px;
    left:40px;
    width:52px;
    height:52px;
    border:1px solid #d4af37;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#d4af37;
    font-size:22px;
    font-weight:bold
}
.contact{
    position:absolute;
    right:35px;
    top:35px;
    border:1px solid #d4af37;
    background:transparent;
    color:#d4af37;
    padding:11px 18px;
    border-radius:10px;
    letter-spacing:2px;
    cursor:pointer
}
.contact:hover{
    background:#d4af37;
    color:#000
}
.center{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    text-align:center
}
.welcome{
    font-size:clamp(50px,9vw,100px);
    letter-spacing:10px;
    font-weight:300
}
.created{
    margin-top:18px;
    color:#d4af37;
    letter-spacing:5px;
    font-size:13px
}
.users{
    position:absolute;
    right:35px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:12px;
    width:130px
}
.user{
    height:45px;
    border:1px solid rgba(212,175,55,.4);
    background:rgba(255,255,255,.025);
    color:#fff;
    border-radius:10px;
    cursor:pointer;
    letter-spacing:2px
}
.user:hover{
    color:#d4af37;
    border-color:#d4af37
}
.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.84);
    backdrop-filter:blur(10px);
    padding:20px
}
.box{
    width:min(430px,100%);
    background:#0b0b0b;
    border:1px solid rgba(212,175,55,.5);
    border-radius:20px;
    padding:28px
}
.box h2{
    color:#d4af37;
    letter-spacing:3px;
    margin-bottom:18px
}
.box input,.box textarea{
    width:100%;
    background:#050505;
    color:#fff;
    border:1px solid #292929;
    border-radius:10px;
    padding:13px;
    margin-bottom:12px;
    outline:none
}
.box textarea{
    min-height:130px;
    resize:none
}
.actions{
    display:flex;
    gap:10px
}
.actions button{
    flex:1;
    padding:13px;
    border-radius:10px;
    cursor:pointer;
    border:1px solid #d4af37
}
.primary{
    background:#d4af37;
    color:#000
}
.secondary{
    background:transparent;
    color:#d4af37
}
.error{
    display:none;
    color:#e55;
    font-size:13px;
    margin-top:10px
}
@media(max-width:700px){
    .main{height:600px}
    .logo{top:22px;left:22px}
    .contact{top:22px;right:22px}
    .center{top:40%}
    .welcome{font-size:48px;letter-spacing:6px}
    .users{
        top:auto;
        bottom:42px;
        left:50%;
        right:auto;
        transform:translateX(-50%);
        flex-direction:row;
        width:auto
    }
    .user{width:90px;font-size:10px}
}
</style>
</head>

<body>

<div class="led top"></div>
<div class="led bottom"></div>
<div class="led left"></div>
<div class="led right"></div>

<div class="page">
<main class="main">

<div class="logo">S</div>

<button class="contact" onclick="openContact()">
CONTACT
</button>

<div class="center">
    <div class="welcome">WELCOME</div>
    <div class="created">Created-Sabi.</div>
</div>

<div class="users">
    <button class="user" onclick="openLogin('admin','ADMIN')">ADMIN</button>
    <button class="user" onclick="openLogin('sabi','SABI')">SABI</button>
    <button class="user" onclick="openLogin('mondi','MONDI')">MONDI</button>
</div>

</main>
</div>

<!-- CONTACT -->

<div class="overlay" id="contactOverlay">
<div class="box">

<h2>CONTACT</h2>

<input id="contactPhone"
       type="tel"
       placeholder="Numri i telefonit">

<textarea id="contactMessage"
          placeholder="Shkruaj mesazhin..."></textarea>

<div class="actions">
<button class="primary" onclick="sendSMS()">
DËRGO SMS
</button>

<button class="secondary" onclick="closeContact()">
MBYLL
</button>
</div>

</div>
</div>

<!-- LOGIN -->

<div class="overlay" id="loginOverlay">
<div class="box">

<h2 id="loginTitle">LOGIN</h2>

<input id="loginUsername"
       type="text"
       placeholder="Username">

<input id="loginPassword"
       type="password"
       placeholder="Password">

<button class="primary"
        style="width:100%;padding:14px;border-radius:10px;cursor:pointer"
        onclick="login()">
HYR
</button>

<div class="error" id="loginError">
Username ose password i gabuar.
</div>

</div>
</div>

<script>

const USERS=[
    {
        username:"admin",
        password:"1234",
        role:"admin",
        name:"ADMIN"
    },
    {
        username:"sabi",
        password:"1234",
        role:"waiter",
        name:"SABI"
    },
    {
        username:"mondi",
        password:"1234",
        role:"waiter",
        name:"MONDI"
    }
];

function openLogin(username,name){

    document.getElementById("loginOverlay").style.display="flex";

    document.getElementById("loginTitle").textContent=name;

    document.getElementById("loginUsername").value=username;

    document.getElementById("loginPassword").value="";

    document.getElementById("loginError").style.display="none";
}

function login(){

    const username=document
        .getElementById("loginUsername")
        .value.trim();

    const password=document
        .getElementById("loginPassword")
        .value;

    const user=USERS.find(u=>
        u.username===username &&
        u.password===password
    );

    if(!user){

        document.getElementById("loginError").style.display="block";
        return;
    }

    localStorage.setItem("MYBAR_SESSION_V2","true");
    localStorage.setItem(
        "MYBAR_CURRENT_USER",
        JSON.stringify(user)
    );

    window.location.href="./app.html";
}

function openContact(){
    document.getElementById("contactOverlay").style.display="flex";
}

function closeContact(){
    document.getElementById("contactOverlay").style.display="none";
}

function sendSMS(){

    const phone=document
        .getElementById("contactPhone")
        .value.trim();

    const message=document
        .getElementById("contactMessage")
        .value.trim();

    if(!phone){
        alert("Shkruaj numrin.");
        return;
    }

    if(!message){
        alert("Shkruaj mesazhin.");
        return;
    }

    window.location.href=
        "sms:"+encodeURIComponent(phone)+
        "?body="+encodeURIComponent(message);
}

document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){
        closeContact();
        document.getElementById("loginOverlay").style.display="none";
    }
});

</script>

</body>
</html>
