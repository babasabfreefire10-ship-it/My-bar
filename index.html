<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY BAR • POS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050706;
            color: #f4f7f5;
            min-height: 100vh;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .topbar {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid #1c2b22;
            background: #080c09;
        }

        .brand {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .brand span {
            color: #27d17f;
        }

        .user-box {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        #userInfo {
            color: #9daaa3;
            font-size: 14px;
        }

        .logout {
            border: 1px solid #28372f;
            background: #101610;
            color: #fff;
            padding: 9px 14px;
            border-radius: 9px;
        }

        .layout {
            display: grid;
            grid-template-columns: 230px 1fr 390px;
            min-height: calc(100vh - 72px);
        }

        /* SIDEBAR */

        .sidebar {
            border-right: 1px solid #1b2921;
            background: #080c09;
            padding: 18px;
        }

        .sidebar-title {
            font-size: 11px;
            color: #68766e;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .side-btn {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 8px;
            border: 1px solid #1c2b22;
            background: #0c120e;
            color: #dfe8e2;
            border-radius: 10px;
            text-align: left;
        }

        .side-btn:hover {
            border-color: #27d17f;
        }

        .side-btn.primary {
            background: #0d2117;
            border-color: #27d17f;
            color: #45e995;
            font-weight: 800;
        }

        .side-btn.danger {
            color: #ff8585;
            border-color: #402323;
        }

        /* MAIN */

        .main {
            padding: 22px;
            overflow: auto;
        }

        .page-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .page-title h1 {
            font-size: 24px;
        }

        .page-title small {
            color: #78857e;
        }

        .tables-title {
            margin: 20px 0 12px;
            font-size: 14px;
            color: #8d9992;
        }

        #tableGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .table-card {
            min-height: 92px;
            border-radius: 14px;
            border: 1px solid #26372e;
            background: #0c120e;
            color: #fff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            text-align: left;
        }

        .table-card:hover {
            border-color: #27d17f;
        }

        .table-card.active {
            border-color: #c79b3b;
            background: #171308;
        }

        .table-card.selected {
            border-color: #27d17f;
            box-shadow: 0 0 0 1px #27d17f inset;
        }

        .table-card span {
            color: #7e8c84;
            font-size: 13px;
        }

        .table-card.active span {
            color: #e0bd69;
        }

        /* MENU */

        .menu-section {
            margin-top: 25px;
        }

        #categories {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        #categories button {
            border: 1px solid #26372e;
            background: #0c120e;
            color: #aebbb3;
            border-radius: 9px;
            padding: 9px 13px;
        }

        #categories button.active {
            background: #0d2b1c;
            color: #42e493;
            border-color: #27d17f;
        }

        #menuSearch {
            width: 100%;
            padding: 13px 15px;
            border-radius: 11px;
            border: 1px solid #26372e;
            background: #0b100d;
            color: #fff;
            outline: none;
            margin-bottom: 14px;
        }

        #menuGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 10px;
        }

        .menu-card {
            min-height: 105px;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #26372e;
            background: #0c120e;
            color: #fff;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-card:hover {
            border-color: #27d17f;
        }

        .menu-card span {
            color: #42e493;
            font-weight: 800;
        }

        .menu-card small {
            color: #66746c;
        }

        .menu-card.disabled {
            opacity: .35;
            pointer-events: none;
        }

        /* ORDER */

        .order-panel {
            border-left: 1px solid #1b2921;
            background: #080c09;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .order-header {
            padding: 20px;
            border-bottom: 1px solid #1b2921;
        }

        .order-header h2 {
            font-size: 19px;
            margin-bottom: 6px;
        }

        #selectedTableText {
            color: #27d17f;
            font-size: 13px;
        }

        #orderItems {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .order-item {
            border: 1px solid #1e2d25;
            background: #0c120e;
            border-radius: 11px;
            padding: 12px;
            margin-bottom: 9px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .order-item strong {
            display: block;
            margin-bottom: 4px;
        }

        .order-item small {
            color: #707d76;
        }

        .order-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .order-actions button {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            border: 1px solid #2a3a31;
            background: #111811;
            color: #fff;
        }

        .order-actions button:hover {
            border-color: #27d17f;
        }

        .order-footer {
            padding: 18px;
            border-top: 1px solid #1b2921;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .total-row span {
            color: #7d8a83;
        }

        #orderTotal {
            color: #42e493;
            font-size: 25px;
            font-weight: 900;
        }

        .invoice-main-btn {
            width: 100%;
            padding: 16px;
            border: 0;
            border-radius: 11px;
            background: #27d17f;
            color: #041008;
            font-weight: 900;
            font-size: 15px;
            margin-bottom: 9px;
        }

        .invoice-main-btn:hover {
            background: #42e493;
        }

        .secondary-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #293930;
            background: #101711;
            color: #dce5df;
            margin-bottom: 8px;
        }

        .secondary-btn:hover {
            border-color: #27d17f;
        }

        /* MODALS */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            width: 100%;
            max-width: 460px;
            background: #0a100c;
            border: 1px solid #2b3d32;
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 25px 80px rgba(0,0,0,.6);
        }

        .modal-box h2 {
            margin-bottom: 8px;
        }

        .modal-box p {
            color: #7e8b84;
            margin-bottom: 18px;
        }

        .payment-total {
            font-size: 34px;
            color: #42e493;
            font-weight: 900;
            text-align: center;
            margin: 20px 0;
        }

        .payment-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .payment-buttons button {
            padding: 17px;
            border-radius: 11px;
            border: 1px solid #2b3c32;
            background: #101711;
            color: #fff;
            font-weight: 800;
        }

        .payment-buttons button:hover {
            border-color: #27d17f;
        }

        .close-modal {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            border: 1px solid #392626;
            background: #160d0d;
            color: #ff9a9a;
        }

        .invoice-items {
            max-height: 300px;
            overflow-y: auto;
            margin: 15px 0;
        }

        .invoice-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid #1b2921;
        }

        .invoice-total {
            display: flex;
            justify-content: space-between;
            margin-top: 16px;
            padding-top: 15px;
            border-top: 1px solid #2b3d32;
            font-size: 22px;
            font-weight: 900;
        }

        .invoice-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 18px;
        }

        .invoice-buttons button {
            padding: 12px 5px;
            border-radius: 9px;
            border: 1px solid #293a31;
            background: #101711;
            color: #fff;
            font-weight: 800;
        }

        .invoice-buttons button:hover {
            border-color: #27d17f;
        }

        .empty-state {
            text-align: center;
            padding: 40px 15px;
            color: #647169;
        }

        @media (max-width: 1100px) {
            .layout {
                grid-template-columns: 190px 1fr;
            }

            .order-panel {
                grid-column: 1 / -1;
                border-left: 0;
                border-top: 1px solid #1b2921;
                min-height: 450px;
            }
        }

        @media (max-width: 700px) {
            .topbar {
                padding: 0 14px;
            }

            .layout {
                display: block;
            }

            .sidebar {
                border-right: 0;
                border-bottom: 1px solid #1b2921;
            }

            .main {
                padding: 14px;
            }

            .order-panel {
                min-height: 500px;
            }

            #tableGrid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="brand">
        <span>MY</span> BAR
    </div>

    <div class="user-box">
        <div id="clock">00:00:00</div>
        <div id="userInfo">Përdorues</div>

        <button class="logout" onclick="logout()">
            Dil
        </button>
    </div>
</header>


<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-title">
            VEPRIME
        </div>

        <button
            class="side-btn primary"
            onclick="newInvoice()">
            + FATURË E RE
        </button>

        <button
            class="side-btn"
            onclick="openPayment()">
            MBYLL FATURËN
        </button>

        <button
            class="side-btn"
            onclick="openSummary()">
            PËRMBLEDHJE
        </button>

        <button
            class="side-btn"
            onclick="openMyInvoices()">
            FATURAT E MIA
        </button>

        <button
            class="side-btn"
            onclick="openTransfer()">
            TRANSFERO
        </button>

        <button
            class="side-btn"
            onclick="openTableDetails()">
            DETAJE TAVOLINE
        </button>

        <div class="sidebar-title" style="margin-top:25px;">
            ARKA
        </div>

        <button
            class="side-btn primary"
            onclick="openCashDrawer()">
            HAP ARKËN
        </button>

        <button
            class="side-btn"
            onclick="openShift()">
            TURNI
        </button>

        <button
            class="side-btn"
            onclick="openCashReport()">
            RAPORT ARKE
        </button>

        <div
            class="admin-only"
            data-admin
            style="margin-top:25px;">

            <div class="sidebar-title">
                ADMIN
            </div>

            <button
                class="side-btn"
                onclick="openAdmin()">
                PANELI ADMIN
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="page-title">

            <div>
                <h1>POS</h1>
                <small>
                    Menaxhimi i tavolinave dhe porosive
                </small>
            </div>

        </div>


        <div class="tables-title">
            TAVOLINAT
        </div>

        <div id="tableGrid"></div>


        <div class="menu-section">

            <div class="tables-title">
                MENU
            </div>

            <div id="categories"></div>

            <input
                id="menuSearch"
                type="search"
                placeholder="Kërko produkt..."
            >

            <div id="menuGrid"></div>

        </div>

    </main>


    <!-- ORDER -->

    <aside class="order-panel">

        <div class="order-header">

            <h2>
                Porosia
            </h2>

            <div id="selectedTableText">
                Zgjidh një tavolinë
            </div>

        </div>


        <div id="orderItems">

            <div class="empty-state">
                Nuk ka produkte në porosi.
            </div>

        </div>


        <div class="order-footer">

            <div class="total-row">
                <span>TOTAL</span>

                <strong id="orderTotal">
                    0 L
                </strong>
            </div>


            <!-- KY ËSHTË BUTONI I RI -->

            <button
                class="invoice-main-btn"
                onclick="openPayment()">

                MBYLL FATURËN

            </button>


            <button
                class="secondary-btn"
                onclick="newInvoice()">

                FATURË E RE

            </button>


            <button
                class="secondary-btn"
                onclick="openTableDetails()">

                DETAJE TAVOLINE

            </button>

        </div>

    </aside>

</div>


<!-- PAYMENT MODAL -->

<div
    id="paymentModal"
    class="modal">

    <div class="modal-box">

        <h2>
            Mbyll faturën
        </h2>

        <p>
            Zgjidh mënyrën e pagesës.
        </p>

        <div
            id="paymentTotal"
            class="payment-total">

            0 L

        </div>

        <div class="payment-buttons">

            <button
                onclick="completePayment('cash')">

                💵 CASH

            </button>

            <button
                onclick="completePayment('card')">

                💳 KARTË

            </button>

        </div>

        <button
            class="close-modal"
            onclick="closePayment()">

            ANULO

        </button>

    </div>

</div>


<!-- INVOICE MODAL -->

<div
    id="invoiceModal"
    class="modal">

    <div class="modal-box">

        <h2>
            FATURA
        </h2>

        <p>
            <span id="invoiceNumber">---</span>
            <br>
            <span id="invoiceDate">---</span>
        </p>

        <p>
            <strong>Tavolina:</strong>
            <span id="invoiceTable">---</span>
            <br>

            <strong>Kamarieri:</strong>
            <span id="invoiceWaiter">---</span>
        </p>

        <div
            id="invoiceItems"
            class="invoice-items">
        </div>

        <div class="invoice-total">

            <span>TOTAL</span>

            <strong id="invoiceTotal">
                0 L
            </strong>

        </div>

        <div class="invoice-buttons">

            <button
                onclick="fiscalizeInvoice()">

                FATURO

            </button>

            <button
                onclick="fiscalizeInvoice()">

                FISKALIZO

            </button>

            <button
                onclick="printInvoice()">

                PRINT

            </button>

        </div>

        <button
            class="close-modal"
            onclick="closeInvoice()">

            MBYLL

        </button>

    </div>

</div>


<script src="app.js"></script>

<script>

    /*
     * ARKA
     * Këto funksione hapin seksionet e arkës.
     * Nëse app.js yt ka funksione me këta emra,
     * përdoren automatikisht.
     */

    function openCashDrawer() {

        if (typeof openCashDrawerSystem === "function") {
            openCashDrawerSystem();
            return;
        }

        if (typeof openCash === "function") {
            openCash();
            return;
        }

        if (typeof openSummary === "function") {
            openSummary();
            return;
        }

        alert("Moduli i arkës nuk është lidhur ende me app.js.");
    }


    function openShift() {

        if (typeof openShiftModal === "function") {
            openShiftModal();
            return;
        }

        if (typeof openShiftSystem === "function") {
            openShiftSystem();
            return;
        }

        if (typeof openSummary === "function") {
            openSummary();
            return;
        }

        alert("Moduli i turnit nuk është lidhur ende.");
    }


    function openCashReport() {

        if (typeof openCashReportModal === "function") {
            openCashReportModal();
            return;
        }

        if (typeof openSummary === "function") {
            openSummary();
            return;
        }

        alert("Raporti i arkës nuk është lidhur ende.");
    }

</script>

</body>
</html>
