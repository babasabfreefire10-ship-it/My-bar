<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MY BAR — POS</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#070b09;color:#fff}
button,input{font:inherit}
button{cursor:pointer}

:root{
 --bg:#070b09;
 --panel:#0d1511;
 --panel2:#111c16;
 --line:#203028;
 --green:#19d878;
 --green2:#0eaa5d;
 --text:#f4f7f5;
 --muted:#91a098;
 --red:#ff5c5c;
 --yellow:#ffc857;
}

.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{
 width:235px;background:#08100c;border-right:1px solid var(--line);
 padding:22px 14px;display:flex;flex-direction:column
}
.logo{font-size:26px;font-weight:900;letter-spacing:2px;padding:8px 12px 25px}
.logo span{color:var(--green)}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{
 border:0;background:transparent;color:#aab8b1;text-align:left;
 padding:13px 14px;border-radius:10px;font-weight:700
}
.nav button:hover,.nav button.active{background:#12221a;color:#fff}
.nav button.active{box-shadow:inset 3px 0 var(--green)}
.bottom{margin-top:auto}
.status{font-size:12px;color:var(--muted);padding:15px}
.dot{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:7px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{
 height:72px;border-bottom:1px solid var(--line);
 display:flex;align-items:center;justify-content:space-between;padding:0 25px;
 background:#09110d
}
.title{font-size:21px;font-weight:800}
.clock{color:var(--green);font-weight:800}
.content{padding:25px;overflow:auto;flex:1}

/* SECTIONS */
.section{display:none}
.section.active{display:block}

/* DASHBOARD */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{
 background:var(--panel);border:1px solid var(--line);border-radius:14px;
 padding:20px
}
.stat small{color:var(--muted)}
.stat strong{display:block;font-size:28px;margin-top:10px}
.green{color:var(--green)}

.toolbar{
 display:flex;gap:10px;align-items:center;margin:22px 0 15px;flex-wrap:wrap
}
.search{
 background:var(--panel);border:1px solid var(--line);color:#fff;
 padding:12px 14px;border-radius:9px;outline:none;min-width:260px
}
.btn{
 border:1px solid var(--line);background:#111c16;color:#fff;
 padding:11px 15px;border-radius:9px;font-weight:800
}
.btn:hover{border-color:#35634b}
.btn.greenbtn{background:var(--green);color:#041008;border-color:var(--green)}
.btn.redbtn{background:#331515;color:#ff9b9b;border-color:#542020}

/* TABLES */
.tables{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.table{
 background:var(--panel);border:1px solid var(--line);border-radius:14px;
 padding:18px;min-height:125px;transition:.15s
}
.table:hover{border-color:#39614c}
.table.busy{border-color:#b68b35;background:#17140d}
.table-number{font-size:19px;font-weight:900}
.table-status{font-size:12px;color:var(--muted);margin-top:8px}
.table-total{font-size:22px;font-weight:900;margin-top:13px}

/* MENU */
.categories{display:flex;gap:8px;flex-wrap:wrap}
.cat.active{background:var(--green);color:#031008}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.product{
 background:var(--panel);border:1px solid var(--line);border-radius:14px;
 padding:17px
}
.product-name{font-weight:900;font-size:17px}
.product-cat{font-size:12px;color:var(--muted);margin-top:5px}
.product-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.price{color:var(--green);font-weight:900}
.add{
 border:0;background:var(--green);color:#041008;
 width:38px;height:38px;border-radius:9px;font-weight:900;font-size:20px
}

/* ORDER */
.order-layout{display:grid;grid-template-columns:1.6fr .8fr;gap:18px}
.box{
 background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px
}
.box h2{margin-top:0}
.order-row{
 display:grid;grid-template-columns:1fr 80px 100px 40px;
 gap:10px;align-items:center;border-bottom:1px solid var(--line);
 padding:13px 0
}
.qty{
 background:#17231c;border:1px solid var(--line);color:#fff;
 border-radius:6px;padding:6px;text-align:center
}
.totalline{
 display:flex;justify-content:space-between;font-size:19px;
 padding:9px 0
}
.totalline.final{font-size:27px;font-weight:900;border-top:1px solid var(--line);margin-top:10px;padding-top:18px}

/* HISTORY */
.history{width:100%;border-collapse:collapse}
.history th,.history td{padding:13px;border-bottom:1px solid var(--line);text-align:left}
.history th{color:var(--muted);font-size:12px}

/* MODAL */
.modal{
 display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);
 align-items:center;justify-content:center;z-index:50
}
.modal.open{display:flex}
.modalbox{
 width:430px;max-width:94%;background:#0c1510;border:1px solid #294335;
 border-radius:15px;padding:22px;box-shadow:0 20px 70px #000
}
.modalbox h2{margin-top:0}
.payoptions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.payoption{
 border:1px solid var(--line);background:#111c16;color:#fff;padding:16px;
 border-radius:9px;font-weight:900
}
.payoption.selected{border-color:var(--green);background:#12301f}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

/* RECEIPT SCREEN - hidden normally */
#printArea{display:none}

/* MOBILE */
@media(max-width:1000px){
 .sidebar{width:190px}
 .stats{grid-template-columns:repeat(2,1fr)}
 .tables,.products{grid-template-columns:repeat(2,1fr)}
 .order-layout{grid-template-columns:1fr}
}
@media(max-width:700px){
 .app{display:block;overflow:auto}
 .sidebar{
  width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line);
  padding:8px
 }
 .logo{padding:8px 10px}
 .nav{flex-direction:row;overflow:auto}
 .nav button{white-space:nowrap}
 .bottom{display:none}
 .top{height:58px;padding:0 12px}
 .content{padding:13px}
 .stats{grid-template-columns:1fr 1fr}
 .tables,.products{grid-template-columns:1fr 1fr}
 .search{min-width:0;width:100%}
}

/* REAL THERMAL RECEIPT PRINT */
@media print{
 body>*{display:none!important}
 #printArea{
  display:block!important;
  width:80mm;
  margin:0;
  padding:0 3mm;
  color:#000!important;
  background:#fff!important;
  font-family:Arial,Helvetica,sans-serif;
  font-size:11px;
 }
 #printArea *{color:#000!important}
 .receipt-center{text-align:center}
 .receipt-title{font-size:20px;font-weight:900;margin-bottom:4px}
 .receipt-sub{font-size:10px}
 .receipt-line{border-top:1px dashed #000;margin:7px 0}
 .receipt-row{display:flex;justify-content:space-between;gap:5px;margin:4px 0}
 .receipt-item{flex:1}
 .receipt-total{font-size:15px;font-weight:900}
 .receipt-footer{text-align:center;margin-top:12px}
 @page{
  size:80mm auto;
  margin:0;
 }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
 <div class="logo">MY <span>BAR</span></div>

 <div class="nav">
  <button class="active" onclick="show('dashboard',this)">▣ Dashboard</button>
  <button onclick="show('tables',this)">▦ Tavolinat</button>
  <button onclick="show('menu',this)">☷ Menu</button>
  <button onclick="show('order',this)">🛒 Porosia</button>
  <button onclick="show('history',this)">◷ Historiku</button>
 </div>

 <div class="bottom status">
  <span class="dot"></span>Sistemi aktiv
 </div>
</aside>

<main class="main">

<header class="top">
 <div class="title" id="pageTitle">Dashboard</div>
 <div class="clock" id="clock"></div>
</header>

<div class="content">

<!-- DASHBOARD -->
<section id="dashboard" class="section active">

 <div class="stats">
  <div class="stat">
   <small>XHIRO SOT</small>
   <strong class="green" id="todayRevenue">€0.00</strong>
  </div>
  <div class="stat">
   <small>FATURA SOT</small>
   <strong id="todayInvoices">0</strong>
  </div>
  <div class="stat">
   <small>TAVOLINA AKTIVE</small>
   <strong id="busyTables">0</strong>
  </div>
  <div class="stat">
   <small>POROSIA AKTIVE</small>
   <strong id="activeOrders">0</strong>
  </div>
 </div>

 <div class="toolbar">
  <button class="btn greenbtn" onclick="show('tables')">+ Hap Tavolinë</button>
  <button class="btn" onclick="show('menu')">Menu</button>
  <button class="btn" onclick="show('history')">Historiku</button>
 </div>

 <div class="box">
  <h2>Gjendja e tavolinave</h2>
  <div class="tables" id="dashboardTables"></div>
 </div>

</section>

<!-- TABLES -->
<section id="tables" class="section">

 <div class="toolbar">
  <button class="btn" onclick="clearTable()">Pastro tavolinën</button>
  <button class="btn greenbtn" onclick="show('menu')">+ Shto porosi</button>
 </div>

 <div class="tables" id="tablesGrid"></div>

</section>

<!-- MENU -->
<section id="menu" class="section">

 <div class="toolbar">
  <input class="search" id="search" placeholder="Kërko produkt..." oninput="renderProducts()">
 </div>

 <div class="toolbar categories">
  <button class="btn cat active" onclick="setCat('Të gjitha',this)">Të gjitha</button>
  <button class="btn cat" onclick="setCat('Kafe',this)">Kafe</button>
  <button class="btn cat" onclick="setCat('Pije',this)">Pije</button>
  <button class="btn cat" onclick="setCat('Birra',this)">Birra</button>
  <button class="btn cat" onclick="setCat('Ushqim',this)">Ushqim</button>
 </div>

 <div class="products" id="products"></div>

</section>

<!-- ORDER -->
<section id="order" class="section">

 <div class="order-layout">

  <div class="box">
   <h2>Porosia — Tavolina <span id="orderTable">-</span></h2>
   <div id="orderItems"></div>
  </div>

  <div class="box">
   <h2>Përmbledhje</h2>

   <div class="totalline">
    <span>Nëntotali</span>
    <strong id="subtotal">€0.00</strong>
   </div>

   <div class="totalline">
    <span>TVSH</span>
    <strong id="tax">€0.00</strong>
   </div>

   <div class="totalline final">
    <span>TOTAL</span>
    <strong id="grandTotal" class="green">€0.00</strong>
   </div>

   <button class="btn greenbtn" style="width:100%;margin-top:15px" onclick="openPayment()">
    💳 Paguaj & Faturë
   </button>

  </div>

 </div>

</section>

<!-- HISTORY -->
<section id="history" class="section">

 <div class="toolbar">
  <button class="btn redbtn" onclick="clearHistory()">Fshi historikun</button>
 </div>

 <div class="box">
  <table class="history">
   <thead>
    <tr>
     <th>Fatura</th>
     <th>Data/Ora</th>
     <th>Tavolina</th>
     <th>Pagesa</th>
     <th>Total</th>
     <th></th>
    </tr>
   </thead>
   <tbody id="historyBody"></tbody>
  </table>
 </div>

</section>

</div>
</main>
</div>

<!-- PAYMENT MODAL -->
<div class="modal" id="paymentModal">
 <div class="modalbox">
  <h2>Pagesa</h2>

  <div style="font-size:30px;font-weight:900;text-align:center;margin:20px" id="paymentTotal">€0.00</div>

  <div class="payoptions">
   <button class="payoption selected" onclick="selectPay('CASH',this)">💶 CASH</button>
   <button class="payoption" onclick="selectPay('KARTË',this)">💳 KARTË</button>
  </div>

  <div class="modal-actions">
   <button class="btn" onclick="closePayment()">Anulo</button>
   <button class="btn greenbtn" onclick="finishPayment()">✓ Paguaj & Printo</button>
  </div>
 </div>
</div>

<!-- RECEIPT -->
<div id="printArea"></div>

<script>
const products=[
 {id:1,name:"Espresso",price:1.20,cat:"Kafe"},
 {id:2,name:"Cappuccino",price:1.80,cat:"Kafe"},
 {id:3,name:"Macchiato",price:1.50,cat:"Kafe"},
 {id:4,name:"Freddo Cappuccino",price:2.20,cat:"Kafe"},
 {id:5,name:"Coca Cola",price:1.50,cat:"Pije"},
 {id:6,name:"Red Bull",price:2.50,cat:"Pije"},
 {id:7,name:"Ujë",price:1.00,cat:"Pije"},
 {id:8,name:"Birra Korça",price:2.00,cat:"Birra"},
 {id:9,name:"Birra Tirana",price:2.00,cat:"Birra"},
 {id:10,name:"Club Sandwich",price:4.50,cat:"Ushqim"},
 {id:11,name:"Burger",price:5.50,cat:"Ushqim"},
 {id:12,name:"Patate",price:2.50,cat:"Ushqim"}
];

let state=JSON.parse(localStorage.getItem("MY_BAR_POS")||"null")||{
 selectedTable:1,
 category:"Të gjitha",
 tables:Array.from({length:12},(_,i)=>({id:i+1,items:[]})),
 invoices:[]
};

let paymentMethod="CASH";

function save(){
 localStorage.setItem("MY_BAR_POS",JSON.stringify(state));
}

function money(n){
 return "€"+Number(n||0).toFixed(2);
}

function now(){
 return new Date().toLocaleString("sq-AL");
}

function show(id,btn=null){
 document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");

 const names={
  dashboard:"Dashboard",
  tables:"Tavolinat",
  menu:"Menu",
  order:"Porosia",
  history:"Historiku"
 };

 document.getElementById("pageTitle").textContent=names[id]||id;

 if(btn){
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
 }

 if(id==="tables")renderTables();
 if(id==="dashboard")renderDashboard();
 if(id==="menu")renderProducts();
 if(id==="order")renderOrder();
 if(id==="history")renderHistory();
}

function selectTable(id){
 state.selectedTable=id;
 save();
 renderTables();
 renderOrder();
 show("order");
}

function tableTotal(table){
 return table.items.reduce((s,x)=>s+x.price*x.qty,0);
}

function renderTables(){
 const html=state.tables.map(t=>{
  const total=tableTotal(t);
  const busy=t.items.length>0;

  return `
   <div class="table ${busy?"busy":""}" onclick="selectTable(${t.id})">
    <div class="table-number">Tavolina ${String(t.id).padStart(2,"0")}</div>
    <div class="table-status">${busy?"● Në përdorim":"○ E lirë"}</div>
    <div class="table-total">${busy?money(total):"—"}</div>
   </div>`;
 }).join("");

 document.getElementById("tablesGrid").innerHTML=html;
}

function renderDashboard(){
 document.getElementById("dashboardTables").innerHTML=state.tables.map(t=>{
  const total=tableTotal(t);
  const busy=t.items.length>0;
  return `
   <div class="table ${busy?"busy":""}" onclick="selectTable(${t.id})">
    <div class="table-number">Tavolina ${String(t.id).padStart(2,"0")}</div>
    <div class="table-status">${busy?"● Në përdorim":"○ E lirë"}</div>
    <div class="table-total">${busy?money(total):"—"}</div>
   </div>`;
 }).join("");

 const revenue=state.invoices.reduce((s,x)=>s+x.total,0);

 document.getElementById("todayRevenue").textContent=money(revenue);
 document.getElementById("todayInvoices").textContent=state.invoices.length;
 document.getElementById("busyTables").textContent=
  state.tables.filter(t=>t.items.length).length;
 document.getElementById("activeOrders").textContent=
  state.tables.reduce((s,t)=>s+t.items.length,0);
}

function setCat(cat,el){
 state.category=cat;
 document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
 if(el)el.classList.add("active");
 renderProducts();
}

function renderProducts(){
 const q=(document.getElementById("search")?.value||"").toLowerCase();

 const list=products.filter(p=>{
  const okCat=state.category==="Të gjitha"||p.cat===state.category;
  const okSearch=p.name.toLowerCase().includes(q);
  return okCat&&okSearch;
 });

 document.getElementById("products").innerHTML=list.map(p=>`
  <div class="product">
   <div class="product-name">${p.name}</div>
   <div class="product-cat">${p.cat}</div>
   <div class="product-bottom">
    <div class="price">${money(p.price)}</div>
    <button class="add" onclick="addProduct(${p.id})">+</button>
   </div>
  </div>
 `).join("");
}

function addProduct(id){
 const table=state.tables.find(t=>t.id===state.selectedTable);
 const p=products.find(x=>x.id===id);
 if(!table||!p)return;

 const existing=table.items.find(x=>x.id===id);

 if(existing) existing.qty++;
 else table.items.push({
  id:p.id,
  name:p.name,
  price:p.price,
  qty:1
 });

 save();
 renderTables();
 renderDashboard();
 renderOrder();
 show("order");
}

function changeQty(id,delta){
 const table=state.tables.find(t=>t.id===state.selectedTable);
 const item=table.items.find(x=>x.id===id);
 if(!item)return;

 item.qty+=delta;

 if(item.qty<=0){
  table.items=table.items.filter(x=>x.id!==id);
 }

 save();
 renderOrder();
 renderTables();
 renderDashboard();
}

function renderOrder(){
 const table=state.tables.find(t=>t.id===state.selectedTable);
 if(!table)return;

 document.getElementById("orderTable").textContent=
  String(table.id).padStart(2,"0");

 const html=table.items.length?
 table.items.map(i=>`
  <div class="order-row">
   <div>
    <strong>${i.name}</strong><br>
    <small>${money(i.price)}</small>
   </div>
   <input class="qty" value="${i.qty}" readonly>
   <strong>${money(i.price*i.qty)}</strong>
   <button class="btn" onclick="changeQty(${i.id},-1)">−</button>
  </div>
 `).join("")
 :
 `<div style="color:var(--muted);padding:30px 0;text-align:center">
   Nuk ka produkte në këtë porosi.
  </div>`;

 document.getElementById("orderItems").innerHTML=html;

 const subtotal=tableTotal(table);
 const tax=subtotal*0.20;
 const total=subtotal;

 document.getElementById("subtotal").textContent=money(subtotal);
 document.getElementById("tax").textContent=money(tax);
 document.getElementById("grandTotal").textContent=money(total);
}

function clearTable(){
 const table=state.tables.find(t=>t.id===state.selectedTable);
 if(!table)return;

 if(confirm("Ta pastrojmë porosinë e kësaj tavoline?")){
  table.items=[];
  save();
  renderTables();
  renderDashboard();
  renderOrder();
 }
}

function openPayment(){
 const table=state.tables.find(t=>t.id===state.selectedTable);

 if(!table||!table.items.length){
  alert("Kjo tavolinë nuk ka porosi.");
  return;
 }

 document.getElementById("paymentTotal").textContent=money(tableTotal(table));
 document.getElementById("paymentModal").classList.add("open");
}

function closePayment(){
 document.getElementById("paymentModal").classList.remove("open");
}

function selectPay(method,el){
 paymentMethod=method;
 document.querySelectorAll(".payoption").forEach(x=>x.classList.remove("selected"));
 el.classList.add("selected");
}

function finishPayment(){
 const table=state.tables.find(t=>t.id===state.selectedTable);

 if(!table||!table.items.length)return;

 const subtotal=tableTotal(table);
 const tax=subtotal*0.20;
 const total=subtotal;

 const invoice={
  id:"F-"+Date.now().toString().slice(-8),
  date:now(),
  table:table.id,
  items:JSON.parse(JSON.stringify(table.items)),
  subtotal,
  tax,
  total,
  payment:paymentMethod
 };

 state.invoices.unshift(invoice);
 table.items=[];

 save();

 closePayment();

 renderTables();
 renderDashboard();
 renderHistory();
 renderOrder();

 /* KJO ËSHTË FATURA REALE E PRINTIMIT */
 printInvoice(invoice);
}

function printInvoice(inv){
 const area=document.getElementById("printArea");

 area.innerHTML=`
  <div class="receipt-center">
   <div class="receipt-title">MY BAR</div>
   <div class="receipt-sub">FATURË SHITJE</div>
   <div class="receipt-sub">${inv.id}</div>
  </div>

  <div class="receipt-line"></div>

  <div>Data: ${inv.date}</div>
  <div>Tavolina: ${String(inv.table).padStart(2,"0")}</div>
  <div>Pagesa: ${inv.payment}</div>

  <div class="receipt-line"></div>

  ${inv.items.map(i=>`
   <div class="receipt-row">
    <div class="receipt-item">${i.qty} x ${i.name}</div>
    <div>${money(i.price*i.qty)}</div>
   </div>
  `).join("")}

  <div class="receipt-line"></div>

  <div class="receipt-row">
   <div>Nëntotali</div>
   <div>${money(inv.subtotal)}</div>
  </div>

  <div class="receipt-row">
   <div>TVSH 20%</div>
   <div>${money(inv.tax)}</div>
  </div>

  <div class="receipt-line"></div>

  <div class="receipt-row receipt-total">
   <div>TOTAL</div>
   <div>${money(inv.total)}</div>
  </div>

  <div class="receipt-footer">
   FALEMINDERIT!<br>
   MY BAR
  </div>
 `;

 /*
  Browser-i hap printimin e Windows.
  Zgjidh printerin termik 80mm.
 */
 setTimeout(()=>window.print(),150);
}

function renderHistory(){
 const body=document.getElementById("historyBody");

 if(!state.invoices.length){
  body.innerHTML=`
   <tr>
    <td colspan="6" style="text-align:center;color:#91a098;padding:30px">
     Nuk ka fatura.
    </td>
   </tr>`;
  return;
 }

 body.innerHTML=state.invoices.map(inv=>`
  <tr>
   <td><strong>${inv.id}</strong></td>
   <td>${inv.date}</td>
   <td>${String(inv.table).padStart(2,"0")}</td>
   <td>${inv.payment}</td>
   <td class="green"><strong>${money(inv.total)}</strong></td>
   <td>
    <button class="btn" onclick="printInvoiceById('${inv.id}')">🖨 Print</button>
   </td>
  </tr>
 `).join("");
}

function printInvoiceById(id){
 const inv=state.invoices.find(x=>x.id===id);
 if(inv)printInvoice(inv);
}

function clearHistory(){
 if(!state.invoices.length)return;

 if(confirm("Je i sigurt që do të fshish historikun?")){
  state.invoices=[];
  save();
  renderHistory();
  renderDashboard();
 }
}

function updateClock(){
 document.getElementById("clock").textContent=
  new Date().toLocaleString("sq-AL",{
   day:"2-digit",
   month:"2-digit",
   year:"numeric",
   hour:"2-digit",
   minute:"2-digit",
   second:"2-digit"
  });
}

setInterval(updateClock,1000);
updateClock();

renderTables();
renderDashboard();
renderProducts();
renderOrder();
renderHistory();
</script>
