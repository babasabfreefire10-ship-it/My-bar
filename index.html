<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>WELCOME • MY BAR</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 50% 45%,rgba(201,165,92,.14),transparent 30%),
        radial-gradient(circle at 10% 90%,rgba(201,165,92,.06),transparent 25%),
        radial-gradient(circle at 90% 10%,rgba(201,165,92,.05),transparent 25%);
    pointer-events:none;
}

.frame{
    position:fixed;
    inset:12px;
    border:1px solid rgba(201,165,92,.35);
    border-radius:20px;
    pointer-events:none;
}

header{
    height:80px;
    padding:0 35px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:42px;
    height:42px;
    border:1px solid #c9a55c;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#d9b86f;
    font-weight:800;
}

.brand strong{
    display:block;
    font-size:14px;
    letter-spacing:4px;
}

.brand small{
    display:block;
    margin-top:4px;
    color:#666;
    font-size:8px;
    letter-spacing:2px;
}

.contact{
    padding:11px 18px;
    border:1px solid #66532d;
    border-radius:10px;
    background:#0a0a0a;
    color:#d9b86f;
    font-size:10px;
    letter-spacing:2px;
    cursor:pointer;
}

main{
    min-height:calc(100vh - 80px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.layout{
    width:min(100%,1000px);
    display:grid;
    grid-template-columns:1fr 330px;
    gap:70px;
    align-items:center;
}

.welcome-line{
    width:65px;
    height:1px;
    background:#c9a55c;
    box-shadow:0 0 15px #c9a55c;
    margin-bottom:25px;
}

h1{
    font-size:clamp(65px,10vw,115px);
    line-height:.85;
    letter-spacing:-6px;
    font-weight:300;
}

h1 span{
    color:#c9a55c;
}

.created{
    margin-top:27px;
    color:#8b806c;
    font-size:12px;
    letter-spacing:3px;
}

.created b{
    color:#d8b76d;
    font-weight:500;
}

.users{
    padding:25px;
    border:1px solid rgba(201,165,92,.3);
    border-radius:20px;
    background:rgba(12,12,12,.88);
    box-shadow:0 25px 80px rgba(0,0,0,.65);
}

.users-title{
    color:#666;
    font-size:8px;
    letter-spacing:3px;
    margin-bottom:15px;
}

.user{
    width:100%;
    padding:17px;
    margin-bottom:9px;
    border:1px solid #202020;
    background:#090909;
    border-radius:12px;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    transition:.2s;
}

.user:last-child{
    margin-bottom:0;
}

.user:hover{
    border-color:#c9a55c;
    transform:translateY(-2px);
}

.user-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.user-icon{
    width:35px;
    height:35px;
    border:1px solid #66532d;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#d8b76d;
    font-size:11px;
}

.user-name{
    text-align:left;
    font-size:11px;
    letter-spacing:2px;
}

.user-role{
    display:block;
    margin-top:4px;
    color:#555;
    font-size:7px;
    letter-spacing:1px;
}

.arrow{
    color:#c9a55c;
    font-size:20px;
}

footer{
    position:fixed;
    bottom:25px;
    width:100%;
    text-align:center;
    color:#444;
    font-size:7px;
    letter-spacing:3px;
}

/* LOGIN */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.86);
    backdrop-filter:blur(14px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.overlay.show{
    display:flex;
}

.login{
    width:min(100%,400px);
    background:#0b0b0b;
    border:1px solid rgba(201,165,92,.4);
    border-radius:20px;
    padding:30px;
    box-shadow:0 30px 100px rgba(0,0,0,.8);
}

.close{
    float:right;
    width:30px;
    height:30px;
    border-radius:50%;
    border:1px solid #292929;
    background:#111;
    color:#999;
    cursor:pointer;
}

.login-logo{
    width:48px;
    height:48px;
    border:1px solid #c9a55c;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#d9b86f;
    font-weight:800;
    margin:0 auto 18px;
}

.login h2{
    text-align:center;
    font-size:23px;
    font-weight:400;
    letter-spacing:2px;
}

.login h2 span{
    color:#c9a55c;
}

.selected{
    margin-top:20px;
    text-align:center;
    padding:13px;
    border:1px solid #252525;
    border-radius:10px;
    background:#080808;
}

.selected small{
    display:block;
    color:#555;
    font-size:7px;
    letter-spacing:2px;
}

.selected strong{
    display:block;
    color:#d8b76d;
    margin-top:5px;
    font-size:12px;
    letter-spacing:2px;
}

.field{
    margin-top:15px;
}

.field label{
    display:block;
    color:#777;
    font-size:8px;
    letter-spacing:2px;
    margin-bottom:7px;
}

.field input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #292929;
    background:#060606;
    color:#fff;
    outline:none;
}

.field input:focus{
    border-color:#c9a55c;
}

.enter{
    width:100%;
    margin-top:18px;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#c9a55c;
    color:#080808;
    font-weight:800;
    letter-spacing:2px;
    cursor:pointer;
}

.back{
    width:100%;
    margin-top:8px;
    padding:13px;
    border:1px solid #292929;
    border-radius:10px;
    background:#090909;
    color:#888;
    cursor:pointer;
}

.error{
    display:none;
    margin-top:12px;
    padding:10px;
    border-radius:9px;
    background:#160909;
    border:1px solid #492626;
    color:#d68181;
    text-align:center;
    font-size:10px;
}

.error.show{
    display:block;
}

/* CONTACT */

.contact-box{
    width:min(100%,420px);
    background:#0b0b0b;
    border:1px solid rgba(201,165,92,.4);
    border-radius:20px;
    padding:28px;
}

.contact-box h2{
    font-size:22px;
    font-weight:400;
}

.contact-box h2 span{
    color:#c9a55c;
}

.contact-box p{
    color:#666;
    font-size:11px;
    line-height:1.6;
    margin:10px 0 20px;
}

textarea{
    width:100%;
    min-height:120px;
    resize:none;
    padding:13px;
    border-radius:10px;
    border:1px solid #292929;
    background:#060606;
    color:#fff;
    outline:none;
    font-family:inherit;
}

.send{
    width:100%;
    margin-top:10px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#c9a55c;
    color:#080808;
    font-weight:800;
    cursor:pointer;
}

@media(max-width:700px){

    body{
        overflow:auto;
    }

    header{
        padding:0 22px;
    }

    .layout{
        grid-template-columns:1fr;
        gap:40px;
        max-width:430px;
    }

    .welcome{
        text-align:center;
    }

    .welcome-line{
        margin-left:auto;
        margin-right:auto;
    }

    h1{
        font-size:65px;
        letter-spacing:-4px;
    }

    .created{
        font-size:10px;
    }

    main{
        padding-bottom:80px;
    }
}
</style>
</head>

<body>

<div class="frame"></div>

<header>

    <div class="brand">
        <div class="logo">S</div>

        <div>
            <strong>MY BAR</strong>
            <small>CREATED BY SABI</small>
        </div>
    </div>

    <button
        class="contact"
        onclick="openContact()"
    >
        CONTACT
    </button>

</header>


<main>

    <div class="layout">

        <section class="welcome">

            <div class="welcome-line"></div>

            <h1>
                WEL<span>COME</span>
            </h1>

            <div class="created">
                Created — <b>Sabi</b>
            </div>

        </section>


        <section class="users">

            <div class="users-title">
                SELECT USER
            </div>

            <button
                class="user"
                onclick="openLogin('admin','ADMIN','ADMINISTRATOR')"
            >

                <div class="user-left">

                    <div class="user-icon">
                        A
                    </div>

                    <div class="user-name">
                        ADMIN
                        <span class="user-role">
                            ADMINISTRATOR
                        </span>
                    </div>

                </div>

                <div class="arrow">›</div>

            </button>


            <button
                class="user"
                onclick="openLogin('sabi','SABI','WAITER')"
            >

                <div class="user-left">

                    <div class="user-icon">
                        S
                    </div>

                    <div class="user-name">
                        SABI
                        <span class="user-role">
                            WAITER
                        </span>
                    </div>

                </div>

                <div class="arrow">›</div>

            </button>


            <button
                class="user"
                onclick="openLogin('mondi','MONDI','WAITER')"
            >

                <div class="user-left">

                    <div class="user-icon">
                        M
                    </div>

                    <div class="user-name">
                        MONDI
                        <span class="user-role">
                            WAITER
                        </span>
                    </div>

                </div>

                <div class="arrow">›</div>

            </button>

        </section>

    </div>

</main>


<footer>
    PREMIUM BAR MANAGEMENT • CREATED BY SABI
</footer>


<!-- LOGIN -->

<div
    class="overlay"
    id="loginOverlay"
>

    <div class="login">

        <button
            class="close"
            onclick="closeLogin()"
        >
            ×
        </button>

        <div class="login-logo">
            S
        </div>

        <h2>
            MY <span>BAR</span>
        </h2>

        <div class="selected">

            <small>SELECTED USER</small>

            <strong id="selectedUser">
                ADMIN
            </strong>

        </div>

        <div class="field">

            <label>USERNAME</label>

            <input
                id="username"
                type="text"
                autocomplete="username"
            >

        </div>

        <div class="field">

            <label>FJALËKALIMI</label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                onkeydown="if(event.key==='Enter') login()"
            >

        </div>

        <button
            class="enter"
            onclick="login()"
        >
            HYR
        </button>

        <button
            class="back"
            onclick="closeLogin()"
        >
            KTHEHU
        </button>

        <div
            class="error"
            id="loginError"
        >
            Username ose fjalëkalim i gabuar.
        </div>

    </div>

</div>


<!-- CONTACT -->

<div
    class="overlay"
    id="contactOverlay"
>

    <div class="contact-box">

        <button
            class="close"
            onclick="closeContact()"
        >
            ×
        </button>

        <h2>
            <span>MY</span> BAR
        </h2>

        <p>
            Na kontakto për probleme,
            sugjerime ose informacione.
        </p>

        <textarea
            id="contactMessage"
            placeholder="Shkruaj mesazhin..."
        ></textarea>

        <button
            class="send"
            onclick="sendContact()"
        >
            DËRGO
        </button>

    </div>

</div>


<script>

const USERS_KEY = "MYBAR_USERS_V2";
const SESSION_KEY = "MYBAR_SESSION_V2";

const DEFAULT_USERS = [

    {
        username:"admin",
        password:"1234",
        role:"admin",
        name:"ADMIN"
    },

    {
        username:"sabi",
        password:"1234",
        role:"waiter",
        name:"SABI"
    },

    {
        username:"mondi",
        password:"1234",
        role:"waiter",
        name:"MONDI"
    }

];


function getUsers(){

    try{

        const saved =
            localStorage.getItem(USERS_KEY);

        if(saved){

            const users =
                JSON.parse(saved);

            if(Array.isArray(users) && users.length){

                return users;

            }

        }

    }catch(e){}

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(DEFAULT_USERS)
    );

    return DEFAULT_USERS;

}


let selectedUsername = "admin";


function openLogin(username,name,role){

    selectedUsername =
        username;

    document
        .getElementById("selectedUser")
        .textContent =
        name;

    document
        .getElementById("username")
        .value =
        username;

    document
        .getElementById("password")
        .value = "";

    document
        .getElementById("loginError")
        .classList.remove("show");

    document
        .getElementById("loginOverlay")
        .classList.add("show");

    setTimeout(
        () => {

            document
                .getElementById("password")
                .focus();

        },
        100
    );

}


function closeLogin(){

    document
        .getElementById("loginOverlay")
        .classList.remove("show");

}


function login(){

    const username =
        document
        .getElementById("username")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("password")
        .value;

    const error =
        document
        .getElementById("loginError");

    const users =
        getUsers();

    const user =
        users.find(
            u =>
                String(u.username).toLowerCase()
                === username
                &&
                String(u.password)
                === password
        );

    if(!user){

        error.classList.add("show");

        return;

    }

    error.classList.remove("show");


    const session = {

        username:user.username,

        name:user.name,

        role:user.role,

        loginTime:Date.now()

    };


    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify(session)
    );

    localStorage.setItem(
        "MYBAR_CURRENT_USER",
        user.username
    );


    /*
       Tani nuk kalon më nga login.html.
       Shkon direkt te app.html.
    */

    window.location.href =
        "./app.html";

}


function openContact(){

    document
        .getElementById("contactOverlay")
        .classList.add("show");

}


function closeContact(){

    document
        .getElementById("contactOverlay")
        .classList.remove("show");

}


function sendContact(){

    const message =
        document
        .getElementById("contactMessage")
        .value
        .trim();

    if(!message){

        alert("Shkruaj mesazhin.");

        return;

    }


    const reports =
        JSON.parse(
            localStorage.getItem(
                "MYBAR_REPORTS"
            ) || "[]"
        );


    reports.push({

        id:Date.now(),

        message:message,

        date:new Date().toISOString()

    });


    localStorage.setItem(
        "MYBAR_REPORTS",
        JSON.stringify(reports)
    );


    document
        .getElementById("contactMessage")
        .value = "";


    alert(
        "Mesazhi u regjistrua."
    );

    closeContact();

}


document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape"){

            closeLogin();

            closeContact();

        }

    }
);

</script>

</body>
</html>
