<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>MY BAR</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 50% 45%,
        rgba(212,170,75,.12),
        transparent 32%);
}

.led{
    position:fixed;
    background:#c9a55c;
    box-shadow:
        0 0 8px #c9a55c,
        0 0 25px rgba(201,165,92,.7);
    z-index:5;
}

.led.top{
    top:0;
    left:0;
    width:100%;
    height:2px;
}

.led.bottom{
    bottom:0;
    right:0;
    width:100%;
    height:2px;
}

.led.left{
    left:0;
    top:0;
    width:2px;
    height:100%;
}

.led.right{
    right:0;
    top:0;
    width:2px;
    height:100%;
}

header{
    position:relative;
    z-index:10;
    height:76px;
    padding:0 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(201,165,92,.16);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:40px;
    height:40px;
    border:1px solid #c9a55c;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#d9b86f;
    font-weight:900;
    font-size:16px;
}

.brand-text strong{
    display:block;
    color:#d9b86f;
    font-size:15px;
    letter-spacing:3px;
}

.brand-text small{
    color:#555;
    font-size:7px;
    letter-spacing:2px;
}

.contact{
    border:1px solid rgba(201,165,92,.5);
    background:#090909;
    color:#d9b86f;
    padding:9px 14px;
    border-radius:9px;
    font-size:8px;
    letter-spacing:2px;
    cursor:pointer;
}

main{
    position:relative;
    z-index:2;
    min-height:calc(100vh - 76px);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.content{
    width:min(92%,500px);
}

.badge{
    display:inline-block;
    padding:7px 11px;
    border:1px solid rgba(201,165,92,.25);
    border-radius:50px;
    color:#777;
    font-size:7px;
    letter-spacing:3px;
    margin-bottom:22px;
}

h1{
    font-size:clamp(42px,12vw,82px);
    font-weight:300;
    letter-spacing:9px;
    line-height:1;
}

h1 span{
    color:#d9b86f;
}

.subtitle{
    margin-top:15px;
    color:#666;
    font-size:9px;
    letter-spacing:4px;
}

.users{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin:34px auto 0;
    max-width:420px;
}

.user-btn{
    padding:15px 5px;
    border:1px solid #292929;
    background:#090909;
    color:#aaa;
    border-radius:11px;
    cursor:pointer;
    transition:.2s;
}

.user-btn:hover{
    border-color:#c9a55c;
    color:#d9b86f;
    transform:translateY(-2px);
}

.user-btn strong{
    display:block;
    font-size:11px;
    letter-spacing:2px;
}

.user-btn small{
    display:block;
    margin-top:5px;
    color:#444;
    font-size:7px;
}

footer{
    position:fixed;
    z-index:5;
    bottom:18px;
    left:0;
    width:100%;
    text-align:center;
    color:#333;
    font-size:7px;
    letter-spacing:2px;
}

/* LOGIN */

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.92);
    backdrop-filter:blur(12px);
}

.overlay.show{
    display:flex;
}

.login-box{
    width:min(100%,390px);
    background:#0a0a0a;
    border:1px solid rgba(201,165,92,.45);
    border-radius:20px;
    padding:30px;
    box-shadow:0 30px 100px rgba(0,0,0,.9);
}

.login-logo{
    width:48px;
    height:48px;
    margin:0 auto 16px;
    border:1px solid #c9a55c;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#d9b86f;
    font-weight:900;
}

.login-title{
    text-align:center;
    font-size:22px;
    letter-spacing:3px;
}

.login-title span{
    color:#d9b86f;
}

.selected{
    text-align:center;
    margin:10px 0 22px;
    color:#666;
    font-size:8px;
    letter-spacing:2px;
}

label{
    display:block;
    margin:12px 0 7px;
    color:#777;
    font-size:8px;
    letter-spacing:2px;
}

input{
    width:100%;
    padding:14px;
    background:#050505;
    border:1px solid #292929;
    border-radius:10px;
    color:#fff;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#c9a55c;
}

.login-btn{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#c9a55c;
    color:#050505;
    font-weight:800;
    letter-spacing:2px;
    cursor:pointer;
}

.close-btn{
    width:100%;
    margin-top:9px;
    padding:12px;
    border:1px solid #292929;
    border-radius:10px;
    background:#090909;
    color:#777;
    cursor:pointer;
}

.error{
    display:none;
    margin-top:12px;
    padding:10px;
    border:1px solid #542929;
    background:#180909;
    border-radius:9px;
    color:#d98787;
    text-align:center;
    font-size:9px;
}

.error.show{
    display:block;
}

/* CONTACT */

.contact-box{
    width:min(100%,420px);
    background:#0a0a0a;
    border:1px solid rgba(201,165,92,.45);
    border-radius:20px;
    padding:28px;
}

.contact-box h2{
    color:#d9b86f;
    text-align:center;
    font-size:20px;
    letter-spacing:3px;
}

.contact-box p{
    text-align:center;
    color:#666;
    font-size:9px;
    margin:9px 0 20px;
}

textarea{
    width:100%;
    min-height:130px;
    resize:none;
    padding:13px;
    background:#050505;
    border:1px solid #292929;
    border-radius:10px;
    color:#fff;
    outline:none;
}

.send-btn{
    width:100%;
    margin-top:12px;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#c9a55c;
    color:#050505;
    font-weight:800;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="led top"></div>
<div class="led right"></div>
<div class="led bottom"></div>
<div class="led left"></div>

<header>

    <div class="brand">

        <div class="logo">S</div>

        <div class="brand-text">
            <strong>MY BAR</strong>
            <small>CREATED BY SABI</small>
        </div>

    </div>

    <button
        class="contact"
        onclick="openContact()"
    >
        CONTACT
    </button>

</header>


<main>

    <div class="content">

        <div class="badge">
            SISTEM PREMIUM
        </div>

        <h1>
            WELCOME <span>MY BAR</span>
        </h1>

        <div class="subtitle">
            ZGJIDH PËRDORUESIN
        </div>


        <div class="users">

            <button
                class="user-btn"
                onclick="openLogin('admin','ADMIN')"
            >
                <strong>ADMIN</strong>
                <small>ADMINISTRATOR</small>
            </button>


            <button
                class="user-btn"
                onclick="openLogin('sabi','SABI')"
            >
                <strong>SABI</strong>
                <small>KAMARIER</small>
            </button>


            <button
                class="user-btn"
                onclick="openLogin('mondi','MONDI')"
            >
                <strong>MONDI</strong>
                <small>KAMARIER</small>
            </button>

        </div>

    </div>

</main>


<footer>
    MY BAR • PRIVATE SYSTEM
</footer>


<!-- LOGIN -->

<div
    id="loginOverlay"
    class="overlay"
>

    <div class="login-box">

        <div class="login-logo">
            S
        </div>

        <div class="login-title">
            MY <span>BAR</span>
        </div>

        <div
            id="selectedUser"
            class="selected"
        >
            ADMIN
        </div>


        <label>
            USERNAME
        </label>

        <input
            id="username"
            type="text"
            autocomplete="username"
        >


        <label>
            FJALËKALIMI
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="••••"
            onkeydown="if(event.key==='Enter') login()"
        >


        <button
            class="login-btn"
            onclick="login()"
        >
            HYR NË SISTEM
        </button>


        <button
            class="close-btn"
            onclick="closeLogin()"
        >
            KTHEHU
        </button>


        <div
            id="loginError"
            class="error"
        >
            Username ose fjalëkalim i gabuar.
        </div>

    </div>

</div>


<!-- CONTACT -->

<div
    id="contactOverlay"
    class="overlay"
>

    <div class="contact-box">

        <h2>CONTACT</h2>

        <p>
            Dërgo një mesazh te SABI
        </p>

        <textarea
            id="contactMessage"
            placeholder="Shkruaj mesazhin..."
        ></textarea>

        <button
            class="send-btn"
            onclick="sendContact()"
        >
            DËRGO MESAZH
        </button>

        <button
            class="close-btn"
            onclick="closeContact()"
        >
            MBYLL
        </button>

    </div>

</div>


<script>

"use strict";


const USERS_KEY =
    "MYBAR_USERS_V2";

const SESSION_KEY =
    "MYBAR_SESSION_V2";

const CURRENT_USER_KEY =
    "MYBAR_CURRENT_USER";


const DEFAULT_USERS = [

    {
        username:"admin",
        password:"1234",
        role:"admin",
        name:"ADMIN"
    },

    {
        username:"sabi",
        password:"1234",
        role:"waiter",
        name:"SABI"
    },

    {
        username:"mondi",
        password:"1234",
        role:"waiter",
        name:"MONDI"
    }

];


function initializeUsers(){

    const saved =
        localStorage.getItem(
            USERS_KEY
        );

    if(!saved){

        localStorage.setItem(
            USERS_KEY,
            JSON.stringify(
                DEFAULT_USERS
            )
        );

    }

}


function getUsers(){

    try{

        const users =
            JSON.parse(
                localStorage.getItem(
                    USERS_KEY
                )
            );

        if(
            Array.isArray(users)
            &&
            users.length
        ){

            return users;

        }

    }catch(e){}

    initializeUsers();

    return DEFAULT_USERS;

}


let selectedUsername = "admin";


function openLogin(
    username,
    name
){

    selectedUsername =
        username;

    document
        .getElementById(
            "selectedUser"
        )
        .textContent =
        name;

    document
        .getElementById(
            "username"
        )
        .value =
        username;

    document
        .getElementById(
            "password"
        )
        .value =
        "";

    document
        .getElementById(
            "loginError"
        )
        .classList
        .remove(
            "show"
        );

    document
        .getElementById(
            "loginOverlay"
        )
        .classList
        .add(
            "show"
        );

    setTimeout(() => {

        document
            .getElementById(
                "password"
            )
            .focus();

    },100);

}


function closeLogin(){

    document
        .getElementById(
            "loginOverlay"
        )
        .classList
        .remove(
            "show"
        );

}


function login(){

    const username =
        document
        .getElementById(
            "username"
        )
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById(
            "password"
        )
        .value;

    const error =
        document
        .getElementById(
            "loginError"
        );


    const users =
        getUsers();


    const user =
        users.find(
            u =>
                String(
                    u.username
                )
                .toLowerCase()
                === username
                &&
                String(
                    u.password
                )
                === password
        );


    if(!user){

        error
            .classList
            .add(
                "show"
            );

        return;

    }


    const session = {

        username:
            user.username,

        name:
            user.name,

        role:
            user.role,

        loginTime:
            Date.now()

    };


    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify(
            session
        )
    );


    localStorage.setItem(
        CURRENT_USER_KEY,
        user.username
    );


    /*
       SHKO DIREKT TE APP.
       NUK KA LOGIN.HTML.
    */

    window.location.href =
        "./app.html";

}


function openContact(){

    document
        .getElementById(
            "contactOverlay"
        )
        .classList
        .add(
            "show"
        );

}


function closeContact(){

    document
        .getElementById(
            "contactOverlay"
        )
        .classList
        .remove(
            "show"
        );

}


function sendContact(){

    const message =
        document
        .getElementById(
            "contactMessage"
        )
        .value
        .trim();


    if(!message){

        alert(
            "Shkruaj një mesazh."
        );

        return;

    }


    /*
       Për momentin ruhet në pajisje.
       Më vonë mund ta lidhim me SMS/backend.
    */

    const reports =
        JSON.parse(
            localStorage.getItem(
                "MYBAR_REPORTS"
            ) || "[]"
        );


    reports.push({

        id:Date.now(),

        message:message,

        date:new Date()
            .toISOString()

    });


    localStorage.setItem(
        "MYBAR_REPORTS",
        JSON.stringify(
            reports
        )
    );


    document
        .getElementById(
            "contactMessage"
        )
        .value =
        "";


    alert(
        "Mesazhi u ruajt me sukses."
    );


    closeContact();

}


initializeUsers();

</script>

</body>
</html>
