<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY BAR — Kasa</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#070c09;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
    display:grid;
    grid-template-columns:220px 1fr;
}

/* SIDEBAR */

.sidebar{
    background:#0b120e;
    border-right:1px solid #20352a;
    padding:20px;
}

.logo{
    color:#55df8b;
    font-size:25px;
    font-weight:900;
    margin-bottom:25px;
}

.nav{
    width:100%;
    border:1px solid #20382b;
    background:#0e1812;
    color:#d9e5de;
    padding:13px;
    border-radius:10px;
    margin-bottom:8px;
    text-align:left;
}

.nav:hover,
.nav.active{
    background:#16452c;
    border-color:#45d77d;
}

.nav.logout{
    margin-top:25px;
}

/* MAIN */

.main{
    padding:22px;
    min-width:0;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.page-title{
    font-size:25px;
    font-weight:800;
}

.clock{
    color:#91a69a;
}

/* PAGES */

.page{
    display:none;
}

.page.active{
    display:block;
}

/* DASHBOARD */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat{
    background:#0d1711;
    border:1px solid #20392b;
    border-radius:14px;
    padding:18px;
}

.stat small{
    color:#91a69a;
}

.stat strong{
    display:block;
    margin-top:8px;
    font-size:25px;
}

/* TABLES */

.table-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.table-card{
    min-height:100px;
    background:#0d1711;
    color:#fff;
    border:1px solid #284333;
    border-radius:14px;
    padding:17px;
    text-align:left;
}

.table-card:hover{
    border-color:#45d77d;
}

.table-card.active-table{
    border-color:#d49a36;
}

.table-card.selected-table{
    outline:2px solid #45d77d;
}

.table-card strong{
    display:block;
    font-size:17px;
    margin-bottom:10px;
}

.table-card span{
    color:#91a69a;
}

/* POS */

.pos{
    display:grid;
    grid-template-columns:1fr 390px;
    gap:18px;
}

.search{
    width:100%;
    background:#0d1711;
    color:#fff;
    border:1px solid #294334;
    border-radius:10px;
    padding:13px;
    outline:none;
    margin-bottom:12px;
}

.search:focus{
    border-color:#45d77d;
}

.categories{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:14px;
}

.category{
    background:#0d1711;
    border:1px solid #294334;
    color:#d9e5de;
    padding:8px 12px;
    border-radius:20px;
}

.category.active{
    background:#17633a;
    border-color:#45d77d;
}

.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.product{
    min-height:105px;
    background:#0d1711;
    color:white;
    border:1px solid #284333;
    border-radius:12px;
    padding:14px;
    text-align:left;
}

.product:hover{
    border-color:#45d77d;
}

.product:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.product strong{
    display:block;
}

.product .price{
    color:#55df8b;
    display:block;
    margin-top:9px;
    font-weight:bold;
}

.product small{
    display:block;
    color:#879c91;
    margin-top:7px;
}

/* ORDER */

.order-box{
    background:#0d1711;
    border:1px solid #294334;
    border-radius:15px;
    padding:16px;
    height:max-content;
    position:sticky;
    top:15px;
}

.order-box h2{
    margin-top:0;
}

.order-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #1e3227;
}

.order-item small{
    display:block;
    color:#879c91;
    margin-top:4px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:6px;
}

.quantity button{
    width:30px;
    height:30px;
    border-radius:7px;
    border:1px solid #31513e;
    background:#132219;
    color:white;
}

.total{
    display:flex;
    justify-content:space-between;
    font-size:23px;
    font-weight:900;
    margin:20px 0;
}

.btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    font-weight:800;
    margin-top:8px;
}

.btn-green{
    background:#42d17c;
    color:#031009;
}

.btn-dark{
    background:#17251d;
    color:#fff;
    border:1px solid #294334;
}

.btn-red{
    background:#391719;
    color:#ffb9b9;
}

/* HISTORY */

.history{
    display:grid;
    gap:9px;
}

.history-row{
    background:#0d1711;
    border:1px solid #20392b;
    border-radius:11px;
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.history-row small{
    display:block;
    color:#879c91;
    margin-top:5px;
}

/* SETTINGS */

.settings{
    max-width:600px;
    display:grid;
    gap:9px;
}

.settings label{
    color:#91a69a;
    font-size:13px;
    margin-top:5px;
}

.settings input{
    width:100%;
    padding:12px;
    background:#0d1711;
    color:white;
    border:1px solid #294334;
    border-radius:10px;
}

/* MODALS */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal-box{
    width:min(450px,100%);
    background:#0d1711;
    border:1px solid #355541;
    border-radius:16px;
    padding:20px;
}

.close{
    float:right;
    border:0;
    background:none;
    color:#aaa;
    font-size:25px;
}

.payment-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.payment-button{
    padding:20px;
    border:0;
    border-radius:12px;
    background:#42d17c;
    color:#031009;
    font-weight:900;
}

/* INVOICE */

.invoice-preview{
    background:#fff;
    color:#111;
    padding:15px;
    border-radius:8px;
    margin:15px 0;
}

.invoice-line{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin:7px 0;
}

.invoice-total{
    border-top:1px dashed #333;
    padding-top:10px;
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    font-size:18px;
}

/* TOAST */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#111;
    border:1px solid #42d17c;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    display:none;
    z-index:999;
}

/* PRINT */

#printArea{
    display:none;
}

@media print{

    body{
        background:#fff!important;
        color:#000!important;
    }

    body > *{
        display:none!important;
    }

    #printArea{
        display:block!important;
    }

    .receipt{
        display:block;
        width:80mm;
        margin:0;
        padding:4mm;
        background:#fff;
        color:#000;
        font-family:Arial,Helvetica,sans-serif;
    }

    .receipt h1{
        text-align:center;
        font-size:19px;
        margin:0 0 6px;
    }

    .receipt p{
        margin:3px 0;
        font-size:11px;
    }

    .receipt-line{
        border-top:1px dashed #000;
        margin:8px 0;
    }

    .receipt-row{
        display:flex;
        justify-content:space-between;
        gap:5px;
        font-size:11px;
        margin:5px 0;
    }

    .receipt-total{
        display:flex;
        justify-content:space-between;
        font-size:16px;
        font-weight:bold;
        margin-top:9px;
    }
}

/* MOBILE */

@media(max-width:1000px){

    .app{
        grid-template-columns:1fr;
    }

    .sidebar{
        display:grid;
        grid-template-columns:repeat(3,1fr);
        gap:7px;
    }

    .logo{
        grid-column:1/-1;
        margin-bottom:5px;
    }

    .nav{
        margin:0;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .pos{
        grid-template-columns:1fr;
    }

    .order-box{
        position:static;
    }

    .table-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .products{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

    <button class="nav active" data-page="dashboard">

    </button>

<header class="header">

    <div class="page-title" id="pageTitle">

    </div>

</header>


<!-- DASHBOARD -->

<section class="page active" id="dashboard">

    <div class="stats">

        <div class="stat">
            <small>Shitje sot</small>

        </div>

        <div class="stat">

            <strong id="activeTables">0</strong>
        </div>

        <div class="stat">
            <small>Fatura sot</small>
            <strong id="invoiceCount">0</strong>
        </div>

        <div class="stat">
            <small>Kartë sot</small>

        </div>

    </div>

    <h2>Tavolinat</h2>

    <div class="table-grid" id="dashboardTables"></div>

</section>


<!-- POS -->

<section class="page" id="pos">

<div class="pos">

<div>

    <input

</div>

</div>

</section>


<!-- TABLES -->

<section class="page" id="tables">

    <div

</section>


<!-- HISTORY -->

<section class="page" id="history">

        </div>

        <div class="stat">
            <small>Kartë sot</small>

        </div>

<!-- SETTINGS -->

<section class="page" id="settings">

<div class="settings">

    <label>Emri i lokalit</label>

</section>

</main>

</div>


<!-- PAYMENT MODAL -->

<div
    class="modal"
    id="paymentModal"
>

<div class="modal-box">

    <button
        class="close"
        id="closePayment"

<!-- PRINT AREA -->

<script>

"use strict";


/* =====================================================
   STORAGE
===================================================== */

const USERS_KEY = "MYBAR_USERS_FINAL";
const SESSION_KEY = "MY_BAR_SESSION";
const PRODUCTS_KEY = "MYBAR_PRODUCTS_FINAL";
const TABLES_KEY = "MYBAR_TABLES_FINAL";
const INVOICES_KEY = "MYBAR_INVOICES_FINAL";
const SETTINGS_KEY = "MYBAR_SETTINGS_FINAL";
const STOCK_KEY = "MYBAR_STOCK_FINAL";


/* =====================================================
   DEFAULT USERS
===================================================== */

const DEFAULT_USERS = [

    {
        username:"admin",
        password:"1234",
        role:"admin",
        name:"Administrator"
    },

    {
        username:"kamarier",
        password:"1234",
        role:"waiter",
        name:"Kamarier"
    }

];


/* =====================================================
   DEFAULT PRODUCTS
===================================================== */

const DEFAULT_PRODUCTS = [

["Espresso","Kafe",100],
["Espresso Dopio","Kafe",150],
["Macchiato","Kafe",120],
["Cappuccino","Kafe",180],
["Latte","Kafe",200],
["Freddo Espresso","Kafe",200],
["Freddo Cappuccino","Kafe",220],
["Çaj","Kafe",120],

["Coca Cola","Pije Freskuese",150],
["Coca Cola Zero","Pije Freskuese",150],
["Fanta","Pije Freskuese",150],
["Sprite","Pije Freskuese",150],
["Schweppes","Pije Freskuese",150],
["Red Bull","Pije Freskuese",250],

["Ujë 0.5L","Ujë",100],
["Ujë 0.75L","Ujë",150],
["Ujë 1.5L","Ujë",150],

["Birra Tirana","Birra",200],
["Birra Korça","Birra",200],
["Heineken","Birra",250],
["Corona","Birra",300],
["Tuborg","Birra",250],

["Jack Daniel's","Whisky",500],
["Johnnie Walker Red","Whisky",450],
["Johnnie Walker Black","Whisky",650],
["Chivas Regal","Whisky",700],

["Gordon's Gin","Gin",450],
["Bombay Sapphire","Gin",550],
["Hendrick's","Gin",800],

["Absolut Vodka","Vodka",450],
["Smirnoff","Vodka",450],
["Grey Goose","Vodka",800],

["Bacardi","Rum",450],
["Captain Morgan","Rum",500],

["Jose Cuervo","Tequila",500],
["Olmeca","Tequila",550],

["Baileys","Liqueur & Amaro",450],
["Jägermeister","Liqueur & Amaro",450],
["Aperol","Liqueur & Amaro",400],

["Verë e Kuqe","Verë",300],
["Verë e Bardhë","Verë",300],
["Prosecco","Verë",600],

["Mojito","Cocktails",600],
["Margarita","Cocktails",650],
["Aperol Spritz","Cocktails",650],
["Sex on the Beach","Cocktails",700],
["Long Island","Cocktails",800],

["Gin Tonic","Long Drinks",550],
["Vodka Red Bull","Long Drinks",600],
["Whisky Cola","Long Drinks",550],

["Shot Tequila","Shots",300],
["Shot Jägermeister","Shots",300],
["Shot Vodka","Shots",250],

["Patatina","Snacks",200],
["Kikirikë","Snacks",200],
["Ullinj","Snacks",250],
["Mix Nuts","Snacks",350]

].map((item,index)=>({

    id:index+1,

    name:item[0],

    category:item[1],

    price:item[2]

}));


/* =====================================================
   HELPERS
===================================================== */

function loadJSON(key,fallback){

    try{

        const value =
            localStorage.getItem(key);

        return value
            ? JSON.parse(value)
            : fallback;

    }catch(error){

        return fallback;

    }

}


function saveJSON(key,value){

    localStorage.setItem(
        key,
        JSON.stringify(value)
    );

}


function money(value){

    return Number(value || 0)
        .toLocaleString("sq-AL") + " L";

}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function toast(message){

    const box =
        document.getElementById("toast");

    box.textContent = message;

    box.style.display = "block";

    clearTimeout(window.toastTimer);

    window.toastTimer =
        setTimeout(()=>{

            box.style.display = "none";

        },2200);

}


function currentUser(){

    return loadJSON(
        SESSION_KEY,
        null
    );

}


function today(){

    const d = new Date();

    return d.toISOString().slice(0,10);

}


/* =====================================================
   SETTINGS
===================================================== */

function getSettings(){

    return loadJSON(
        SETTINGS_KEY,
        {
            barName:"MY BAR",
            address:"",
            phone:"",
            tableCount:12
        }
    );

}


/* =====================================================
   INITIALIZE
===================================================== */

function initialize(){

    if(!localStorage.getItem(USERS_KEY)){

        saveJSON(
            USERS_KEY,
            DEFAULT_USERS
        );

    }


    if(!localStorage.getItem(PRODUCTS_KEY)){

        saveJSON(
            PRODUCTS_KEY,
            DEFAULT_PRODUCTS
        );

    }


    if(!localStorage.getItem(INVOICES_KEY)){

        saveJSON(
            INVOICES_KEY,
            []
        );

    }


    if(!localStorage.getItem(SETTINGS_KEY)){

        saveJSON(
            SETTINGS_KEY,
            {
                barName:"MY BAR",
                address:"",
                phone:"",
                tableCount:12
            }
        );

    }


    initializeTables();

    initializeStock();

}


/* =====================================================
   TABLES
===================================================== */

function initializeTables(){

    const settings =
        getSettings();

    const count =
        Math.max(
            1,
            Math.min(
                100,
                Number(settings.tableCount) || 12
            )
        );


    let tables =
        loadJSON(
            TABLES_KEY,
            []
        );


    if(
        !Array.isArray(tables) ||
        tables.length !== count
    ){

        const old =
            Array.isArray(tables)
                ? tables
                : [];


        tables =
            Array.from(
                {length:count},
                (_,index)=>{

                    return old[index] || {

                        id:index+1,

                        name:
                            "Tavolina " +
                            (index+1),

                        items:[]

                    };

                }
            );


        saveJSON(
            TABLES_KEY,
            tables
        );

    }

}


function getTables(){

    return loadJSON(
        TABLES_KEY,
        []
    );

}


function saveTables(tables){

    saveJSON(
        TABLES_KEY,
        tables
    );

}


function getSelectedTable(){

    return Number(
        localStorage.getItem(
            "MYBAR_SELECTED_TABLE"
        ) || 0
    );

}


function selectTable(id){

    localStorage.setItem(
        "MYBAR_SELECTED_TABLE",
        String(id)
    );

    openPage("pos");

    renderAll();

}


/* =====================================================
   STOCK
===================================================== */

function initializeStock(){

    const products =
        loadJSON(
            PRODUCTS_KEY,
            DEFAULT_PRODUCTS
        );


    let stock =
        loadJSON(
            STOCK_KEY,
            {}
        );


    products.forEach(product=>{

        if(
            stock[product.id] === undefined
        ){

            stock[product.id] = 20;

        }

    });


    saveJSON(
        STOCK_KEY,
        stock
    );

}


function getStock(id){

    const stock =
        loadJSON(
            STOCK_KEY,
            {}
        );


    if(
        stock[id] === undefined
    ){

        stock[id] = 20;

        saveJSON(
            STOCK_KEY,
            stock
        );

    }


    return Number(
        stock[id] || 0
    );

}


function changeStock(id,amount){

    const stock =
        loadJSON(
            STOCK_KEY,
            {}
        );


    stock[id] =
        Math.max(
            0,
            Number(stock[id] || 0) +
            Number(amount)
        );


    saveJSON(
        STOCK_KEY,
        stock
    );

}

/* =====================================================
   TABLE RENDER
===================================================== */

function getTableTotal(table){

    return (
        table.items || []
    ).reduce(

        (total,item)=>{

            return total +
                Number(item.price) *
                Number(item.quantity);

        },

        0

    );

}


function renderTables(){

    const tables =
        getTables();

    const selected =
        getSelectedTable();


    const html =
        tables.map(table=>{

            const active =
                table.items &&
                table.items.length > 0;


            const total =
                getTableTotal(table);


            return `

                <button
                    class="
                        table-card
                        ${active ? "active-table" : ""}
                        ${selected === table.id ? "selected-table" : ""}
                    "
                    onclick="selectTable(${table.id})"
                >

                    <strong>
                        ${escapeHTML(table.name)}
                    </strong>

                    <span>
                        ${
                            active
                            ? money(total)
                            : "E lirë"
                        }
                    </span>

                </button>

            `;

        }).join("");


    document.getElementById(
        "dashboardTables"
    ).innerHTML = html;


    document.getElementById(
        "tableGrid"
    ).innerHTML = html;


    document.getElementById(
        "selectedTableTitle"
    ).textContent =

        selected

        ? "Tavolina " + selected

        : "Zgjidh tavolinë";

}

/* =====================================================
   ADD PRODUCT
===================================================== */

function addProduct(productId){

    const tableId =
        getSelectedTable();


    if(!tableId){

        toast(
            "Zgjidh fillimisht një tavolinë."
        );

        return;

    }


    const products =
        loadJSON(
            PRODUCTS_KEY,
            DEFAULT_PRODUCTS
        );


    const product =
        products.find(
            p =>
                Number(p.id) ===
                Number(productId)
        );


    if(!product){

        return;

    }


    const stock =
        getStock(productId);


    if(stock <= 0){

        toast(
            "Ky produkt nuk ka stok."
        );

        return;

    }


    const tables =
        getTables();


    const table =
        tables.find(
            t =>
                Number(t.id) ===
                Number(tableId)
        );


    if(!table){

        return;

    }


    if(!Array.isArray(table.items)){

        table.items = [];

    }


    const existing =
        table.items.find(
            item =>
                Number(item.productId) ===
                Number(productId)
        );


    if(existing){

        if(
            Number(existing.quantity) >=
            stock
        ){

            toast(
                "Nuk ka më stok."
            );

            return;

        }


        existing.quantity++;

    }else{

        table.items.push({

            productId:
                product.id,

            name:
                product.name,

            price:
                Number(product.price),

            quantity:1

        });

    }


    saveTables(tables);

    renderAll();

    toast(
        product.name +
        " u shtua."
    );

}

/* =====================================================
   QUANTITY
===================================================== */

function changeQuantity(
    index,
    amount
){

    const tableId =
        getSelectedTable();


    const tables =
        getTables();


    const table =
        tables.find(
            t =>
                Number(t.id) ===
                Number(tableId)
        );


    if(!table){

        return;

    }


    const item =
        table.items[index];


    if(!item){

        return;

    }


    const newQuantity =
        Number(item.quantity) +
        Number(amount);


    if(newQuantity <= 0){

        table.items.splice(
            index,
            1
        );

    }else{

        const stock =
            getStock(
                item.productId
            );


        if(newQuantity > stock){

            toast(
                "Nuk ka mjaftueshëm stok."
            );

            return;

        }


        item.quantity =
            newQuantity;

    }


    saveTables(tables);

    renderAll();

}

/* =====================================================
   COMPLETE PAYMENT
===================================================== */

function completePayment(
    paymentMethod
){

    const tableId =
        getSelectedTable();


    if(!tableId){

        toast(
            "Nuk është zgjedhur tavolina."
        );

        return;

    }


    const tables =
        getTables();


    const table =
        tables.find(
            t =>
                Number(t.id) ===
                Number(tableId)
        );


    if(
        !table ||
        !table.items ||
        !table.items.length
    ){

        toast(
            "Porosia është bosh."
        );

        return;

    }


    /*
        KONTROLLI I STOKUT
    */

    for(
        const item of table.items
    ){

        const stock =
            getStock(
                item.productId
            );


        if(
            Number(item.quantity) >
            Number(stock)
        ){

            toast(
                "Stok i pamjaftueshëm: " +
                item.name
            );

            return;

        }

    }


    /*
        TOTALI PARA SE TË PASTROHET TAVOLINA
    */

    const total =
        getTableTotal(
            table
        );


    /*
        USER
    */

    const current =
        currentUser();


    /*
        KRIJO FATURËN
    */

    const invoice = {

        id:
            Date.now(),

        number:
            "INV-" +
            Date.now(),

        date:
            new Date().toISOString(),

        table:
            table.id,

        tableName:
            table.name,

        items:
            JSON.parse(
                JSON.stringify(
                    table.items
                )
            ),

        total:
            total,

        payment:
            paymentMethod,

        waiter:
            current
                ? (
                    current.name ||
                    current.username
                )
                : "Pa emër"

    };


    /*
        UL STOKUN
    */

    invoice.items.forEach(
        item=>{

            changeStock(
                item.productId,
                -Number(item.quantity)
            );

        }
    );


    /*
        RUAJ FATURËN
    */

    const invoices =
        loadJSON(
            INVOICES_KEY,
            []
        );


    invoices.push(
        invoice
    );


    saveJSON(
        INVOICES_KEY,
        invoices
    );


    /*
        PASTRO TAVOLINËN
    */

    table.items = [];

    saveTables(
        tables
    );


    /*
        MBYLL PAYMENT MODAL
    */

    document.getElementById(
        "paymentModal"
    ).style.display =
        "none";


    /*
        HIQ TAVOLINËN E ZGJEDHUR
    */

    localStorage.removeItem(
        "MYBAR_SELECTED_TABLE"
    );


    /*
        RIFRESKO APP
    */

    renderAll();


    /*
        SHFAQ FATURËN
    */

    showInvoice(
        invoice
    );


    toast(
        "Pagesa u krye me sukses."
    );

}

function printInvoice(invoice){

    if(!invoice){

        const invoices =
            loadJSON(
                INVOICES_KEY,
                []
            );


        invoice =
            invoices[
                invoices.length - 1
            ];

    }


    if(!invoice){

        toast(
            "Nuk ka faturë për printim."
        );

        return;

    }


    preparePrint(
        invoice
    );


    /*
        WAIT FOR PRINT AREA
        THEN OPEN PRINT WINDOW
    */

    setTimeout(
        ()=>{

            window.print();

        },
        150
    );

}

function saveSettings(){

    const settings =
        getSettings();


    settings.barName =
        document.getElementById(
            "barNameInput"
        ).value.trim() ||
        "MY BAR";


    settings.address =
        document.getElementById(
            "barAddressInput"
        ).value.trim();


    settings.phone =
        document.getElementById(
            "barPhoneInput"
        ).value.trim();


    settings.tableCount =
        Math.max(
            1,
            Math.min(
                100,
                Number(
                    document.getElementById(
                        "tableCountInput"
                    ).value
                ) || 12
            )
        );


    saveJSON(
        SETTINGS_KEY,
        settings
    );


    initializeTables();

    renderAll();

    toast(
        "Cilësimet u ruajtën."
    );

}


/* =====================================================
   RENDER ALL
===================================================== */

function renderAll(){

    const settings =
        getSettings();


    document.getElementById(
        "sideBarName"
    ).textContent =
        settings.barName ||
        "MY BAR";


    renderTables();

    renderMenu();

    renderOrder();

    renderDashboard();

    renderHistory();

    renderSettings();

}


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

    document.getElementById(
        "clock"
    ).textContent =

        new Date()
            .toLocaleTimeString(
                "sq-AL",
                {
                    hour:"2-digit",
                    minute:"2-digit",
                    second:"2-digit"
                }
            );

}

===================================================== */

);

);

    }
);

document.getElementById(
    "closeInvoice"
).addEventListener(

    }

document.getElementById(

    ()=>{

        ).style.display =

    }
);

).addEventListener(

        printInvoice(
            currentInvoice
        );

);


document.getElementById(
    "printLastButton"
).addEventListener(

    }
);


document.getElementById(
    "closeShiftButton"
).addEventListener(

    closeShift
);


document.getElementById(
    "saveSettingsButton"
).addEventListener(

    saveSettings
);


document.getElementById(
    "logoutButton"
).addEventListener(
    "click",
    ()=>{

        localStorage.removeItem(
            SESSION_KEY
        );

        window.location.href =
            "./login.html";

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key === "F6"
        ){

            event.preventDefault();

            printInvoice();

        }


        if(
            event.key === "Escape"
        ){

            document.getElementById(
                "paymentModal"
            ).style.display =
                "none";


            document.getElementById(
                "invoiceModal"
            ).style.display =
                "none";

        }

    }
);


/* =====================================================
   START
===================================================== */

const session =
    currentUser();


if(!session){

    window.location.href =
        "./login.html";

}else{

    initialize();


    if(
        session.role !== "admin"
    ){

        document
            .querySelectorAll(
                ".admin-only"
            )
            .forEach(element=>{

                element.style.display =
                    "none";

            });

    }


    updateClock();

    setInterval(
        updateClock,
        1000
    );

}
