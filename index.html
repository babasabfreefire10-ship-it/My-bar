<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>MY BAR</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#f5f7f6;
    color:#18201c;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.topbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:#fff;
    border-bottom:1px solid #e3e7e4;
    box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.topbar-main{
    min-height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    padding:12px 22px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    white-space:nowrap;
}

.brand-logo{
    width:38px;
    height:38px;
    border-radius:11px;
    background:#111;
    color:#fff;
    display:grid;
    place-items:center;
    font-weight:900;
}

.brand strong{
    font-size:18px;
    letter-spacing:.8px;
}

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
}

#clock{
    font-weight:700;
    color:#53605a;
}

.user-badge{
    background:#f1f4f2;
    border:1px solid #e0e5e2;
    padding:9px 12px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
}

.nav{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:9px 16px;
    border-top:1px solid #f0f2f1;
    scrollbar-width:none;
}

.nav::-webkit-scrollbar{
    display:none;
}

.nav button{
    flex:0 0 auto;
    border:1px solid #dfe5e1;
    background:#fff;
    color:#26312b;
    padding:9px 13px;
    border-radius:9px;
    font-weight:700;
    font-size:13px;
}

.nav button:hover{
    border-color:#1f8f57;
    color:#147044;
}

.nav .primary{
    background:#17834e;
    border-color:#17834e;
    color:#fff;
}

.nav .danger{
    color:#b42318;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

.page-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.page-title h1{
    font-size:25px;
}

.page-title p{
    color:#707a75;
    margin-top:4px;
    font-size:13px;
}

.tables{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(135px,1fr));
    gap:10px;
    margin-bottom:22px;
}

.table-card{
    min-height:75px;
    border:1px solid #dfe5e1;
    background:#fff;
    border-radius:13px;
    padding:12px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
    gap:6px;
    transition:.15s;
}

.table-card:hover{
    border-color:#1d8b54;
    transform:translateY(-1px);
}

.table-card.active{
    border-color:#e3a51c;
    background:#fffaf0;
}

.table-card.selected{
    border:2px solid #16804c;
}

.table-card strong{
    font-size:14px;
}

.table-card span{
    color:#65716b;
    font-size:12px;
}

.pos-grid{
    display:grid;
    grid-template-columns:minmax(0,1fr) 390px;
    gap:18px;
    align-items:start;
}

.menu-box,
.order-box,
.panel{
    background:#fff;
    border:1px solid #e0e5e2;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.04);
}

.menu-box{
    padding:16px;
}

.menu-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:14px;
}

.menu-header h2{
    font-size:18px;
}

.search{
    width:250px;
    max-width:100%;
    border:1px solid #d8dfdb;
    background:#fbfcfb;
    padding:10px 12px;
    border-radius:10px;
    outline:none;
}

.search:focus{
    border-color:#1b8a53;
}

.categories{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:10px;
    margin-bottom:14px;
}

.categories button{
    flex:0 0 auto;
    border:1px solid #dce2df;
    background:#fff;
    padding:8px 12px;
    border-radius:9px;
    font-size:12px;
    font-weight:700;
}

.categories button.active{
    background:#17834e;
    border-color:#17834e;
    color:#fff;
}

.menu-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px;
}

.menu-card{
    min-height:105px;
    border:1px solid #e0e5e2;
    background:#fff;
    border-radius:12px;
    padding:13px;
    text-align:left;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:7px;
}

.menu-card:hover{
    border-color:#17834e;
    box-shadow:0 4px 15px rgba(23,131,78,.08);
}

.menu-card strong{
    font-size:14px;
}

.menu-card .price{
    font-weight:800;
    color:#16804c;
}

.menu-card small{
    color:#78817c;
    font-size:11px;
}

.menu-card.disabled{
    opacity:.45;
    cursor:not-allowed;
}

.order-box{
    position:sticky;
    top:145px;
    overflow:hidden;
}

.order-head{
    padding:17px;
    border-bottom:1px solid #e5e9e7;
    background:#fff;
}

.order-head-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.order-head h2{
    font-size:18px;
}

.order-total-top{
    font-size:20px;
    font-weight:900;
    color:#147847;
    white-space:nowrap;
}

.order-sub{
    color:#747e79;
    font-size:12px;
    margin-top:5px;
}

.order-items{
    padding:12px;
    max-height:480px;
    overflow-y:auto;
}

.order-item{
    border:1px solid #e4e8e6;
    border-radius:12px;
    padding:11px;
    margin-bottom:9px;
    background:#fff;
}

.order-item-main{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.order-item-name{
    font-weight:800;
    font-size:14px;
}

.order-item-prices{
    margin-top:4px;
    color:#68736d;
    font-size:12px;
}

.line-total{
    font-weight:900;
    color:#18201c;
    white-space:nowrap;
}

.quantity-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:9px;
}

.qty{
    display:flex;
    align-items:center;
    gap:7px;
}

.qty button{
    width:29px;
    height:29px;
    border:1px solid #d8dfdb;
    background:#f8faf9;
    border-radius:8px;
    font-weight:900;
}

.remove{
    border:0;
    background:#fff1f0;
    color:#b42318;
    padding:7px 9px;
    border-radius:8px;
    font-weight:800;
}

.order-footer{
    border-top:1px solid #e3e7e4;
    padding:14px;
    background:#fff;
}

.grand-total{
    display:flex;
    justify-content:space-between;
    font-size:18px;
    font-weight:900;
    margin-bottom:12px;
}

.action-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.action{
    border:1px solid #dbe1de;
    background:#fff;
    padding:11px;
    border-radius:10px;
    font-weight:800;
}

.action.primary{
    background:#17834e;
    border-color:#17834e;
    color:#fff;
}

.action.danger{
    color:#b42318;
}

.empty{
    padding:40px 15px;
    text-align:center;
    color:#7b8580;
    font-size:13px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(20,25,22,.38);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal-card{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:17px;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.modal-head{
    padding:17px;
    border-bottom:1px solid #e4e8e6;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-head h3{
    font-size:18px;
}

.close{
    border:0;
    background:#f0f2f1;
    width:32px;
    height:32px;
    border-radius:8px;
}

.modal-body{
    padding:17px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.field{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-size:12px;
    color:#5e6963;
    font-weight:700;
}

.field input,
.field select,
.field textarea{
    border:1px solid #d8dfdb;
    border-radius:9px;
    padding:10px;
    outline:none;
    background:#fff;
}

.field textarea{
    min-height:80px;
    resize:vertical;
}

.admin-section{
    border:1px solid #e1e6e3;
    border-radius:12px;
    padding:13px;
    margin-bottom:12px;
}

.admin-section h4{
    margin-bottom:10px;
}

.admin-list{
    display:flex;
    flex-direction:column;
    gap:7px;
    max-height:250px;
    overflow:auto;
}

.admin-row{
    border:1px solid #e2e7e4;
    border-radius:9px;
    padding:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.admin-row small{
    display:block;
    color:#727c77;
    margin-top:3px;
}

.admin-buttons{
    display:flex;
    gap:5px;
}

.mini{
    border:1px solid #d7ded9;
    background:#fff;
    padding:6px 9px;
    border-radius:7px;
    font-size:12px;
    font-weight:700;
}

.mini.green{
    color:#147847;
}

.mini.red{
    color:#b42318;
}

.invoice{
    width:min(520px,100%);
}

.invoice-paper{
    padding:24px;
    color:#111;
    background:#fff;
}

.invoice-center{
    text-align:center;
}

.invoice-title{
    font-size:24px;
    font-weight:900;
}

.invoice-meta{
    margin-top:10px;
    font-size:12px;
    line-height:1.6;
}

.invoice-line{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    border-bottom:1px dashed #ccc;
    font-size:13px;
}

.invoice-total{
    display:flex;
    justify-content:space-between;
    font-size:20px;
    font-weight:900;
    padding-top:14px;
}

.invoice-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    padding:15px;
    border-top:1px solid #eee;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    z-index:99999;
    background:#111;
    color:#fff;
    padding:12px 17px;
    border-radius:10px;
    display:none;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    font-size:13px;
}

@media(max-width:900px){
    .pos-grid{
        grid-template-columns:1fr;
    }

    .order-box{
        position:relative;
        top:auto;
    }

    .order-items{
        max-height:none;
    }
}

@media(max-width:600px){
    .topbar-main{
        padding:10px 13px;
    }

    .header-right #clock{
        display:none;
    }

    .container{
        padding:12px;
    }

    .page-title h1{
        font-size:20px;
    }

    .menu-header{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        width:100%;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="topbar-main">

        <div class="brand">
            <div class="brand-logo">M</div>
            <div>
                <strong id="appName">MY BAR</strong>
            </div>
        </div>

        <div class="header-right">
            <span id="clock"></span>
            <span class="user-badge" id="userInfo"></span>
        </div>

    </div>

    <nav class="nav">

        <button class="primary" onclick="newInvoice()">
            + FATURË E RE
        </button>

        <button onclick="closeCurrentInvoice()">
            MBYLL FATURËN
        </button>

        <button onclick="lockScreen()">
            BLLOKO
        </button>

        <button onclick="openSummary()">
            PËRMBLEDHJE
        </button>

        <button onclick="openMyInvoices()">
            FATURAT E MIA
        </button>

        <button onclick="tableDetails()">
            DETAJE TAVOLINE
        </button>

        <button onclick="transferTable()">
            TRANSFERO
        </button>

        <button onclick="openCash()">
            HAP ARKËN
        </button>

        <button onclick="cashReport()">
            RAPORT ARKE
        </button>

        <button class="admin-only" onclick="openAdmin()">
            ADMIN
        </button>

        <button class="danger" onclick="logout()">
            DIL
        </button>

    </nav>

</header>

<main class="container">

    <section class="page-title">

        <div>
            <h1>Paneli i shitjeve</h1>
            <p id="selectedTableText">
                Zgjidh një tavolinë
            </p>
        </div>

    </section>

    <section class="tables" id="tableGrid"></section>

    <section class="pos-grid">

        <div class="menu-box">

            <div class="menu-header">

                <div>
                    <h2>MENU</h2>
                </div>

                <input
                    id="searchInput"
                    class="search"
                    type="search"
                    placeholder="Kërko produkt..."
                >

            </div>

            <div
                class="categories"
                id="categories">
            </div>

            <div
                class="menu-grid"
                id="menuGrid">
            </div>

        </div>

        <aside class="order-box">

            <div class="order-head">

                <div class="order-head-top">

                    <div>
                        <h2>FATURA E RE</h2>
                        <div
                            class="order-sub"
                            id="orderTable">
                            Zgjidh tavolinën
                        </div>
                    </div>

                    <div
                        class="order-total-top"
                        id="orderTotalTop">
                        0 L
                    </div>

                </div>

            </div>

            <div
                class="order-items"
                id="orderItems">
            </div>

            <div class="order-footer">

                <div class="grand-total">
                    <span>TOTAL</span>
                    <span id="orderTotal">0 L</span>
                </div>

                <div class="action-row">

                    <button
                        class="action primary"
                        onclick="openPayment()">
                        PAGUA
                    </button>

                    <button
                        class="action danger"
                        onclick="clearOrder()">
                        PASTRO
                    </button>

                </div>

            </div>

        </aside>

    </section>

</main>

<!-- PAYMENT -->

<div class="modal" id="paymentModal">

    <div class="modal-card">

        <div class="modal-head">
            <h3>Pagesa</h3>
            <button class="close" onclick="closeModal('paymentModal')">×</button>
        </div>

        <div class="modal-body">

            <div
                style="text-align:center;font-size:28px;font-weight:900;margin-bottom:20px"
                id="paymentTotal">
                0 L
            </div>

            <div class="action-row">

                <button
                    class="action primary"
                    onclick="completePayment('cash')">
                    CASH
                </button>

                <button
                    class="action"
                    onclick="completePayment('card')">
                    KARTË
                </button>

            </div>

        </div>

    </div>

</div>

<!-- INVOICE -->

<div class="modal" id="invoiceModal">

    <div class="modal-card invoice">

        <div class="invoice-paper">

            <div class="invoice-center">

                <div
                    class="invoice-title"
                    id="invoiceBusiness">
                    MY BAR
                </div>

                <div class="invoice-meta">

                    <div id="invoiceNumber"></div>
                    <div id="invoiceDate"></div>
                    <div id="invoiceTable"></div>
                    <div id="invoiceWaiter"></div>
                    <div id="invoicePayment"></div>

                </div>

            </div>

            <hr style="margin:18px 0;border:0;border-top:1px solid #ddd">

            <div id="invoiceItems"></div>

            <div class="invoice-total">

                <span>TOTAL</span>

                <span id="invoiceTotal">
                    0 L
                </span>

            </div>

            <div
                style="text-align:center;font-size:11px;color:#666;margin-top:18px"
                id="invoiceFooter">
            </div>

        </div>

        <div class="invoice-actions">

            <button
                class="action primary"
                onclick="printInvoice()">
                PRINT / PRIT
            </button>

            <button
                class="action"
                onclick="finishInvoice()">
                MBYLL & DIL
            </button>

        </div>

    </div>

</div>

<!-- GENERAL MODAL -->

<div class="modal" id="generalModal">

    <div class="modal-card">

        <div class="modal-head">

            <h3 id="generalModalTitle">
                MY BAR
            </h3>

            <button
                class="close"
                onclick="closeModal('generalModal')">
                ×
            </button>

        </div>

        <div
            class="modal-body"
            id="generalModalBody">
        </div>

    </div>

</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>

</body>
</html>
