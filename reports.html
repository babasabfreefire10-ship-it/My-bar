<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MY BAR — Raporte</title>

<style>
:root{
    --bg:#050806;
    --panel:#0d1510;
    --panel2:#111b14;
    --green:#20e879;
    --border:rgba(255,255,255,.08);
    --text:#f4f7f5;
    --muted:#87938c;
    --red:#ff5368;
    --blue:#45a9ff;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    padding:22px;
    color:var(--text);
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,rgba(32,232,121,.07),transparent 35%),
        var(--bg);
}

.container{
    width:min(1200px,100%);
    margin:auto;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.icon{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:12px;
    color:var(--green);
    font-weight:900;
    background:#0c1910;
    border:1px solid rgba(32,232,121,.25);
}

.logo h1{
    font-size:22px;
}

.logo span{
    color:var(--green);
}

.back{
    padding:10px 14px;
    color:var(--text);
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:10px;
    text-decoration:none;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.card{
    padding:18px;
    border-radius:15px;
    background:var(--panel);
    border:1px solid var(--border);
}

.card small{
    color:var(--muted);
}

.card strong{
    display:block;
    margin-top:8px;
    font-size:25px;
}

.green{color:var(--green)}
.blue{color:var(--blue)}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

input{
    width:100%;
    min-height:44px;
    padding:10px 13px;
    color:var(--text);
    background:#09100c;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
}

.table-wrap{
    overflow:auto;
    border-radius:15px;
    border:1px solid var(--border);
}

table{
    width:100%;
    min-width:700px;
    border-collapse:collapse;
    background:var(--panel);
}

th,td{
    padding:13px 14px;
    text-align:left;
    border-bottom:1px solid var(--border);
}

th{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
}

td{
    color:var(--text);
    font-size:13px;
}

.amount{
    color:var(--green);
    font-weight:900;
}

.payment{
    display:inline-block;
    padding:5px 8px;
    border-radius:7px;
    background:rgba(255,255,255,.05);
    color:var(--muted);
    font-size:10px;
    font-weight:800;
}

.empty{
    padding:45px;
    text-align:center;
    color:var(--muted);
}

@media(max-width:700px){
    body{padding:13px}

    .stats{
        grid-template-columns:1fr 1fr;
        gap:9px;
    }

    header{
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">
        <div class="icon">S</div>
        <h1>MY <span>BAR</span></h1>
    </div>

    <a class="back" href="index.html">← Kthehu</a>
</header>

<div class="stats">

    <div class="card">
        <small>Xhiro totale</small>
        <strong class="green" id="totalSales">0 L</strong>
    </div>

    <div class="card">
        <small>Fatura</small>
        <strong id="totalInvoices">0</strong>
    </div>

    <div class="card">
        <small>Cash</small>
        <strong class="green" id="cashTotal">0 L</strong>
    </div>

    <div class="card">
        <small>Kartë</small>
        <strong class="blue" id="cardTotal">0 L</strong>
    </div>

</div>

<div class="toolbar">
    <input
        id="search"
        type="search"
        placeholder="Kërko faturë, tavolinë ose pagesë..."
    >
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
    <th>Fatura</th>
    <th>Data</th>
    <th>Tavolina</th>
    <th>Pagesa</th>
    <th>Total</th>
</tr>
</thead>

<tbody id="reports"></tbody>
</table>
</div>

</div>

<script>
const INVOICES_KEY="barInvoicesV4";

function getInvoices(){
    try{
        const data=
            JSON.parse(localStorage.getItem(INVOICES_KEY));

        return Array.isArray(data) ? data : [];
    }catch(e){
        return [];
    }
}

let invoices=getInvoices();

function getTotal(invoice){
    return Number(
        invoice.total ??
        invoice.amount ??
        invoice.grandTotal ??
        0
    );
}

function getPayment(invoice){
    return String(
        invoice.paymentMethod ??
        invoice.payment ??
        invoice.method ??
        "Cash"
    );
}

function getDate(invoice){
    return invoice.createdAt ??
           invoice.date ??
           invoice.time ??
           "";
}

function getTable(invoice){
    return invoice.tableName ??
           invoice.table ??
           invoice.tableId ??
           "-";
}

function formatMoney(value){
    return Number(value).toLocaleString("sq-AL")+" L";
}

function formatDate(value){
    if(!value) return "-";

    const date=new Date(value);

    if(Number.isNaN(date.getTime())){
        return String(value);
    }

    return date.toLocaleString("sq-AL",{
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    });
}

function render(){
    const search=
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const filtered=invoices.filter(invoice=>{
        const text=[
            invoice.id,
            getTable(invoice),
            getPayment(invoice),
            getDate(invoice)
        ].join(" ").toLowerCase();

        return text.includes(search);
    });

    const tbody=document.getElementById("reports");

    if(!filtered.length){
        tbody.innerHTML=`
            <tr>
                <td colspan="5">
                    <div class="empty">
                        Nuk ka të dhëna.
                    </div>
                </td>
            </tr>
        `;
        return;
    }

    tbody.innerHTML=filtered.map((invoice,index)=>{

        const payment=getPayment(invoice);

        return `
        <tr>
            <td>#${escapeHtml(
                invoice.id || String(index+1)
            )}</td>

            <td>${escapeHtml(
                formatDate(getDate(invoice))
            )}</td>

            <td>${escapeHtml(
                getTable(invoice)
            )}</td>

            <td>
                <span class="payment">
                    ${escapeHtml(payment)}
                </span>
            </td>

            <td class="amount">
                ${formatMoney(getTotal(invoice))}
            </td>
        </tr>
        `;
    }).join("");
}

function updateStats(){

    let total=0;
    let cash=0;
    let card=0;

    invoices.forEach(invoice=>{

        const amount=getTotal(invoice);

        total+=amount;

        const payment=
            getPayment(invoice).toLowerCase();

        if(
            payment.includes("card") ||
            payment.includes("kart")
        ){
            card+=amount;
        }else{
            cash+=amount;
        }
    });

    document.getElementById("totalSales")
        .textContent=formatMoney(total);

    document.getElementById("totalInvoices")
        .textContent=invoices.length;

    document.getElementById("cashTotal")
        .textContent=formatMoney(cash);

    document.getElementById("cardTotal")
        .textContent=formatMoney(card);
}

function escapeHtml(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

document.getElementById("search")
    .addEventListener("input",render);

updateStats();
render();
</script>

</body>
</html>
