<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY BAR — Stoku</title>

<style>
:root{
    --bg:#050806;
    --panel:#0d1510;
    --panel2:#111b14;
    --green:#20e879;
    --green-soft:rgba(32,232,121,.10);
    --border:rgba(255,255,255,.08);
    --text:#f4f7f5;
    --muted:#87938c;
    --red:#ff5368;
    --yellow:#ffc857;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    padding:22px;
    color:var(--text);
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,rgba(32,232,121,.07),transparent 35%),
        var(--bg);
}

.container{
    width:min(1200px,100%);
    margin:auto;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:22px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border-radius:12px;
    color:var(--green);
    font-weight:900;
    background:#0c1910;
    border:1px solid rgba(32,232,121,.25);
}

.logo h1{
    font-size:22px;
}

.logo span{
    color:var(--green);
}

.back{
    padding:10px 14px;
    border-radius:10px;
    color:var(--text);
    background:var(--panel2);
    border:1px solid var(--border);
    text-decoration:none;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    padding:18px;
    border-radius:15px;
    background:var(--panel);
    border:1px solid var(--border);
}

.stat small{
    color:var(--muted);
}

.stat strong{
    display:block;
    margin-top:7px;
    font-size:25px;
}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

input,select{
    width:100%;
    min-height:44px;
    padding:10px 13px;
    color:var(--text);
    background:#09100c;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
}

input:focus,select:focus{
    border-color:rgba(32,232,121,.35);
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:13px;
}

.product{
    overflow:hidden;
    border-radius:15px;
    background:var(--panel);
    border:1px solid var(--border);
}

.product img{
    width:100%;
    height:130px;
    object-fit:cover;
}

.info{
    padding:14px;
}

.name{
    font-weight:850;
    font-size:15px;
}

.category{
    margin-top:4px;
    color:var(--muted);
    font-size:11px;
}

.stock{
    margin-top:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.stock-number{
    color:var(--green);
    font-size:18px;
    font-weight:900;
}

.low .stock-number{
    color:var(--yellow);
}

.out .stock-number{
    color:var(--red);
}

.actions{
    display:flex;
    gap:7px;
    margin-top:12px;
}

button{
    flex:1;
    min-height:38px;
    border-radius:9px;
    border:1px solid var(--border);
    cursor:pointer;
    color:var(--text);
    background:var(--panel2);
    font-weight:800;
}

button.add{
    color:#041009;
    background:var(--green);
    border-color:var(--green);
}

button:hover{
    filter:brightness(1.08);
}

.empty{
    padding:40px;
    text-align:center;
    color:var(--muted);
    border:1px dashed var(--border);
    border-radius:15px;
}

@media(max-width:650px){
    body{padding:13px}

    header{
        align-items:flex-start;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .products{
        grid-template-columns:1fr 1fr;
        gap:9px;
    }

    .product img{
        height:105px;
    }

    .info{
        padding:10px;
    }

    .toolbar{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">
        <div class="logo-icon">S</div>
        <h1>MY <span>BAR</span></h1>
    </div>

    <a class="back" href="index.html">← Kthehu</a>
</header>

<div class="stats">
    <div class="stat">
        <small>Produkte</small>
        <strong id="totalProducts">0</strong>
    </div>

    <div class="stat">
        <small>Gjendje totale</small>
        <strong id="totalStock">0</strong>
    </div>

    <div class="stat">
        <small>Stok i ulët</small>
        <strong id="lowStock">0</strong>
    </div>
</div>

<div class="toolbar">
    <input
        id="search"
        type="search"
        placeholder="Kërko produkt..."
    >

    <select id="category">
        <option value="all">Të gjitha kategoritë</option>
    </select>
</div>

<div id="products" class="products"></div>

</div>

<script>
const PRODUCTS_KEY = "barProductsV4";
const STOCK_KEY = "barInventoryV2";

const defaultProducts = [
    {id:"espresso",name:"Espresso",price:100,category:"Kafe"},
    {id:"macchiato",name:"Macchiato",price:120,category:"Kafe"},
    {id:"cappuccino",name:"Cappuccino",price:150,category:"Kafe"},
    {id:"americano",name:"Americano",price:130,category:"Kafe"},
    {id:"water",name:"Ujë",price:80,category:"Pije"},
    {id:"coca",name:"Coca Cola",price:150,category:"Pije"},
    {id:"fanta",name:"Fanta",price:150,category:"Pije"},
    {id:"sprite",name:"Sprite",price:150,category:"Pije"},
    {id:"redbull",name:"Red Bull",price:250,category:"Pije"},
    {id:"beer",name:"Birrë",price:200,category:"Alkool"},
    {id:"wine",name:"Verë",price:300,category:"Alkool"},
    {id:"vodka",name:"Vodka",price:350,category:"Alkool"},
    {id:"pizza",name:"Pizza",price:500,category:"Ushqim"},
    {id:"burger",name:"Burger",price:450,category:"Ushqim"},
    {id:"fries",name:"Patate",price:250,category:"Ushqim"}
];

function getProducts(){
    try{
        const data=JSON.parse(localStorage.getItem(PRODUCTS_KEY));
        if(Array.isArray(data) && data.length) return data;
    }catch(e){}
    localStorage.setItem(PRODUCTS_KEY,JSON.stringify(defaultProducts));
    return defaultProducts;
}

function getStock(){
    try{
        const data=JSON.parse(localStorage.getItem(STOCK_KEY));
        if(data && typeof data==="object") return data;
    }catch(e){}
    return {};
}

function saveStock(stock){
    localStorage.setItem(STOCK_KEY,JSON.stringify(stock));
}

let products=getProducts();
let stock=getStock();

function getQty(product){
    const value=stock[product.id];
    return Number.isFinite(Number(value)) ? Number(value) : 0;
}

function formatPrice(value){
    return Number(value).toLocaleString("sq-AL")+" L";
}

function renderCategories(){
    const select=document.getElementById("category");

    const categories=[
        ...new Set(products.map(p=>p.category).filter(Boolean))
    ];

    select.innerHTML=
        `<option value="all">Të gjitha kategoritë</option>`+
        categories.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
}

function render(){
    const search=document.getElementById("search").value.toLowerCase().trim();
    const category=document.getElementById("category").value;

    const filtered=products.filter(p=>{
        const matchesSearch=
            p.name.toLowerCase().includes(search);

        const matchesCategory=
            category==="all" || p.category===category;

        return matchesSearch && matchesCategory;
    });

    const container=document.getElementById("products");

    if(!filtered.length){
        container.innerHTML=
            `<div class="empty">Nuk u gjet asnjë produkt.</div>`;
        return;
    }

    container.innerHTML=filtered.map(product=>{
        const qty=getQty(product);

        let cls="";
        if(qty<=0) cls="out";
        else if(qty<=5) cls="low";

        const image=product.image ||
            "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=700&q=80";

        return `
        <div class="product ${cls}">
            <img src="${image}" alt="${escapeHtml(product.name)}">

            <div class="info">
                <div class="name">${escapeHtml(product.name)}</div>

                <div class="category">
                    ${escapeHtml(product.category || "Pa kategori")}
                    • ${formatPrice(product.price)}
                </div>

                <div class="stock">
                    <span>Stok</span>
                    <span class="stock-number">${qty}</span>
                </div>

                <div class="actions">
                    <button onclick="changeStock('${product.id}',-1)">−</button>
                    <button class="add" onclick="changeStock('${product.id}',1)">+ Shto</button>
                </div>
            </div>
        </div>`;
    }).join("");

    updateStats();
}

function changeStock(id,amount){
    const current=getQty({id});
    stock[id]=Math.max(0,current+amount);

    saveStock(stock);
    render();
}

function updateStats(){
    const totalProducts=products.length;

    const totalStock=products.reduce(
        (sum,p)=>sum+getQty(p),0
    );

    const lowStock=products.filter(
        p=>getQty(p)<=5
    ).length;

    document.getElementById("totalProducts").textContent=totalProducts;
    document.getElementById("totalStock").textContent=totalStock;
    document.getElementById("lowStock").textContent=lowStock;
}

function escapeHtml(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

document.getElementById("search")
    .addEventListener("input",render);

document.getElementById("category")
    .addEventListener("change",render);

renderCategories();
render();
</script>

</body>
</html>
