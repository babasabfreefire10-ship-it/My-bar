<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>WELCOME • BY SABI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    background:#030303;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

/* =========================
   RGB LIGHTS
========================= */

body::before{
    content:"";
    position:fixed;
    inset:-30%;
    z-index:0;
    pointer-events:none;

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(255,0,90,.09),
            transparent 28%
        ),
        radial-gradient(
            circle at 80% 20%,
            rgba(0,130,255,.09),
            transparent 28%
        ),
        radial-gradient(
            circle at 50% 90%,
            rgba(0,255,150,.07),
            transparent 30%
        );

    animation:bgMove 12s ease-in-out infinite alternate;
}

@keyframes bgMove{
    from{
        transform:scale(1);
        filter:hue-rotate(0deg);
    }

    to{
        transform:scale(1.12);
        filter:hue-rotate(90deg);
    }
}

/* =========================
   LED FRAME
========================= */

.led{
    position:fixed;
    z-index:20;
    pointer-events:none;
}

.top,
.bottom{
    left:0;
    right:0;
    height:2px;

    background:
        linear-gradient(
            90deg,
            #ff0055,
            #ff9d00,
            #00ff88,
            #00aaff,
            #9d00ff,
            #ff0055
        );

    background-size:400% 100%;

    animation:ledHorizontal 7s linear infinite;

    box-shadow:
        0 0 8px rgba(255,255,255,.5),
        0 0 22px rgba(0,180,255,.35);
}

.top{
    top:0;
}

.bottom{
    bottom:0;
}

.left,
.right{
    top:0;
    bottom:0;
    width:2px;

    background:
        linear-gradient(
            180deg,
            #ff0055,
            #ff9d00,
            #00ff88,
            #00aaff,
            #9d00ff,
            #ff0055
        );

    background-size:100% 400%;

    animation:ledVertical 7s linear infinite;

    box-shadow:
        0 0 8px rgba(255,255,255,.5),
        0 0 22px rgba(0,180,255,.35);
}

.left{
    left:0;
}

.right{
    right:0;
}

@keyframes ledHorizontal{
    from{
        background-position:0 0;
    }

    to{
        background-position:400% 0;
    }
}

@keyframes ledVertical{
    from{
        background-position:0 0;
    }

    to{
        background-position:0 400%;
    }
}

/* =========================
   PAGE
========================= */

.page{
    position:relative;
    z-index:5;

    min-height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    padding:30px 20px;
}

/* =========================
   WELCOME
========================= */

.welcome{
    text-align:center;
    margin-bottom:55px;
}

.welcome h1{
    font-size:clamp(55px,10vw,105px);
    font-weight:900;
    letter-spacing:-5px;
    line-height:.9;

    color:#fff;

    text-shadow:
        0 0 25px rgba(255,255,255,.04);
}

.created{
    margin-top:20px;

    color:#777;

    font-size:10px;
    letter-spacing:5px;
}

/* =========================
   USERS
========================= */

.users{
    width:min(420px,90vw);

    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.user{
    height:70px;

    border:1px solid #242424;
    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #111,
            #070707
        );

    color:#fff;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    transition:.2s;
}

.user:hover{
    border-color:#666;
    transform:translateY(-2px);
}

.user.admin{
    border-color:#373737;
}

.user-name{
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
}

.user-role{
    color:#555;
    font-size:9px;
    letter-spacing:2px;
    margin-top:4px;
}

.arrow{
    color:#555;
    font-size:18px;
}

/* =========================
   CONTACT
========================= */

.contact{
    margin-top:45px;

    border:1px solid #292929;
    background:#090909;

    color:#888;

    padding:12px 22px;

    border-radius:10px;

    font-size:10px;
    letter-spacing:2px;

    cursor:pointer;

    transition:.2s;
}

.contact:hover{
    color:#fff;
    border-color:#777;
}

/* =========================
   FOOTER
========================= */

.footer{
    position:fixed;

    bottom:17px;
    left:0;
    right:0;

    text-align:center;

    color:#333;

    font-size:8px;
    letter-spacing:2px;

    z-index:5;
}

/* =========================
   LOGIN MODAL
========================= */

.modal{
    display:none;

    position:fixed;
    inset:0;

    z-index:100;

    background:rgba(0,0,0,.88);

    align-items:center;
    justify-content:center;

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(390px,100%);

    background:#0c0c0c;

    border:1px solid #292929;

    border-radius:20px;

    padding:28px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.7);
}

.modal-title{
    text-align:center;

    font-size:18px;

    letter-spacing:3px;

    margin-bottom:8px;
}

.modal-sub{
    text-align:center;

    color:#666;

    font-size:10px;

    letter-spacing:2px;

    margin-bottom:22px;
}

.pin{
    width:100%;
    height:50px;

    border:1px solid #292929;

    border-radius:11px;

    background:#050505;

    color:#fff;

    outline:none;

    text-align:center;

    font-size:19px;

    letter-spacing:7px;
}

.pin:focus{
    border-color:#888;
}

.enter{
    width:100%;
    height:48px;

    margin-top:10px;

    border:0;

    border-radius:11px;

    background:#fff;

    color:#050505;

    font-weight:800;

    letter-spacing:2px;

    cursor:pointer;
}

.close{
    width:100%;
    height:44px;

    margin-top:10px;

    border:1px solid #292929;

    border-radius:11px;

    background:#111;

    color:#777;

    cursor:pointer;
}

.error{
    min-height:18px;

    margin-top:9px;

    text-align:center;

    color:#ff5d5d;

    font-size:11px;
}

/* =========================
   CONTACT MODAL
========================= */

.contact-text{
    width:100%;
    min-height:130px;

    resize:none;

    border:1px solid #292929;

    border-radius:11px;

    background:#050505;

    color:#fff;

    outline:none;

    padding:14px;

    font-family:Arial,Helvetica,sans-serif;

    font-size:13px;

    line-height:1.5;
}

.contact-text:focus{
    border-color:#777;
}

.sms{
    width:100%;
    height:48px;

    margin-top:10px;

    border:0;

    border-radius:11px;

    background:#fff;

    color:#050505;

    font-weight:800;

    letter-spacing:1px;

    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .welcome{
        margin-bottom:40px;
    }

    .welcome h1{
        font-size:58px;
    }

    .created{
        font-size:9px;
        letter-spacing:4px;
    }

    .users{
        width:100%;
        max-width:360px;
    }

    .user{
        height:64px;
        padding:0 15px;
    }

    .user-name{
        font-size:12px;
    }

    .contact{
        margin-top:35px;
    }
}
</style>
</head>

<body>

<div class="led top"></div>
<div class="led bottom"></div>
<div class="led left"></div>
<div class="led right"></div>

<main class="page">

    <section class="welcome">

        <h1>WELCOME</h1>

        <div class="created">
            CREATED • SABI
        </div>

    </section>


    <section id="users" class="users">
        <!-- USERS -->
    </section>


    <button
        class="contact"
        onclick="openContact()"
    >
        CONTACT
    </button>

</main>


<div class="footer">
    BY SABI
</div>


<!-- =========================
     LOGIN MODAL
========================= -->

<div id="loginModal" class="modal">

    <div class="modal-card">

        <div
            id="loginName"
            class="modal-title"
        >
            USER
        </div>

        <div class="modal-sub">
            ENTER PASSWORD
        </div>

        <input
            id="pin"
            class="pin"
            type="password"
            inputmode="numeric"
            autocomplete="off"
            placeholder="••••"
        >

        <button
            class="enter"
            onclick="login()"
        >
            ENTER
        </button>

        <div
            id="loginError"
            class="error"
        ></div>

        <button
            class="close"
            onclick="closeLogin()"
        >
            BACK
        </button>

    </div>

</div>


<!-- =========================
     CONTACT MODAL
========================= -->

<div id="contactModal" class="modal">

    <div class="modal-card">

        <div class="modal-title">
            CONTACT
        </div>

        <div class="modal-sub">
            SHKRUAJ MESAZHIN
        </div>

        <textarea
            id="message"
            class="contact-text"
            placeholder="Shkruaj problemin ose mesazhin këtu..."
        ></textarea>

        <button
            class="sms"
            onclick="sendSMS()"
        >
            DËRGO SMS
        </button>

        <button
            class="close"
            onclick="closeContact()"
        >
            MBYLL
        </button>

    </div>

</div>


<script>

/* =========================
   STORAGE
========================= */

const USERS_KEY = "MYBAR_USERS_V2";
const SESSION_KEY = "MYBAR_SESSION_V2";


const DEFAULT_USERS = [

    {
        username:"admin",
        password:"1234",
        role:"admin",
        name:"ADMIN"
    },

    {
        username:"sabi",
        password:"1234",
        role:"waiter",
        name:"SABI"
    },

    {
        username:"mondi",
        password:"1234",
        role:"waiter",
        name:"MONDI"
    }

];


/* =========================
   JSON
========================= */

function getJSON(key,fallback){

    try{

        const value =
            localStorage.getItem(key);

        return value
            ? JSON.parse(value)
            : fallback;

    }catch{

        return fallback;

    }

}


function setJSON(key,value){

    localStorage.setItem(
        key,
        JSON.stringify(value)
    );

}


/* =========================
   USERS
========================= */

let selectedUser = null;


function initialize(){

    if(!localStorage.getItem(USERS_KEY)){

        setJSON(
            USERS_KEY,
            DEFAULT_USERS
        );

    }

    renderUsers();

}


function renderUsers(){

    const box =
        document.getElementById("users");

    const users =
        getJSON(
            USERS_KEY,
            DEFAULT_USERS
        );

    box.innerHTML =
        users.map((user,index)=>{

            return `

                <button
                    class="user ${user.role === "admin" ? "admin" : ""}"
                    onclick="selectUser(${index})"
                >

                    <div>

                        <div class="user-name">
                            ${escapeHTML(user.name)}
                        </div>

                        <div class="user-role">
                            ${user.role === "admin"
                                ? "ADMIN"
                                : "KAMARIER"}
                        </div>

                    </div>

                    <div class="arrow">
                        ›
                    </div>

                </button>

            `;

        }).join("");

}


/* =========================
   SELECT
========================= */

function selectUser(index){

    const users =
        getJSON(
            USERS_KEY,
            DEFAULT_USERS
        );

    if(!users[index]) return;

    selectedUser = index;

    document
        .getElementById("loginName")
        .textContent =
        users[index].name;

    document
        .getElementById("pin")
        .value = "";

    document
        .getElementById("loginError")
        .textContent = "";

    document
        .getElementById("loginModal")
        .classList.add("show");

    setTimeout(()=>{

        document
            .getElementById("pin")
            .focus();

    },100);

}


/* =========================
   LOGIN
========================= */

function login(){

    if(selectedUser === null){

        return;

    }

    const users =
        getJSON(
            USERS_KEY,
            DEFAULT_USERS
        );

    const user =
        users[selectedUser];

    if(!user) return;

    const password =
        document
            .getElementById("pin")
            .value;

    if(
        String(password) !==
        String(user.password)
    ){

        document
            .getElementById("loginError")
            .textContent =
            "PASSWORD I GABUAR.";

        document
            .getElementById("pin")
            .value = "";

        return;

    }


    setJSON(
        SESSION_KEY,
        {
            username:user.username,
            name:user.name,
            role:user.role,
            loginAt:Date.now()
        }
    );


    /*
       KËTU HAPET POS-I YT.
       index.html = POS
    */

    window.location.href =
        "index.html";

}


/* =========================
   ENTER KEY
========================= */

document
    .getElementById("pin")
    .addEventListener(
        "keydown",
        event => {

            if(event.key === "Enter"){

                login();

            }

        }
    );


/* =========================
   CLOSE LOGIN
========================= */

function closeLogin(){

    document
        .getElementById("loginModal")
        .classList.remove("show");

}


/* =========================
   CONTACT
========================= */

function openContact(){

    document
        .getElementById("contactModal")
        .classList.add("show");

}


function closeContact(){

    document
        .getElementById("contactModal")
        .classList.remove("show");

}


/* =========================
   SEND SMS
========================= */

function sendSMS(){

    const message =
        document
            .getElementById("message")
            .value
            .trim();

    if(!message){

        alert(
            "Shkruaj një mesazh fillimisht."
        );

        return;

    }


    /*
       NDRYSHO KËTU NUMRIN
       ME NUMRIN KU DO TË DËRGOSH SMS.
    */

    const phone =
        "355XXXXXXXXX";


    const text =
        "MY BAR - Mesazh nga aplikacioni:%0A%0A" +
        encodeURIComponent(message);


    window.location.href =
        "sms:" +
        phone +
        "?body=" +
        text;

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   START
========================= */

document.addEventListener(
    "DOMContentLoaded",
    initialize
);

</script>

</body>
</html>
