<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>MY BAR • Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(
            circle at center,
            rgba(201,165,92,.15),
            transparent 35%
        );
}

.box{
    position:relative;
    width:min(100%,410px);
    padding:32px;
    background:#0b0b0b;
    border:1px solid rgba(201,165,92,.4);
    border-radius:22px;
    box-shadow:0 30px 100px rgba(0,0,0,.8);
}

.logo{
    width:55px;
    height:55px;
    margin:0 auto 18px;
    border:1px solid #c9a55c;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#d9b86f;
    font-size:20px;
    font-weight:800;
    box-shadow:0 0 25px rgba(201,165,92,.15);
}

h1{
    text-align:center;
    font-size:25px;
    font-weight:400;
    letter-spacing:3px;
}

h1 span{
    color:#c9a55c;
}

.subtitle{
    text-align:center;
    margin-top:7px;
    color:#555;
    font-size:8px;
    letter-spacing:3px;
}

.user{
    margin-top:25px;
    padding:13px;
    border:1px solid #252525;
    border-radius:11px;
    background:#070707;
    text-align:center;
}

.user small{
    display:block;
    color:#555;
    font-size:7px;
    letter-spacing:2px;
}

.user strong{
    display:block;
    margin-top:5px;
    color:#d8b76d;
    font-size:13px;
    letter-spacing:2px;
}

.field{
    margin-top:16px;
}

label{
    display:block;
    margin-bottom:7px;
    color:#777;
    font-size:8px;
    letter-spacing:2px;
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #292929;
    background:#050505;
    color:#fff;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#c9a55c;
}

.login{
    width:100%;
    margin-top:18px;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#c9a55c;
    color:#050505;
    font-weight:800;
    letter-spacing:2px;
    cursor:pointer;
}

.back{
    width:100%;
    margin-top:9px;
    padding:13px;
    border:1px solid #292929;
    border-radius:10px;
    background:#090909;
    color:#888;
    cursor:pointer;
}

.error{
    display:none;
    margin-top:13px;
    padding:11px;
    border-radius:10px;
    background:#180909;
    border:1px solid #542929;
    color:#d98787;
    text-align:center;
    font-size:10px;
}

.error.show{
    display:block;
}

.users{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.users button{
    flex:1;
    padding:10px 5px;
    border:1px solid #222;
    background:#090909;
    color:#777;
    border-radius:9px;
    cursor:pointer;
    font-size:9px;
    letter-spacing:1px;
}

.users button.active{
    border-color:#c9a55c;
    color:#d9b86f;
}

.footer{
    margin-top:22px;
    text-align:center;
    color:#3f3f3f;
    font-size:7px;
    letter-spacing:2px;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">
        S
    </div>

    <h1>
        MY <span>BAR</span>
    </h1>

    <div class="subtitle">
        SECURE ACCESS
    </div>

    <div class="user">

        <small>
            USER
        </small>

        <strong id="selectedUser">
            ADMIN
        </strong>

    </div>


    <div class="users">

        <button
            id="adminBtn"
            onclick="selectUser('admin','ADMIN')"
        >
            ADMIN
        </button>

        <button
            id="sabiBtn"
            onclick="selectUser('sabi','SABI')"
        >
            SABI
        </button>

        <button
            id="mondiBtn"
            onclick="selectUser('mondi','MONDI')"
        >
            MONDI
        </button>

    </div>


    <div class="field">

        <label>
            USERNAME
        </label>

        <input
            id="username"
            type="text"
            autocomplete="username"
            value="admin"
        >

    </div>


    <div class="field">

        <label>
            FJALËKALIMI
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="••••"
            onkeydown="if(event.key==='Enter') login()"
        >

    </div>


    <button
        class="login"
        onclick="login()"
    >
        HYR NË SISTEM
    </button>


    <button
        class="back"
        onclick="goBack()"
    >
        KTHEHU
    </button>


    <div
        id="error"
        class="error"
    >
        Username ose fjalëkalim i gabuar.
    </div>


    <div class="footer">
        MY BAR • CREATED BY SABI
    </div>

</div>


<script>

"use strict";


const USERS_KEY =
    "MYBAR_USERS_V2";

const SESSION_KEY =
    "MYBAR_SESSION_V2";

const CURRENT_USER_KEY =
    "MYBAR_CURRENT_USER";


const DEFAULT_USERS = [

    {
        username:"admin",
        password:"1234",
        role:"admin",
        name:"ADMIN"
    },

    {
        username:"sabi",
        password:"1234",
        role:"waiter",
        name:"SABI"
    },

    {
        username:"mondi",
        password:"1234",
        role:"waiter",
        name:"MONDI"
    }

];


function getUsers(){

    try{

        const saved =
            localStorage.getItem(
                USERS_KEY
            );

        if(saved){

            const users =
                JSON.parse(saved);

            if(
                Array.isArray(users)
                &&
                users.length
            ){

                return users;

            }

        }

    }catch(error){

        console.error(error);

    }


    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(
            DEFAULT_USERS
        )
    );


    return DEFAULT_USERS;

}


let selectedUsername =
    "admin";


function selectUser(
    username,
    name
){

    selectedUsername =
        username;


    document
        .getElementById(
            "selectedUser"
        )
        .textContent =
        name;


    document
        .getElementById(
            "username"
        )
        .value =
        username;


    document
        .getElementById(
            "password"
        )
        .value =
        "";


    document
        .getElementById(
            "error"
        )
        .classList
        .remove(
            "show"
        );


    document
        .querySelectorAll(
            ".users button"
        )
        .forEach(
            button =>
                button.classList
                    .remove(
                        "active"
                    )
        );


    const selectedButton =
        document.getElementById(
            username + "Btn"
        );


    if(selectedButton){

        selectedButton.classList
            .add("active");

    }


    document
        .getElementById(
            "password"
        )
        .focus();

}


function login(){

    const username =
        document
        .getElementById(
            "username"
        )
        .value
        .trim()
        .toLowerCase();


    const password =
        document
        .getElementById(
            "password"
        )
        .value;


    const error =
        document
        .getElementById(
            "error"
        );


    const users =
        getUsers();


    const user =
        users.find(
            item =>
                String(
                    item.username
                )
                .toLowerCase()
                ===
                username
                &&
                String(
                    item.password
                )
                ===
                password
        );


    if(!user){

        error.classList
            .add("show");

        return;

    }


    error.classList
        .remove("show");


    const session = {

        username:
            user.username,

        name:
            user.name,

        role:
            user.role,

        loginTime:
            Date.now()

    };


    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify(
            session
        )
    );


    localStorage.setItem(
        CURRENT_USER_KEY,
        user.username
    );


    /*
       Shkojmë direkt te app.html.
       Nuk përdorim më asnjë login tjetër.
    */

    window.location.href =
        "app.html";

}


function goBack(){

    window.location.href =
        "index.html";

}


/* ADMIN si default */

selectUser(
    "admin",
    "ADMIN"
);

</script>

</body>
</html>
