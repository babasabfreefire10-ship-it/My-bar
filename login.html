<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050805">
<title>MY BAR — Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#050805;
    color:#fff;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 50% 20%,rgba(35,180,95,.12),transparent 35%),
        radial-gradient(circle at 10% 90%,rgba(0,255,120,.06),transparent 30%),
        #050805;
    z-index:-3;
}

.led{
    position:fixed;
    background:linear-gradient(180deg,
        transparent,
        #20d66d,
        #8affb4,
        #20d66d,
        transparent
    );
    width:2px;
    height:75vh;
    top:12vh;
    opacity:.75;
    filter:drop-shadow(0 0 8px #20d66d);
    animation:ledPulse 3s infinite alternate;
}

.led.left{
    left:12px;
}

.led.right{
    right:12px;
}

@keyframes ledPulse{
    from{
        opacity:.35;
        filter:drop-shadow(0 0 4px #20d66d);
    }
    to{
        opacity:1;
        filter:drop-shadow(0 0 14px #20d66d);
    }
}

/* LOGIN BOX */

.login-wrap{
    width:100%;
    max-width:440px;
    padding:24px;
}

.login-box{
    width:100%;
    background:rgba(8,14,10,.96);
    border:1px solid rgba(49,160,91,.35);
    border-radius:24px;
    padding:34px;
    box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        0 0 35px rgba(25,170,80,.08);
    backdrop-filter:blur(15px);
}

.logo{
    width:70px;
    height:70px;
    margin:0 auto 18px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:900;
    color:#07100a;
    background:linear-gradient(135deg,#72ff9d,#1ed267);
    box-shadow:0 0 30px rgba(43,226,111,.25);
}

.title{
    text-align:center;
    font-size:26px;
    font-weight:900;
    letter-spacing:2px;
}

.subtitle{
    text-align:center;
    color:#84958b;
    font-size:13px;
    margin-top:8px;
    margin-bottom:28px;
}

/* STEP TITLE */

.step-title{
    color:#9aaba1;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-bottom:12px;
}

/* ROLE BUTTONS */

.role-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.role-btn{
    min-height:90px;
    border:1px solid #26382d;
    background:#0b120e;
    border-radius:16px;
    color:#fff;
    cursor:pointer;
    transition:.2s;
    padding:16px 10px;
}

.role-btn:hover{
    border-color:#2bd96f;
    background:#0e1b13;
    transform:translateY(-2px);
}

.role-icon{
    display:block;
    font-size:25px;
    margin-bottom:8px;
}

.role-name{
    display:block;
    font-size:15px;
    font-weight:800;
}

.role-description{
    display:block;
    margin-top:5px;
    font-size:11px;
    color:#78877e;
}

/* WAITER LIST */

.hidden{
    display:none !important;
}

.back-btn{
    border:0;
    background:transparent;
    color:#7d9185;
    cursor:pointer;
    padding:0;
    margin-bottom:15px;
    font-size:13px;
}

.back-btn:hover{
    color:#55ef8b;
}

.waiter-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:260px;
    overflow-y:auto;
    padding-right:3px;
}

.waiter-btn{
    width:100%;
    border:1px solid #26382d;
    background:#0b120e;
    color:#fff;
    border-radius:14px;
    padding:15px;
    text-align:left;
    cursor:pointer;
    transition:.2s;
}

.waiter-btn:hover{
    border-color:#2bd96f;
    background:#0f1a13;
}

.waiter-name{
    display:block;
    font-size:15px;
    font-weight:800;
}

.waiter-username{
    display:block;
    color:#718078;
    font-size:12px;
    margin-top:4px;
}

.empty{
    text-align:center;
    color:#7b8981;
    padding:20px 5px;
    font-size:13px;
}

/* PASSWORD */

.selected-user{
    border:1px solid #244b32;
    background:#0a160e;
    padding:13px 14px;
    border-radius:13px;
    margin-bottom:15px;
}

.selected-user small{
    display:block;
    color:#728279;
    margin-bottom:4px;
}

.selected-user strong{
    font-size:15px;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    height:52px;
    border-radius:13px;
    border:1px solid #293a30;
    outline:none;
    background:#070c09;
    color:#fff;
    padding:0 48px 0 15px;
    font-size:16px;
}

input:focus{
    border-color:#29d86b;
    box-shadow:0 0 0 3px rgba(41,216,107,.08);
}

.show-password{
    position:absolute;
    right:13px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#829188;
    cursor:pointer;
    font-size:18px;
}

/* LOGIN BUTTON */

.login-btn{
    width:100%;
    height:52px;
    margin-top:15px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#42ef83,#18b95a);
    color:#041008;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(24,185,90,.18);
    transition:.2s;
}

.login-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 12px 30px rgba(24,185,90,.28);
}

.error{
    min-height:18px;
    margin-top:12px;
    text-align:center;
    color:#ff7272;
    font-size:13px;
}

.footer{
    text-align:center;
    color:#536158;
    font-size:10px;
    letter-spacing:1px;
    margin-top:25px;
}

/* MOBILE */

@media(max-width:500px){
    .login-wrap{
        padding:16px;
    }

    .login-box{
        padding:25px 20px;
        border-radius:20px;
    }

    .title{
        font-size:23px;
    }

    .role-btn{
        min-height:82px;
    }

    .led{
        opacity:.35;
    }
}
</style>
</head>

<body>

<div class="led left"></div>
<div class="led right"></div>

<div class="login-wrap">

    <div class="login-box">

        <!-- STEP 1 -->
        <section id="roleStep">

            <div class="logo">S</div>

            <div class="title">MY BAR</div>

            <div class="subtitle">
                Hyr në sistem
            </div>

            <div class="step-title">
                Zgjidh përdoruesin
            </div>

            <div class="role-grid">

                <button
                    type="button"
                    class="role-btn"
                    onclick="selectAdmin()"
                >
                    <span class="role-icon">⚙️</span>
                    <span class="role-name">ADMIN</span>
                    <span class="role-description">
                        Menaxhim i plotë
                    </span>
                </button>

                <button
                    type="button"
                    class="role-btn"
                    onclick="showWaiters()"
                >
                    <span class="role-icon">👤</span>
                    <span class="role-name">KAMARIER</span>
                    <span class="role-description">
                        Hyr në sistem
                    </span>
                </button>

            </div>

        </section>


        <!-- STEP 2 WAITER LIST -->
        <section id="waiterStep" class="hidden">

            <button
                type="button"
                class="back-btn"
                onclick="backToRoles()"
            >
                ← Kthehu
            </button>

            <div class="step-title">
                Zgjidh kamarierin
            </div>

            <div id="waiterList" class="waiter-list"></div>

        </section>


        <!-- STEP 3 PASSWORD -->
        <section id="passwordStep" class="hidden">

            <button
                type="button"
                class="back-btn"
                onclick="backToPrevious()"
            >
                ← Kthehu
            </button>

            <div class="step-title">
                Fjalëkalimi
            </div>

            <div class="selected-user">
                <small>Përdoruesi</small>
                <strong id="selectedUserName">
                    Administrator
                </strong>
            </div>

            <form id="loginForm">

                <div class="input-wrap">

                    <input
                        id="password"
                        type="password"
                        placeholder="Shkruaj fjalëkalimin"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                        aria-label="Shfaq fjalëkalimin"
                    >
                        👁
                    </button>

                </div>

                <div id="loginError" class="error"></div>

                <button
                    type="submit"
                    class="login-btn"
                >
                    HYR NË SISTEM
                </button>

            </form>

        </section>


        <div class="footer">
            MY BAR • PREMIUM MANAGEMENT SYSTEM
        </div>

    </div>

</div>


<script>
"use strict";

/* =========================
   STORAGE
========================= */

const USERS_KEY = "MYBAR_USERS_FINAL";
const SESSION_KEY = "MY_BAR_SESSION";


/* =========================
   DEFAULT USERS
========================= */

const DEFAULT_USERS = [
    {
        username: "admin",
        password: "1234",
        role: "admin",
        name: "Administrator"
    },
    {
        username: "kamarier",
        password: "1234",
        role: "waiter",
        name: "Kamarier"
    }
];


/* =========================
   STORAGE HELPERS
========================= */

function getJSON(key, fallback){
    try{
        const value = localStorage.getItem(key);

        if(!value){
            return fallback;
        }

        return JSON.parse(value);

    }catch(error){
        console.error(error);
        return fallback;
    }
}


function setJSON(key,value){
    localStorage.setItem(
        key,
        JSON.stringify(value)
    );
}


/* =========================
   INITIALIZE USERS
========================= */

function initializeUsers(){

    /*
        IMPORTANT:
        We only create default users
        if the storage does not exist.

        Existing users are NEVER overwritten.
    */

    if(!localStorage.getItem(USERS_KEY)){

        setJSON(
            USERS_KEY,
            DEFAULT_USERS
        );
    }
}


/* =========================
   GET USERS
========================= */

function getUsers(){

    const users =
        getJSON(
            USERS_KEY,
            DEFAULT_USERS
        );

    return Array.isArray(users)
        ? users
        : DEFAULT_USERS;
}


/* =========================
   STATE
========================= */

let selectedUser = null;
let previousStep = "role";


/* =========================
   ELEMENTS
========================= */

const roleStep =
    document.getElementById("roleStep");

const waiterStep =
    document.getElementById("waiterStep");

const passwordStep =
    document.getElementById("passwordStep");

const waiterList =
    document.getElementById("waiterList");

const selectedUserName =
    document.getElementById("selectedUserName");

const passwordInput =
    document.getElementById("password");

const loginError =
    document.getElementById("loginError");

const loginForm =
    document.getElementById("loginForm");


/* =========================
   SHOW ADMIN LOGIN
========================= */

function selectAdmin(){

    const users = getUsers();

    const admin =
        users.find(
            user =>
                String(user.username)
                    .toLowerCase() === "admin"
                ||
                String(user.role)
                    .toLowerCase() === "admin"
        );

    if(!admin){

        showError(
            "Admin nuk u gjet."
        );

        return;
    }

    selectedUser = admin;

    previousStep = "role";

    selectedUserName.textContent =
        admin.name || "Administrator";

    roleStep.classList.add("hidden");
    waiterStep.classList.add("hidden");
    passwordStep.classList.remove("hidden");

    passwordInput.value = "";
    loginError.textContent = "";

    setTimeout(() => {
        passwordInput.focus();
    },100);
}


/* =========================
   SHOW WAITER LIST
========================= */

function showWaiters(){

    const users = getUsers();

    const waiters =
        users.filter(
            user =>
                String(user.role)
                    .toLowerCase() === "waiter"
        );

    previousStep = "role";

    roleStep.classList.add("hidden");
    passwordStep.classList.add("hidden");
    waiterStep.classList.remove("hidden");

    if(!waiters.length){

        waiterList.innerHTML =
            '<div class="empty">Nuk ka kamarierë të regjistruar.</div>';

        return;
    }

    waiterList.innerHTML =
        waiters.map(
            (user,index) => {

                return `
                    <button
                        type="button"
                        class="waiter-btn"
                        onclick="selectWaiter(${index})"
                    >
                        <span class="waiter-name">
                            ${escapeHTML(
                                user.name || "Kamarier"
                            )}
                        </span>

                        <span class="waiter-username">
                            @${escapeHTML(
                                user.username || ""
                            )}
                        </span>
                    </button>
                `;
            }
        ).join("");

    /*
        Save waiter list temporarily so
        selecting by numeric index is safe.
    */

    window.__myBarWaiters = waiters;
}


/* =========================
   SELECT WAITER
========================= */

function selectWaiter(index){

    const waiters =
        window.__myBarWaiters || [];

    const waiter =
        waiters[index];

    if(!waiter){
        return;
    }

    selectedUser = waiter;

    previousStep = "waiters";

    selectedUserName.textContent =
        waiter.name || "Kamarier";

    waiterStep.classList.add("hidden");
    roleStep.classList.add("hidden");
    passwordStep.classList.remove("hidden");

    passwordInput.value = "";
    loginError.textContent = "";

    setTimeout(() => {
        passwordInput.focus();
    },100);
}


/* =========================
   BACK
========================= */

function backToRoles(){

    selectedUser = null;

    waiterStep.classList.add("hidden");
    passwordStep.classList.add("hidden");
    roleStep.classList.remove("hidden");

    loginError.textContent = "";
}


function backToPrevious(){

    selectedUser = null;

    passwordStep.classList.add("hidden");

    loginError.textContent = "";

    if(previousStep === "waiters"){
        showWaiters();
    }else{
        roleStep.classList.remove("hidden");
    }
}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        loginError.textContent = "";

        if(!selectedUser){

            showError(
                "Zgjidh një përdorues."
            );

            return;
        }

        const password =
            passwordInput.value;

        if(!password){

            showError(
                "Shkruaj fjalëkalimin."
            );

            return;
        }

        /*
            IMPORTANT:
            Read users AGAIN from localStorage.

            This means if Admin added a waiter,
            edited password/name/username,
            login immediately uses the new data.
        */

        const users = getUsers();

        const username =
            String(
                selectedUser.username || ""
            ).toLowerCase();

        const currentUser =
            users.find(
                user =>
                    String(user.username || "")
                        .toLowerCase() === username
            );

        if(!currentUser){

            showError(
                "Ky përdorues nuk ekziston më."
            );

            return;
        }

        if(
            String(currentUser.password) !==
            String(password)
        ){

            showError(
                "Fjalëkalimi është gabim."
            );

            passwordInput.select();

            return;
        }


        /* =========================
           CREATE SESSION
        ========================= */

        const session = {

            username:
                currentUser.username,

            user:
                currentUser.username,

            name:
                currentUser.name,

            role:
                currentUser.role,

            loginAt:
                Date.now()
        };


        /*
            Main session used by index.html
        */

        setJSON(
            SESSION_KEY,
            session
        );


        /*
            Compatibility with older code
        */

        setJSON(
            "barCurrentUser",
            session
        );


        /*
            Go to POS
        */

        window.location.href =
            "index.html";
    }
);


/* =========================
   PASSWORD VISIBILITY
========================= */

function togglePassword(){

    if(
        passwordInput.type ===
        "password"
    ){

        passwordInput.type =
            "text";

    }else{

        passwordInput.type =
            "password";
    }
}


/* =========================
   ERROR
========================= */

function showError(message){

    loginError.textContent =
        message;

    passwordInput.focus();
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================
   START
========================= */

initializeUsers();


/* =========================
   IF ALREADY LOGGED IN
========================= */

const existingSession =
    getJSON(
        SESSION_KEY,
        null
    );

if(existingSession){

    /*
        We intentionally do NOT automatically
        redirect here.

        This lets the user choose another account
        from the login screen.
    */
}


console.log(
    "MY BAR login loaded successfully."
);
</script>

</body>
</html>
