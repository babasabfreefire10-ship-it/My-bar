<!DOCTYPE html>
<html lang="sq">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bar Lulishtja - Hyrje</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #292929,
                    #0b0b0b 60%
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .login-container {

            width: 100%;

            max-width: 400px;

        }


        .logo {

            text-align: center;

            font-size: 60px;

            margin-bottom: 10px;

        }


        .title {

            text-align: center;

            margin-bottom: 25px;

        }


        .title h1 {

            font-size: 28px;

        }


        .title p {

            color: #888;

            margin-top: 7px;

        }


        .login-box {

            background: rgba(
                25,
                25,
                25,
                .95
            );

            border: 1px solid #333;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.45);

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            color: #aaa;

            font-size: 13px;

            margin-bottom: 7px;

        }


        input {

            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid #333;

            background: #111;

            color: white;

            outline: none;

            font-size: 16px;

        }


        input:focus {

            border-color: #777;

        }


        .login-btn {

            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 14px;

            background: white;

            color: black;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .login-btn:hover {

            background: #ddd;

        }


        .error {

            display: none;

            background: #3a1c1c;

            border: 1px solid #633;

            color: #ffaaaa;

            padding: 11px;

            border-radius: 9px;

            margin-top: 15px;

            text-align: center;

            font-size: 13px;

        }


        .footer {

            text-align: center;

            color: #666;

            font-size: 11px;

            margin-top: 20px;

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="logo">
        🍸
    </div>


    <div class="title">

        <h1>
            Bar Lulishtja
        </h1>

        <p>
            Sistemi i menaxhimit
        </p>

    </div>


    <div class="login-box">


        <form
            id="loginForm"
        >


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Shkruaj username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Shkruaj password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                class="login-btn"
                type="submit"
            >
                🔐 Hyr në sistem
            </button>


            <div
                id="error"
                class="error"
            >
                Username ose password i gabuar.
            </div>


        </form>


    </div>


    <div class="footer">

        Bar Lulishtja • Management System

    </div>


</div>



<script>


/* =====================================================
   USERS
===================================================== */


const defaultUsers = [

    {

        id: "admin",

        username: "admin",

        password: "1234",

        role: "admin",

        name: "Administrator"

    },


    {

        id: "waiter1",

        username: "kamarier1",

        password: "1234",

        role: "waiter",

        name: "Kamarier 1"

    }

];



function getUsers() {


    const saved =
        localStorage.getItem(
            "barUsersV2"
        );


    if (!saved) {


        localStorage.setItem(

            "barUsersV2",

            JSON.stringify(
                defaultUsers
            )

        );


        return [
            ...defaultUsers
        ];

    }


    return JSON.parse(
        saved
    );

}



/* =====================================================
   LOGIN
===================================================== */


document
    .getElementById(
        "loginForm"
    )
    .addEventListener(
        "submit",
        function(event) {


            event.preventDefault();


            const username =
                document.getElementById(
                    "username"
                )
                .value
                .trim();


            const password =
                document.getElementById(
                    "password"
                )
                .value;


            const users =
                getUsers();


            const user =
                users.find(
                    item =>

                        item.username ===
                        username &&

                        item.password ===
                        password

                );


            if (!user) {


                document.getElementById(
                    "error"
                ).style.display =
                    "block";


                return;

            }


            localStorage.setItem(

                "barCurrentUser",

                JSON.stringify({

                    id:
                        user.id,

                    username:
                        user.username,

                    role:
                        user.role,

                    name:
                        user.name

                })

            );


            window.location.href =
                "index.html";


        }
    );


</script>


</body>

</html>
