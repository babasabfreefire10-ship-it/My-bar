<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>MY BAR</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#020202;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* ==============================
   BACKGROUND
============================== */

.screen{
    position:relative;
    width:100%;
    height:100vh;
    min-height:500px;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 78% 48%,
            rgba(150,90,15,.18),
            transparent 38%
        ),
        radial-gradient(
            ellipse at 18% 55%,
            rgba(255,175,40,.08),
            transparent 35%
        ),
        linear-gradient(
            110deg,
            #010101 0%,
            #080704 52%,
            #020202 100%
        );
}

/* warm bar glow on right */

.screen:after{
    content:"";
    position:absolute;
    top:0;
    right:0;
    width:42%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(220,150,35,.08),
            transparent
        );

    pointer-events:none;
}

/* ==============================
   MOVING LIGHTS
============================== */

.light{
    position:absolute;
    height:2px;
    background:#e4ad43;

    box-shadow:
        0 0 8px #e4ad43,
        0 0 22px #e4ad43,
        0 0 45px rgba(228,173,67,.4);

    animation:pulse 3s ease-in-out infinite alternate;
}

.light1{
    width:25%;
    left:0;
    top:31%;
}

.light2{
    width:18%;
    right:0;
    top:31%;
    animation-delay:1s;
}

.light3{
    width:100%;
    left:0;
    bottom:12%;
    opacity:.5;
}

@keyframes pulse{
    from{opacity:.35}
    to{opacity:1}
}

/* ==============================
   DECORATIVE GLOW
============================== */

.glow{
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(231,174,61,.12),
            transparent 68%
        );

    filter:blur(12px);

    animation:floatGlow 9s ease-in-out infinite alternate;
}

.glow1{
    left:-250px;
    top:15%;
}

.glow2{
    right:-220px;
    bottom:-100px;
    animation-delay:2s;
}

@keyframes floatGlow{
    from{
        transform:translate(0,0) scale(.9);
    }
    to{
        transform:translate(80px,-40px) scale(1.15);
    }
}

/* ==============================
   CORNERS
============================== */

.corner{
    position:absolute;
    width:75px;
    height:75px;
    border-color:rgba(218,164,54,.35);
    border-style:solid;
    z-index:3;
}

.corner1{
    top:22px;
    left:22px;
    border-width:1px 0 0 1px;
}

.corner2{
    right:22px;
    bottom:22px;
    border-width:0 1px 1px 0;
}

/* ==============================
   MAIN
============================== */

.main{
    position:absolute;
    z-index:10;

    left:0;
    top:0;

    width:100%;
    height:100%;

    display:grid;

    /*
       KJO ËSHTË PJESA KRYESORE:
       WELCOME MAJTAS
       PERSONAT DJATHTAS
    */

    grid-template-columns:55% 45%;
    align-items:center;
}

/* ==============================
   WELCOME
============================== */

.welcome-area{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;

    padding-left:8%;
}

.welcome{
    color:#f2c55e;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        cursive;

    font-size:clamp(75px,9vw,145px);

    font-weight:400;
    line-height:.85;

    white-space:nowrap;

    text-shadow:
        0 0 5px rgba(255,215,110,.9),
        0 0 18px rgba(245,187,62,.6),
        0 0 45px rgba(236,159,30,.3);

    animation:goldGlow 3s ease-in-out infinite alternate;
}

@keyframes goldGlow{
    from{
        text-shadow:
            0 0 5px rgba(255,215,110,.8),
            0 0 18px rgba(245,187,62,.4);
    }

    to{
        text-shadow:
            0 0 8px rgba(255,225,130,1),
            0 0 28px rgba(245,187,62,.7),
            0 0 55px rgba(236,159,30,.35);
    }
}

.welcome-line{
    width:285px;
    height:3px;

    margin-top:25px;
    margin-left:45px;

    background:#e5b348;

    border-radius:50%;

    transform:rotate(-5deg);

    box-shadow:
        0 0 8px #e5b348,
        0 0 22px rgba(229,179,72,.5);
}

/* ==============================
   USERS
============================== */

.users-area{
    display:flex;
    align-items:center;
    justify-content:flex-start;

    padding-left:20px;
}

.users{
    width:min(380px,78%);

    display:flex;
    flex-direction:column;

    gap:22px;
}

.user{
    position:relative;

    width:100%;
    height:68px;

    display:flex;
    align-items:center;

    padding:0 25px;

    border-radius:50px;

    border:1px solid #bc8420;

    background:
        linear-gradient(
            90deg,
            rgba(210,153,35,.11),
            rgba(0,0,0,.58)
        );

    color:#fff;

    cursor:pointer;

    font-size:20px;
    font-weight:600;
    letter-spacing:1px;

    transition:
        .25s ease;

    box-shadow:
        inset 0 0 20px rgba(255,180,40,.02);
}

.user:before{
    content:"";

    position:absolute;
    left:-1px;
    top:-1px;

    width:4px;
    height:calc(100% + 2px);

    border-radius:50px;

    background:#e9b344;

    box-shadow:
        0 0 8px #e9b344,
        0 0 20px rgba(233,179,68,.7);
}

.user:hover{
    transform:translateX(-7px);

    border-color:#ffd66e;

    box-shadow:
        0 0 12px rgba(234,177,60,.45),
        0 0 35px rgba(234,177,60,.15);
}

.user:active{
    transform:scale(.97);
}

.user-icon{
    width:40px;
    height:40px;

    margin-right:18px;

    position:relative;

    border:2px solid #e8b044;
    border-radius:50%;

    box-shadow:
        0 0 8px rgba(232,176,68,.4);
}

.user-icon:before{
    content:"";

    position:absolute;

    width:10px;
    height:10px;

    border:2px solid #e8b044;
    border-radius:50%;

    top:7px;
    left:50%;

    transform:translateX(-50%);
}

.user-icon:after{
    content:"";

    position:absolute;

    width:20px;
    height:10px;

    border:2px solid #e8b044;
    border-bottom:0;

    border-radius:14px 14px 0 0;

    left:50%;
    bottom:5px;

    transform:translateX(-50%);
}

/* ==============================
   BOTTOM
============================== */

.by{
    position:absolute;

    z-index:20;

    left:38px;
    bottom:22px;

    color:#777;

    font-size:10px;
    letter-spacing:.5px;
}

.by span{
    color:#bd8b38;
}

.contact{
    position:absolute;

    z-index:20;

    right:38px;
    bottom:22px;

    border:0;
    background:none;

    color:#777;

    font-size:10px;
    letter-spacing:.5px;

    cursor:pointer;
}

.contact:hover{
    color:#e4ad42;
}

/* ==============================
   LOGIN MODAL
============================== */

.login-overlay{
    position:fixed;
    z-index:100;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.82);

    backdrop-filter:blur(12px);
}

.login-card{
    width:min(390px,88%);

    padding:32px;

    border-radius:25px;

    border:1px solid #d5a13a;

    background:
        linear-gradient(
            145deg,
            #171209,
            #050505
        );

    box-shadow:
        0 0 25px rgba(225,168,53,.35),
        0 0 70px rgba(225,168,53,.12);

    text-align:center;
}

.login-card h2{
    color:#e7b348;

    font-size:28px;

    margin-bottom:7px;
}

.login-card p{
    color:#777;

    font-size:12px;

    margin-bottom:22px;
}

.password{
    width:100%;
    height:52px;

    border:1px solid #5c461e;
    border-radius:13px;

    background:#080808;

    color:#fff;

    outline:none;

    padding:0 16px;

    font-size:16px;
}

.password:focus{
    border-color:#e4ae43;

    box-shadow:
        0 0 15px rgba(228,174,67,.2);
}

.login-button{
    width:100%;
    height:52px;

    margin-top:13px;

    border:0;
    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #f0c45d,
            #ae7419
        );

    color:#080604;

    font-size:15px;
    font-weight:800;

    cursor:pointer;
}

.cancel{
    margin-top:14px;

    background:none;
    border:0;

    color:#777;

    cursor:pointer;
}

.error{
    display:none;

    color:#ff6262;

    font-size:12px;

    margin-top:10px;
}

/* ==============================
   CONTACT
============================== */

.contact-overlay{
    position:fixed;
    inset:0;

    z-index:110;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.82);

    backdrop-filter:blur(10px);
}

.contact-card{
    width:min(420px,88%);

    padding:28px;

    border-radius:22px;

    border:1px solid #bd8a2d;

    background:#090909;

    box-shadow:
        0 0 45px rgba(218,162,48,.2);
}

.contact-card h3{
    color:#e5ae42;
    margin-bottom:18px;
}

.contact-card input,
.contact-card textarea{
    width:100%;

    border:1px solid #4b391c;

    background:#111;

    color:#fff;

    border-radius:11px;

    padding:12px;

    outline:none;

    margin-bottom:10px;
}

.contact-card textarea{
    height:100px;
    resize:none;
}

.send{
    width:100%;
    height:46px;

    border:0;
    border-radius:11px;

    background:#dda93e;

    color:#090909;

    font-weight:800;

    cursor:pointer;
}

.close{
    width:100%;

    margin-top:9px;

    border:0;
    background:none;

    color:#777;

    cursor:pointer;
}

/* ==============================
   MOBILE
   IMPORTANT:
   MOS I VENDOSIM POSHTË.
   WELCOME DHE PERSONAT MBETEN
   MAJTAS/DJATHTAS SI NË FOTO.
============================== */

@media(max-width:700px){

    .main{
        grid-template-columns:52% 48%;
    }

    .welcome-area{
        padding-left:7%;
    }

    .welcome{
        font-size:clamp(48px,13vw,78px);
    }

    .welcome-line{
        width:145px;
        margin-top:16px;
        margin-left:20px;
    }

    .users-area{
        padding-left:5px;
    }

    .users{
        width:92%;
        gap:12px;
    }

    .user{
        height:52px;

        padding:0 10px;

        font-size:14px;

        letter-spacing:.4px;
    }

    .user-icon{
        width:29px;
        height:29px;

        margin-right:9px;
    }

    .user-icon:before{
        width:7px;
        height:7px;

        top:5px;
    }

    .user-icon:after{
        width:15px;
        height:7px;

        bottom:4px;
    }

    .by{
        left:15px;
        bottom:12px;

        font-size:8px;
    }

    .contact{
        right:15px;
        bottom:12px;

        font-size:8px;
    }

    .corner{
        width:42px;
        height:42px;
    }

    .corner1{
        top:12px;
        left:12px;
    }

    .corner2{
        right:12px;
        bottom:12px;
    }
}
</style>
</head>

<body>

<div class="screen">

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

    <div class="light light1"></div>
    <div class="light light2"></div>
    <div class="light light3"></div>

    <div class="corner corner1"></div>
    <div class="corner corner2"></div>


    <!-- =================================
         KJO ËSHTË LAYOUT-I SI FOTOJA
         WELCOME = MAJTAS
         PERSONAT = DJATHTAS
    ================================== -->

    <div class="main">

        <div class="welcome-area">

            <div class="welcome">
                Welcome
            </div>

            <div class="welcome-line"></div>

        </div>


        <div class="users-area">

            <div class="users">

                <button
                    class="user"
                    onclick="openLogin('admin','ADMIN')">

                    <span class="user-icon"></span>

                    <span>ADMIN</span>

                </button>


                <button
                    class="user"
                    onclick="openLogin('sabi','SABI')">

                    <span class="user-icon"></span>

                    <span>SABI</span>

                </button>


                <button
                    class="user"
                    onclick="openLogin('mondi','MONDI')">

                    <span class="user-icon"></span>

                    <span>MONDI</span>

                </button>

            </div>

        </div>

    </div>


    <div class="by">
        by <span>Sabi</span>
    </div>


    <button
        class="contact"
        onclick="openContact()">
        Contact
    </button>

</div>


<!-- LOGIN -->

<div
    class="login-overlay"
    id="loginOverlay">

    <div class="login-card">

        <h2 id="loginTitle">
            LOGIN
        </h2>

        <p>
            Vendos fjalëkalimin
        </p>

        <input
            class="password"
            id="password"
            type="password"
            placeholder="Fjalëkalimi">

        <button
            class="login-button"
            onclick="doLogin()">
            HYR
        </button>

        <div
            class="error"
            id="loginError">
            Fjalëkalimi është i gabuar.
        </div>

        <button
            class="cancel"
            onclick="closeLogin()">
            Anulo
        </button>

    </div>

</div>


<!-- CONTACT -->

<div
    class="contact-overlay"
    id="contactOverlay">

    <div class="contact-card">

        <h3>CONTACT</h3>

        <input
            id="phone"
            type="tel"
            placeholder="Numri i telefonit">

        <textarea
            id="message"
            placeholder="Shkruaj mesazhin..."></textarea>

        <button
            class="send"
            onclick="sendSMS()">
            DËRGO
        </button>

        <button
            class="close"
            onclick="closeContact()">
            Mbyll
        </button>

    </div>

</div>


<script>

/* ==============================
   USERS
============================== */

const USERS = {

    admin:{
        username:"admin",
        password:"1234",
        role:"admin",
        name:"ADMIN"
    },

    sabi:{
        username:"sabi",
        password:"1234",
        role:"waiter",
        name:"SABI"
    },

    mondi:{
        username:"mondi",
        password:"1234",
        role:"waiter",
        name:"MONDI"
    }

};

let selectedUser = null;


/* ==============================
   LOGIN
============================== */

function openLogin(username,name){

    selectedUser = USERS[username];

    if(!selectedUser){
        return;
    }

    document.getElementById(
        "loginTitle"
    ).textContent = name;

    document.getElementById(
        "password"
    ).value = "";

    document.getElementById(
        "loginError"
    ).style.display = "none";

    document.getElementById(
        "loginOverlay"
    ).style.display = "flex";

    setTimeout(function(){

        document.getElementById(
            "password"
        ).focus();

    },100);
}


function closeLogin(){

    document.getElementById(
        "loginOverlay"
    ).style.display = "none";

    selectedUser = null;
}


function doLogin(){

    if(!selectedUser){
        return;
    }

    const password =
        document.getElementById(
            "password"
        ).value;

    if(
        password !==
        selectedUser.password
    ){

        document.getElementById(
            "loginError"
        ).style.display = "block";

        return;
    }

    localStorage.setItem(
        "MYBAR_SESSION_V2",
        "1"
    );

    localStorage.setItem(
        "MYBAR_CURRENT_USER",
        JSON.stringify(
            selectedUser
        )
    );

    window.location.href =
        "./app.html";
}


/* ENTER = LOGIN */

document
.getElementById("password")
.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){
            doLogin();
        }

    }
);


/* ==============================
   CONTACT
============================== */

function openContact(){

    document.getElementById(
        "contactOverlay"
    ).style.display = "flex";

}


function closeContact(){

    document.getElementById(
        "contactOverlay"
    ).style.display = "none";

}


function sendSMS(){

    const phone =
        document.getElementById(
            "phone"
        ).value.trim();

    const message =
        document.getElementById(
            "message"
        ).value.trim();

    if(!phone){

        alert(
            "Vendos numrin e telefonit."
        );

        return;
    }

    if(!message){

        alert(
            "Shkruaj mesazhin."
        );

        return;
    }

    window.location.href =
        "sms:" +
        encodeURIComponent(phone) +
        "?body=" +
        encodeURIComponent(message);
}


/* ==============================
   OUTSIDE CLICK
============================== */

document
.getElementById("loginOverlay")
.addEventListener(
    "click",
    function(e){

        if(e.target === this){
            closeLogin();
        }

    }
);

document
.getElementById("contactOverlay")
.addEventListener(
    "click",
    function(e){

        if(e.target === this){
            closeContact();
        }

    }
);

</script>

</body>
</html>
