<!DOCTYPE html>
<html lang="sq">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - Bar Lulishtja</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background: #0d1117;

            color: white;

            font-family: Arial, sans-serif;

        }


        .login-box {

            width: 100%;

            max-width: 400px;

            padding: 30px;

            background: #151b23;

            border: 1px solid #293341;

            border-radius: 18px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.4);

        }


        h1 {

            margin-top: 0;

            text-align: center;

        }


        .subtitle {

            text-align: center;

            color: #8792a0;

            margin-bottom: 25px;

        }


        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 12px;

            border-radius: 9px;

            border: 1px solid #303b49;

            background: #0f141b;

            color: white;

            outline: none;

        }


        button {

            width: 100%;

            padding: 14px;

            border: 0;

            border-radius: 9px;

            background: #2f81f7;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        .error {

            color: #ff6262;

            text-align: center;

            margin-top: 15px;

            display: none;

        }


        .demo {

            margin-top: 20px;

            padding: 12px;

            border-radius: 9px;

            background: #202936;

            color: #9aa5b4;

            font-size: 13px;

        }

    </style>

</head>


<body>


<div class="login-box">

    <h1>🍸</h1>

    <h1 id="appName">
        Bar Lulishtja
    </h1>

    <div class="subtitle">
        Paneli i menaxhimit
    </div>


    <input
        id="username"
        placeholder="Username"
        autocomplete="username">


    <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password">


    <button onclick="login()">
        Hyr
    </button>


    <div
        id="error"
        class="error">
        Username ose password gabim.
    </div>


    <div class="demo">

        <strong>Login fillestar:</strong>

        <br><br>

        Admin:
        <b>admin</b> /
        <b>1234</b>

        <br>

        Kamarier:
        <b>kamarier1</b> /
        <b>1234</b>

    </div>

</div>


<script>

const USERS_KEY = "barUsersV3";
const APP_NAME_KEY = "barAppNameV3";
const CURRENT_USER_KEY = "barCurrentUser";


const defaultUsers = [

    {
        id: "u1",
        username: "admin",
        password: "1234",
        role: "admin",
        name: "Administrator"
    },

    {
        id: "u2",
        username: "kamarier1",
        password: "1234",
        role: "waiter",
        name: "Kamarier 1"
    }

];


function getUsers() {

    let users =
        JSON.parse(
            localStorage.getItem(
                USERS_KEY
            ) || "null"
        );


    if (
        !Array.isArray(users) ||
        users.length === 0
    ) {

        users =
            defaultUsers;

        localStorage.setItem(
            USERS_KEY,
            JSON.stringify(users)
        );

    }


    return users;

}


function login() {

    const username =
        document
            .getElementById("username")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    const user =
        getUsers().find(
            u =>
                u.username === username &&
                u.password === password
        );


    if (!user) {

        document
            .getElementById("error")
            .style.display = "block";

        return;

    }


    localStorage.setItem(
        CURRENT_USER_KEY,
        JSON.stringify(user)
    );


    window.location.href =
        "index.html";

}


document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                login();

            }

        }
    );


const appName =
    localStorage.getItem(
        APP_NAME_KEY
    );


if (appName) {

    document
        .getElementById("appName")
        .textContent = appName;

}

</script>


</body>

</html>
