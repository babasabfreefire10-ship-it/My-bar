<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY BAR — Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#020403;
  color:#fff;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

/* BACKGROUND */
.bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% 45%,rgba(0,255,120,.08),transparent 35%),
    radial-gradient(circle at 20% 80%,rgba(0,255,120,.035),transparent 30%),
    #020403;
  z-index:-5;
}

/* MOVING LED SIDES */
.led{
  position:fixed;
  top:0;
  bottom:0;
  width:3px;
  overflow:hidden;
  background:rgba(0,255,110,.08);
  box-shadow:0 0 12px rgba(0,255,110,.18);
  z-index:-1;
}

.led.left{
  left:18px;
}

.led.right{
  right:18px;
}

.led::after{
  content:"";
  position:absolute;
  left:0;
  width:100%;
  height:170px;
  background:linear-gradient(
    to bottom,
    transparent,
    #00ff73,
    #8affbd,
    #00ff73,
    transparent
  );
  filter:drop-shadow(0 0 9px #00ff73);
  animation:ledMove 3.5s linear infinite;
}

.led.right::after{
  animation-delay:1.7s;
}

@keyframes ledMove{
  0%{
    top:-180px;
  }
  100%{
    top:100%;
  }
}

/* SIDE LIGHT STREAKS */
.streak{
  position:fixed;
  width:90px;
  height:1px;
  background:linear-gradient(90deg,transparent,#00ff73,transparent);
  opacity:.35;
  filter:blur(.2px);
  animation:streakMove 5s linear infinite;
}

.streak.s1{left:0;top:18%;animation-delay:0s;}
.streak.s2{right:0;top:42%;animation-delay:1.4s;}
.streak.s3{left:0;top:70%;animation-delay:2.8s;}
.streak.s4{right:0;top:83%;animation-delay:3.8s;}

@keyframes streakMove{
  0%{
    transform:translateX(-100%);
    opacity:0;
  }
  15%{opacity:.5;}
  50%{opacity:.8;}
  85%{opacity:.3;}
  100%{
    transform:translateX(100%);
    opacity:0;
  }
}

/* CORNER ACCENTS */
.corner{
  position:fixed;
  width:65px;
  height:65px;
  opacity:.5;
}

.corner::before,
.corner::after{
  content:"";
  position:absolute;
  background:#00ff73;
  box-shadow:0 0 8px rgba(0,255,115,.7);
}

.corner::before{
  width:45px;
  height:1px;
}

.corner::after{
  width:1px;
  height:45px;
}

.tl{
  top:22px;
  left:28px;
}

.tl::after{left:0;top:0;}
.tl::before{left:0;top:0;}

.tr{
  top:22px;
  right:28px;
  transform:rotate(90deg);
}

.bl{
  bottom:22px;
  left:28px;
  transform:rotate(-90deg);
}

.br{
  bottom:22px;
  right:28px;
  transform:rotate(180deg);
}

/* LOGIN CARD */
.login-box{
  width:min(410px,90vw);
  padding:42px 34px 30px;
  border:1px solid rgba(0,255,115,.17);
  background:
    linear-gradient(
      145deg,
      rgba(10,18,14,.96),
      rgba(2,5,3,.97)
    );
  border-radius:18px;
  box-shadow:
    0 0 50px rgba(0,255,115,.06),
    inset 0 0 35px rgba(0,255,115,.025);
  position:relative;
  overflow:hidden;
}

/* TOP LED LINE */
.login-box::before{
  content:"";
  position:absolute;
  top:0;
  left:-40%;
  width:40%;
  height:2px;
  background:linear-gradient(
    90deg,
    transparent,
    #00ff73,
    #b8ffd5,
    transparent
  );
  box-shadow:0 0 12px #00ff73;
  animation:topLed 3s linear infinite;
}

@keyframes topLed{
  0%{left:-40%;}
  100%{left:110%;}
}

/* LOGO */
.logo{
  width:76px;
  height:76px;
  margin:0 auto 18px;
  border:1px solid rgba(0,255,115,.45);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  font-weight:900;
  color:#00ff73;
  text-shadow:0 0 15px rgba(0,255,115,.6);
  box-shadow:
    0 0 25px rgba(0,255,115,.08),
    inset 0 0 18px rgba(0,255,115,.04);
  position:relative;
}

.logo::before{
  content:"";
  position:absolute;
  inset:-7px;
  border:1px solid rgba(0,255,115,.08);
  border-radius:50%;
  animation:logoPulse 2.5s ease-in-out infinite;
}

@keyframes logoPulse{
  0%,100%{
    transform:scale(1);
    opacity:.35;
  }
  50%{
    transform:scale(1.08);
    opacity:.8;
  }
}

.badge{
  width:max-content;
  margin:0 auto 13px;
  padding:6px 11px;
  border:1px solid rgba(0,255,115,.18);
  border-radius:20px;
  font-size:9px;
  letter-spacing:2.5px;
  color:#72ffad;
  background:rgba(0,255,115,.025);
}

h1{
  text-align:center;
  font-size:28px;
  letter-spacing:5px;
  font-weight:900;
  margin-bottom:7px;
}

.subtitle{
  text-align:center;
  color:#718078;
  font-size:10px;
  letter-spacing:2.4px;
  margin-bottom:32px;
}

/* INPUTS */
.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#6f7c75;
  font-size:9px;
  letter-spacing:1.7px;
  text-transform:uppercase;
}

.input{
  width:100%;
  height:48px;
  border:1px solid #1a2921;
  background:#060a08;
  color:white;
  border-radius:9px;
  padding:0 14px;
  outline:none;
  font-size:14px;
  transition:.2s;
}

.input:focus{
  border-color:#00b957;
  box-shadow:0 0 0 3px rgba(0,255,115,.055);
}

/* LOGIN BUTTON */
.login-btn{
  width:100%;
  height:49px;
  margin-top:9px;
  border:1px solid #00e866;
  border-radius:9px;
  background:linear-gradient(
    135deg,
    #00d95f,
    #00a94a
  );
  color:#001b0b;
  font-weight:900;
  letter-spacing:1.5px;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 0 18px rgba(0,255,115,.13);
}

.login-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 0 25px rgba(0,255,115,.28);
}

.login-btn:active{
  transform:scale(.98);
}

.error{
  min-height:17px;
  text-align:center;
  color:#ff5f5f;
  font-size:11px;
  margin-top:12px;
}

/* CONTACT */
.contact{
  margin-top:25px;
  border-top:1px solid #142019;
  padding-top:18px;
}

.contact-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  color:#78857e;
  font-size:9px;
  letter-spacing:2px;
  user-select:none;
}

.arrow{
  color:#00ff73;
  font-size:18px;
  line-height:10px;
}

.contact-content{
  display:none;
  margin-top:14px;
  gap:8px;
}

.contact-content.open{
  display:grid;
}

.contact-btn{
  height:40px;
  border:1px solid #1a2921;
  background:#070b09;
  color:#b5c0ba;
  border-radius:7px;
  cursor:pointer;
  font-size:9px;
  letter-spacing:1px;
  transition:.2s;
}

.contact-btn:hover{
  border-color:#00b957;
  color:#00ff73;
}

.buy{
  border-color:rgba(0,255,115,.22);
  color:#00ff73;
}

/* FOOTER */
.footer{
  position:fixed;
  bottom:18px;
  left:0;
  right:0;
  text-align:center;
  color:#3d4943;
  font-size:8px;
  letter-spacing:2px;
}

@media(max-width:500px){
  .login-box{
    padding:35px 24px 25px;
  }

  .led.left{
    left:8px;
  }

  .led.right{
    right:8px;
  }

  .corner{
    display:none;
  }

  h1{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="led left"></div>
<div class="led right"></div>

<div class="streak s1"></div>
<div class="streak s2"></div>
<div class="streak s3"></div>
<div class="streak s4"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="login-box">

  <div class="logo">M</div>

  <div class="badge">SISTEM PREMIUM</div>

  <h1>MY BAR</h1>

  <div class="subtitle">
    SISTEMI I MENAXHIMIT
  </div>

  <div class="field">
    <label>Përdoruesi</label>
    <input
      id="username"
      class="input"
      type="text"
      autocomplete="username"
      placeholder="Shkruaj përdoruesin"
    >
  </div>

  <div class="field">
    <label>Fjalëkalimi</label>
    <input
      id="password"
      class="input"
      type="password"
      autocomplete="current-password"
      placeholder="Shkruaj fjalëkalimin"
    >
  </div>

  <button class="login-btn" onclick="login()">
    HYR NË SISTEM
  </button>

  <div id="error" class="error"></div>

  <div class="contact">

    <div class="contact-head" onclick="toggleContact()">
      <span>CONTACT</span>
      <span id="arrow" class="arrow">+</span>
    </div>

    <div id="contactContent" class="contact-content">

      <button class="contact-btn buy" onclick="buyApp()">
        BLI APLIKACIONIN • 49€
      </button>

      <button class="contact-btn" onclick="reportProblem()">
        RAPORTO NJË PROBLEM
      </button>

    </div>

  </div>

</div>

<div class="footer">
  MY BAR • PREMIUM MANAGEMENT SYSTEM
</div>

<script>

"use strict";

/* =========================
   LOGIN
========================= */

function login(){

  const user =
    document.getElementById("username").value.trim().toLowerCase();

  const pass =
    document.getElementById("password").value;

  const error =
    document.getElementById("error");

  /* Clear previous error */
  error.textContent = "";

  /*
   * IMPORTANT:
   * index.html checks:
   *
   * user.role === "admin"
   *
   * therefore the role MUST be:
   * "admin" or "waiter"
   */

  let session = null;

  if(user === "admin" && pass === "1234"){

    session = {
      username: "admin",
      user: "admin",
      role: "admin",
      name: "Administrator"
    };

  }else if(user === "kamarier" && pass === "1234"){

    session = {
      username: "kamarier",
      user: "kamarier",
      role: "waiter",
      name: "Kamarier"
    };

  }else{

    error.textContent =
      "Përdoruesi ose fjalëkalimi është gabim.";

    return;
  }

  /*
   * Save the SAME session key used by index.html.
   */
  localStorage.setItem(
    "MY_BAR_SESSION",
    JSON.stringify(session)
  );

  /*
   * Small compatibility layer for older MY BAR versions.
   */
  localStorage.setItem(
    "barCurrentUser",
    JSON.stringify(session)
  );

  /*
   * Go to the main application.
   */
  window.location.href = "./index.html";
}


/* =========================
   CONTACT
========================= */

function toggleContact(){

  const box =
    document.getElementById("contactContent");

  const arrow =
    document.getElementById("arrow");

  box.classList.toggle("open");

  arrow.textContent =
    box.classList.contains("open")
      ? "−"
      : "+";
}


/* =========================
   BUY APP
========================= */

function buyApp(){

  alert(
    "MY BAR\n\n" +
    "Çmimi i aplikacionit: 49€\n\n" +
    "Kontaktoni administratorin për blerjen."
  );

}


/* =========================
   REPORT PROBLEM
========================= */

function reportProblem(){

  const problem =
    prompt(
      "Shkruaj problemin që dëshiron të raportosh:"
    );

  if(problem && problem.trim()){

    alert(
      "Raporti u regjistrua.\n\n" +
      "Problemi:\n" +
      problem.trim()
    );

  }

}


/* =========================
   ENTER = LOGIN
========================= */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){
      login();
    }

  }
);

</script>

</body>
</html>
