<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MY BAR — Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#030504;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.login{
    min-height:100vh;
    display:grid;
    grid-template-columns:1fr 1fr;
}

.left{
    display:flex;
    align-items:center;
    justify-content:center;
    border-right:1px solid #17251d;
    background:
        radial-gradient(circle at 50% 50%,rgba(20,130,70,.12),transparent 50%);
}

.brand{
    text-align:center;
}

.brand h1{
    font-size:64px;
    letter-spacing:9px;
    font-weight:900;
}

.brand p{
    margin-top:15px;
    color:#65736c;
    letter-spacing:4px;
    font-size:11px;
}

.right{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.box{
    width:min(520px,100%);
}

.title{
    font-size:25px;
    margin-bottom:8px;
}

.subtitle{
    color:#65736c;
    font-size:13px;
    margin-bottom:25px;
}

.users{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:25px;
}

.user{
    border:1px solid #1b3024;
    background:#08100c;
    color:white;
    padding:22px 8px;
    cursor:pointer;
    transition:.2s;
}

.user:hover,
.user.active{
    border-color:#20d678;
    background:#0c2115;
    box-shadow:0 0 20px rgba(32,214,120,.12);
}

.avatar{
    width:45px;
    height:45px;
    border-radius:50%;
    margin:auto auto 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#11271a;
    color:#42ec91;
    font-weight:bold;
}

.user strong{
    display:block;
    font-size:13px;
}

.user small{
    color:#65736c;
    font-size:10px;
}

.pin{
    width:100%;
    padding:16px;
    background:#070d09;
    border:1px solid #203329;
    color:white;
    outline:none;
    font-size:18px;
    text-align:center;
    letter-spacing:7px;
}

.pin:focus{
    border-color:#20d678;
}

.loginBtn{
    width:100%;
    padding:16px;
    margin-top:12px;
    background:#0b2517;
    color:white;
    border:1px solid #20d678;
    cursor:pointer;
    font-weight:bold;
    letter-spacing:2px;
}

.loginBtn:hover{
    background:#20d678;
    color:#021008;
}

.error{
    color:#ff6464;
    text-align:center;
    margin-top:15px;
    font-size:12px;
    min-height:18px;
}

.clock{
    position:fixed;
    top:20px;
    right:25px;
    color:#65736c;
    font-size:12px;
}

@media(max-width:800px){
    .login{
        grid-template-columns:1fr;
    }

    .left{
        min-height:230px;
        border-right:0;
        border-bottom:1px solid #17251d;
    }

    .brand h1{
        font-size:42px;
    }
}
</style>
</head>

<body>

<div class="clock" id="clock"></div>

<div class="login">

<section class="left">
    <div class="brand">
        <h1>MY BAR</h1>
        <p>PROFESSIONAL POS SYSTEM</p>
    </div>
</section>

<section class="right">

<div class="box">

    <div class="title">WELCOME</div>
    <div class="subtitle">Zgjidh përdoruesin për të vazhduar</div>

    <div class="users" id="users"></div>

    <input
        id="pin"
        class="pin"
        type="password"
        inputmode="numeric"
        maxlength="12"
        placeholder="PIN"
    >

    <button class="loginBtn" onclick="login()">
        HYR NË SISTEM
    </button>

    <div class="error" id="error"></div>

</div>

</section>

</div>

<script>

const USERS_KEY = "MYBAR_USERS_V2";
const SESSION_KEY = "MYBAR_SESSION_V2";

let selectedUser = null;

const DEFAULT_USERS = [
    {
        username:"admin",
        password:"1234",
        role:"admin",
        name:"ADMIN"
    },
    {
        username:"sabi",
        password:"1234",
        role:"waiter",
        name:"SABI"
    },
    {
        username:"mondi",
        password:"1234",
        role:"waiter",
        name:"MONDI"
    }
];

function getUsers(){

    try{

        const users =
            JSON.parse(localStorage.getItem(USERS_KEY));

        if(Array.isArray(users) && users.length){
            return users;
        }

    }catch(e){}

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(DEFAULT_USERS)
    );

    return DEFAULT_USERS;
}

function renderUsers(){

    const users = getUsers();

    document.getElementById("users").innerHTML =
        users.map((user,index)=>`

        <button
            class="user"
            onclick="selectUser(${index})"
            id="user-${index}"
        >

            <div class="avatar">
                ${user.name.charAt(0).toUpperCase()}
            </div>

            <strong>${escapeHTML(user.name)}</strong>

            <small>
                ${user.role === "admin" ? "ADMINISTRATOR" : "KAMARIER"}
            </small>

        </button>

    `).join("");
}

function selectUser(index){

    const users = getUsers();

    selectedUser = users[index];

    document.querySelectorAll(".user")
        .forEach(x=>x.classList.remove("active"));

    const el =
        document.getElementById("user-"+index);

    if(el) el.classList.add("active");

    document.getElementById("pin").focus();
}

function login(){

    const error =
        document.getElementById("error");

    error.textContent = "";

    if(!selectedUser){

        error.textContent =
            "Zgjidh fillimisht përdoruesin.";

        return;
    }

    const pin =
        document.getElementById("pin").value;

    if(pin !== selectedUser.password){

        error.textContent =
            "PIN-i është i gabuar.";

        return;
    }

    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify({
            username:selectedUser.username,
            name:selectedUser.name,
            role:selectedUser.role,
            loginTime:Date.now()
        })
    );

    localStorage.setItem(
        "barCurrentUser",
        JSON.stringify(selectedUser)
    );

    window.location.href = "index.html";
}

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function updateClock(){

    document.getElementById("clock")
        .textContent =
        new Date().toLocaleTimeString("sq-AL");
}

document.getElementById("pin")
    .addEventListener("keydown",e=>{
        if(e.key === "Enter"){
            login();
        }
    });

renderUsers();
updateClock();
setInterval(updateClock,1000);

</script>

</body>
</html>
