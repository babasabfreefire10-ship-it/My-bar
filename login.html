<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY BAR • Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, Helvetica, sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    #10251a 0%,
                    #07100b 38%,
                    #030504 78%
                );
        }

        .login-card {
            width: min(440px, 92vw);

            padding: 32px;

            background:
                linear-gradient(
                    145deg,
                    rgba(13, 24, 17, .98),
                    rgba(5, 9, 7, .98)
                );

            border: 1px solid rgba(98, 220, 148, .25);
            border-radius: 22px;

            box-shadow:
                0 30px 90px rgba(0, 0, 0, .75);
        }

        .logo {
            text-align: center;

            font-size: 35px;
            font-weight: 900;
            letter-spacing: 6px;

            color: #65e59a;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #708277;

            font-size: 12px;
            letter-spacing: 2px;

            margin-bottom: 28px;
        }

        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .role {
            border: 1px solid #294735;
            background: #0b1510;
            color: #a7b8ae;

            border-radius: 11px;

            padding: 14px;

            font-size: 13px;
            font-weight: 900;

            cursor: pointer;

            transition: .2s;
        }

        .role:hover {
            border-color: #62dc94;
        }

        .role.active {
            background: #62dc94;
            color: #061009;
            border-color: #62dc94;
        }

        .panel {
            margin-top: 22px;
        }

        .hidden {
            display: none !important;
        }

        label {
            display: block;

            color: #91a399;

            font-size: 12px;
            font-weight: 700;

            margin: 14px 0 7px;
        }

        input,
        select {
            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid #294735;

            background: #07100b;
            color: #fff;

            outline: none;

            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: #62dc94;
        }

        select option {
            background: #07100b;
            color: #fff;
        }

        .login-button {
            width: 100%;

            margin-top: 20px;

            padding: 15px;

            border: 0;
            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #6bea9e,
                    #38bf73
                );

            color: #041008;

            font-weight: 900;
            letter-spacing: 1px;

            cursor: pointer;
        }

        .login-button:hover {
            filter: brightness(1.08);
        }

        .error {
            min-height: 20px;

            margin-top: 14px;

            text-align: center;

            color: #ff7272;

            font-size: 12px;
        }

        .back {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #60746a;

            font-size: 11px;

            cursor: pointer;
        }

        .back:hover {
            color: #62dc94;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">
        MY BAR
    </div>

    <div class="subtitle">
        HYRJE NË SISTEM
    </div>

    <div class="roles">

        <button
            id="adminRole"
            class="role active"
            type="button">
            ADMIN
        </button>

        <button
            id="waiterRole"
            class="role"
            type="button">
            KAMARIER
        </button>

    </div>

    <!-- ADMIN -->

    <section
        id="adminPanel"
        class="panel">

        <label for="adminPassword">
            Fjalëkalimi i administratorit
        </label>

        <input
            id="adminPassword"
            type="password"
            placeholder="Fjalëkalimi">

        <button
            class="login-button"
            type="button"
            onclick="loginAdmin()">
            HYR SI ADMIN
        </button>

    </section>


    <!-- KAMARIER -->

    <section
        id="waiterPanel"
        class="panel hidden">

        <label for="waiterSelect">
            Zgjidh kamarierin
        </label>

        <select id="waiterSelect">
        </select>

        <label for="waiterPassword">
            Fjalëkalimi
        </label>

        <input
            id="waiterPassword"
            type="password"
            placeholder="Fjalëkalimi">

        <button
            class="login-button"
            type="button"
            onclick="loginWaiter()">
            HYR SI KAMARIER
        </button>

    </section>


    <div
        id="error"
        class="error">
    </div>

    <div
        class="back"
        onclick="location.href='sabi.html'">
        ← Kthehu
    </div>

</div>


<script>

"use strict";

/* =========================
   STORAGE
========================= */

const USERS_KEY = "MYBAR_USERS_FINAL";
const SESSION_KEY = "MY_BAR_SESSION";


/* =========================
   DEFAULT USERS
========================= */

const DEFAULT_USERS = [

    {
        username: "admin",
        password: "1234",
        role: "admin",
        name: "Administrator"
    },

    {
        username: "kamarier1",
        password: "1234",
        role: "waiter",
        name: "Kamarier 1"
    }

];


/* =========================
   STORAGE HELPERS
========================= */

function getUsers() {

    try {

        const data =
            localStorage.getItem(USERS_KEY);

        if (!data) {

            localStorage.setItem(
                USERS_KEY,
                JSON.stringify(DEFAULT_USERS)
            );

            return DEFAULT_USERS;
        }

        const users =
            JSON.parse(data);

        if (!Array.isArray(users)) {
            throw new Error();
        }

        return users;

    } catch {

        localStorage.setItem(
            USERS_KEY,
            JSON.stringify(DEFAULT_USERS)
        );

        return DEFAULT_USERS;
    }
}


function saveSession(user) {

    const session = {

        username: user.username,

        user: user.username,

        name: user.name,

        role: user.role,

        loginAt: Date.now()

    };


    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify(session)
    );


    /* compatibility */

    localStorage.setItem(
        "barCurrentUser",
        JSON.stringify(session)
    );


    location.href = "index.html";
}


/* =========================
   ELEMENTS
========================= */

const adminRole =
    document.getElementById("adminRole");

const waiterRole =
    document.getElementById("waiterRole");

const adminPanel =
    document.getElementById("adminPanel");

const waiterPanel =
    document.getElementById("waiterPanel");

const waiterSelect =
    document.getElementById("waiterSelect");

const errorBox =
    document.getElementById("error");


/* =========================
   ROLE SWITCH
========================= */

function showAdmin() {

    adminRole.classList.add("active");

    waiterRole.classList.remove("active");

    adminPanel.classList.remove("hidden");

    waiterPanel.classList.add("hidden");

    errorBox.textContent = "";

}


function showWaiter() {

    waiterRole.classList.add("active");

    adminRole.classList.remove("active");

    adminPanel.classList.add("hidden");

    waiterPanel.classList.remove("hidden");

    errorBox.textContent = "";

    loadWaiters();

}


adminRole.addEventListener(
    "click",
    showAdmin
);


waiterRole.addEventListener(
    "click",
    showWaiter
);


/* =========================
   LOAD WAITERS
========================= */

function loadWaiters() {

    const users =
        getUsers();

    const waiters =
        users.filter(
            user =>
                user.role === "waiter" ||
                user.role === "kamarier"
        );


    waiterSelect.innerHTML = "";


    if (!waiters.length) {

        const option =
            document.createElement("option");

        option.value = "";

        option.textContent =
            "Nuk ka kamarierë";

        waiterSelect.appendChild(option);

        return;
    }


    waiters.forEach(user => {

        const option =
            document.createElement("option");

        option.value =
            user.username;

        option.textContent =
            user.name ||
            user.username;

        waiterSelect.appendChild(option);

    });

}


/* =========================
   ERROR
========================= */

function showError(message) {

    errorBox.textContent =
        message;

}


/* =========================
   ADMIN LOGIN
========================= */

function loginAdmin() {

    const password =
        document
            .getElementById("adminPassword")
            .value;


    const users =
        getUsers();


    const admin =
        users.find(
            user =>
                user.username === "admin" &&
                user.role === "admin"
        );


    if (!admin) {

        showError(
            "Administratori nuk ekziston."
        );

        return;
    }


    if (
        password !==
        admin.password
    ) {

        showError(
            "Fjalëkalimi i administratorit është gabim."
        );

        return;
    }


    saveSession(admin);
}


/* =========================
   WAITER LOGIN
========================= */

function loginWaiter() {

    const username =
        waiterSelect.value;


    const password =
        document
            .getElementById("waiterPassword")
            .value;


    const users =
        getUsers();


    const waiter =
        users.find(
            user =>
                user.username === username &&
                (
                    user.role === "waiter" ||
                    user.role === "kamarier"
                )
        );


    if (!waiter) {

        showError(
            "Kamarieri nuk ekziston."
        );

        return;
    }


    if (
        password !==
        waiter.password
    ) {

        showError(
            "Fjalëkalimi është gabim."
        );

        return;
    }


    waiter.role = "waiter";


    saveSession(waiter);
}


/* =========================
   INIT
========================= */

getUsers();

loadWaiters();

</script>

</body>
</html>
