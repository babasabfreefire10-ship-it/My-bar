<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirë se vini | Bar Lulishtja</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(34,197,94,.15), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(16,185,129,.10), transparent 30%),
                #070b09;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(34,197,94,.06);
            filter: blur(80px);
            top: -220px;
            left: -180px;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
            animation: appear .7s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 86px;
            height: 86px;
            margin: 0 auto 18px;
            border-radius: 26px;
            background: linear-gradient(145deg, #22c55e, #15803d);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow:
                0 15px 40px rgba(34,197,94,.25),
                inset 0 1px 0 rgba(255,255,255,.2);
        }

        .welcome h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -.7px;
        }

        .welcome h1 span {
            color: #4ade80;
        }

        .welcome p {
            margin-top: 8px;
            color: #94a39a;
            font-size: 14px;
        }

        .card {
            background: rgba(16,23,19,.88);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 24px;
            padding: 26px;
            box-shadow:
                0 25px 70px rgba(0,0,0,.45),
                inset 0 1px 0 rgba(255,255,255,.03);
            backdrop-filter: blur(18px);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            color: #aab7af;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: .75;
        }

        input {
            width: 100%;
            height: 52px;
            border-radius: 14px;
            border: 1px solid #26342c;
            background: #0b110e;
            color: white;
            padding: 0 46px;
            font-size: 15px;
            outline: none;
            transition: .2s;
        }

        input::placeholder {
            color: #647168;
        }

        input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,.10);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #87958d;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
        }

        .login-btn {
            width: 100%;
            height: 54px;
            border: 0;
            border-radius: 15px;
            margin-top: 8px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(34,197,94,.18);
            transition: .2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 15px 32px rgba(34,197,94,.25);
        }

        .login-btn:active {
            transform: scale(.98);
        }

        .error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(239,68,68,.10);
            border: 1px solid rgba(239,68,68,.25);
            color: #fca5a5;
            font-size: 13px;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #536058;
            font-size: 12px;
        }

        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            margin-top: 12px;
            color: #728078;
            font-size: 12px;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(34,197,94,.7);
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .welcome h1 {
                font-size: 27px;
            }

            .logo {
                width: 76px;
                height: 76px;
                font-size: 36px;
                border-radius: 23px;
            }

            .card {
                padding: 22px 18px;
                border-radius: 21px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="welcome">
        <div class="logo">🌿</div>

        <h1>
            Mirë se vini te
            <span id="appName">Bar Lulishtja</span>
        </h1>

        <p>Sistemi i menaxhimit të lokalit</p>
    </div>

    <div class="card">

        <div class="card-title">
            Hyr në llogarinë tënde
        </div>

        <form id="loginForm">

            <div class="field">
                <label for="username">Përdoruesi</label>

                <div class="input-wrap">
                    <span class="input-icon">👤</span>

                    <input
                        id="username"
                        type="text"
                        placeholder="Shkruaj përdoruesin"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <div class="field">
                <label for="password">Fjalëkalimi</label>

                <div class="input-wrap">
                    <span class="input-icon">🔒</span>

                    <input
                        id="password"
                        type="password"
                        placeholder="Shkruaj fjalëkalimin"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Shfaq fjalëkalimin"
                    >
                        👁️
                    </button>
                </div>
            </div>

            <button class="login-btn" type="submit">
                Hyr në sistem
            </button>

            <div class="error" id="error">
                Përdoruesi ose fjalëkalimi nuk është i saktë.
            </div>

        </form>
    </div>

    <div class="status">
        <span class="dot"></span>
        Sistemi është aktiv
    </div>

    <div class="footer">
        © 2026 Bar Lulishtja
    </div>

</div>

<script>
    const USERS_KEY = "barUsersV3";
    const CURRENT_USER_KEY = "barCurrentUser";
    const APP_NAME_KEY = "barAppNameV3";

    const defaultUsers = [
        {
            username: "admin",
            password: "1234",
            role: "admin",
            name: "Administrator"
        },
        {
            username: "kamarier1",
            password: "1234",
            role: "waiter",
            name: "Kamarier 1"
        }
    ];

    function getUsers() {
        try {
            const saved = localStorage.getItem(USERS_KEY);

            if (!saved) {
                localStorage.setItem(
                    USERS_KEY,
                    JSON.stringify(defaultUsers)
                );

                return defaultUsers;
            }

            return JSON.parse(saved);
        } catch (error) {
            return defaultUsers;
        }
    }

    const savedAppName = localStorage.getItem(APP_NAME_KEY);

    if (savedAppName) {
        document.getElementById("appName").textContent = savedAppName;
        document.title = "Mirë se vini | " + savedAppName;
    }

    document
        .getElementById("togglePassword")
        .addEventListener("click", function () {

            const password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
                this.textContent = "🙈";
                this.setAttribute(
                    "aria-label",
                    "Fshih fjalëkalimin"
                );
            } else {
                password.type = "password";
                this.textContent = "👁️";
                this.setAttribute(
                    "aria-label",
                    "Shfaq fjalëkalimin"
                );
            }
        });

    document
        .getElementById("loginForm")
        .addEventListener("submit", function (event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const error =
                document.getElementById("error");

            const users = getUsers();

            const user = users.find(function (u) {
                return (
                    u.username === username &&
                    u.password === password
                );
            });

            if (!user) {
                error.style.display = "block";

                document
                    .getElementById("password")
                    .value = "";

                return;
            }

            error.style.display = "none";

            localStorage.setItem(
                CURRENT_USER_KEY,
                JSON.stringify({
                    username: user.username,
                    role: user.role,
                    name: user.name
                })
            );

            window.location.href = "index.html";
        });

    document
        .getElementById("username")
        .addEventListener("input", function () {
            document.getElementById("error").style.display = "none";
        });

    document
        .getElementById("password")
        .addEventListener("input", function () {
            document.getElementById("error").style.display = "none";
        });
</script>

</body>
</html>
