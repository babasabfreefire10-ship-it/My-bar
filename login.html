<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MY BAR • Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:#f5f7f6;
    color:#17201b;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login{
    width:min(850px,100%);
    background:#fff;
    border:1px solid #e0e5e2;
    border-radius:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.08);
    padding:30px;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo-icon{
    width:58px;
    height:58px;
    background:#111;
    color:#fff;
    border-radius:16px;
    display:grid;
    place-items:center;
    margin:auto;
    font-size:25px;
    font-weight:900;
}

.logo h1{
    margin-top:12px;
    font-size:26px;
    letter-spacing:1px;
}

.logo p{
    color:#737c77;
    margin-top:5px;
}

.users{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

.user{
    border:1px solid #dfe5e1;
    background:#fff;
    border-radius:14px;
    padding:20px;
    text-align:left;
    transition:.15s;
}

.user:hover{
    border-color:#17834e;
    transform:translateY(-2px);
}

.user strong{
    display:block;
    font-size:17px;
}

.user span{
    display:block;
    margin-top:5px;
    color:#76807b;
    font-size:12px;
}

.pin{
    margin-top:20px;
    display:none;
}

.pin.active{
    display:block;
}

.pin input{
    width:100%;
    padding:13px;
    border:1px solid #d8dfdb;
    border-radius:10px;
    outline:none;
    font-size:17px;
    text-align:center;
}

.pin button{
    width:100%;
    margin-top:9px;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#17834e;
    color:#fff;
    font-weight:800;
}

.error{
    color:#b42318;
    text-align:center;
    margin-top:12px;
    font-size:13px;
}
</style>
</head>

<body>

<div class="login">

    <div class="logo">

        <div class="logo-icon">
            M
        </div>

        <h1 id="businessName">
            MY BAR
        </h1>

        <p id="welcome">
            MIRË SE VINI
        </p>

    </div>

    <div
        class="users"
        id="users">
    </div>

    <div
        class="pin"
        id="pinBox">

        <input
            id="pin"
            type="password"
            inputmode="numeric"
            placeholder="PIN / Password"
        >

        <button onclick="login()">
            HYR
        </button>

        <div
            class="error"
            id="error">
        </div>

    </div>

</div>

<script>

const USERS_KEY =
    "MYBAR_USERS_V2";

const SESSION_KEY =
    "MYBAR_SESSION_V2";

const SETTINGS_KEY =
    "MYBAR_SETTINGS_V2";

const DEFAULT_USERS = [

    {
        username:"admin",
        password:"1234",
        role:"admin",
        name:"Administrator"
    },

    {
        username:"sabi",
        password:"1234",
        role:"waiter",
        name:"SABI"
    },

    {
        username:"mondi",
        password:"1234",
        role:"waiter",
        name:"MONDI"
    }
];

let selectedUser = null;

function getJSON(key,fallback){

    try{

        const value =
            localStorage.getItem(key);

        return value
            ? JSON.parse(value)
            : fallback;

    }catch{

        return fallback;
    }
}

function setJSON(key,value){

    localStorage.setItem(
        key,
        JSON.stringify(value)
    );
}

function load(){

    let users =
        getJSON(
            USERS_KEY,
            DEFAULT_USERS
        );

    if(!localStorage.getItem(USERS_KEY)){

        setJSON(
            USERS_KEY,
            DEFAULT_USERS
        );

        users =
            DEFAULT_USERS;
    }

    const settings =
        getJSON(
            SETTINGS_KEY,
            {}
        );

    document.getElementById(
        "businessName"
    ).textContent =
        settings.appName ||
        settings.businessName ||
        "MY BAR";

    document.getElementById(
        "welcome"
    ).textContent =
        settings.welcomeTitle ||
        "MIRË SE VINI";

    const box =
        document.getElementById(
            "users"
        );

    box.innerHTML =
        users.map(
            (user,index) => `

                <button
                    class="user"
                    onclick="selectUser(${index})">

                    <strong>
                        ${escapeHTML(user.name)}
                    </strong>

                    <span>
                        ${
                            user.role === "admin"
                                ? "ADMIN"
                                : "KAMARIER"
                        }
                    </span>

                </button>

            `
        ).join("");
}

function selectUser(index){

    const users =
        getJSON(
            USERS_KEY,
            DEFAULT_USERS
        );

    selectedUser =
        users[index];

    document
        .getElementById("pinBox")
        .classList.add("active");

    document
        .getElementById("pin")
        .value = "";

    document
        .getElementById("pin")
        .focus();

    document
        .getElementById("error")
        .textContent = "";
}

function login(){

    if(!selectedUser) return;

    const pin =
        document
            .getElementById("pin")
            .value;

    if(
        pin !==
        selectedUser.password
    ){

        document
            .getElementById("error")
            .textContent =
            "PIN / Password i gabuar.";

        return;
    }

    setJSON(
        SESSION_KEY,
        {
            username:
                selectedUser.username,

            name:
                selectedUser.name,

            role:
                selectedUser.role
        }
    );

    window.location.href =
        "index.html";
}

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

document.addEventListener(
    "DOMContentLoaded",
    load
);

document
    .getElementById("pin")
    .addEventListener(
        "keydown",
        event => {

            if(event.key === "Enter"){
                login();
            }

        }
    );

</script>

</body>
</html>
