<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY BAR — Login</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at top,#10251a 0%,#050805 42%,#020302 100%);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    padding:20px;
}

.login-box{
    width:430px;
    max-width:100%;
    background:rgba(8,13,9,.96);
    border:1px solid #24452f;
    border-radius:22px;
    padding:30px;
    box-shadow:
        0 25px 70px rgba(0,0,0,.65),
        0 0 35px rgba(56,232,121,.06);
}

.logo{
    text-align:center;
    color:#38e879;
    font-size:32px;
    font-weight:900;
    letter-spacing:6px;
}

.subtitle{
    text-align:center;
    color:#68786e;
    font-size:10px;
    letter-spacing:3px;
    margin-top:8px;
    margin-bottom:30px;
}

.title{
    text-align:center;
    font-size:21px;
    font-weight:800;
    margin-bottom:18px;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.option{
    min-height:125px;
    border:1px solid #203627;
    background:#0c150f;
    color:#fff;
    border-radius:15px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:.2s;
}

.option:hover{
    border-color:#38e879;
    background:#102016;
    transform:translateY(-2px);
}

.option .icon{
    font-size:32px;
}

.option strong{
    font-size:15px;
}

.option small{
    color:#708078;
    font-size:11px;
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

.back{
    width:100%;
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    background:#101712;
    border:1px solid #263a2c;
    color:#9aaa9f;
}

.back:hover{
    color:#fff;
    border-color:#38e879;
}

.input-group{
    margin-bottom:13px;
}

.input-group label{
    display:block;
    color:#7d8b83;
    font-size:12px;
    margin-bottom:6px;
}

.input-group input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #29402f;
    background:#060a07;
    color:#fff;
    outline:none;
}

.input-group input:focus{
    border-color:#38e879;
    box-shadow:0 0 0 2px rgba(56,232,121,.08);
}

.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#32df70;
    color:#031007;
    font-weight:900;
    margin-top:3px;
}

.login-btn:hover{
    background:#42ed82;
}

.user-list{
    display:flex;
    flex-direction:column;
    gap:9px;
    max-height:330px;
    overflow:auto;
}

.waiter{
    width:100%;
    padding:14px;
    background:#0d160f;
    border:1px solid #203527;
    border-radius:11px;
    color:#fff;
    text-align:left;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.waiter:hover{
    border-color:#38e879;
    background:#102016;
}

.waiter-info strong{
    display:block;
    font-size:15px;
}

.waiter-info small{
    display:block;
    color:#718078;
    margin-top:4px;
}

.arrow{
    color:#38e879;
    font-size:20px;
}

.selected-user{
    text-align:center;
    margin-bottom:18px;
}

.selected-user .icon{
    font-size:36px;
    margin-bottom:8px;
}

.selected-user strong{
    display:block;
    font-size:19px;
}

.selected-user small{
    color:#718078;
    display:block;
    margin-top:4px;
}

.error{
    display:none;
    background:#2a1010;
    border:1px solid #693333;
    color:#ff8b8b;
    padding:10px;
    border-radius:9px;
    margin-bottom:12px;
    text-align:center;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#718078;
    padding:20px 10px;
    border:1px dashed #24382a;
    border-radius:10px;
}

.footer{
    text-align:center;
    color:#435149;
    font-size:10px;
    margin-top:25px;
    letter-spacing:1px;
}

@media(max-width:500px){
    .login-box{
        padding:22px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .option{
        min-height:105px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">MY BAR</div>

    <div class="subtitle">
        MANAGEMENT SYSTEM
    </div>

    <!-- ROLE -->
    <div id="roleScreen" class="screen active">

        <div class="title">
            Zgjidh përdoruesin
        </div>

        <div class="options">

            <button
                class="option"
                onclick="openAdminLogin()">

                <div class="icon">⚙️</div>

                <strong>ADMIN</strong>

                <small>
                    Administratori
                </small>

            </button>

            <button
                class="option"
                onclick="openWaiterList()">

                <div class="icon">👤</div>

                <strong>KAMARIER</strong>

                <small>
                    Hyr si kamarier
                </small>

            </button>

        </div>

    </div>

    <!-- ADMIN LOGIN -->
    <div id="adminScreen" class="screen">

        <div class="title">
            Hyr si Administrator
        </div>

        <div id="adminError" class="error"></div>

        <div class="input-group">

            <label>
                Password
            </label>

            <input
                id="adminPassword"
                type="password"
                placeholder="Shkruaj password-in"
                autocomplete="current-password"
                onkeydown="handleEnter(event,'admin')">

        </div>

        <button
            class="login-btn"
            onclick="loginAdmin()">

            HYR NË SISTEM

        </button>

        <button
            class="back"
            onclick="backToRoles()">

            ← Kthehu

        </button>

    </div>

    <!-- WAITER LIST -->
    <div id="waiterListScreen" class="screen">

        <div class="title">
            Zgjidh Kamarierin
        </div>

        <div id="waiterList"
             class="user-list">
        </div>

        <button
            class="back"
            onclick="backToRoles()">

            ← Kthehu

        </button>

    </div>

    <!-- WAITER PASSWORD -->
    <div id="waiterPasswordScreen" class="screen">

        <div class="selected-user">

            <div class="icon">
                👤
            </div>

            <strong id="selectedWaiterName">
                Kamarier
            </strong>

            <small id="selectedWaiterUsername">
                -
            </small>

        </div>

        <div id="waiterError" class="error"></div>

        <div class="input-group">

            <label>
                Password
            </label>

            <input
                id="waiterPassword"
                type="password"
                placeholder="Shkruaj password-in"
                autocomplete="current-password"
                onkeydown="handleEnter(event,'waiter')">

        </div>

        <button
            class="login-btn"
            onclick="loginWaiter()">

            HYR NË SISTEM

        </button>

        <button
            class="back"
            onclick="openWaiterList()">

            ← Kthehu te kamarierët

        </button>

    </div>

    <div class="footer">
        MY BAR • PREMIUM MANAGEMENT SYSTEM
    </div>

</div>

<script>

/* =========================================================
   SAME USER DATABASE AS INDEX.HTML
========================================================= */

const USERS_KEY = "MYBAR_USERS_FINAL";

const SESSION_KEY = "MY_BAR_SESSION";

const OLD_SESSION_KEY = "barCurrentUser";

/* =========================================================
   DEFAULT USERS
========================================================= */

const DEFAULT_USERS = [
    {
        username:"admin",
        password:"1234",
        role:"admin",
        name:"Administrator"
    },
    {
        username:"kamarier",
        password:"1234",
        role:"waiter",
        name:"Kamarier"
    }
];

/* =========================================================
   STORAGE
========================================================= */

function getUsers(){

    try{

        const saved =
            localStorage.getItem(USERS_KEY);

        if(!saved){

            localStorage.setItem(
                USERS_KEY,
                JSON.stringify(DEFAULT_USERS)
            );

            return JSON.parse(
                JSON.stringify(DEFAULT_USERS)
            );
        }

        const users =
            JSON.parse(saved);

        if(!Array.isArray(users) || !users.length){

            localStorage.setItem(
                USERS_KEY,
                JSON.stringify(DEFAULT_USERS)
            );

            return JSON.parse(
                JSON.stringify(DEFAULT_USERS)
            );
        }

        return users;

    }catch(error){

        localStorage.setItem(
            USERS_KEY,
            JSON.stringify(DEFAULT_USERS)
        );

        return JSON.parse(
            JSON.stringify(DEFAULT_USERS)
        );
    }
}

function setUsers(users){

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );
}

/* =========================================================
   SCREENS
========================================================= */

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(screen=>{
            screen.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");

    clearErrors();
}

function clearErrors(){

    document
        .querySelectorAll(".error")
        .forEach(error=>{
            error.style.display="none";
            error.textContent="";
        });
}

/* =========================================================
   ROLE
========================================================= */

function openAdminLogin(){

    showScreen("adminScreen");

    setTimeout(()=>{
        document
            .getElementById("adminPassword")
            .focus();
    },100);
}

function openWaiterList(){

    renderWaiters();

    showScreen(
        "waiterListScreen"
    );
}

function backToRoles(){

    showScreen("roleScreen");
}

/* =========================================================
   ADMIN LOGIN
========================================================= */

function loginAdmin(){

    const password =
        document
        .getElementById("adminPassword")
        .value;

    const users =
        getUsers();

    const admin =
        users.find(user =>
            String(user.username)
            .toLowerCase()==="admin"
            &&
            String(user.role)
            .toLowerCase()==="admin"
        );

    if(!admin){

        showError(
            "adminError",
            "Administratori nuk ekziston."
        );

        return;
    }

    if(
        String(password)!==
        String(admin.password)
    ){

        showError(
            "adminError",
            "Password-i është i gabuar."
        );

        document
            .getElementById("adminPassword")
            .select();

        return;
    }

    createSession(admin);

}

/* =========================================================
   WAITER LIST
========================================================= */

function renderWaiters(){

    const box =
        document.getElementById(
            "waiterList"
        );

    const users =
        getUsers();

    const waiters =
        users.filter(user =>
            String(user.role)
            .toLowerCase()==="waiter"
            ||
            String(user.role)
            .toLowerCase()==="kamarier"
        );

    if(!waiters.length){

        box.innerHTML = `
            <div class="empty">
                Nuk ka kamarierë të regjistruar.
            </div>
        `;

        return;
    }

    box.innerHTML =
        waiters.map((user,index)=>{

            return `
                <button
                    class="waiter"
                    onclick="selectWaiter(${index})">

                    <div class="waiter-info">

                        <strong>
                            ${escapeHTML(
                                user.name ||
                                "Kamarier"
                            )}
                        </strong>

                        <small>
                            @${escapeHTML(
                                user.username
                            )}
                        </small>

                    </div>

                    <div class="arrow">
                        →
                    </div>

                </button>
            `;

        }).join("");

    window.loginWaiters = waiters;
}

/* =========================================================
   SELECT WAITER
========================================================= */

function selectWaiter(index){

    const users =
        getUsers();

    const waiters =
        users.filter(user =>
            String(user.role)
            .toLowerCase()==="waiter"
            ||
            String(user.role)
            .toLowerCase()==="kamarier"
        );

    const waiter =
        waiters[index];

    if(!waiter)
        return;

    window.selectedWaiter =
        waiter;

    document
        .getElementById(
            "selectedWaiterName"
        )
        .textContent =
            waiter.name ||
            "Kamarier";

    document
        .getElementById(
            "selectedWaiterUsername"
        )
        .textContent =
            "@"+waiter.username;

    document
        .getElementById(
            "waiterPassword"
        )
        .value="";

    showScreen(
        "waiterPasswordScreen"
    );

    setTimeout(()=>{
        document
            .getElementById(
                "waiterPassword"
            )
            .focus();
    },100);
}

/* =========================================================
   WAITER LOGIN
========================================================= */

function loginWaiter(){

    const waiter =
        window.selectedWaiter;

    if(!waiter){

        openWaiterList();

        return;
    }

    const password =
        document
        .getElementById(
            "waiterPassword"
        )
        .value;

    const users =
        getUsers();

    const current =
        users.find(user =>
            String(user.username)
            .toLowerCase() ===
            String(waiter.username)
            .toLowerCase()
        );

    if(!current){

        showError(
            "waiterError",
            "Ky kamarier nuk ekziston më."
        );

        return;
    }

    if(
        String(password)!==
        String(current.password)
    ){

        showError(
            "waiterError",
            "Password-i është i gabuar."
        );

        document
            .getElementById(
                "waiterPassword"
            )
            .select();

        return;
    }

    createSession(current);
}

/* =========================================================
   CREATE SESSION
========================================================= */

function createSession(user){

    const session = {

        username:
            user.username,

        user:
            user.username,

        role:
            user.role,

        name:
            user.name,

        loginAt:
            new Date().toISOString()

    };

    /*
       Ruajmë të dyja formatet
       që index.html aktual
       dhe versionet e vjetra
       të funksionojnë.
    */

    localStorage.setItem(
        SESSION_KEY,
        JSON.stringify(session)
    );

    localStorage.setItem(
        OLD_SESSION_KEY,
        JSON.stringify(session)
    );

    window.location.href =
        "index.html";
}

/* =========================================================
   ENTER KEY
========================================================= */

function handleEnter(event,type){

    if(event.key!=="Enter")
        return;

    if(type==="admin")
        loginAdmin();

    if(type==="waiter")
        loginWaiter();
}

/* =========================================================
   ERROR
========================================================= */

function showError(id,message){

    const box =
        document.getElementById(id);

    box.textContent =
        message;

    box.style.display =
        "block";
}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value??"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

/* =========================================================
   START
========================================================= */

getUsers();

</script>

</body>
</html>
