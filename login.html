<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>LOGIN • MY BAR</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:650px;
    height:650px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(201,165,92,.13),
        transparent 68%
    );
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
}

.frame{
    position:fixed;
    inset:12px;
    border:1px solid rgba(201,165,92,.35);
    border-radius:20px;
    pointer-events:none;
}

.login-box{
    width:min(92%,420px);
    padding:38px;
    border:1px solid rgba(201,165,92,.35);
    border-radius:22px;
    background:rgba(12,12,12,.9);
    box-shadow:
        0 30px 100px rgba(0,0,0,.75),
        inset 0 0 35px rgba(201,165,92,.025);
    position:relative;
    z-index:2;
}

.logo{
    width:52px;
    height:52px;
    border-radius:50%;
    border:1px solid #c9a55c;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#d8b76d;
    font-size:22px;
    font-weight:700;
    margin:0 auto 22px;
    box-shadow:0 0 22px rgba(201,165,92,.18);
}

h1{
    text-align:center;
    font-size:27px;
    font-weight:400;
    letter-spacing:3px;
}

h1 span{
    color:#c9a55c;
}

.subtitle{
    text-align:center;
    color:#666;
    font-size:11px;
    margin-top:8px;
    letter-spacing:1.5px;
}

.selected-user{
    margin-top:28px;
    padding:14px;
    border:1px solid rgba(201,165,92,.2);
    border-radius:12px;
    text-align:center;
    background:#090909;
}

.selected-user small{
    display:block;
    color:#555;
    font-size:8px;
    letter-spacing:2px;
    margin-bottom:5px;
}

.selected-user strong{
    color:#d8b76d;
    letter-spacing:2px;
    font-size:13px;
}

.field{
    margin-top:18px;
}

label{
    display:block;
    color:#777;
    font-size:9px;
    letter-spacing:2px;
    margin-bottom:8px;
}

input{
    width:100%;
    border:1px solid #292929;
    background:#070707;
    color:#fff;
    border-radius:12px;
    padding:15px;
    outline:none;
    font-size:14px;
}

input:focus{
    border-color:#c9a55c;
    box-shadow:0 0 15px rgba(201,165,92,.08);
}

.login-btn{
    width:100%;
    margin-top:23px;
    border:0;
    border-radius:12px;
    padding:16px;
    background:#c9a55c;
    color:#070707;
    font-weight:800;
    letter-spacing:2px;
    cursor:pointer;
    transition:.2s;
}

.login-btn:hover{
    background:#e1c47d;
    transform:translateY(-1px);
}

.back-btn{
    width:100%;
    margin-top:10px;
    border:1px solid #292929;
    border-radius:12px;
    padding:14px;
    background:#0a0a0a;
    color:#888;
    cursor:pointer;
}

.back-btn:hover{
    color:#fff;
    border-color:#555;
}

.error{
    display:none;
    margin-top:14px;
    padding:11px;
    border-radius:10px;
    background:rgba(180,50,50,.08);
    border:1px solid rgba(180,50,50,.35);
    color:#e18b8b;
    text-align:center;
    font-size:11px;
}

.error.show{
    display:block;
}

footer{
    position:fixed;
    bottom:22px;
    left:0;
    width:100%;
    text-align:center;
    color:#444;
    font-size:7px;
    letter-spacing:3px;
}

@media(max-width:500px){

    .login-box{
        padding:28px 22px;
    }

    h1{
        font-size:23px;
    }
}
</style>
</head>

<body>

<div class="frame"></div>

<div class="login-box">

    <div class="logo">S</div>

    <h1>
        MY <span>BAR</span>
    </h1>

    <div class="subtitle">
        SECURE LOGIN
    </div>

    <div class="selected-user">

        <small>USER</small>

        <strong id="selectedUser">
            ADMIN
        </strong>

    </div>

    <div class="field">

        <label>USERNAME</label>

        <input
            id="username"
            type="text"
            autocomplete="username"
            placeholder="Username"
        >

    </div>

    <div class="field">

        <label>FJALËKALIMI</label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Fjalëkalimi"
            onkeydown="if(event.key==='Enter') login()"
        >

    </div>

    <button
        class="login-btn"
        onclick="login()"
    >
        HYR
    </button>

    <button
        class="back-btn"
        onclick="goBack()"
    >
        ← KTHEHU
    </button>

    <div
        class="error"
        id="error"
    >
        Username ose fjalëkalim i gabuar.
    </div>

</div>

<footer>
    MY BAR • CREATED BY SABI
</footer>


<script>

/* =========================
   STORAGE
========================= */

const USERS_KEY = "MYBAR_USERS_V2";
const SESSION_KEY = "MYBAR_SESSION_V2";
const SELECTED_USER_KEY = "MYBAR_SELECTED_USER";


/* =========================
   DEFAULT USERS
========================= */

const DEFAULT_USERS = [

    {
        username:"admin",
        password:"1234",
        role:"admin",
        name:"ADMIN"
    },

    {
        username:"sabi",
        password:"1234",
        role:"waiter",
        name:"SABI"
    },

    {
        username:"mondi",
        password:"1234",
        role:"waiter",
        name:"MONDI"
    }

];


/* =========================
   JSON HELPERS
========================= */

function getJSON(key,fallback){

    try{

        const value =
            localStorage.getItem(key);

        return value
            ? JSON.parse(value)
            : fallback;

    }catch{

        return fallback;

    }

}

function setJSON(key,value){

    localStorage.setItem(
        key,
        JSON.stringify(value)
    );

}


/* =========================
   INITIALIZE USERS
========================= */

function initializeUsers(){

    if(!localStorage.getItem(USERS_KEY)){

        setJSON(
            USERS_KEY,
            DEFAULT_USERS
        );

    }

}


/* =========================
   SELECTED USER
========================= */

function loadSelectedUser(){

    const selected =
        localStorage.getItem(
            SELECTED_USER_KEY
        );

    const users =
        getJSON(
            USERS_KEY,
            DEFAULT_USERS
        );

    let user =
        users.find(
            u =>
                u.username.toLowerCase()
                ===
                String(selected || "").toLowerCase()
        );

    if(!user){

        user = users[0];

    }

    document
        .getElementById("selectedUser")
        .textContent =
        user.name.toUpperCase();

    document
        .getElementById("username")
        .value =
        user.username;

}


/* =========================
   LOGIN
========================= */

function login(){

    const username =
        document
        .getElementById("username")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("password")
        .value;

    const error =
        document
        .getElementById("error");

    const users =
        getJSON(
            USERS_KEY,
            DEFAULT_USERS
        );

    const user =
        users.find(
            u =>
                u.username.toLowerCase()
                === username
                &&
                u.password === password
        );

    if(!user){

        error.classList.add("show");

        return;

    }

    error.classList.remove("show");

    const session = {

        username:user.username,

        name:user.name,

        role:user.role,

        loginTime:Date.now()

    };

    setJSON(
        SESSION_KEY,
        session
    );

    localStorage.setItem(
        "MYBAR_CURRENT_USER",
        user.username
    );

    /*
       Pas login:
       admin -> app.html
       waiter -> app.html
    */

    window.location.href = "app.html";

}


/* =========================
   BACK
========================= */

function goBack(){

    window.location.href =
        "index.html";

}


/* =========================
   START
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        initializeUsers();

        loadSelectedUser();

        document
            .getElementById("password")
            .focus();

    }
);

</script>

</body>
</html>
