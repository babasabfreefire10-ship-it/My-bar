<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Lulishtja - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 30px;
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #aaa;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            background: #111;
            color: white;
            border: 1px solid #333;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: white;
            color: black;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            display: none;
            color: #ff5555;
            text-align: center;
            margin-top: 15px;
        }

        .info {
            margin-top: 25px;
            padding: 12px;
            background: #151515;
            border-radius: 10px;
            color: #777;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">🍸</div>

    <h1>Bar Lulishtja</h1>

    <p class="subtitle">
        Sistemi i menaxhimit
    </p>

    <form id="loginForm">

        <label>Username</label>

        <input
            type="text"
            id="username"
            placeholder="Username"
            autocomplete="username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            🔐 Hyr në sistem
        </button>

        <p id="error" class="error">
            Username ose password i gabuar!
        </p>

    </form>

    <div class="info">
        Bar Lulishtja • Menaxhimi i Barit
    </div>

</div>

<script>

const defaultUsers = [
    {
        id: "admin",
        username: "admin",
        password: "1234",
        role: "admin",
        name: "Administrator"
    },
    {
        id: "waiter1",
        username: "kamarier1",
        password: "1234",
        role: "waiter",
        name: "Kamarier 1"
    }
];

function getUsers() {

    const saved = localStorage.getItem("barUsers");

    if (!saved) {
        localStorage.setItem(
            "barUsers",
            JSON.stringify(defaultUsers)
        );

        return defaultUsers;
    }

    return JSON.parse(saved);
}

document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        const users = getUsers();

        const user = users.find(
            u =>
                u.username === username &&
                u.password === password
        );

        if (!user) {

            document.getElementById("error").style.display =
                "block";

            return;
        }

        localStorage.setItem(
            "barCurrentUser",
            JSON.stringify({
                id: user.id,
                username: user.username,
                role: user.role,
                name: user.name
            })
        );

        window.location.href = "index.html";
    });

</script>

</body>
</html>
