<!DOCTYPE html>
<html lang="sq">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bar Lulishtja - Hyrje</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    #303030,
                    #080808 65%
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .container {

            width: 100%;

            max-width: 400px;
        }


        .logo {

            text-align: center;

            font-size: 60px;

            margin-bottom: 8px;
        }


        .title {

            text-align: center;

            margin-bottom: 25px;
        }


        .title h1 {

            font-size: 28px;
        }


        .title p {

            color: #888;

            margin-top: 7px;

            font-size: 14px;
        }


        .login-box {

            background: #191919;

            border: 1px solid #333;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.5);
        }


        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            color: #aaa;

            font-size: 13px;

            margin-bottom: 7px;
        }


        input {

            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid #333;

            background: #101010;

            color: white;

            outline: none;

            font-size: 16px;
        }


        input:focus {

            border-color: #777;
        }


        .login-btn {

            width: 100%;

            border: none;

            border-radius: 10px;

            padding: 14px;

            background: white;

            color: black;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .login-btn:hover {

            background: #ddd;
        }


        .error {

            display: none;

            background: #3b1d1d;

            border: 1px solid #633;

            color: #ffb2b2;

            padding: 11px;

            border-radius: 9px;

            margin-top: 15px;

            text-align: center;

            font-size: 13px;
        }


        .footer {

            text-align: center;

            color: #666;

            font-size: 11px;

            margin-top: 20px;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        🍸
    </div>


    <div class="title">

        <h1 id="loginAppName">
            Bar Lulishtja
        </h1>

        <p>
            Sistemi i menaxhimit
        </p>

    </div>


    <div class="login-box">

        <form id="loginForm">


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn">
                🔐 Hyr në sistem
            </button>


            <div
                id="error"
                class="error">
                Username ose password i gabuar.
            </div>


        </form>

    </div>


    <div class="footer">

        Management System

    </div>


</div>


<script>


/* =====================================================
   DEFAULT USERS
===================================================== */

const defaultUsers = [

    {
        id: "admin",

        username: "admin",

        password: "1234",

        role: "admin",

        name: "Administrator"
    },


    {
        id: "waiter1",

        username: "kamarier1",

        password: "1234",

        role: "waiter",

        name: "Kamarier 1"
    }

];


/* =====================================================
   USERS
===================================================== */

function getUsers() {

    const saved =
        localStorage.getItem(
            "barUsersV3"
        );


    if (!saved) {

        localStorage.setItem(

            "barUsersV3",

            JSON.stringify(
                defaultUsers
            )

        );


        return JSON.parse(
            JSON.stringify(
                defaultUsers
            )
        );
    }


    return JSON.parse(
        saved
    );
}


/* =====================================================
   APP NAME
===================================================== */

function getAppName() {

    return (
        localStorage.getItem(
            "barAppNameV3"
        )
        ||
        "Bar Lulishtja"
    );
}


document.getElementById(
    "loginAppName"
).textContent =
    getAppName();


/* =====================================================
   LOGIN
===================================================== */

document
    .getElementById(
        "loginForm"
    )
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const username =
                document.getElementById(
                    "username"
                )
                .value
                .trim();


            const password =
                document.getElementById(
                    "password"
                )
                .value;


            const users =
                getUsers();


            const user =
                users.find(
                    item =>

                        item.username ===
                        username

                        &&

                        item.password ===
                        password
                );


            if (!user) {

                document.getElementById(
                    "error"
                ).style.display =
                    "block";

                return;
            }


            localStorage.setItem(

                "barCurrentUser",

                JSON.stringify({

                    id:
                        user.id,

                    username:
                        user.username,

                    role:
                        user.role,

                    name:
                        user.name

                })

            );


            window.location.href =
                "index.html";

        }
    );

</script>


</body>

</html>
