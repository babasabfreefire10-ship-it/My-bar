<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>MY BAR — Hyrje</title>

    <style>
        :root {
            --bg: #050806;
            --panel: #0c130f;
            --panel2: #101913;
            --green: #20e879;
            --green-soft: rgba(32, 232, 121, .10);
            --green-border: rgba(32, 232, 121, .28);
            --text: #f4f7f5;
            --muted: #87938c;
            --danger: #ff5368;
            --border: rgba(255,255,255,.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(32,232,121,.09),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    rgba(32,232,121,.04),
                    transparent 30%
                ),
                #050806;
        }

        .login-box {
            width: min(420px, 100%);

            padding: 34px 30px 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(16,25,19,.98),
                    rgba(8,14,10,.98)
                );

            border: 1px solid var(--border);

            border-radius: 22px;

            box-shadow:
                0 30px 80px rgba(0,0,0,.48);
        }

        .logo {
            width: 58px;
            height: 58px;

            display: grid;
            place-items: center;

            margin: 0 auto 18px;

            border-radius: 16px;

            color: var(--green);

            font-size: 22px;
            font-weight: 950;

            background:
                linear-gradient(
                    145deg,
                    #12251a,
                    #09120d
                );

            border: 1px solid var(--green-border);

            box-shadow:
                inset 0 0 25px rgba(32,232,121,.04);
        }

        .brand {
            text-align: center;
        }

        .brand h1 {
            color: var(--text);

            font-size: 26px;
            font-weight: 950;

            letter-spacing: 1px;
        }

        .brand h1 span {
            color: var(--green);
        }

        .brand p {
            margin-top: 5px;

            color: var(--muted);

            font-size: 12px;
        }

        .divider {
            width: 45px;
            height: 2px;

            margin: 22px auto;

            border-radius: 10px;

            background: var(--green);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #b9c4bd;

            font-size: 12px;
            font-weight: 800;
        }

        input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            outline: none;

            color: var(--text);

            background: #080e0a;

            border: 1px solid var(--border);

            border-radius: 11px;

            font-size: 14px;

            transition:
                border-color .18s ease,
                box-shadow .18s ease,
                background .18s ease;
        }

        input::placeholder {
            color: #5f6a63;
        }

        input:focus {
            background: #09110c;

            border-color: var(--green-border);

            box-shadow:
                0 0 0 3px rgba(32,232,121,.05);
        }

        .login-button {
            width: 100%;
            height: 49px;

            margin-top: 6px;

            border: 0;
            border-radius: 11px;

            cursor: pointer;

            color: #041009;

            background: var(--green);

            font-size: 14px;
            font-weight: 950;

            transition:
                transform .18s ease,
                background .18s ease,
                box-shadow .18s ease;
        }

        .login-button:hover {
            background: #3af18a;

            box-shadow:
                0 10px 28px rgba(32,232,121,.12);
        }

        .login-button:active {
            transform: scale(.98);
        }

        .error {
            min-height: 18px;

            margin-top: 12px;

            color: var(--danger);

            text-align: center;

            font-size: 12px;
            font-weight: 700;
        }

        .footer {
            margin-top: 23px;

            color: #59645d;

            text-align: center;

            font-size: 10px;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .login-box {
                padding: 28px 20px 24px;

                border-radius: 18px;
            }

            .logo {
                width: 54px;
                height: 54px;
            }

            .brand h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="login-box">

        <div class="logo">S</div>

        <div class="brand">
            <h1>MY <span>BAR</span></h1>
            <p>SISTEMI I MENAXHIMIT</p>
        </div>

        <div class="divider"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Përdoruesi</label>

                <input
                    id="username"
                    type="text"
                    placeholder="Shkruaj përdoruesin"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Fjalëkalimi</label>

                <input
                    id="password"
                    type="password"
                    placeholder="Shkruaj fjalëkalimin"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-button"
            >
                HYR NË SISTEM →
            </button>

            <div
                id="error"
                class="error"
            ></div>

        </form>

        <div class="footer">
            MY BAR • SYSTEM PREMIUM
        </div>

    </main>


    <script>
        const USERS_KEY = "barUsersV4";
        const CURRENT_USER_KEY = "barCurrentUserV4";
        const APP_NAME_KEY = "barAppNameV4";

        const defaultUsers = [
            {
                id: "admin",
                username: "admin",
                password: "1234",
                role: "admin",
                name: "Administrator"
            },
            {
                id: "kamarier1",
                username: "kamarier1",
                password: "1234",
                role: "waiter",
                name: "Kamarier 1"
            }
        ];

        function getUsers() {
            try {
                const saved = localStorage.getItem(USERS_KEY);

                if (!saved) {
                    localStorage.setItem(
                        USERS_KEY,
                        JSON.stringify(defaultUsers)
                    );

                    return defaultUsers;
                }

                const users = JSON.parse(saved);

                if (!Array.isArray(users) || users.length === 0) {
                    localStorage.setItem(
                        USERS_KEY,
                        JSON.stringify(defaultUsers)
                    );

                    return defaultUsers;
                }

                return users;

            } catch (error) {
                return defaultUsers;
            }
        }


        // Nëse përdoruesi është tashmë i loguar
        const currentUser =
            localStorage.getItem(CURRENT_USER_KEY);

        if (currentUser) {
            window.location.replace("index.html");
        }


        // Emri i aplikacionit
        try {
            const savedAppName =
                localStorage.getItem(APP_NAME_KEY);

            if (savedAppName) {
                document.title =
                    savedAppName + " — Hyrje";
            }
        } catch (error) {
            // Mos blloko login-in
        }


        const form =
            document.getElementById("loginForm");

        const usernameInput =
            document.getElementById("username");

        const passwordInput =
            document.getElementById("password");

        const errorBox =
            document.getElementById("error");


        form.addEventListener("submit", function(event) {

            event.preventDefault();

            errorBox.textContent = "";

            const username =
                usernameInput.value.trim();

            const password =
                passwordInput.value;

            if (!username || !password) {
                errorBox.textContent =
                    "Plotëso përdoruesin dhe fjalëkalimin.";

                return;
            }

            const users = getUsers();

            const user = users.find(function(item) {

                return (
                    String(item.username).toLowerCase() ===
                    username.toLowerCase()
                    &&
                    String(item.password) === password
                );

            });


            if (!user) {

                errorBox.textContent =
                    "Përdoruesi ose fjalëkalimi është gabim.";

                passwordInput.value = "";
                passwordInput.focus();

                return;
            }


            const sessionUser = {
                id: user.id,
                username: user.username,
                role: user.role,
                name: user.name
            };


            localStorage.setItem(
                CURRENT_USER_KEY,
                JSON.stringify(sessionUser)
            );


            window.location.replace("index.html");
        });


        usernameInput.focus();
    </script>

</body>
</html>
