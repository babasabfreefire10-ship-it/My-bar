<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MY BAR</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#071015;
    --panel:#0d171d;
    --panel2:#101d24;
    --line:#1d3039;
    --gold:#d6b45a;
    --gold2:#f1d88b;
    --blue:#4c8fa8;
    --text:#f4f5f5;
    --muted:#8e9ba2;
    --danger:#c75c5c;
    --success:#4da67b;
}

html,body{
    min-height:100%;
    background:
        radial-gradient(circle at 75% 0%,rgba(76,143,168,.10),transparent 28%),
        radial-gradient(circle at 15% 100%,rgba(214,180,90,.06),transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    min-height:100vh;
    display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:245px;
    min-height:100vh;
    background:
        linear-gradient(180deg,#0b1419,#071015);
    border-right:1px solid var(--line);
    padding:22px 15px;
    display:flex;
    flex-direction:column;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 9px 25px;
    border-bottom:1px solid var(--line);
}

.logo{
    width:42px;
    height:42px;
    border-radius:12px;
    border:1px solid rgba(214,180,90,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold2);
    font-size:20px;
    font-weight:800;
    background:#0c171d;
}

.brand strong{
    display:block;
    font-size:15px;
    letter-spacing:2px;
}

.brand small{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
    letter-spacing:1px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:5px;
    margin-top:22px;
}

.nav button{
    border:1px solid transparent;
    background:transparent;
    color:#aeb8bc;
    text-align:left;
    padding:12px 13px;
    border-radius:10px;
    transition:.2s;
}

.nav button:hover,
.nav button.active{
    color:var(--gold2);
    background:rgba(214,180,90,.07);
    border-color:rgba(214,180,90,.18);
}

.nav .admin-only{
    color:#d6b45a;
}

.sidebar-bottom{
    margin-top:auto;
}

.lock{
    width:100%;
    border:1px solid #263b44;
    background:#0b171d;
    color:#aeb8bc;
    padding:11px;
    border-radius:10px;
}

.lock:hover{
    border-color:var(--gold);
    color:var(--gold2);
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:245px;
    width:calc(100% - 245px);
    min-height:100vh;
    padding:20px 22px 35px;
}

/* =========================
   TOPBAR
========================= */

.topbar{
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    border-bottom:1px solid var(--line);
    margin-bottom:20px;
}

.top-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.page-title{
    font-size:21px;
    letter-spacing:1px;
}

.page-subtitle{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.top-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.clock-box{
    text-align:right;
    padding-right:12px;
    border-right:1px solid var(--line);
}

.clock{
    color:var(--gold2);
    font-size:16px;
    font-weight:700;
}

.date{
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
}

.user-pill{
    border:1px solid var(--line);
    background:#0c171d;
    border-radius:10px;
    padding:9px 12px;
    font-size:12px;
}

/* =========================
   DASHBOARD CARDS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat{
    background:
        linear-gradient(145deg,#101c23,#0a1419);
    border:1px solid var(--line);
    border-radius:14px;
    padding:17px;
}

.stat-label{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.stat-value{
    margin-top:8px;
    color:var(--gold2);
    font-size:23px;
    font-weight:700;
}

/* =========================
   PANELS
========================= */

.page{
    display:none;
}

.page.active{
    display:block;
}

.panel{
    background:
        linear-gradient(145deg,#0e1a20,#0a1419);
    border:1px solid var(--line);
    border-radius:15px;
    overflow:hidden;
}

.panel-head{
    padding:15px 17px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.panel-head h2{
    font-size:14px;
    letter-spacing:1px;
}

.panel-head span{
    color:var(--muted);
    font-size:11px;
}

.panel-body{
    padding:16px;
}

/* =========================
   TABLES
========================= */

.tables-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(135px,1fr));
    gap:10px;
}

.table{
    min-height:86px;
    border:1px solid #23353e;
    border-radius:12px;
    background:#0b171d;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    padding:13px;
    transition:.2s;
}

.table:hover{
    border-color:var(--gold);
    transform:translateY(-1px);
}

.table strong{
    font-size:13px;
}

.table span{
    color:var(--muted);
    font-size:11px;
    margin-top:7px;
}

.table.active{
    border-color:rgba(76,143,168,.65);
    background:rgba(76,143,168,.08);
}

.table.selected{
    border-color:var(--gold);
    box-shadow:0 0 0 1px rgba(214,180,90,.15);
}

/* =========================
   POS
========================= */

.pos{
    display:grid;
    grid-template-columns:minmax(0,1fr) 360px;
    gap:15px;
}

.categories{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding-bottom:12px;
}

.categories button{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:#0b171d;
    color:#9da9ae;
    border-radius:9px;
    padding:9px 12px;
    font-size:11px;
}

.categories button:hover,
.categories button.active{
    color:#071015;
    background:var(--gold);
    border-color:var(--gold);
}

.search{
    width:100%;
    background
