<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY BAR</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    background:#030504;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 50% 50%,rgba(24,120,70,.13),transparent 45%),
        linear-gradient(135deg,#020302,#07100b,#020302);
    z-index:-2;
}

.led{
    position:fixed;
    background:linear-gradient(90deg,transparent,#19d77a,#fff,#19d77a,transparent);
    box-shadow:0 0 18px #19d77a,0 0 45px rgba(25,215,122,.35);
    animation:led 4s linear infinite;
}

.top,.bottom{
    left:8%;
    width:84%;
    height:2px;
}

.top{top:7%}
.bottom{bottom:7%}

.left,.right{
    top:15%;
    width:2px;
    height:70%;
    background:linear-gradient(180deg,transparent,#19d77a,#fff,#19d77a,transparent);
}

.left{left:5%}
.right{right:5%}

@keyframes led{
    0%,100%{opacity:.45}
    50%{opacity:1}
}

.panel{
    width:min(650px,90%);
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    padding:55px 35px;
    border:1px solid #193f2c;
    background:rgba(4,10,7,.88);
    box-shadow:0 0 80px rgba(0,255,120,.08);
}

.badge{
    display:inline-block;
    border:1px solid #236c48;
    color:#39e98c;
    padding:7px 14px;
    font-size:11px;
    letter-spacing:3px;
    margin-bottom:28px;
}

.logo{
    font-size:64px;
    font-weight:900;
    letter-spacing:8px;
}

.welcome{
    margin-top:12px;
    font-size:20px;
    letter-spacing:8px;
    color:#b7c5be;
}

.line{
    width:90px;
    height:1px;
    background:#25d77b;
    margin:30px auto;
    box-shadow:0 0 12px #25d77b;
}

.description{
    font-size:12px;
    color:#718078;
    letter-spacing:3px;
    margin-bottom:35px;
}

.enter{
    border:1px solid #25d77b;
    background:#0b2417;
    color:white;
    padding:16px 38px;
    font-size:13px;
    letter-spacing:3px;
    cursor:pointer;
    transition:.2s;
}

.enter:hover{
    background:#25d77b;
    color:#031008;
    box-shadow:0 0 25px rgba(37,215,123,.4);
}

.footer{
    margin-top:35px;
    font-size:10px;
    color:#47554e;
    letter-spacing:2px;
}

@media(max-width:600px){
    .logo{font-size:42px}
    .welcome{font-size:15px}
    .panel{padding:40px 22px}
}
</style>
</head>

<body>

<div class="led top"></div>
<div class="led bottom"></div>
<div class="led left"></div>
<div class="led right"></div>

<div class="panel">

    <div class="badge">PROFESSIONAL POS</div>

    <div class="logo">MY BAR</div>

    <div class="welcome">MIRË SE VINI</div>

    <div class="line"></div>

    <div class="description">
        SISTEM PROFESIONAL PËR MENAXHIMIN E BARIT
    </div>

    <button class="enter" onclick="location.href='login.html'">
        HYR NË SISTEM
    </button>

    <div class="footer">
        MY BAR • POS SYSTEM
    </div>

</div>

</body>
</html>
