<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WELCOME</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:#010302;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

/* BACKGROUND */
.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at center,
        rgba(0,255,136,.13),
        transparent 38%),
        #010302;
}

/* LED LINES */
.led{
    position:absolute;
    width:80vw;
    height:2px;
    left:-90%;
    background:linear-gradient(
        90deg,
        transparent,
        #00ff88,
        white,
        #00ff88,
        transparent
    );
    box-shadow:
        0 0 6px #00ff88,
        0 0 20px #00ff88,
        0 0 45px #00ff88;
}

.l1{
    top:12%;
    transform:rotate(-14deg);
    animation:move 7s linear infinite;
}

.l2{
    top:35%;
    transform:rotate(9deg);
    animation:move 9s linear infinite 1s;
}

.l3{
    top:62%;
    transform:rotate(-8deg);
    animation:move 8s linear infinite 2s;
}

.l4{
    top:84%;
    transform:rotate(11deg);
    animation:move 10s linear infinite 3s;
}

@keyframes move{
    from{
        left:-90%;
    }
    to{
        left:120%;
    }
}

/* VERTICAL LINES */
.v{
    position:absolute;
    top:0;
    height:100%;
    width:1px;
    background:linear-gradient(
        transparent,
        rgba(0,255,136,.6),
        transparent
    );
    box-shadow:0 0 15px #00ff88;
    animation:vpulse 3s infinite;
}

.v1{left:8%}
.v2{left:25%;animation-delay:1s}
.v3{left:75%;animation-delay:2s}
.v4{left:92%;animation-delay:.5s}

@keyframes vpulse{
    0%,100%{opacity:.1}
    50%{opacity:.55}
}

/* MAIN */
.main{
    position:relative;
    z-index:5;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:min(680px,94vw);
    padding:45px 30px 35px;
    text-align:center;
    border:1px solid rgba(0,255,136,.4);
    border-radius:30px;
    background:rgba(2,10,6,.75);
    backdrop-filter:blur(20px);
    box-shadow:
        0 0 30px rgba(0,255,136,.15),
        inset 0 0 40px rgba(0,255,136,.03);
    animation:cardGlow 3s infinite;
}

@keyframes cardGlow{
    0%,100%{
        box-shadow:
        0 0 25px rgba(0,255,136,.12),
        inset 0 0 30px rgba(0,255,136,.02);
    }

    50%{
        box-shadow:
        0 0 60px rgba(0,255,136,.25),
        inset 0 0 50px rgba(0,255,136,.05);
    }
}

/* STATUS */
.status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 15px;
    border:1px solid rgba(0,255,136,.4);
    border-radius:30px;
    color:#9dffc9;
    font-size:10px;
    letter-spacing:3px;
    margin-bottom:25px;
}

.statusDot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#00ff88;
    box-shadow:0 0 12px #00ff88;
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{opacity:.2}
}

/* PHOTO */
.photo{
    width:180px;
    height:180px;
    margin:0 auto 25px;
    border-radius:35px;
    overflow:hidden;
    border:2px solid #00ff88;
    background:
        radial-gradient(circle,#00ff88 0%,#06351f 35%,#010302 75%);
    box-shadow:
        0 0 15px #00ff88,
        0 0 45px rgba(0,255,136,.5),
        inset 0 0 25px rgba(0,255,136,.2);
    animation:photoPulse 3s infinite;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

@keyframes photoPulse{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.04);
    }
}

/* TITLE */
h1{
    font-size:clamp(45px,10vw,80px);
    letter-spacing:7px;
    font-weight:900;
    color:white;
    text-shadow:
        0 0 5px white,
        0 0 15px #00ff88,
        0 0 35px #00ff88;
    margin-bottom:28px;
    word-break:break-word;
}

/* FEATURES */
.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:25px;
}

.feature{
    padding:16px 5px;
    border:1px solid rgba(0,255,136,.2);
    border-radius:15px;
    background:rgba(0,255,136,.025);
    transition:.2s;
}

.feature:active{
    transform:scale(.92);
    border-color:#00ff88;
    background:rgba(0,255,136,.12);
    box-shadow:
        0 0 15px #00ff88,
        0 0 35px rgba(0,255,136,.5);
}

.icon{
    font-size:25px;
    margin-bottom:7px;
    filter:drop-shadow(0 0 8px #00ff88);
}

.feature span{
    font-size:10px;
    letter-spacing:1px;
    color:#b9ffd7;
}

/* ENTER */
.enter{
    width:100%;
    height:60px;
    border:1px solid #00ff88;
    border-radius:17px;
    background:rgba(0,255,136,.08);
    color:white;
    font-size:13px;
    font-weight:bold;
    letter-spacing:4px;
    cursor:pointer;
    box-shadow:
        0 0 15px rgba(0,255,136,.3),
        inset 0 0 20px rgba(0,255,136,.04);
    transition:.15s;
}

.enter:active{
    transform:scale(.95);
    background:#00ff88;
    color:#001b0e;
    box-shadow:
        0 0 20px #00ff88,
        0 0 70px #00ff88;
}

/* ADMIN */
.admin{
    margin-top:20px;
}

.adminBtn{
    background:none;
    border:1px solid rgba(0,255,136,.15);
    color:#4c8064;
    border-radius:10px;
    padding:8px 12px;
    font-size:9px;
    cursor:pointer;
}

.adminBox{
    display:none;
    margin-top:12px;
    padding:15px;
    border:1px solid rgba(0,255,136,.3);
    border-radius:15px;
    background:rgba(0,10,5,.9);
}

.adminBox.show{
    display:block;
}

.adminBox input{
    width:100%;
    padding:12px;
    margin-bottom:8px;
    border-radius:10px;
    border:1px solid rgba(0,255,136,.3);
    background:#020604;
    color:white;
    outline:none;
}

.adminBox button{
    width:100%;
    padding:12px;
    border:1px solid #00ff88;
    border-radius:10px;
    background:rgba(0,255,136,.1);
    color:white;
    cursor:pointer;
}

/* RIPPLE */
.ripple{
    position:fixed;
    width:20px;
    height:20px;
    border:2px solid #00ff88;
    border-radius:50%;
    pointer-events:none;
    z-index:9999;
    transform:translate(-50%,-50%) scale(0);
    animation:ripple .65s ease-out forwards;
    box-shadow:
        0 0 10px #00ff88,
        0 0 30px #00ff88;
}

@keyframes ripple{
    to{
        transform:translate(-50%,-50%) scale(8);
        opacity:0;
    }
}

/* MOBILE */
@media(max-width:600px){

    .card{
        padding:35px 18px 25px;
    }

    .photo{
        width:145px;
        height:145px;
    }

    .features{
        gap:6px;
    }

    .feature{
        padding:13px 3px;
    }

    h1{
        letter-spacing:4px;
    }
}
</style>
</head>

<body>

<div class="bg">

    <div class="led l1"></div>
    <div class="led l2"></div>
    <div class="led l3"></div>
    <div class="led l4"></div>

    <div class="v v1"></div>
    <div class="v v2"></div>
    <div class="v v3"></div>
    <div class="v v4"></div>

</div>

<div class="main">

<div class="card">

    <div class="status">
        <span class="statusDot"></span>
        SYSTEM ONLINE
    </div>

    <div class="photo">
        <img id="welcomePhoto" alt="Welcome">
    </div>

    <h1 id="welcomeText">WELCOME</h1>

    <div class="features">

        <div class="feature">
            <div class="icon">🪑</div>
            <span>TAVOLINA</span>
        </div>

        <div class="feature">
            <div class="icon">🍹</div>
            <span>MENU</span>
        </div>

        <div class="feature">
            <div class="icon">📊</div>
            <span>CONTROL</span>
        </div>

    </div>

    <button class="enter" onclick="enterSystem(event)">
        HYR NË SISTEM
    </button>

    <div class="admin">

        <button class="adminBtn" onclick="openAdmin()">
            ⚙ CUSTOMIZE
        </button>

        <div class="adminBox" id="adminBox">

            <input
                id="textInput"
                type="text"
                placeholder="Shkruaj tekstin..."
            >

            <input
                id="photoInput"
                type="file"
                accept="image/*"
            >

            <button onclick="saveWelcome()">
                💾 RUAJ NDRYSHIMET
            </button>

        </div>

    </div>

</div>

</div>

<script>

/* LOAD SAVED SETTINGS */
function loadWelcome(){

    const savedText =
        localStorage.getItem("sabiWelcomeText");

    const savedPhoto =
        localStorage.getItem("sabiWelcomePhoto");

    if(savedText){
        document.getElementById("welcomeText").textContent =
            savedText;
    }

    if(savedPhoto){

        const img =
            document.getElementById("welcomePhoto");

        img.src = savedPhoto;
        img.style.display = "block";
    }
}

/* OPEN CUSTOMIZE */
function openAdmin(){

    const box =
        document.getElementById("adminBox");

    box.classList.toggle("show");

    const savedText =
        localStorage.getItem("sabiWelcomeText");

    if(savedText){
        document.getElementById("textInput").value =
            savedText;
    }
}

/* SAVE */
function saveWelcome(){

    const text =
        document.getElementById("textInput").value.trim();

    if(text){

        localStorage.setItem(
            "sabiWelcomeText",
            text
        );

        document.getElementById("welcomeText").textContent =
            text;
    }

    const file =
        document.getElementById("photoInput").files[0];

    if(file){

        const reader =
            new FileReader();

        reader.onload = function(e){

            localStorage.setItem(
                "sabiWelcomePhoto",
                e.target.result
            );

            const img =
                document.getElementById("welcomePhoto");

            img.src = e.target.result;
            img.style.display = "block";
        };

        reader.readAsDataURL(file);
    }

    alert("U ruajt me sukses ✅");
}

/* ENTER */
function enterSystem(e){

    createRipple(e.clientX,e.clientY);

    setTimeout(function(){

        window.location.href =
            "login.html";

    },300);
}

/* TOUCH EFFECT */
document.addEventListener(
    "pointerdown",
    function(e){

        createRipple(
            e.clientX,
            e.clientY
        );

    }
);

function createRipple(x,y){

    const ripple =
        document.createElement("div");

    ripple.className = "ripple";

    ripple.style.left =
        x + "px";

    ripple.style.top =
        y + "px";

    document.body.appendChild(ripple);

    setTimeout(function(){
        ripple.remove();
    },700);
}

/* START */
loadWelcome();

</script>

</body>
</html>
