<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY BAR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 50% 35%, #11251a 0%, #07100b 35%, #030504 75%);
            color: white;
        }

        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .led {
            position: absolute;
            background: linear-gradient(90deg, transparent, #42e88a, transparent);
            opacity: .75;
            animation: ledMove 4s linear infinite;
        }

        .led.top {
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
        }

        .led.bottom {
            bottom: 0;
            right: 0;
            width: 100%;
            height: 2px;
            animation-delay: 2s;
        }

        .led.left {
            left: 0;
            top: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg, transparent, #238cff, transparent);
            animation-delay: 1s;
        }

        .led.right {
            right: 0;
            top: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg, transparent, #42e88a, transparent);
            animation-delay: 3s;
        }

        @keyframes ledMove {
            0% {
                opacity: .25;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: .25;
            }
        }

        .panel {
            width: min(900px, 92vw);
            padding: 65px 35px;
            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(16, 28, 21, .95),
                    rgba(3, 7, 5, .96)
                );

            border: 1px solid rgba(91, 229, 145, .22);
            border-radius: 28px;

            box-shadow:
                0 35px 100px rgba(0, 0, 0, .75),
                inset 0 0 50px rgba(71, 214, 126, .025);
        }

        .badge {
            display: inline-block;
            padding: 7px 13px;
            border: 1px solid rgba(98, 220, 148, .35);
            border-radius: 999px;
            color: #6be49a;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 22px;
        }

        .logo {
            font-size: clamp(48px, 9vw, 92px);
            font-weight: 900;
            letter-spacing: 10px;
            margin-left: 10px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #69e99b,
                    #ffffff
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            text-shadow: 0 0 35px rgba(98, 220, 148, .15);
        }

        .welcome {
            margin-top: 12px;
            color: #a8b9af;
            font-size: clamp(14px, 2vw, 18px);
            letter-spacing: 5px;
            font-weight: 600;
        }

        .line {
            width: min(480px, 80%);
            height: 1px;
            margin: 35px auto;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(98, 220, 148, .8),
                    transparent
                );
        }

        .description {
            color: #75897d;
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 35px;
        }

        .enter {
            border: 0;
            cursor: pointer;

            min-width: 230px;
            padding: 16px 30px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #6bea9e,
                    #38bf73
                );

            color: #041008;

            font-size: 14px;
            font-weight: 900;
            letter-spacing: 2px;

            box-shadow:
                0 12px 35px rgba(57, 204, 116, .18);

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .enter:hover {
            transform: translateY(-2px);
            box-shadow:
                0 18px 45px rgba(57, 204, 116, .28);
        }

        .footer {
            margin-top: 30px;
            color: #435449;
            font-size: 11px;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {
            .panel {
                padding: 48px 22px;
                border-radius: 22px;
            }

            .logo {
                letter-spacing: 6px;
                margin-left: 6px;
            }

            .welcome {
                letter-spacing: 3px;
            }

            .description {
                line-height: 1.6;
            }

            .enter {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="screen">

    <div class="led top"></div>
    <div class="led bottom"></div>
    <div class="led left"></div>
    <div class="led right"></div>

    <main class="panel">

        <div class="badge">
            SISTEM PREMIUM
        </div>

        <div class="logo">
            MY BAR
        </div>

        <div class="welcome">
            MIRË SE VINI
        </div>

        <div class="line"></div>

        <div class="description">
            SISTEM PROFESIONAL PËR MENAXHIMIN E BARIT
        </div>

        <button
            class="enter"
            onclick="location.href='login.html'">
            HYR NË SISTEM
        </button>

        <div class="footer">
            MY BAR • PROFESSIONAL POS
        </div>

    </main>

</div>

</body>
</html>
