<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WELCOME • SABI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    width:100%;
    min-height:100vh;
    overflow:hidden;
    background:#020604;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

/* BACKGROUND */
.bg{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 45%, rgba(0,255,110,.13), transparent 35%),
        radial-gradient(circle at 10% 90%, rgba(0,255,170,.07), transparent 30%),
        #020604;
}

/* LED DIAGONAL LINES */
.led{
    position:absolute;
    height:3px;
    width:70%;
    left:-80%;
    border-radius:20px;
    background:linear-gradient(
        90deg,
        transparent,
        #00ff66,
        #9affc1,
        #00ff66,
        transparent
    );
    box-shadow:
        0 0 8px #00ff66,
        0 0 20px #00ff66,
        0 0 40px rgba(0,255,100,.8);
    transform:rotate(-18deg);
    animation:moveLed 5s linear infinite;
}

.led:nth-child(1){
    top:12%;
    animation-delay:0s;
}

.led:nth-child(2){
    top:35%;
    animation-delay:1.2s;
}

.led:nth-child(3){
    top:60%;
    animation-delay:2.4s;
}

.led:nth-child(4){
    top:82%;
    animation-delay:3.6s;
}

@keyframes moveLed{
    0%{
        left:-80%;
        opacity:0;
    }
    15%{
        opacity:1;
    }
    85%{
        opacity:1;
    }
    100%{
        left:120%;
        opacity:0;
    }
}

/* VERTICAL LED */
.vline{
    position:absolute;
    width:2px;
    height:100%;
    background:linear-gradient(
        transparent,
        #00ff66,
        transparent
    );
    opacity:.25;
    box-shadow:0 0 15px #00ff66;
}

.v1{left:8%;}
.v2{left:25%;}
.v3{right:25%;}
.v4{right:8%;}

/* FLOATING LIGHTS */
.dot{
    position:absolute;
    width:5px;
    height:5px;
    background:#6aff9b;
    border-radius:50%;
    box-shadow:
        0 0 8px #00ff66,
        0 0 20px #00ff66;
    animation:float 5s ease-in-out infinite;
}

.d1{left:15%;top:25%;animation-delay:0s;}
.d2{left:80%;top:20%;animation-delay:1s;}
.d3{left:18%;top:75%;animation-delay:2s;}
.d4{left:87%;top:70%;animation-delay:3s;}
.d5{left:50%;top:10%;animation-delay:1.5s;}

@keyframes float{
    0%,100%{
        transform:translateY(0);
        opacity:.3;
    }
    50%{
        transform:translateY(-30px);
        opacity:1;
    }
}

/* MAIN */
.main{
    position:relative;
    z-index:10;
    width:min(92%,520px);
    text-align:center;
}

/* LOGO */
.logo{
    width:120px;
    height:120px;
    margin:0 auto 25px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(circle,
        rgba(0,255,100,.25),
        rgba(0,255,100,.04) 55%,
        transparent 70%);

    border:2px solid rgba(0,255,100,.8);

    box-shadow:
        0 0 15px #00ff66,
        0 0 35px rgba(0,255,100,.8),
        inset 0 0 30px rgba(0,255,100,.2);

    animation:pulse 2.5s infinite;
}

.logo span{
    font-size:58px;
    font-weight:900;
    color:#d8ffe5;
    text-shadow:
        0 0 10px #00ff66,
        0 0 25px #00ff66,
        0 0 45px #00ff66;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.05);
    }
}

/* WELCOME */
h1{
    font-size:clamp(42px,12vw,78px);
    letter-spacing:8px;
    font-weight:900;
    margin-bottom:10px;

    color:white;

    text-shadow:
        0 0 5px #fff,
        0 0 15px #00ff66,
        0 0 35px #00ff66,
        0 0 65px rgba(0,255,100,.8);
}

.subtitle{
    font-size:13px;
    letter-spacing:5px;
    color:#8cffb0;
    margin-bottom:35px;
}

/* CARD */
.card{
    padding:25px;
    border-radius:24px;

    background:rgba(0,20,10,.55);
    border:1px solid rgba(0,255,100,.35);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    box-shadow:
        0 0 30px rgba(0,255,100,.12),
        inset 0 0 30px rgba(0,255,100,.03);
}

/* FEATURES */
.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:22px;
}

.feature{
    padding:15px 8px;
    border-radius:15px;

    background:rgba(0,255,100,.05);
    border:1px solid rgba(0,255,100,.18);

    transition:.25s;
}

.feature:hover,
.feature:active{
    transform:translateY(-4px);
    background:rgba(0,255,100,.12);
    border-color:#00ff66;

    box-shadow:
        0 0 15px rgba(0,255,100,.35);
}

.icon{
    font-size:25px;
    margin-bottom:7px;
}

.feature span{
    font-size:11px;
    color:#b8ffc9;
    letter-spacing:1px;
}

/* BUTTON */
button{
    width:100%;
    border:0;
    border-radius:15px;
    padding:17px;

    background:linear-gradient(
        90deg,
        #00a83f,
        #00ff66,
        #00c94e
    );

    color:#001b08;
    font-size:15px;
    font-weight:900;
    letter-spacing:2px;

    cursor:pointer;

    box-shadow:
        0 0 15px rgba(0,255,100,.6),
        0 0 35px rgba(0,255,100,.25);

    transition:.2s;
}

button:active{
    transform:scale(.96);
}

/* CLOCK */
.clock{
    margin-top:22px;
    font-size:12px;
    color:#6cff96;
    letter-spacing:2px;
}

/* FOOTER */
.footer{
    margin-top:18px;
    font-size:9px;
    color:rgba(180,255,200,.45);
    letter-spacing:3px;
}

/* TOUCH RIPPLE */
.ripple{
    position:fixed;
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid #00ff66;
    pointer-events:none;
    transform:translate(-50%,-50%);
    animation:ripple .7s ease-out forwards;
    z-index:9999;
}

@keyframes ripple{
    from{
        width:20px;
        height:20px;
        opacity:1;
        box-shadow:0 0 10px #00ff66;
    }
    to{
        width:300px;
        height:300px;
        opacity:0;
        box-shadow:0 0 80px #00ff66;
    }
}

/* FLASH */
.flash{
    position:fixed;
    inset:0;
    background:#00ff66;
    opacity:0;
    pointer-events:none;
    z-index:9998;
}

.flash.active{
    animation:flash .5s ease-out;
}

@keyframes flash{
    0%{opacity:.45;}
    100%{opacity:0;}
}

/* MOBILE */
@media(max-width:500px){

    .logo{
        width:100px;
        height:100px;
    }

    .logo span{
        font-size:48px;
    }

    h1{
        font-size:48px;
        letter-spacing:5px;
    }

    .subtitle{
        font-size:10px;
        letter-spacing:3px;
    }

    .card{
        padding:18px;
    }

    .feature{
        padding:12px 5px;
    }
}
</style>
</head>

<body>

<div class="bg">

    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>
    <div class="led"></div>

    <div class="vline v1"></div>
    <div class="vline v2"></div>
    <div class="vline v3"></div>
    <div class="vline v4"></div>

    <div class="dot d1"></div>
    <div class="dot d2"></div>
    <div class="dot d3"></div>
    <div class="dot d4"></div>
    <div class="dot d5"></div>

</div>

<div class="main">

    <div class="logo">
        <span>S</span>
    </div>

    <h1>WELCOME</h1>

    <div class="subtitle">
        SABI SYSTEM
    </div>

    <div class="card">

        <div class="features">

            <div class="feature">
                <div class="icon">🪑</div>
                <span>TAVOLINA</span>
            </div>

            <div class="feature">
                <div class="icon">🍹</div>
                <span>MENU</span>
            </div>

            <div class="feature">
                <div class="icon">📊</div>
                <span>RAPORTE</span>
            </div>

        </div>

        <button onclick="enterSystem()">
            HYR NË SISTEM
        </button>

        <div class="clock" id="clock">
            00:00:00
        </div>

    </div>

    <div class="footer">
        SABI SYSTEM © 2026
    </div>

</div>

<div class="flash" id="flash"></div>

<script>

/* CLOCK */
function updateClock(){

    const now = new Date();

    const time = now.toLocaleTimeString(
        "sq-AL",
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit"
        }
    );

    document.getElementById("clock").textContent = time;
}

updateClock();
setInterval(updateClock,1000);


/* ENTER SYSTEM */
function enterSystem(){

    const flash = document.getElementById("flash");

    flash.classList.add("active");

    setTimeout(function(){

        window.location.href = "login.html";

    },350);
}


/* TOUCH / CLICK EFFECT */
document.addEventListener("pointerdown",function(e){

    const ripple = document.createElement("div");

    ripple.className = "ripple";

    ripple.style.left = e.clientX + "px";
    ripple.style.top = e.clientY + "px";

    document.body.appendChild(ripple);

    setTimeout(function(){
        ripple.remove();
    },700);

});

</script>

</body>
</html>
