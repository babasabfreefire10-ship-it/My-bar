<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- VERSION I RI -->
<meta name="version" content="SABI-2026-V2">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>SABI • Bar Lulishtja • V2</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#020504;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    position:relative;
}

/* BACKGROUND GRID */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(rgba(0,255,140,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,255,140,.035) 1px,transparent 1px);
    background-size:45px 45px;
    pointer-events:none;
}

/* CENTRAL LIGHT */
body::after{
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(
        circle,
        rgba(0,255,140,.09) 0%,
        rgba(0,255,140,.035) 35%,
        transparent 70%
    );
    pointer-events:none;
}

/* SIDE LED */
.led{
    position:absolute;
    top:0;
    bottom:0;
    width:3px;
    background:#00ff88;
    animation:colorChange 8s linear infinite;
    z-index:5;
}

.led.left{
    left:0;
}

.led.right{
    right:0;
}

.led::after{
    content:"";
    position:absolute;
    width:100%;
    height:130px;
    top:-130px;
    left:0;
    background:linear-gradient(
        to bottom,
        transparent,
        rgba(255,255,255,.95),
        transparent
    );
    box-shadow:
        0 0 12px currentColor,
        0 0 30px currentColor;
    animation:travel 3s linear infinite;
}

@keyframes travel{
    0%{
        top:-130px;
    }
    100%{
        top:100%;
    }
}

@keyframes colorChange{
    0%{background:#00ff88;color:#00ff88;}
    16%{background:#00ffff;color:#00ffff;}
    32%{background:#0088ff;color:#0088ff;}
    48%{background:#8a2be2;color:#8a2be2;}
    64%{background:#ff00cc;color:#ff00cc;}
    80%{background:#ff8800;color:#ff8800;}
    100%{background:#ffff00;color:#ffff00;}
}

/* CORNER LINES */
.corner{
    position:absolute;
    width:70px;
    height:70px;
    border-color:rgba(0,255,140,.5);
    z-index:2;
}

.corner.tl{
    top:25px;
    left:25px;
    border-top:1px solid;
    border-left:1px solid;
}

.corner.tr{
    top:25px;
    right:25px;
    border-top:1px solid;
    border-right:1px solid;
}

.corner.bl{
    bottom:25px;
    left:25px;
    border-bottom:1px solid;
    border-left:1px solid;
}

.corner.br{
    bottom:25px;
    right:25px;
    border-bottom:1px solid;
    border-right:1px solid;
}

/* MAIN */
.container{
    position:relative;
    z-index:10;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
}

.content{
    width:min(600px,100%);
}

/* BADGE */
.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    border:1px solid rgba(0,255,140,.35);
    border-radius:30px;
    background:rgba(0,255,140,.04);
    color:#00ff88;
    font-size:11px;
    letter-spacing:3px;
    margin-bottom:28px;
    box-shadow:0 0 20px rgba(0,255,140,.08);
}

.badge-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#00ff88;
    box-shadow:0 0 10px #00ff88;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:.3;}
}

/* LOGO */
.logo{
    width:92px;
    height:92px;
    margin:0 auto 28px;
    position:relative;
    transform:rotate(45deg);
    border:2px solid #00ff88;
    background:rgba(0,255,140,.025);
    box-shadow:
        0 0 20px rgba(0,255,140,.25),
        inset 0 0 25px rgba(0,255,140,.05);
    display:flex;
    align-items:center;
    justify-content:center;
    animation:logoGlow 4s ease-in-out infinite;
}

.logo span{
    transform:rotate(-45deg);
    font-size:38px;
    font-weight:900;
    color:#00ff88;
    text-shadow:
        0 0 10px #00ff88,
        0 0 25px #00ff88;
}

@keyframes logoGlow{
    0%,100%{
        box-shadow:
            0 0 20px rgba(0,255,140,.25),
            inset 0 0 25px rgba(0,255,140,.05);
    }

    50%{
        box-shadow:
            0 0 40px rgba(0,255,140,.45),
            inset 0 0 35px rgba(0,255,140,.1);
    }
}

/* TITLE */
.title{
    font-size:clamp(38px,8vw,72px);
    font-weight:900;
    letter-spacing:7px;
    margin-bottom:14px;
    color:white;
    text-shadow:
        0 0 20px rgba(255,255,255,.15);
}

.subtitle{
    font-size:12px;
    letter-spacing:5px;
    color:rgba(255,255,255,.5);
    margin-bottom:25px;
}

/* DIVIDER */
.divider{
    width:180px;
    height:1px;
    margin:0 auto 28px;
    background:linear-gradient(
        90deg,
        transparent,
        #00ff88,
        transparent
    );
    box-shadow:0 0 10px rgba(0,255,140,.5);
}

/* BUTTON */
.enter-btn{
    border:1px solid #00ff88;
    background:rgba(0,255,140,.05);
    color:#00ff88;
    padding:15px 28px;
    min-width:220px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
    letter-spacing:3px;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 15px rgba(0,255,140,.08);
}

.enter-btn:hover{
    background:#00ff88;
    color:#00140b;
    box-shadow:
        0 0 20px #00ff88,
        0 0 50px rgba(0,255,140,.4);
    transform:translateY(-2px);
}

.enter-btn:active{
    transform:scale(.97);
}

/* FOOTER */
.footer{
    position:absolute;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,.25);
    font-size:9px;
    letter-spacing:3px;
    white-space:nowrap;
    z-index:20;
}

/* CONTACT */
.contact{
    position:absolute;
    bottom:22px;
    left:25px;
    z-index:30;
}

.contact button{
    background:none;
    border:none;
    color:rgba(255,255,255,.35);
    font-size:9px;
    letter-spacing:2px;
    cursor:pointer;
    transition:.3s;
}

.contact button:hover{
    color:#00ff88;
}

/* CONTACT SCREEN */
.contact-screen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    backdrop-filter:blur(15px);
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.contact-screen.active{
    display:flex;
}

.contact-box{
    width:min(430px,100%);
    background:#050908;
    border:1px solid rgba(0,255,140,.35);
    border-radius:12px;
    padding:28px;
    text-align:center;
    box-shadow:
        0 0 40px rgba(0,255,140,.12);
}

.contact-title{
    color:#00ff88;
    font-size:18px;
    font-weight:bold;
    letter-spacing:2px;
    margin-bottom:22px;
}

.contact-option{
    width:100%;
    margin-bottom:12px;
    padding:14px;
    background:rgba(0,255,140,.04);
    border:1px solid rgba(0,255,140,.25);
    color:white;
    border-radius:6px;
    cursor:pointer;
    font-size:11px;
    letter-spacing:1px;
    transition:.3s;
}

.contact-option:hover{
    background:rgba(0,255,140,.12);
    border-color:#00ff88;
}

.waiting{
    display:none;
}

.waiting.active{
    display:block;
}

.spinner{
    width:35px;
    height:35px;
    border:2px solid rgba(0,255,140,.15);
    border-top-color:#00ff88;
    border-radius:50%;
    margin:0 auto 20px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.count{
    color:#00ff88;
    font-size:25px;
    font-weight:bold;
    margin:10px;
}

.report-area{
    display:none;
}

.report-area.active{
    display:block;
}

textarea{
    width:100%;
    height:130px;
    resize:none;
    background:#020504;
    border:1px solid rgba(0,255,140,.25);
    color:white;
    border-radius:6px;
    padding:12px;
    outline:none;
    font-family:Arial;
    margin-bottom:12px;
}

textarea:focus{
    border-color:#00ff88;
    box-shadow:0 0 15px rgba(0,255,140,.1);
}

.send-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:5px;
    background:#00ff88;
    color:#00140b;
    font-weight:bold;
    cursor:pointer;
    letter-spacing:2px;
}

.close-btn{
    margin-top:12px;
    background:none;
    border:none;
    color:rgba(255,255,255,.4);
    cursor:pointer;
    font-size:10px;
}

/* MOBILE */
@media(max-width:600px){

    .corner{
        width:45px;
        height:45px;
    }

    .corner.tl,
    .corner.tr{
        top:15px;
    }

    .corner.bl,
    .corner.br{
        bottom:15px;
    }

    .corner.tl,
    .corner.bl{
        left:15px;
    }

    .corner.tr,
    .corner.br{
        right:15px;
    }

    .logo{
        width:78px;
        height:78px;
        margin-bottom:25px;
    }

    .logo span{
        font-size:32px;
    }

    .title{
        letter-spacing:5px;
    }

    .subtitle{
        font-size:9px;
        letter-spacing:3px;
    }

    .enter-btn{
        width:100%;
        max-width:280px;
    }

    .contact{
        left:15px;
        bottom:15px;
    }

    .footer{
        bottom:15px;
        font-size:7px;
        letter-spacing:2px;
    }
}
</style>
</head>

<body>

<div class="led left"></div>
<div class="led right"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="container">

    <div class="content">

        <div class="badge">
            <span class="badge-dot"></span>
            SISTEM PREMIUM • V2
        </div>

        <div class="logo">
            <span>S</span>
        </div>

        <div class="title">
            MIRË SE VINI
        </div>

        <div class="subtitle">
            SISTEMI I MENAXHIMIT
        </div>

        <div class="divider"></div>

        <button class="enter-btn" onclick="hyjNeSistem()">
            HYR NË SISTEM →
        </button>

    </div>

</div>

<div class="footer">
    SABI • SISTEM PREMIUM • 2026 • V2
</div>

<div class="contact">
    <button onclick="openContact()">
        CONTACT
    </button>
</div>

<!-- CONTACT MODAL -->
<div class="contact-screen" id="contactScreen">

    <div class="contact-box">

        <div class="contact-title">
            SABI SUPPORT
        </div>

        <div id="contactMenu">

            <button class="contact-option" onclick="startReport()">
                RAPORTO NJË PROBLEM
            </button>

            <button class="contact-option" onclick="buyApp()">
                BLI APLIKACIONIN • 49€
            </button>

        </div>

        <div class="waiting" id="waiting">

            <div class="spinner"></div>

            <div style="color:rgba(255,255,255,.5);font-size:11px;">
                Ju lutem prisni...
            </div>

            <div class="count" id="countdown">
                5
            </div>

        </div>

        <div class="report-area" id="reportArea">

            <textarea
                id="reportText"
                placeholder="Shkruani problemin këtu..."
            ></textarea>

            <button class="send-btn" onclick="sendReport()">
                DËRGO RAPORTIMIN
            </button>

        </div>

        <button class="close-btn" onclick="closeContact()">
            MBYLL
        </button>

    </div>

</div>

<script>

/* VERSION */
const SABI_VERSION = "2026-V2";

/* HYRJA */
function hyjNeSistem(){
    window.location.href = "login.html";
}

let timer = null;

/* CONTACT */
function openContact(){

    document
        .getElementById("contactScreen")
        .classList.add("active");

    document
        .getElementById("contactMenu")
        .style.display = "block";

    document
        .getElementById("waiting")
        .classList.remove("active");

    document
        .getElementById("reportArea")
        .classList.remove("active");

}

/* REPORT */
function startReport(){

    document
        .getElementById("contactMenu")
        .style.display = "none";

    document
        .getElementById("waiting")
        .classList.add("active");

    let seconds = 5;

    const countdown =
        document.getElementById("countdown");

    countdown.textContent = seconds;

    clearInterval(timer);

    timer = setInterval(function(){

        seconds--;

        countdown.textContent = seconds;

        if(seconds <= 0){

            clearInterval(timer);

            document
                .getElementById("waiting")
                .classList.remove("active");

            document
                .getElementById("reportArea")
                .classList.add("active");

        }

    },1000);

}

/* SEND REPORT */
function sendReport(){

    const report =
        document
        .getElementById("reportText")
        .value
        .trim();

    if(!report){

        alert("Ju lutem shkruani raportimin.");

        return;

    }

    const myNumber = "+355XXXXXXXXX";

    const message =
        "RAPORTIM SABI\n\n" +
        report +
        "\n\nVersion: " +
        SABI_VERSION;

    const sms =
        "sms:" +
        myNumber +
        "?body=" +
        encodeURIComponent(message);

    window.location.href = sms;
}

/* BUY */
function buyApp(){

    const myNumber = "+355XXXXXXXXX";

    const message =
        "Përshëndetje, jam i interesuar të blej aplikacionin SABI për 49€.\n\nVersion: " +
        SABI_VERSION;

    const sms =
        "sms:" +
        myNumber +
        "?body=" +
        encodeURIComponent(message);

    window.location.href = sms;
}

/* CLOSE */
function closeContact(){

    clearInterval(timer);

    document
        .getElementById("contactScreen")
        .classList.remove("active");

}

</script>

</body>
</html>
