<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirë se vini • SABI Premium</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#030404;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

/* =========================
   BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255,255,255,.045),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #020303,
            #080a09 50%,
            #020303
        );
}

/* LINES */

.background::before{
    content:"";

    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:75px 75px;

    mask-image:linear-gradient(
        to bottom,
        transparent,
        black 20%,
        black 80%,
        transparent
    );
}

/* =========================
   PREMIUM COLOR LIGHTS
========================= */

.ambient{
    position:absolute;

    width:600px;
    height:600px;

    border-radius:50%;

    filter:blur(120px);

    opacity:.12;

    animation:ambientColor 12s linear infinite;
}

.ambient.left{
    left:-350px;
    top:15%;
}

.ambient.right{
    right:-350px;
    bottom:10%;

    animation-delay:-6s;
}

@keyframes ambientColor{

    0%{
        background:#00ff66;
    }

    16%{
        background:#00d9ff;
    }

    32%{
        background:#315cff;
    }

    48%{
        background:#a855f7;
    }

    64%{
        background:#ff2d8d;
    }

    80%{
        background:#ff7a18;
    }

    100%{
        background:#00ff66;
    }
}

/* =========================
   LED ANASH
========================= */

.led{
    position:fixed;

    top:0;
    bottom:0;

    width:3px;

    z-index:4;

    background:#00ff66;

    animation:
        colorChange 10s linear infinite,
        brightness 2.5s ease-in-out infinite;

    box-shadow:
        0 0 8px currentColor,
        0 0 20px currentColor,
        0 0 45px currentColor,
        0 0 90px currentColor;
}

.led.left{
    left:18px;
}

.led.right{
    right:18px;

    animation-delay:-5s;
}

/* NGJYRAT */

@keyframes colorChange{

    0%{
        background:#00ff66;
        color:#00ff66;
    }

    14%{
        background:#00d9ff;
        color:#00d9ff;
    }

    28%{
        background:#315cff;
        color:#315cff;
    }

    42%{
        background:#a855f7;
        color:#a855f7;
    }

    56%{
        background:#ff2d8d;
        color:#ff2d8d;
    }

    70%{
        background:#ff5c35;
        color:#ff5c35;
    }

    84%{
        background:#ffd23f;
        color:#ffd23f;
    }

    100%{
        background:#00ff66;
        color:#00ff66;
    }
}

@keyframes brightness{

    0%,100%{
        opacity:.45;
        filter:brightness(.8);
    }

    50%{
        opacity:1;
        filter:brightness(1.8);
    }
}

/* LIGHT BALL */

.led::after{
    content:"";

    position:absolute;

    left:50%;

    width:12px;
    height:170px;

    transform:translateX(-50%);

    border-radius:50%;

    background:linear-gradient(
        to bottom,
        transparent,
        currentColor,
        white,
        currentColor,
        transparent
    );

    box-shadow:
        0 0 15px currentColor,
        0 0 40px currentColor,
        0 0 80px currentColor;

    animation:travel 4s linear infinite;
}

.led.right::after{
    animation-delay:-2s;
}

@keyframes travel{

    0%{
        top:-180px;
    }

    100%{
        top:100%;
    }
}

/* INNER LINES */

.inner-line{
    position:fixed;

    top:6%;
    bottom:6%;

    width:1px;

    background:rgba(255,255,255,.07);

    z-index:2;
}

.inner-line.left{
    left:36px;
}

.inner-line.right{
    right:36px;
}

/* =========================
   MAIN
========================= */

.container{
    position:relative;

    z-index:10;

    width:100%;
    height:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    text-align:center;
}

.content{
    width:min(92%,680px);
}

/* PREMIUM BADGE */

.badge{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    padding:9px 18px;

    border:1px solid rgba(255,255,255,.18);

    border-radius:100px;

    background:rgba(255,255,255,.035);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    color:#cfd6d1;

    font-size:9px;

    letter-spacing:4px;

    margin-bottom:35px;

    box-shadow:
        0 0 25px rgba(255,255,255,.035);
}

.badge::before{
    content:"";

    width:5px;
    height:5px;

    border-radius:50%;

    background:#7aff9b;

    box-shadow:
        0 0 8px #7aff9b,
        0 0 18px #7aff9b;

    margin-right:10px;

    animation:status 2s infinite;
}

@keyframes status{

    0%,100%{
        opacity:.4;
    }

    50%{
        opacity:1;
    }
}

/* LOGO */

.logo{
    position:relative;

    width:108px;
    height:108px;

    margin:0 auto 38px;

    transform:rotate(45deg);

    border:1px solid rgba(255,255,255,.35);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.06),
            rgba(255,255,255,.015)
        );

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 0 50px rgba(255,255,255,.06),
        inset 0 0 30px rgba(255,255,255,.04);

    animation:logoColor 10s linear infinite;
}

.logo::before{
    content:"";

    position:absolute;

    inset:9px;

    border:1px solid rgba(255,255,255,.13);
}

.logo span{
    transform:rotate(-45deg);

    font-size:55px;

    font-weight:300;

    color:white;

    text-shadow:
        0 0 25px currentColor;
}

@keyframes logoColor{

    0%{
        color:#00ff66;
        border-color:rgba(0,255,102,.7);
    }

    16%{
        color:#00d9ff;
        border-color:rgba(0,217,255,.7);
    }

    32%{
        color:#4c6fff;
        border-color:rgba(76,111,255,.7);
    }

    48%{
        color:#b45cff;
        border-color:rgba(180,92,255,.7);
    }

    64%{
        color:#ff3f9d;
        border-color:rgba(255,63,157,.7);
    }

    80%{
        color:#ff8b32;
        border-color:rgba(255,139,50,.7);
    }

    100%{
        color:#00ff66;
        border-color:rgba(0,255,102,.7);
    }
}

/* TITLE */

h1{
    font-size:clamp(48px,9vw,88px);

    font-weight:200;

    letter-spacing:11px;

    margin-left:11px;

    line-height:1;

    color:#f4f6f5;

    text-shadow:
        0 0 35px rgba(255,255,255,.09);
}

.subtitle{
    margin-top:20px;

    font-size:11px;

    letter-spacing:6px;

    color:#8b9690;
}

/* DIVIDER */

.divider{
    width:190px;
    height:1px;

    margin:38px auto;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );
}

/* BUTTON */

.enter{
    position:relative;

    width:245px;
    height:56px;

    border:1px solid rgba(255,255,255,.25);

    border-radius:3px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.07),
            rgba(255,255,255,.025)
        );

    color:#eef2ef;

    font-size:10px;

    letter-spacing:4px;

    cursor:pointer;

    overflow:hidden;

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    transition:.4s;
}

.enter::before{
    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:100%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.15),
        transparent
    );

    transition:.6s;
}

.enter:hover{
    transform:translateY(-2px);

    border-color:rgba(255,255,255,.6);

    box-shadow:
        0 0 30px rgba(255,255,255,.08);
}

.enter:hover::before{
    left:120%;
}

.arrow{
    margin-left:18px;

    transition:.3s;
}

.enter:hover .arrow{
    transform:translateX(7px);
}

/* FOOTER */

.footer{
    position:fixed;

    bottom:24px;

    left:0;
    right:0;

    text-align:center;

    font-size:8px;

    letter-spacing:4px;

    color:#4c5550;

    z-index:10;
}

/* CORNERS */

.corner{
    position:fixed;

    width:38px;
    height:38px;

    z-index:20;

    border-color:rgba(255,255,255,.2);
}

.c1{
    top:24px;
    left:24px;

    border-top:1px solid;
    border-left:1px solid;
}

.c2{
    top:24px;
    right:24px;

    border-top:1px solid;
    border-right:1px solid;
}

.c3{
    bottom:24px;
    left:24px;

    border-bottom:1px solid;
    border-left:1px solid;
}

.c4{
    bottom:24px;
    right:24px;

    border-bottom:1px solid;
    border-right:1px solid;
}

/* TOUCH */

.ripple{
    position:fixed;

    width:5px;
    height:5px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.65);

    pointer-events:none;

    transform:translate(-50%,-50%);

    animation:ripple .7s ease-out forwards;

    z-index:999;
}

@keyframes ripple{

    from{
        width:5px;
        height:5px;
        opacity:.8;
    }

    to{
        width:220px;
        height:220px;
        opacity:0;
    }
}

/* FLASH */

.flash{
    position:fixed;

    inset:0;

    background:white;

    opacity:0;

    pointer-events:none;

    z-index:1000;
}

.flash.active{
    animation:flash .45s ease-out;
}

@keyframes flash{

    0%{
        opacity:.1;
    }

    100%{
        opacity:0;
    }
}

/* MOBILE */

@media(max-width:600px){

    .led.left{
        left:9px;
    }

    .led.right{
        right:9px;
    }

    .inner-line.left{
        left:25px;
    }

    .inner-line.right{
        right:25px;
    }

    .logo{
        width:82px;
        height:82px;

        margin-bottom:30px;
    }

    .logo span{
        font-size:42px;
    }

    h1{
        font-size:47px;
        letter-spacing:6px;
        margin-left:6px;
    }

    .subtitle{
        font-size:9px;
        letter-spacing:4px;
    }

    .badge{
        font-size:8px;
        letter-spacing:3px;
    }

    .enter{
        width:220px;
    }

}
</style>
</head>

<body>

<div class="background">

    <div class="ambient left"></div>
    <div class="ambient right"></div>

</div>

<!-- LED ANASH -->
<div class="led left"></div>
<div class="led right"></div>

<div class="inner-line left"></div>
<div class="inner-line right"></div>

<!-- KORNIZAT -->
<div class="corner c1"></div>
<div class="corner c2"></div>
<div class="corner c3"></div>
<div class="corner c4"></div>


<!-- FAQJA -->
<div class="container">

    <div class="content">

        <div class="badge">
            SISTEM PREMIUM
        </div>

        <div class="logo">
            <span>S</span>
        </div>

        <h1>
            MIRË SE VINI
        </h1>

        <div class="subtitle">
            SISTEMI I MENAXHIMIT
        </div>

        <div class="divider"></div>

        <button
            class="enter"
            onclick="hyjNeSistem()"
        >
            HYR NË SISTEM
            <span class="arrow">→</span>
        </button>

    </div>

</div>


<div class="footer">
    SABI • SISTEM PREMIUM • 2026
</div>

<div
    class="flash"
    id="flash"
></div>


<script>

function hyjNeSistem(){

    const flash =
        document.getElementById("flash");

    flash.classList.add("active");

    setTimeout(function(){

        window.location.href = "login.html";

    },350);
}


/* EFEKT KUR PREK EKRANIN */

document.addEventListener(
    "pointerdown",
    function(e){

        const ripple =
            document.createElement("div");

        ripple.className = "ripple";

        ripple.style.left =
            e.clientX + "px";

        ripple.style.top =
            e.clientY + "px";

        document.body.appendChild(ripple);

        setTimeout(function(){
            ripple.remove();
        },700);

    }
);

</script>

</body>
</html>
