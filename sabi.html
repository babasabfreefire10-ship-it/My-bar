<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>MY BAR • BY SABI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:#030303;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 42%,
            #1b1b1b 0%,
            #0b0b0b 38%,
            #020202 100%
        );
}

.glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    left:50%;
    top:45%;
    transform:translate(-50%,-50%);
    background:
        radial-gradient(
            circle,
            rgba(201,168,106,.12),
            transparent 68%
        );
    filter:blur(35px);
    animation:glowMove 7s ease-in-out infinite;
}

@keyframes glowMove{
    0%,100%{
        transform:translate(-50%,-50%) scale(.9);
        opacity:.6;
    }

    50%{
        transform:translate(-50%,-50%) scale(1.15);
        opacity:1;
    }
}

/* =========================
   RGB LED FRAME
========================= */

.led{
    position:fixed;
    z-index:50;
    pointer-events:none;
    background:#ff0000;
    box-shadow:0 0 15px currentColor;
    animation:rgb 8s linear infinite;
}

.led-top,
.led-bottom{
    left:0;
    width:100%;
    height:2px;
}

.led-top{
    top:0;
}

.led-bottom{
    bottom:0;
}

.led-left,
.led-right{
    top:0;
    width:2px;
    height:100%;
}

.led-left{
    left:0;
}

.led-right{
    right:0;
}

@keyframes rgb{
    0%{
        background:#ff2020;
        color:#ff2020;
    }

    20%{
        background:#ff00d4;
        color:#ff00d4;
    }

    40%{
        background:#653cff;
        color:#653cff;
    }

    60%{
        background:#00bfff;
        color:#00bfff;
    }

    80%{
        background:#00ff8c;
        color:#00ff8c;
    }

    100%{
        background:#ff2020;
        color:#ff2020;
    }
}

/* =========================
   MOVING LIGHTS
========================= */

.light{
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:rgba(255,255,255,.035);
    filter:blur(25px);
    animation:lightMove 10s linear infinite;
}

.light.one{
    top:10%;
    left:-200px;
}

.light.two{
    bottom:5%;
    right:-200px;
    animation-delay:4s;
}

@keyframes lightMove{
    0%{
        transform:translateX(0);
        opacity:0;
    }

    20%{
        opacity:.5;
    }

    70%{
        opacity:.2;
    }

    100%{
        transform:translateX(120vw);
        opacity:0;
    }
}

/* =========================
   HEADER
========================= */

.header{
    position:fixed;
    z-index:100;
    top:0;
    left:0;
    width:100%;
    padding:24px 30px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.mini-brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.mini-logo{
    width:36px;
    height:36px;
    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#101010;
    border:1px solid #333;

    color:#d7b775;
    font-size:16px;
    font-weight:900;

    box-shadow:
        inset 0 1px rgba(255,255,255,.08);
}

.mini-brand span{
    color:#777;
    font-size:10px;
    font-weight:800;
    letter-spacing:3px;
}

.contact-button{
    border:1px solid #303030;
    background:rgba(8,8,8,.85);
    color:#aaa;

    padding:11px 15px;

    border-radius:9px;

    font-size:9px;
    font-weight:900;
    letter-spacing:2px;

    cursor:pointer;

    transition:.2s;
}

.contact-button:hover{
    color:#fff;
    border-color:#806936;
}

/* =========================
   MAIN
========================= */

.main{
    position:relative;
    z-index:10;

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:80px 20px;
}

.content{
    width:100%;
    max-width:720px;
    text-align:center;
}

/* =========================
   BADGE
========================= */

.badge{
    display:inline-flex;
    align-items:center;
    gap:8px;

    padding:8px 13px;

    border:1px solid #3b3222;
    border-radius:100px;

    color:#c9a86a;
    background:rgba(201,168,106,.04);

    font-size:8px;
    font-weight:900;
    letter-spacing:2.5px;

    margin-bottom:28px;
}

.badge-dot{
    width:5px;
    height:5px;
    border-radius:50%;

    background:#00ed8a;

    box-shadow:
        0 0 12px #00ed8a;
}

/* =========================
   S LOGO
========================= */

.big-logo{
    position:relative;

    width:105px;
    height:105px;

    margin:0 auto 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:29px;

    background:
        linear-gradient(
            145deg,
            #242424,
            #050505
        );

    border:1px solid #3b3b3b;

    box-shadow:
        0 30px 80px rgba(0,0,0,.7),
        inset 0 1px rgba(255,255,255,.08);
}

.big-logo::before{
    content:"";

    position:absolute;
    inset:-5px;

    border-radius:34px;

    border:1px solid rgba(201,168,106,.18);

    animation:logoPulse 3s ease-in-out infinite;
}

@keyframes logoPulse{
    0%,100%{
        opacity:.3;
    }

    50%{
        opacity:1;
        box-shadow:
            0 0 35px rgba(201,168,106,.13);
    }
}

.big-logo strong{
    font-size:48px;
    font-weight:950;
    color:#fff;
}

/* =========================
   TITLE
========================= */

.title{
    font-size:clamp(42px,8vw,78px);
    line-height:.95;

    font-weight:950;
    letter-spacing:9px;

    color:#f4f4f4;

    text-shadow:
        0 20px 50px rgba(0,0,0,.8);
}

.by{
    margin-top:16px;

    color:#c9a86a;

    font-size:11px;
    font-weight:900;

    letter-spacing:7px;
}

.description{
    margin-top:22px;

    color:#707070;

    font-size:10px;
    font-weight:700;

    letter-spacing:3px;
    text-transform:uppercase;
}

/* =========================
   ENTER
========================= */

.enter-button{
    position:relative;

    margin-top:38px;

    width:250px;

    padding:17px 20px;

    border:1px solid #b49150;
    border-radius:11px;

    background:
        linear-gradient(
            135deg,
            #d9bd7d,
            #a6844b
        );

    color:#080808;

    font-size:11px;
    font-weight:950;
    letter-spacing:2px;

    cursor:pointer;

    overflow:hidden;

    box-shadow:
        0 20px 60px rgba(0,0,0,.55);

    transition:.2s;
}

.enter-button::after{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:70%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.45),
            transparent
        );

    transform:skewX(-20deg);

    animation:shine 3.5s infinite;
}

@keyframes shine{
    0%{
        left:-100%;
    }

    40%,100%{
        left:150%;
    }
}

.enter-button:hover{
    transform:translateY(-3px);
    filter:brightness(1.08);
}

.enter-button:active{
    transform:translateY(0);
}

/* =========================
   FEATURES
========================= */

.features{
    margin-top:24px;

    display:flex;
    justify-content:center;
    flex-wrap:wrap;

    gap:8px;
}

.feature{
    padding:7px 10px;

    border:1px solid #202020;
    border-radius:7px;

    background:#070707;

    color:#555;

    font-size:7px;
    font-weight:900;
    letter-spacing:1.7px;
}

/* =========================
   FOOTER
========================= */

.footer{
    position:fixed;
    z-index:100;

    left:0;
    bottom:20px;

    width:100%;

    text-align:center;

    color:#3d3d3d;

    font-size:7px;
    font-weight:800;

    letter-spacing:2.5px;
}

.footer b{
    color:#666;
}

/* =========================
   CONTACT MODAL
========================= */

.overlay{
    position:fixed;
    z-index:500;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.82);

    backdrop-filter:blur(12px);
}

.overlay.show{
    display:flex;
}

.modal{
    width:100%;
    max-width:430px;

    padding:27px;

    border:1px solid #303030;
    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #181818,
            #070707
        );

    box-shadow:
        0 30px 100px rgba(0,0,0,.85);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:20px;
}

.modal-header h2{
    font-size:18px;
    letter-spacing:1px;
}

.close{
    width:32px;
    height:32px;

    border:1px solid #2d2d2d;
    border-radius:8px;

    background:#0c0c0c;
    color:#aaa;

    font-size:18px;

    cursor:pointer;
}

.contact-option{
    width:100%;

    padding:15px;

    margin-top:9px;

    border:1px solid #282828;
    border-radius:11px;

    background:#0b0b0b;
    color:#fff;

    text-align:left;

    cursor:pointer;

    transition:.2s;
}

.contact-option:hover{
    border-color:#69562f;
    background:#111;
}

.contact-option strong{
    display:block;

    font-size:11px;
    letter-spacing:1px;
}

.contact-option small{
    display:block;

    margin-top:5px;

    color:#666;

    font-size:9px;
}

.gold{
    color:#c9a86a!important;
    font-weight:900;
}

.report-box{
    display:none;

    margin-top:14px;
}

.report-box.show{
    display:block;
}

.report-box textarea{
    width:100%;
    height:110px;

    padding:13px;

    resize:none;

    border:1px solid #2c2c2c;
    border-radius:10px;

    outline:none;

    background:#080808;
    color:#fff;

    font-family:inherit;
}

.report-send{
    width:100%;

    margin-top:8px;

    padding:13px;

    border:1px solid #a7864e;
    border-radius:10px;

    background:#c9a86a;
    color:#080808;

    font-weight:900;

    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        padding:17px 15px;
    }

    .mini-brand span{
        font-size:8px;
    }

    .contact-button{
        padding:9px 11px;
        font-size:8px;
    }

    .main{
        padding:80px 16px;
    }

    .big-logo{
        width:84px;
        height:84px;
        border-radius:23px;
    }

    .big-logo strong{
        font-size:38px;
    }

    .title{
        font-size:43px;
        letter-spacing:6px;
    }

    .by{
        font-size:9px;
        letter-spacing:5px;
    }

    .description{
        font-size:8px;
        letter-spacing:2px;
        line-height:1.6;
    }

    .enter-button{
        width:100%;
        max-width:290px;
    }

    .footer{
        padding:0 10px;
        bottom:13px;
    }
}
</style>
</head>

<body>

<div class="background">

    <div class="glow"></div>

    <div class="light one"></div>
    <div class="light two"></div>

</div>

<div class="led led-top"></div>
<div class="led led-bottom"></div>
<div class="led led-left"></div>
<div class="led led-right"></div>

<header class="header">

    <div class="mini-brand">

        <div class="mini-logo">
            S
        </div>

        <span>
            BY SABI
        </span>

    </div>

    <button
        class="contact-button"
        onclick="openContact()">

        CONTACT

    </button>

</header>

<main class="main">

    <section class="content">

        <div class="badge">

            <span class="badge-dot"></span>

            SISTEM PREMIUM

        </div>

        <div class="big-logo">

            <strong>
                S
            </strong>

        </div>

        <h1 class="title">
            MY BAR
        </h1>

        <div class="by">
            BY SABI
        </div>

        <p class="description">
            Bar Management & POS System
        </p>

        <button
            class="enter-button"
            onclick="enterSystem()">

            HYR NË SISTEM

        </button>

        <div class="features">

            <span class="feature">
                POS
            </span>

            <span class="feature">
                FATURA
            </span>

            <span class="feature">
                TAVOLINA
            </span>

            <span class="feature">
                INVENTAR
            </span>

            <span class="feature">
                ADMIN
            </span>

        </div>

    </section>

</main>

<footer class="footer">

    PREMIUM BAR MANAGEMENT
    &nbsp;•&nbsp;
    <b>BY SABI</b>

</footer>

<!-- CONTACT -->

<div
    class="overlay"
    id="contactOverlay"
    onclick="outsideClose(event)">

    <div class="modal">

        <div class="modal-header">

            <h2>
                CONTACT
            </h2>

            <button
                class="close"
                onclick="closeContact()">

                ×

            </button>

        </div>

        <button
            class="contact-option"
            onclick="openReport()">

            <strong>
                RAPORTO NJË PROBLEM
            </strong>

            <small>
                Na njofto nëse ke problem me sistemin.
            </small>

        </button>

        <button
            class="contact-option"
            onclick="buyApp()">

            <strong>
                BLI APLIKACIONIN
            </strong>

            <small class="gold">
                MY BAR PREMIUM • 49€
            </small>

        </button>

        <div
            class="report-box"
            id="reportBox">

            <textarea
                id="reportText"
                placeholder="Shkruaj problemin këtu..."></textarea>

            <button
                class="report-send"
                onclick="sendReport()">

                DËRGO

            </button>

        </div>

    </div>

</div>

<script>

/* =========================
   ENTER
========================= */

function enterSystem(){

    window.location.href = "login.html";

}

/* =========================
   CONTACT
========================= */

function openContact(){

    document
        .getElementById("contactOverlay")
        .classList.add("show");

}

function closeContact(){

    document
        .getElementById("contactOverlay")
        .classList.remove("show");

    document
        .getElementById("reportBox")
        .classList.remove("show");

}

function outsideClose(event){

    if(
        event.target.id ===
        "contactOverlay"
    ){

        closeContact();

    }

}

/* =========================
   REPORT
========================= */

function openReport(){

    document
        .getElementById("reportBox")
        .classList.add("show");

    document
        .getElementById("reportText")
        .focus();

}

function sendReport(){

    const textarea =
        document.getElementById(
            "reportText"
        );

    const message =
        textarea.value.trim();

    if(!message){

        alert(
            "Shkruaj problemin."
        );

        return;

    }

    const reports =
        JSON.parse(
            localStorage.getItem(
                "MYBAR_REPORTS"
            ) || "[]"
        );

    reports.push({

        id:Date.now(),

        message:message,

        date:
            new Date().toISOString()

    });

    localStorage.setItem(
        "MYBAR_REPORTS",
        JSON.stringify(reports)
    );

    textarea.value = "";

    alert(
        "Raporti u dërgua me sukses."
    );

    closeContact();

}

/* =========================
   BUY
========================= */

function buyApp(){

    alert(
        "MY BAR PREMIUM\n\nÇmimi: 49€\n\nKontakto BY SABI për blerjen."
    );

}

/* =========================
   ESC CLOSE
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeContact();

        }

    }
);

</script>

</body>
</html>
