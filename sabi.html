<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SABI • Bar Lulishtja</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    background:#030404;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

/* BACKGROUND */

.background{
    position:fixed;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255,255,255,.045),
            transparent 38%
        ),
        linear-gradient(
            135deg,
            #020303,
            #090b0a 50%,
            #020303
        );
}

.background::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);

    background-size:75px 75px;
}


/* LED */

.led{
    position:fixed;
    top:0;
    bottom:0;
    width:3px;
    z-index:5;

    background:#00ff66;

    animation:
        colorChange 10s linear infinite,
        brightness 2.5s ease-in-out infinite;

    box-shadow:
        0 0 8px currentColor,
        0 0 20px currentColor,
        0 0 45px currentColor,
        0 0 90px currentColor;
}

.led.left{
    left:18px;
}

.led.right{
    right:18px;
    animation-delay:-5s;
}

@keyframes colorChange{

    0%{
        background:#00ff66;
        color:#00ff66;
    }

    14%{
        background:#00d9ff;
        color:#00d9ff;
    }

    28%{
        background:#315cff;
        color:#315cff;
    }

    42%{
        background:#a855f7;
        color:#a855f7;
    }

    56%{
        background:#ff2d8d;
        color:#ff2d8d;
    }

    70%{
        background:#ff6535;
        color:#ff6535;
    }

    84%{
        background:#ffd23f;
        color:#ffd23f;
    }

    100%{
        background:#00ff66;
        color:#00ff66;
    }
}

@keyframes brightness{

    0%,100%{
        opacity:.45;
    }

    50%{
        opacity:1;
    }
}


/* LED BALL */

.led::after{
    content:"";

    position:absolute;
    left:50%;

    width:12px;
    height:170px;

    transform:translateX(-50%);

    background:linear-gradient(
        to bottom,
        transparent,
        currentColor,
        white,
        currentColor,
        transparent
    );

    box-shadow:
        0 0 15px currentColor,
        0 0 40px currentColor,
        0 0 80px currentColor;

    animation:travel 4s linear infinite;
}

.led.right::after{
    animation-delay:-2s;
}

@keyframes travel{

    0%{
        top:-180px;
    }

    100%{
        top:100%;
    }
}


/* CORNERS */

.corner{
    position:fixed;
    width:38px;
    height:38px;
    z-index:20;
    border-color:rgba(255,255,255,.20);
}

.c1{
    top:24px;
    left:24px;
    border-top:1px solid;
    border-left:1px solid;
}

.c2{
    top:24px;
    right:24px;
    border-top:1px solid;
    border-right:1px solid;
}

.c3{
    bottom:24px;
    left:24px;
    border-bottom:1px solid;
    border-left:1px solid;
}

.c4{
    bottom:24px;
    right:24px;
    border-bottom:1px solid;
    border-right:1px solid;
}


/* MAIN */

.container{
    position:relative;
    z-index:10;

    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
}

.content{
    width:min(92%,680px);
}


/* BADGE */

.badge{
    display:inline-flex;
    align-items:center;

    padding:8px 15px;

    border:1px solid rgba(255,255,255,.18);
    border-radius:100px;

    background:rgba(255,255,255,.035);

    backdrop-filter:blur(15px);

    color:#cfd6d1;

    font-size:8px;
    letter-spacing:3px;

    margin-bottom:32px;
}

.badge::before{
    content:"";

    width:5px;
    height:5px;

    border-radius:50%;

    background:#7aff9b;

    box-shadow:
        0 0 8px #7aff9b,
        0 0 18px #7aff9b;

    margin-right:9px;
}


/* LOGO */

.logo{
    width:100px;
    height:100px;

    margin:0 auto 35px;

    transform:rotate(45deg);

    border:1px solid rgba(255,255,255,.35);

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.025);

    box-shadow:
        0 0 50px rgba(255,255,255,.06);

    animation:logoColor 10s linear infinite;
}

.logo span{
    transform:rotate(-45deg);

    font-size:50px;

    font-weight:300;

    color:white;
}

@keyframes logoColor{

    0%{
        color:#00ff66;
        border-color:#00ff66;
    }

    20%{
        color:#00d9ff;
        border-color:#00d9ff;
    }

    40%{
        color:#a855f7;
        border-color:#a855f7;
    }

    60%{
        color:#ff2d8d;
        border-color:#ff2d8d;
    }

    80%{
        color:#ff8b32;
        border-color:#ff8b32;
    }

    100%{
        color:#00ff66;
        border-color:#00ff66;
    }
}


/* TITLE */

h1{
    font-size:clamp(45px,8vw,82px);

    font-weight:200;

    letter-spacing:9px;

    line-height:1;

    color:#f4f6f5;
}

.subtitle{
    margin-top:18px;

    font-size:10px;

    letter-spacing:5px;

    color:#8b9690;
}

.divider{
    width:170px;
    height:1px;

    margin:35px auto;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );
}


/* ENTER */

.enter{
    width:230px;
    height:53px;

    border:1px solid rgba(255,255,255,.25);
    border-radius:3px;

    background:rgba(255,255,255,.04);

    color:#eef2ef;

    font-size:9px;

    letter-spacing:3px;

    cursor:pointer;

    transition:.3s;
}

.enter:hover{
    border-color:white;

    box-shadow:
        0 0 30px rgba(255,255,255,.08);

    transform:translateY(-2px);
}


/* =========================
   SMALL CONTACT
========================= */

.contact-button{
    position:fixed;

    left:25px;
    bottom:25px;

    z-index:100;

    padding:8px 12px;

    background:rgba(255,255,255,.025);

    border:1px solid rgba(255,255,255,.14);

    color:#737d77;

    font-size:7px;

    letter-spacing:2px;

    cursor:pointer;

    backdrop-filter:blur(12px);

    transition:.3s;
}

.contact-button:hover{
    color:white;

    border-color:rgba(255,255,255,.55);

    box-shadow:
        0 0 20px rgba(255,255,255,.06);
}


/* =========================
   CONTACT PANEL
========================= */

.contact-screen{
    position:fixed;

    inset:0;

    z-index:200;

    display:none;

    justify-content:center;
    align-items:center;

    background:rgba(2,3,3,.94);

    backdrop-filter:blur(20px);
}

.contact-screen.active{
    display:flex;
}

.contact-box{
    width:min(88%,360px);

    padding:30px 24px;

    text-align:center;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.14);

    border-radius:14px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.6);

    animation:showBox .35s ease;
}

@keyframes showBox{

    from{
        opacity:0;
        transform:translateY(15px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.contact-label{
    font-size:7px;

    letter-spacing:3px;

    color:#68726c;

    margin-bottom:12px;
}

.contact-title{
    font-size:21px;

    font-weight:300;

    letter-spacing:3px;

    margin-bottom:9px;
}

.contact-text{
    color:#7d8781;

    font-size:10px;

    line-height:1.6;

    margin-bottom:20px;
}


/* OPTIONS */

.contact-options{
    display:flex;

    flex-direction:column;

    gap:8px;
}

.option-button{
    width:100%;

    padding:13px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.13);

    border-radius:7px;

    color:#b9c1bc;

    font-size:8px;

    letter-spacing:2px;

    cursor:pointer;

    transition:.3s;
}

.option-button:hover{
    color:white;

    border-color:#7aff9b;

    box-shadow:
        0 0 20px rgba(0,255,100,.07);
}

.price{
    color:#7aff9b;

    margin-left:7px;

    font-weight:bold;
}


/* WAITING */

.waiting{
    display:none;
}

.waiting.active{
    display:block;
}

.countdown{
    font-size:52px;

    font-weight:200;

    margin:15px 0;

    animation:pulse 1s infinite;
}

@keyframes pulse{

    0%,100%{
        opacity:.45;
    }

    50%{
        opacity:1;
    }
}


/* REPORT */

.report-area{
    display:none;
}

.report-area.active{
    display:block;
}

textarea{
    width:100%;

    height:120px;

    resize:none;

    outline:none;

    padding:12px;

    border-radius:7px;

    border:1px solid rgba(255,255,255,.13);

    background:rgba(255,255,255,.035);

    color:white;

    font-family:Arial;

    font-size:11px;

    margin-bottom:10px;
}

textarea:focus{
    border-color:#7aff9b;
}

textarea::placeholder{
    color:#59635d;
}

.send{
    width:100%;

    height:43px;

    border-radius:7px;

    border:1px solid rgba(255,255,255,.22);

    background:rgba(255,255,255,.05);

    color:white;

    font-size:8px;

    letter-spacing:3px;

    cursor:pointer;
}


/* CLOSE */

.close{
    margin-top:15px;

    border:0;

    background:none;

    color:#535d57;

    font-size:7px;

    letter-spacing:2px;

    cursor:pointer;
}

.close:hover{
    color:white;
}


/* FOOTER */

.footer{
    position:fixed;

    bottom:22px;

    left:0;
    right:0;

    text-align:center;

    font-size:7px;

    letter-spacing:3px;

    color:#454e49;
}


/* MOBILE */

@media(max-width:600px){

    .led.left{
        left:8px;
    }

    .led.right{
        right:8px;
    }

    .logo{
        width:80px;
        height:80px;

        margin-bottom:28px;
    }

    .logo span{
        font-size:40px;
    }

    h1{
        font-size:43px;
        letter-spacing:5px;
    }

    .subtitle{
        font-size:8px;
        letter-spacing:3px;
    }

    .contact-button{
        left:17px;
        bottom:17px;
    }

    .contact-box{
        width:88%;
        padding:27px 20px;
    }

}

</style>
</head>


<body>


<div class="background"></div>

<div class="led left"></div>
<div class="led right"></div>

<div class="corner c1"></div>
<div class="corner c2"></div>
<div class="corner c3"></div>
<div class="corner c4"></div>


<!-- MAIN -->

<div class="container">

    <div class="content">

        <div class="badge">
            SISTEM PREMIUM
        </div>

        <div class="logo">
            <span>S</span>
        </div>

        <h1>
            MIRË SE VINI
        </h1>

        <div class="subtitle">
            SISTEMI I MENAXHIMIT
        </div>

        <div class="divider"></div>

        <button
            class="enter"
            onclick="hyjNeSistem()"
        >
            HYR NË SISTEM →
        </button>

    </div>

</div>


<div class="footer">
    SABI • SISTEM PREMIUM • 2026
</div>


<!-- VETËM NJË CONTACT -->

<button
    class="contact-button"
    onclick="openContact()"
>
    CONTACT
</button>


<!-- CONTACT PANEL -->

<div
    class="contact-screen"
    id="contactScreen"
>

    <div class="contact-box">


        <!-- MENU -->

        <div id="contactMenu">

            <div class="contact-label">
                SABI SYSTEM
            </div>

            <div class="contact-title">
                CONTACT
            </div>

            <div class="contact-text">
                Zgjidhni një nga opsionet.
            </div>


            <div class="contact-options">

                <button
                    class="option-button"
                    onclick="startReport()"
                >
                    RAPORTO NJË PROBLEM
                </button>


                <button
                    class="option-button"
                    onclick="buyApp()"
                >
                    BLI APLIKACIONIN
                    <span class="price">49€</span>
                </button>

            </div>

        </div>


        <!-- WAITING -->

        <div
            class="waiting"
            id="waiting"
        >

            <div class="contact-label">
                CONTACT SYSTEM
            </div>

            <div class="contact-title">
                PRISNI
            </div>

            <div class="contact-text">
                Po përgatitet raportimi.
            </div>

            <div
                class="countdown"
                id="countdown"
            >
                5
            </div>

        </div>


        <!-- REPORT -->

        <div
            class="report-area"
            id="reportArea"
        >

            <div class="contact-label">
                CONTACT SYSTEM
            </div>

            <div class="contact-title">
                RAPORTIMI
            </div>

            <div class="contact-text">
                Shkruani raportimin tuaj.
            </div>

            <textarea
                id="reportText"
                placeholder="Shkruani këtu..."
            ></textarea>

            <button
                class="send"
                onclick="sendReport()"
            >
                DËRGO
            </button>

        </div>


        <button
            class="close"
            onclick="closeContact()"
        >
            MBYLL
        </button>

    </div>

</div>


<script>


/* HYRJA */

function hyjNeSistem(){

    window.location.href =
        "login.html";

}


/* CONTACT */

let timer = null;


function openContact(){

    document
        .getElementById("contactScreen")
        .classList.add("active");

    document
        .getElementById("contactMenu")
        .style.display = "block";

    document
        .getElementById("waiting")
        .classList.remove("active");

    document
        .getElementById("reportArea")
        .classList.remove("active");

}


/* RAPORT */

function startReport(){

    document
        .getElementById("contactMenu")
        .style.display = "none";

    document
        .getElementById("waiting")
        .classList.add("active");

    let seconds = 5;

    const countdown =
        document.getElementById("countdown");

    countdown.textContent = seconds;


    clearInterval(timer);


    timer = setInterval(function(){

        seconds--;

        countdown.textContent = seconds;


        if(seconds <= 0){

            clearInterval(timer);

            document
                .getElementById("waiting")
                .classList.remove("active");

            document
                .getElementById("reportArea")
                .classList.add("active");

        }

    },1000);

}


/* DËRGO RAPORT */

function sendReport(){

    const report =
        document
        .getElementById("reportText")
        .value
        .trim();


    if(!report){

        alert(
            "Ju lutem shkruani raportimin."
        );

        return;

    }


    /* VENDOS NUMRIN TËND KËTU */

    const myNumber =
        "+355XXXXXXXXX";


    const message =
        "RAPORTIM SABI\n\n" +
        report;


    const sms =
        "sms:" +
        myNumber +
        "?body=" +
        encodeURIComponent(message);


    window.location.href = sms;

}


/* BLI APLIKACIONIN */

function buyApp(){

    /* VENDOS NUMRIN TËND KËTU */

    const myNumber =
        "+355XXXXXXXXX";


    const message =
        "Përshëndetje, jam i interesuar të blej aplikacionin SABI për 49€.";


    const sms =
        "sms:" +
        myNumber +
        "?body=" +
        encodeURIComponent(message);


    window.location.href = sms;

}


/* MBYLL */

function closeContact(){

    clearInterval(timer);

    document
        .getElementById("contactScreen")
        .classList.remove("active");

}

</script>

</body>
</html>
