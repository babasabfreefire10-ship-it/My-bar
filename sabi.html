<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07110b">
    <title>MY BAR</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at 50% 35%, rgba(0,255,115,.08), transparent 32%),
                linear-gradient(145deg, #030504, #07100a 55%, #030504);
            color: #fff;
            overflow-x: hidden;
        }

        /* BACKGROUND */
        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .glow {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: rgba(0,255,115,.08);
            filter: blur(90px);
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
        }

        /* MAIN */
        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            position: relative;
            z-index: 2;
        }

        .container {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        /* LOGO */
        .logo {
            width: 92px;
            height: 92px;
            margin: 0 auto 28px;
            border: 1px solid rgba(0,255,115,.45);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8,20,13,.75);
            box-shadow:
                0 0 25px rgba(0,255,115,.12),
                inset 0 0 25px rgba(0,255,115,.04);
            position: relative;
        }

        .logo::before {
            content: "";
            position: absolute;
            inset: 7px;
            border: 1px solid rgba(0,255,115,.16);
            border-radius: 18px;
        }

        .logo span {
            font-size: 38px;
            font-weight: 900;
            color: #00ff73;
            text-shadow: 0 0 18px rgba(0,255,115,.35);
            position: relative;
        }

        /* TEXT */
        .small-title {
            color: #00ff73;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: clamp(42px, 11vw, 72px);
            line-height: .95;
            letter-spacing: 4px;
            font-weight: 900;
            margin-bottom: 15px;
            text-shadow: 0 0 30px rgba(0,255,115,.12);
        }

        .subtitle {
            color: #89958d;
            font-size: 13px;
            letter-spacing: 3px;
            font-weight: 600;
        }

        .line {
            width: 70px;
            height: 1px;
            background: #00ff73;
            opacity: .55;
            margin: 28px auto;
            box-shadow: 0 0 10px rgba(0,255,115,.35);
        }

        /* BUTTONS */
        .buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 330px;
            margin: 0 auto;
        }

        button {
            width: 100%;
            min-height: 56px;
            border-radius: 14px;
            border: 1px solid rgba(0,255,115,.35);
            background: rgba(7,18,11,.85);
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: .2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            border-color: #00ff73;
            background: rgba(0,255,115,.08);
            box-shadow: 0 0 22px rgba(0,255,115,.12);
            transform: translateY(-1px);
        }

        button:active {
            transform: scale(.98);
        }

        .enter-btn {
            background: #00ff73;
            color: #031008;
            border-color: #00ff73;
            box-shadow: 0 0 22px rgba(0,255,115,.18);
        }

        .enter-btn:hover {
            background: #16ff82;
            color: #031008;
            box-shadow: 0 0 30px rgba(0,255,115,.28);
        }

        .contact-btn {
            color: #aab4ae;
            background: rgba(255,255,255,.025);
        }

        /* FOOTER */
        .footer {
            margin-top: 35px;
            color: #526058;
            font-size: 10px;
            letter-spacing: 2px;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 20;
            background: rgba(0,0,0,.72);
            backdrop-filter: blur(7px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 420px;
            background: #09110c;
            border: 1px solid rgba(0,255,115,.3);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 20px 70px rgba(0,0,0,.55);
        }

        .modal-box h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .modal-box p {
            color: #89958d;
            font-size: 13px;
            margin-bottom: 18px;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            resize: vertical;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.1);
            background: #050805;
            color: #fff;
            padding: 13px;
            outline: none;
            font-family: inherit;
            margin-bottom: 12px;
        }

        textarea:focus {
            border-color: rgba(0,255,115,.5);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
        }

        @media (max-width: 480px) {
            .page {
                padding: 20px;
            }

            .logo {
                width: 82px;
                height: 82px;
                margin-bottom: 24px;
            }

            .logo span {
                font-size: 34px;
            }

            .small-title {
                font-size: 10px;
                letter-spacing: 3px;
            }

            h1 {
                letter-spacing: 3px;
            }

            .subtitle {
                font-size: 11px;
                letter-spacing: 2px;
            }

            .buttons {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="background">
    <div class="glow"></div>
</div>

<main class="page">
    <div class="container">

        <div class="logo">
            <span>S</span>
        </div>

        <div class="small-title">SISTEM PREMIUM</div>

        <h1>MY BAR</h1>

        <div class="subtitle">
            SISTEMI I MENAXHIMIT
        </div>

        <div class="line"></div>

        <div class="buttons">

            <button
                class="enter-btn"
                id="enterBtn"
                type="button">
                HYR NË SISTEM →
            </button>

            <button
                class="contact-btn"
                id="contactBtn"
                type="button">
                CONTACT
            </button>

        </div>

        <div class="footer">
            MY BAR • MANAGEMENT SYSTEM
        </div>

    </div>
</main>

<!-- CONTACT MODAL -->
<div class="modal" id="contactModal">

    <div class="modal-box">

        <h2>Contact</h2>

        <p>
            Dërgo një mesazh për administratorin.
        </p>

        <textarea
            id="contactMessage"
            placeholder="Shkruaj mesazhin..."></textarea>

        <div class="modal-actions">

            <button
                type="button"
                id="sendContact">
                DËRGO
            </button>

            <button
                type="button"
                id="closeContact">
                MBYLL
            </button>

        </div>

    </div>

</div>

<script>
    const enterBtn = document.getElementById("enterBtn");
    const contactBtn = document.getElementById("contactBtn");
    const contactModal = document.getElementById("contactModal");
    const closeContact = document.getElementById("closeContact");
    const sendContact = document.getElementById("sendContact");
    const contactMessage = document.getElementById("contactMessage");

    // Hyr në sistem
    enterBtn.addEventListener("click", function () {
        window.location.href = "login.html";
    });

    // Hap Contact
    contactBtn.addEventListener("click", function () {
        contactModal.classList.add("active");
        contactMessage.focus();
    });

    // Mbyll Contact
    closeContact.addEventListener("click", function () {
        contactModal.classList.remove("active");
    });

    // Klik jashtë modalit
    contactModal.addEventListener("click", function (e) {
        if (e.target === contactModal) {
            contactModal.classList.remove("active");
        }
    });

    // ESC
    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
            contactModal.classList.remove("active");
        }
    });

    // Dërgo mesazhin
    sendContact.addEventListener("click", function () {

        const message = contactMessage.value.trim();

        if (!message) {
            alert("Shkruaj një mesazh.");
            return;
        }

        alert("Mesazhi u dërgua.");

        contactMessage.value = "";
        contactModal.classList.remove("active");
    });
</script>

</body>
</html>
