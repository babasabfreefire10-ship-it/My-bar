<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WELCOME MY BAR</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --green:#00ff88;
    --green2:#00c86b;
    --dark:#020604;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:#010302;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

/* BACKGROUND */
.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 50%,rgba(0,255,136,.09),transparent 35%),
        radial-gradient(circle at 10% 20%,rgba(0,255,136,.06),transparent 25%),
        #010302;
}

/* MOVING LED LINES */
.led{
    position:absolute;
    height:2px;
    width:75vw;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(0,255,136,.1),
        #00ff88,
        white,
        #00ff88,
        rgba(0,255,136,.1),
        transparent
    );
    box-shadow:
        0 0 5px #00ff88,
        0 0 15px #00ff88,
        0 0 35px rgba(0,255,136,.8);
    opacity:.8;
}

.led1{
    top:12%;
    left:-80%;
    transform:rotate(-14deg);
    animation:move1 7s linear infinite;
}

.led2{
    top:35%;
    left:-80%;
    transform:rotate(9deg);
    animation:move2 9s linear infinite;
    animation-delay:1s;
}

.led3{
    top:62%;
    left:-80%;
    transform:rotate(-7deg);
    animation:move1 8s linear infinite;
    animation-delay:2s;
}

.led4{
    top:82%;
    left:-80%;
    transform:rotate(12deg);
    animation:move2 10s linear infinite;
    animation-delay:3s;
}

@keyframes move1{
    from{transform:translateX(0) rotate(-14deg)}
    to{transform:translateX(220vw) rotate(-14deg)}
}

@keyframes move2{
    from{transform:translateX(0) rotate(9deg)}
    to{transform:translateX(220vw) rotate(9deg)}
}

/* VERTICAL LED */
.vline{
    position:absolute;
    width:1px;
    height:100%;
    background:linear-gradient(
        transparent,
        rgba(0,255,136,.5),
        transparent
    );
    box-shadow:0 0 15px #00ff88;
    opacity:.25;
}

.v1{left:8%;animation:pulse 3s infinite}
.v2{left:25%;animation:pulse 4s infinite .5s}
.v3{left:75%;animation:pulse 3.5s infinite 1s}
.v4{left:92%;animation:pulse 4.5s infinite 1.5s}

@keyframes pulse{
    0%,100%{opacity:.12}
    50%{opacity:.5}
}

/* GLOW DOTS */
.dot{
    position:absolute;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#00ff88;
    box-shadow:
        0 0 8px #00ff88,
        0 0 20px #00ff88;
    animation:float 5s infinite ease-in-out;
}

.d1{left:15%;top:20%}
.d2{left:82%;top:18%;animation-delay:1s}
.d3{left:30%;top:78%;animation-delay:2s}
.d4{left:70%;top:72%;animation-delay:3s}
.d5{left:50%;top:15%;animation-delay:1.5s}

@keyframes float{
    0%,100%{transform:translateY(0);opacity:.3}
    50%{transform:translateY(-30px);opacity:1}
}

/* MAIN */
.main{
    position:relative;
    z-index:10;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.card{
    width:min(700px,94vw);
    padding:55px 35px 40px;
    text-align:center;
    border:1px solid rgba(0,255,136,.35);
    border-radius:30px;
    background:rgba(2,10,6,.72);
    backdrop-filter:blur(18px);
    box-shadow:
        0 0 30px rgba(0,255,136,.12),
        inset 0 0 40px rgba(0,255,136,.025);
    animation:cardGlow 3s infinite ease-in-out;
}

@keyframes cardGlow{
    0%,100%{
        box-shadow:
        0 0 25px rgba(0,255,136,.12),
        inset 0 0 30px rgba(0,255,136,.02);
    }
    50%{
        box-shadow:
        0 0 55px rgba(0,255,136,.25),
        inset 0 0 50px rgba(0,255,136,.05);
    }
}

/* STATUS */
.status{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:8px 15px;
    border-radius:30px;
    border:1px solid rgba(0,255,136,.4);
    background:rgba(0,255,136,.06);
    color:#9dffc9;
    font-size:11px;
    letter-spacing:3px;
    margin-bottom:25px;
}

.statusDot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#00ff88;
    box-shadow:0 0 12px #00ff88;
    animation:blink 1.2s infinite;
}

@keyframes blink{
    50%{opacity:.25}
}

/* LOGO */
.logo{
    width:100px;
    height:100px;
    margin:0 auto 25px;
    border:2px solid #00ff88;
    border-radius:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:43px;
    font-weight:900;
    color:#00ff88;
    text-shadow:0 0 20px #00ff88;
    box-shadow:
        0 0 15px #00ff88,
        0 0 50px rgba(0,255,136,.35),
        inset 0 0 25px rgba(0,255,136,.12);
    animation:logoPulse 2.5s infinite;
}

@keyframes logoPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.04)}
}

/* TITLE */
h1{
    font-size:clamp(45px,10vw,82px);
    letter-spacing:8px;
    font-weight:900;
    margin-bottom:10px;
    color:white;
    text-shadow:
        0 0 5px white,
        0 0 15px #00ff88,
        0 0 35px #00ff88;
}

.subtitle{
    color:#8cffbd;
    letter-spacing:5px;
    font-size:12px;
    margin-bottom:35px;
}

/* FEATURES */
.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:28px;
}

.feature{
    padding:17px 8px;
    border:1px solid rgba(0,255,136,.18);
    border-radius:16px;
    background:rgba(0,255,136,.025);
    transition:.2s;
    cursor:pointer;
}

.feature:hover{
    border-color:#00ff88;
    box-shadow:0 0 25px rgba(0,255,136,.2);
    transform:translateY(-4px);
}

.feature:active{
    transform:scale(.94);
    background:rgba(0,255,136,.12);
    box-shadow:
        0 0 10px #00ff88,
        0 0 35px rgba(0,255,136,.8);
}

.icon{
    font-size:25px;
    margin-bottom:8px;
    filter:drop-shadow(0 0 8px #00ff88);
}

.feature span{
    display:block;
    font-size:11px;
    color:#b9ffd7;
    letter-spacing:1px;
}

/* BUTTON */
.enter{
    position:relative;
    width:100%;
    height:62px;
    border:1px solid #00ff88;
    border-radius:18px;
    background:linear-gradient(
        90deg,
        rgba(0,255,136,.08),
        rgba(0,255,136,.18),
        rgba(0,255,136,.08)
    );
    color:white;
    font-size:14px;
    font-weight:bold;
    letter-spacing:4px;
    cursor:pointer;
    overflow:hidden;
    box-shadow:
        0 0 12px rgba(0,255,136,.35),
        inset 0 0 20px rgba(0,255,136,.05);
    transition:.18s;
}

.enter::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );
    animation:shine 2.5s infinite;
}

@keyframes shine{
    0%{left:-100%}
    55%,100%{left:100%}
}

.enter:hover{
    box-shadow:
        0 0 20px #00ff88,
        0 0 60px rgba(0,255,136,.45);
}

.enter:active{
    transform:scale(.96);
    background:#00ff88;
    color:#001b0e;
    box-shadow:
        0 0 15px #00ff88,
        0 0 70px #00ff88,
        0 0 120px rgba(0,255,136,.7);
}

/* FOOTER */
.footer{
    margin-top:25px;
    color:#4d8066;
    font-size:9px;
    letter-spacing:3px;
}

/* TOUCH RIPPLE */
.ripple{
    position:fixed;
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid #00ff88;
    pointer-events:none;
    z-index:9999;
    transform:translate(-50%,-50%) scale(0);
    animation:ripple .65s ease-out forwards;
    box-shadow:
        0 0 10px #00ff88,
        0 0 30px #00ff88;
}

@keyframes ripple{
    to{
        transform:translate(-50%,-50%) scale(8);
        opacity:0;
    }
}

/* FLASH */
.flash{
    position:fixed;
    inset:0;
    background:#00ff88;
    opacity:0;
    pointer-events:none;
    z-index:9998;
}

.flash.active{
    animation:flash .35s ease-out;
}

@keyframes flash{
    0%{opacity:.12}
    100%{opacity:0}
}

/* MOBILE */
@media(max-width:600px){
    .card{
        padding:40px 20px 30px;
        border-radius:25px;
    }

    .logo{
        width:85px;
        height:85px;
        font-size:36px;
    }

    .subtitle{
        letter-spacing:3px;
    }

    .features{
        gap:7px;
    }

    .feature{
        padding:14px 5px;
    }

    .enter{
        height:58px;
    }
}
</style>
</head>

<body>

<div class="background">

    <div class="led led1"></div>
    <div class="led led2"></div>
    <div class="led led3"></div>
    <div class="led led4"></div>

    <div class="vline v1"></div>
    <div class="vline v2"></div>
    <div class="vline v3"></div>
    <div class="vline v4"></div>

    <div class="dot d1"></div>
    <div class="dot d2"></div>
    <div class="dot d3"></div>
    <div class="dot d4"></div>
    <div class="dot d5"></div>

</div>

<div class="main">

    <div class="card">

        <div class="status">
            <span class="statusDot"></span>
            SYSTEM ONLINE
        </div>

        <div class="logo">S</div>

        <h1>WELCOME</h1>

        <div class="subtitle">
            MY BAR • SABI SYSTEM
        </div>

        <div class="features">

            <div class="feature">
                <div class="icon">🪑</div>
                <span>TAVOLINA</span>
            </div>

            <div class="feature">
                <div class="icon">🍹</div>
                <span>MENU</span>
            </div>

            <div class="feature">
                <div class="icon">📊</div>
                <span>CONTROL</span>
            </div>

        </div>

        <button class="enter" onclick="enterSystem(event)">
            HYR NË SISTEM
        </button>

        <div class="footer">
            SABI SYSTEM © 2026
        </div>

    </div>

</div>

<div class="flash" id="flash"></div>

<script>

/* BUTTON */
function enterSystem(e){

    createRipple(e.clientX,e.clientY);

    document.getElementById("flash").classList.add("active");

    setTimeout(()=>{
        window.location.href="login.html";
    },350);
}

/* TOUCH / CLICK EFFECT */
document.addEventListener("pointerdown",function(e){

    createRipple(e.clientX,e.clientY);

});

function createRipple(x,y){

    const ripple=document.createElement("div");

    ripple.className="ripple";

    ripple.style.left=x+"px";
    ripple.style.top=y+"px";

    document.body.appendChild(ripple);

    setTimeout(()=>{
        ripple.remove();
    },700);
}

/* RANDOM LED FLASH */
setInterval(()=>{

    const lines=document.querySelectorAll(".led");

    const random=lines[Math.floor(Math.random()*lines.length)];

    random.style.opacity="1";

    setTimeout(()=>{
        random.style.opacity=".8";
    },500);

},1500);

</script>

</body>
</html>
